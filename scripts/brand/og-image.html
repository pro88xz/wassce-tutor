<!doctype html>
<!--
  Share image (public/og-image.jpg, 1200 x 630): what WhatsApp, Facebook and
  other apps show when someone shares a WASSCE Tutor link.

  It uses the same logo (public/brand/wordmark-on-dark.svg, from npm run brand:icons),
  colours and type as the site. To rebuild it after a
  change, open this file in a Chromium browser at 1200 x 630 and save a
  screenshot as public/og-image.jpg, for example:

    chromium --headless --hide-scrollbars --window-size=1200,630 \
      --screenshot=og.png scripts/brand/og-image.html

  then convert og.png to a JPEG (quality about 88). The text matches the
  og:image:alt in src/routes/__root.tsx; keep the two in step.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Inter'; src: url('../../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    position: relative; overflow: hidden; padding: 64px 72px; color: #fff;
    font-family: 'Inter', system-ui, sans-serif; background: #130d2b;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .glow { position: absolute; inset: 0;
    background: radial-gradient(760px 430px at 92% -10%, rgb(124 77 255 / 46%), transparent 62%),
                radial-gradient(560px 380px at 2% 112%, rgb(56 104 220 / 30%), transparent 60%); }
  .grid { position: absolute; inset: 0;
    background-image: linear-gradient(rgb(255 255 255 / 5%) 1px, transparent 1px), linear-gradient(90deg, rgb(255 255 255 / 5%) 1px, transparent 1px);
    background-size: 60px 60px;
    -webkit-mask-image: radial-gradient(ellipse 85% 80% at 50% 40%, #000 20%, transparent 80%); }
  .row, h1, p, .foot { position: relative; }
  .brand { display: flex; align-items: center; height: 76px; }
  h1 { font-size: 92px; font-weight: 800; letter-spacing: -.045em; line-height: 1.02; max-width: 900px; }
  h1 span { background: linear-gradient(90deg, #e3d7ff, #b9a2ff 55%, #8fdcf5); -webkit-background-clip: text; background-clip: text; color: transparent; }
  p.sub { margin-top: 22px; font-size: 34px; font-weight: 500; color: rgb(255 255 255 / 74%); letter-spacing: -.01em; }
  .foot { display: flex; align-items: center; justify-content: space-between; font-size: 26px; font-weight: 600; color: rgb(255 255 255 / 80%); }
  .pill { display: inline-flex; align-items: center; gap: 12px; background: #fff; color: #28145f; font-weight: 800; font-size: 26px; padding: 16px 30px; border-radius: 16px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: #34d399; }
</style>
</head>
<body>
  <div class="glow"></div><div class="grid"></div>
  <div class="row brand">
    <img src="../../public/brand/wordmark-on-dark.svg" alt="WASSCE Tutor" height="42">
  </div>
  <div class="row">
    <h1>Pass WASSCE <span>with confidence.</span></h1>
    <p class="sub">Lessons · Practice questions · Tutors</p>
  </div>
  <div class="foot">
    <span>Built in Sierra Leone · wasscetutor.com</span>
    <span class="pill"><span class="dot"></span>Free to start</span>
  </div>
</body>
</html>
