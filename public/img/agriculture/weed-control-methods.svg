<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Methods of weed control</title>
<desc id="d">Integrated weed management in the centre, linked to five methods: preventive (clean seed and tools), cultural (correct spacing, cover crops, mulching, rotation, flooding rice), mechanical (hand pulling, hoeing, slashing, tillage), chemical (herbicides, selective or non-selective, pre- or post-emergence) and biological (insects, grazing animals, fungi).</desc>
<defs><marker id="a475569" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker><marker id="a475569s" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#475569"/></marker></defs>
