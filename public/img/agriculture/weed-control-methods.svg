<text x="150.0" y="90.0" font-size="14" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Preventive</text>
<text x="150.0" y="110.0" font-size="12" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">clean seed, clean tools,</text>
<text x="150.0" y="130.0" font-size="12" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">weed-free manure</text>
<line x1="400.0" y1="199.0" x2="150.0" y2="159.0" stroke="#475569" stroke-width="2.2" stroke-linecap="round" marker-end="url(#a475569)"/>
<rect x="535.0" y="67.0" width="230.0" height="86.0" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
