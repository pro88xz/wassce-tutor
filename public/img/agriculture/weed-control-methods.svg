<text x="650.0" y="110.0" font-size="12" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">spacing, cover crops,</text>
<text x="650.0" y="130.0" font-size="12" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">mulch, rotation, flooding</text>
