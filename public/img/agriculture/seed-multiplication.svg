<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">From plant breeding to the farmer&#x27;s field: classes of seed</title>
<desc id="d">A breeder develops and tests a new variety. Breeder seed, produced in small amounts by the breeding institute, is multiplied to foundation seed, then to certified seed by approved seed growers under inspection. Certified seed is sold to farmers, who grow the crop for food and sale.</desc>
<defs><marker id="a0f172a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f172a"/></marker><marker id="a0f172as" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#0f172a"/></marker></defs>
<rect width="800" height="300" rx="20" fill="#f8fafc"/>
<text x="400.0" y="34.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Seed classes: from breeder to farmer</text>
<rect x="15.0" y="110.0" width="140.0" height="80.0" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
<text x="85.0" y="140.0" font-size="14" fill="#7c3aed" text-anchor="middle" dominant-baseline="middle" font-weight="bold">New variety</text>
<text x="85.0" y="160.0" font-size="12" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">bred and tested</text>
<rect x="172.0" y="110.0" width="140.0" height="80.0" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="242.0" y="140.0" font-size="14" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Breeder seed</text>
<text x="242.0" y="160.0" font-size="12" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">small amount, pure</text>
<line x1="161.0" y1="150.0" x2="166.0" y2="150.0" stroke="#0f172a" stroke-width="2.4" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<rect x="329.0" y="110.0" width="140.0" height="80.0" rx="12" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/>
<text x="399.0" y="140.0" font-size="14" fill="#0f766e" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Foundation seed</text>
<text x="399.0" y="160.0" font-size="12" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">multiplied</text>
<line x1="318.0" y1="150.0" x2="323.0" y2="150.0" stroke="#0f172a" stroke-width="2.4" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<rect x="486.0" y="110.0" width="140.0" height="80.0" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
<text x="556.0" y="140.0" font-size="14" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Certified seed</text>
<text x="556.0" y="160.0" font-size="12" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">inspected, labelled</text>
<line x1="475.0" y1="150.0" x2="480.0" y2="150.0" stroke="#0f172a" stroke-width="2.4" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<rect x="643.0" y="110.0" width="140.0" height="80.0" rx="12" fill="#fef3c7" stroke="#ea580c" stroke-width="2.5"/>
<text x="713.0" y="140.0" font-size="14" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Farmers</text>
<text x="713.0" y="160.0" font-size="12" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">grow the crop</text>
<line x1="632.0" y1="150.0" x2="637.0" y2="150.0" stroke="#0f172a" stroke-width="2.4" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<text x="400.0" y="250.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Each step is checked for purity, germination and freedom from disease.</text>
</svg>
