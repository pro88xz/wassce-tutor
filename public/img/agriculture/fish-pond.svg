<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Cross-section of an earthen fish pond</title>
<desc id="d">An earthen fish pond dug on a gentle slope with clay soil. Water enters through an inlet pipe with a screen to keep out wild fish. The pond is shallow at the inlet end and deeper (about 1.5 m) at the outlet end, where a drain pipe or monk lets the pond be emptied for harvesting. Dykes (banks) around the pond are planted with grass to stop erosion.</desc>
