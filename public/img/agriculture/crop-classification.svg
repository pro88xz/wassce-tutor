<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Classification of crops by use</title>
<desc id="d">Ten groups of crops with Sierra Leone examples: cereals (rice, maize, sorghum, millet); legumes (groundnut, cowpea, soya bean); roots and tubers (cassava, sweet potato, yam, cocoyam); vegetables (pepper, okra, garden egg, krain-krain, potato leaves); fruits (mango, orange, pineapple, plantain); beverages (cocoa, coffee); oil crops (oil palm, coconut); spices (ginger, pepper); fibre (cotton); latex (rubber).</desc>
<defs></defs>
<rect width="800" height="470" rx="20" fill="#f8fafc"/>
<text x="400.0" y="34.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Crops grouped by use, with local examples</text>
<rect x="25.0" y="69.0" width="360.0" height="62.0" rx="12" fill="#fef3c7" stroke="#ea580c" stroke-width="2.5"/>
<text x="205.0" y="89.5" font-size="15" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Cereals</text>
<text x="205.0" y="110.5" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">rice, maize, sorghum, millet</text>
