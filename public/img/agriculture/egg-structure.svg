<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The structure of a hen&#x27;s egg</title>
<desc id="d">A longitudinal section of an egg. The hard shell is lined by two shell membranes, which separate at the blunt end to form the air cell. Inside is the albumen (egg white), the yolk with the germinal disc on its surface, and twisted chalazae that hold the yolk in the centre.</desc>
