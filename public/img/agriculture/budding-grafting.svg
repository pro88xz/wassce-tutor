<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Budding and grafting</title>
<desc id="d">Left, T-budding: a T-shaped cut is made in the bark of the rootstock, a bud with a shield of bark is cut from the scion plant, slipped under the bark, and tied firmly with budding tape. Right, cleft grafting: the rootstock is cut off and split down the middle, a scion shoot is cut to a wedge, inserted in the cleft so the cambium layers meet, and tied and sealed.</desc>
