<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Ridges up and down a slope compared with contour ridges and terraces</title>
<desc id="d">Left: ridges made up and down the slope channel rain water straight downhill, so it runs fast and carries soil away. Middle: contour ridges made across the slope hold the water so it soaks in. Right: terraces cut into a steep hillside as level steps slow water and hold soil.</desc>
<defs><marker id="a2563eb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a2563ebs" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#2563eb"/></marker></defs>
<rect width="800" height="420" rx="20" fill="#f8fafc"/>
<text x="400.0" y="34.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Farming slopes: wrong way and right ways</text>
<polygon points="20.0,340.0 250.0,340.0 250.0,140.0" fill="#fde68a" stroke="#92400e" stroke-width="2" stroke-linejoin="round"/>
<text x="135.0" y="90.0" font-size="15" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Up and down the slope</text>
<line x1="70.0" y1="340.0" x2="74.0" y2="296.5" stroke="#92400e" stroke-width="3" stroke-linecap="round"/>
<line x1="106.0" y1="340.0" x2="110.0" y2="265.2" stroke="#92400e" stroke-width="3" stroke-linecap="round"/>
<line x1="142.0" y1="340.0" x2="146.0" y2="233.9" stroke="#92400e" stroke-width="3" stroke-linecap="round"/>
<line x1="178.0" y1="340.0" x2="182.0" y2="202.6" stroke="#92400e" stroke-width="3" stroke-linecap="round"/>
<line x1="214.0" y1="340.0" x2="218.0" y2="171.3" stroke="#92400e" stroke-width="3" stroke-linecap="round"/>
<line x1="200.0" y1="190.0" x2="120.0" y2="320.0" stroke="#2563eb" stroke-width="3" stroke-linecap="round" marker-end="url(#a2563eb)"/>
<text x="135.0" y="375.0" font-size="13" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="normal">water rushes down,</text>
<text x="135.0" y="393.0" font-size="13" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="normal">carrying soil</text>
<polygon points="285.0,340.0 515.0,340.0 515.0,140.0" fill="#fde68a" stroke="#92400e" stroke-width="2" stroke-linejoin="round"/>
<text x="400.0" y="90.0" font-size="15" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Contour ridges</text>
<line x1="296.5" y1="330.0" x2="515.0" y2="330.0" stroke="#15803d" stroke-width="4" stroke-linecap="round"/>
<line x1="340.2" y1="292.0" x2="515.0" y2="292.0" stroke="#15803d" stroke-width="4" stroke-linecap="round"/>
<line x1="383.9" y1="254.0" x2="515.0" y2="254.0" stroke="#15803d" stroke-width="4" stroke-linecap="round"/>
<line x1="427.6" y1="216.0" x2="515.0" y2="216.0" stroke="#15803d" stroke-width="4" stroke-linecap="round"/>
<line x1="471.3" y1="178.0" x2="515.0" y2="178.0" stroke="#15803d" stroke-width="4" stroke-linecap="round"/>
<text x="400.0" y="375.0" font-size="13" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="normal">ridges follow the contour:</text>
<text x="400.0" y="393.0" font-size="13" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="normal">water soaks in</text>
<polygon points="550.0,340.0 580.0,340.0 580.0,300.0 620.0,300.0 620.0,260.0 660.0,260.0 660.0,220.0 700.0,220.0 700.0,180.0 740.0,180.0 740.0,140.0 780.0,140.0 780.0,340.0" fill="#fde68a" stroke="#92400e" stroke-width="2" stroke-linejoin="round"/>
<text x="665.0" y="90.0" font-size="15" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Terraces</text>
<text x="665.0" y="375.0" font-size="13" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="normal">level steps on steep</text>
<text x="665.0" y="393.0" font-size="13" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="normal">slopes hold soil</text>
</svg>
