<line x1="378.0" y1="270.0" x2="440.0" y2="270.0" stroke="#475569" stroke-width="1.3" stroke-linecap="round"/>
<text x="448.0" y="270.0" font-size="15" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">subsoil: lighter; leached minerals collect</text>
