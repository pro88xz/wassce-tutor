<text x="448.0" y="155.0" font-size="15" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">topsoil: dark, humus, roots, organisms</text>
<rect x="90.0" y="210.0" width="280.0" height="120.0" rx="0" fill="#a0703c" stroke="#0f172a" stroke-width="1.6"/>
