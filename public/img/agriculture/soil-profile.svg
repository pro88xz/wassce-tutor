<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">A soil profile</title>
<desc id="d">A vertical section through soil showing its layers (horizons). At the top, the O horizon of leaf litter and humus. Below it the A horizon, the dark topsoil rich in humus, roots and organisms. Then the B horizon, the subsoil, lighter in colour, where leached minerals collect. Then the C horizon of weathered parent rock, and at the bottom the R horizon of solid bedrock.</desc>
<defs><marker id="a0f172a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f172a"/></marker><marker id="a0f172as" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#0f172a"/></marker></defs>
