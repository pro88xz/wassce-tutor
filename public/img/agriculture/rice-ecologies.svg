<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Rice-growing ecologies of Sierra Leone from hill to coast</title>
<desc id="d">A cross-section of the landscape. Upland rice is grown on free-draining slopes, depending on rain. Inland valley swamps lie in the valley bottoms between hills and stay wet. Bolilands and riverine grasslands are flat plains flooded in the rainy season. Mangrove swamps are on the coast, flooded by tides.</desc>
<defs></defs>
