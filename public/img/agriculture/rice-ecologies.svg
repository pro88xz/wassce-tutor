<line x1="60.0" y1="132.0" x2="60.0" y2="114.0" stroke="#15803d" stroke-width="2.4" stroke-linecap="round"/>
<line x1="110.0" y1="128.0" x2="110.0" y2="110.0" stroke="#15803d" stroke-width="2.4" stroke-linecap="round"/>
<line x1="150.0" y1="142.0" x2="150.0" y2="124.0" stroke="#15803d" stroke-width="2.4" stroke-linecap="round"/>
<text x="100.0" y="90.0" font-size="15" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Upland</text>
<text x="100.0" y="108.0" font-size="13" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="normal">rain-fed slopes</text>
<text x="280.0" y="220.0" font-size="15" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Inland valley</text>
<text x="280.0" y="238.0" font-size="13" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="normal">swamp</text>
<text x="545.0" y="240.0" font-size="15" fill="#0f766e" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Boliland /</text>
<text x="545.0" y="258.0" font-size="13" fill="#0f766e" text-anchor="middle" dominant-baseline="middle" font-weight="normal">riverine grassland</text>
<text x="710.0" y="250.0" font-size="15" fill="#7c3aed" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Mangrove</text>
<text x="710.0" y="268.0" font-size="13" fill="#7c3aed" text-anchor="middle" dominant-baseline="middle" font-weight="normal">swamp</text>
<text x="780.0" y="360.0" font-size="13" fill="#2563eb" text-anchor="end" dominant-baseline="middle" font-weight="normal">sea</text>
<text x="400.0" y="385.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Upland: low yields, needs fallow. Swamps: wetter, more fertile, cropped every year.</text>
