<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The order of land preparation and crop operations, with tools and implements</title>
<desc id="d">Clearing with cutlass, axe or bulldozer; ploughing (primary tillage) with hoe or disc plough; harrowing (secondary tillage) with rake or harrow; ridging or making beds with hoe or ridger; planting with planting stick or planter; weeding with hoe or herbicide sprayer; harvesting with sickle, cutlass or combine harvester.</desc>
<defs><marker id="a0f172a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f172a"/></marker><marker id="a0f172as" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#0f172a"/></marker></defs>
<rect width="800" height="330" rx="20" fill="#f8fafc"/>
