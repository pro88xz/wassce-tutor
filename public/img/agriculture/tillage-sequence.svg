<text x="173.0" y="212.0" font-size="12" fill="#92400e" text-anchor="middle" dominant-baseline="middle" font-weight="normal">hoe, mattock</text>
<text x="173.0" y="250.0" font-size="12" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="normal">disc plough</text>
