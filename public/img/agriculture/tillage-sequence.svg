<line x1="678.0" y1="150.0" x2="685.0" y2="150.0" stroke="#0f172a" stroke-width="2.2" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<text x="738.0" y="212.0" font-size="12" fill="#92400e" text-anchor="middle" dominant-baseline="middle" font-weight="normal">sickle, cutlass</text>
<text x="738.0" y="250.0" font-size="12" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="normal">combine</text>
<text x="20.0" y="212.0" font-size="1" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal"></text>
