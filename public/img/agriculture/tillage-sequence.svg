<text x="286.0" y="250.0" font-size="12" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="normal">disc harrow</text>
<rect x="349.0" y="115.0" width="100.0" height="70.0" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
