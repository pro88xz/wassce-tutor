<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Classification of farm animals</title>
<desc id="d">Farm animals are classified by digestive system and by use. Ruminants, with a four-chambered stomach, include cattle, sheep and goats. Non-ruminants (monogastrics) include pigs and rabbits; poultry such as chickens, ducks and turkeys have a crop and gizzard. By use: meat (cattle, goats, pigs, broilers), milk (cattle, goats), eggs (layers), draught power (oxen, donkeys), and wool or skins (sheep, goats).</desc>
