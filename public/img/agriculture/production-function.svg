<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The law of diminishing returns: total, average and marginal product</title>
<desc id="d">As more units of a variable input such as labour are added to a fixed amount of land, total product first rises quickly, then more slowly, reaches a maximum and then falls. Marginal product rises, then falls, and becomes zero where total product is greatest. Stage I lasts until average product is at its maximum, stage II until marginal product reaches zero, and stage III, where marginal product is negative, follows.</desc>
