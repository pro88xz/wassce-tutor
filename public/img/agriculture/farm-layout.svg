<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">A simple layout plan for a mixed farm</title>
<desc id="d">A plan of a mixed farm. The farmhouse, store and office are near the road entrance. Poultry house and pig pens are downwind of the house, near the store. Crop plots are divided for rotation. An orchard and the fish pond are near the stream, and the swamp rice field lies in the valley bottom. Paths link all parts.</desc>
