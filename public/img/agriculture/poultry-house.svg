<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">A deep litter poultry house</title>
<desc id="d">A cross-section of a deep litter house. A wide overhanging roof keeps out sun and rain. Each long side has a low wall with wire mesh above it for ventilation. The concrete floor is covered with a deep layer of dry litter such as wood shavings or rice husks. Feeders and drinkers stand on the litter, with a perch and nest boxes for layers.</desc>
