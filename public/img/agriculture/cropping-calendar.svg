<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">A cropping calendar for upland rice in Sierra Leone</title>
<desc id="d">A timeline across the year. The dry season runs from about November to April and the rainy season from about May to October. Brushing and felling take place from January to March, clearing and land preparation in March and April, planting in May and June at the start of the rains, weeding in June to August, bird scaring in August and September, and harvesting from September to November.</desc>
