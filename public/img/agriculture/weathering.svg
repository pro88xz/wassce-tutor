<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">How rock weathers into soil</title>
<desc id="d">Parent rock is broken down by three kinds of weathering. Physical weathering by heating and cooling, running water and wind breaks rock into smaller pieces. Chemical weathering by hydrolysis, oxidation, carbonation and solution changes the minerals. Biological weathering by roots, burrowing animals and microorganisms breaks rock and adds organic matter. Over time, with organic matter added, the result is soil.</desc>
