<text x="400.0" y="189.0" font-size="15" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Chemical</text>
<text x="400.0" y="210.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">hydrolysis, oxidation,</text>
<text x="400.0" y="231.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">carbonation, solution</text>
