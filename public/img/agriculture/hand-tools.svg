<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Common farm hand tools</title>
<desc id="d">Eight hand tools: the cutlass for clearing and weeding; the hoe for tilling, ridging and weeding; the shovel for digging and moving soil; the rake for levelling and collecting trash; the sickle for harvesting rice and grass; the pickaxe for breaking hard ground; the watering can for watering nurseries; and the knapsack sprayer for applying pesticides.</desc>
