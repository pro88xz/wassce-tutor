<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Grain storage structures</title>
<desc id="d">Three ways to store grain. A crib for maize cobs: a narrow, raised, slatted store with a roof, standing on legs fitted with metal rat guards, letting air dry the cobs. A hermetic bag: two airtight plastic liners inside a woven bag; insects inside die from lack of oxygen. A metal or concrete silo with a sealed lid for larger quantities.</desc>
