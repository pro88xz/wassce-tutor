<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Displacement from the area under a velocity-time graph</title>
<desc id="d">A body accelerates uniformly from rest to 12 m/s in 4 s, then moves at 12 m/s for 3 s. The area of the triangle is 24 m and the area of the rectangle is 36 m, so the displacement is 60 m.</desc>
<defs><marker id="a0f172a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f172a"/></marker><marker id="a0f172as" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#0f172a"/></marker></defs>
<rect width="680" height="430" rx="20" fill="#f8fafc"/>
<polygon points="90.0,352.0 338.0,136.0 338.0,352.0" fill="#dbeafe" stroke="none" stroke-width="0" stroke-linejoin="round"/>
<polygon points="338.0,352.0 338.0,136.0 524.0,136.0 524.0,352.0" fill="#dcfce7" stroke="none" stroke-width="0" stroke-linejoin="round"/>
<line x1="90.0" y1="352.0" x2="610.8" y2="352.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<line x1="90.0" y1="352.0" x2="90.0" y2="82.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<text x="610.8" y="378.0" font-size="18" fill="#475569" text-anchor="end" dominant-baseline="middle" font-weight="normal">t / s</text>
<text x="100.0" y="78.0" font-size="18" fill="#475569" text-anchor="start" dominant-baseline="auto" font-weight="normal">v / m s⁻¹</text>
<text x="78.0" y="368.0" font-size="18" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">0</text>
<path d="M 90.0 352.0 L 338.0 136.0 L 524.0 136.0" stroke="#0f172a" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="338.0" y1="136.0" x2="338.0" y2="352.0" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/>
<line x1="524.0" y1="136.0" x2="524.0" y2="352.0" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/>
<line x1="90.0" y1="136.0" x2="338.0" y2="136.0" stroke="#475569" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 5"/>
<text x="338.0" y="374.0" font-size="17" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">4</text>
<text x="524.0" y="374.0" font-size="17" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">7</text>
<text x="74.0" y="136.0" font-size="17" fill="#0f172a" text-anchor="end" dominant-baseline="middle" font-weight="normal">12</text>
<text x="269.8" y="287.2" font-size="16" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">½ × 4 × 12</text>
<text x="269.8" y="323.2" font-size="16" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">= 24 m</text>
<text x="431.0" y="226.0" font-size="17" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">3 × 12</text>
<text x="431.0" y="262.0" font-size="17" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">= 36 m</text>
<text x="340.0" y="34.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">displacement = area under graph = 24 m + 36 m = 60 m</text>
</svg>
