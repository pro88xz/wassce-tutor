<title id="t">Ray diagram for a converging (convex) lens</title>
<desc id="d">Object beyond 2F: a ray parallel to the axis passes through F on the far side, and a ray through the optical centre goes straight on. They meet to form a real, inverted, diminished image between F and 2F.</desc>
