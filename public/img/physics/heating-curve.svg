<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Heating curve of water</title>
<desc id="d">Temperature against time as ice at -10 degrees Celsius is heated steadily. The temperature stays at 0 degrees while ice melts and at 100 degrees while water boils; latent heat is absorbed in these flat sections.</desc>
<defs><marker id="a0f172a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f172a"/></marker><marker id="a0f172as" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#0f172a"/></marker></defs>
<rect width="660" height="400" rx="20" fill="#f8fafc"/>
<line x1="90.0" y1="340.0" x2="630.0" y2="340.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<line x1="90.0" y1="340.0" x2="90.0" y2="40.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<text x="630.0" y="366.0" font-size="20" fill="#475569" text-anchor="end" dominant-baseline="middle" font-weight="normal">time</text>
<text x="100.0" y="36.0" font-size="20" fill="#475569" text-anchor="start" dominant-baseline="auto" font-weight="normal">temperature / °C</text>
<text x="78.0" y="356.0" font-size="18" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">0</text>
<path d="M 90.0 322.0 L 140.0 300.0 L 240.0 300.0 L 380.0 80.0 L 560.0 80.0 L 600.0 40.4" stroke="#dc2626" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="84.0" y1="300.0" x2="140.0" y2="300.0" stroke="#e2e8f0" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 6"/>
<line x1="84.0" y1="80.0" x2="380.0" y2="80.0" stroke="#e2e8f0" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 6"/>
<text x="78.0" y="300.0" font-size="20" fill="#0f172a" text-anchor="end" dominant-baseline="middle" font-weight="bold">0</text>
<text x="78.0" y="80.0" font-size="20" fill="#0f172a" text-anchor="end" dominant-baseline="middle" font-weight="bold">100</text>
<text x="190.0" y="326.0" font-size="18" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">melting</text>
<text x="190.0" y="348.0" font-size="16" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="normal">(ice + water)</text>
<text x="470.0" y="58.0" font-size="18" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">boiling (water + steam)</text>
<text x="122.0" y="292.0" font-size="17" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">ice</text>
<text x="285.0" y="178.0" font-size="17" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">water</text>
<text x="600.0" y="22.4" font-size="17" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">steam</text>
<text x="360.0" y="380.0" font-size="17" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">flat sections: latent heat changes the state, not the temperature</text>
</svg>
