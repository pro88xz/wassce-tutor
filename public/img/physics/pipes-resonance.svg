<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Resonance in closed and open pipes</title>
<desc id="d">Left: a pipe closed at one end has a node at the closed end and an antinode at the open end; its fundamental wavelength is four times its length. Right: a pipe open at both ends has antinodes at both ends; its fundamental wavelength is twice its length.</desc>
