<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Umbra and penumbra</title>
<desc id="d">An extended light source shines on an opaque ball. Behind the ball is a region of total shadow, the umbra, surrounded by a region of partial shadow, the penumbra.</desc>
<defs></defs>
<rect width="660" height="330" rx="20" fill="#f8fafc"/>
<rect x="56.0" y="120.0" width="28.0" height="90.0" rx="10" fill="#fde68a" stroke="#ea580c" stroke-width="3"/>
<text x="70.0" y="236.0" font-size="16" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="normal">extended source</text>
<polygon points="300.0,131.0 540.0,48.6 540.0,281.4 300.0,199.0" fill="#cbd5e1" stroke="none" stroke-width="0" stroke-linejoin="round"/>
<polygon points="300.0,131.0 540.0,142.5 540.0,187.5 300.0,199.0" fill="#475569" stroke="none" stroke-width="0" stroke-linejoin="round"/>
<line x1="70.0" y1="120.0" x2="540.0" y2="142.5" stroke="#ea580c" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="6 5"/>
<line x1="70.0" y1="210.0" x2="540.0" y2="187.5" stroke="#ea580c" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="6 5"/>
<line x1="70.0" y1="210.0" x2="540.0" y2="48.6" stroke="#ea580c" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="6 5"/>
<line x1="70.0" y1="120.0" x2="540.0" y2="281.4" stroke="#ea580c" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="6 5"/>
<circle cx="300.0" cy="165.0" r="34.0" fill="#0f172a" stroke="#0f172a" stroke-width="2"/>
<line x1="540.0" y1="40.0" x2="540.0" y2="290.0" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
<text x="550.0" y="165.0" font-size="18" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">umbra</text>
<text x="550.0" y="42.6" font-size="16" fill="#475569" text-anchor="start" dominant-baseline="middle" font-weight="normal">penumbra</text>
<text x="550.0" y="295.4" font-size="16" fill="#475569" text-anchor="start" dominant-baseline="middle" font-weight="normal">penumbra</text>
<text x="300.0" y="225.0" font-size="16" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">opaque object</text>
</svg>
