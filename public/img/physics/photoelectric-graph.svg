<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Photoelectric effect: kinetic energy against frequency</title>
<desc id="d">Maximum kinetic energy of photoelectrons against the frequency of the light: zero below the threshold frequency f0, then a straight line of gradient h. Extending the line back meets the energy axis at minus the work function.</desc>
<defs><marker id="a0f172a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f172a"/></marker><marker id="a0f172as" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#0f172a"/></marker></defs>
<rect width="640" height="340" rx="20" fill="#f8fafc"/>
<line x1="120.0" y1="230.0" x2="610.0" y2="230.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<line x1="120.0" y1="320.0" x2="120.0" y2="30.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<text x="610.0" y="254.0" font-size="16" fill="#475569" text-anchor="end" dominant-baseline="middle" font-weight="normal">frequency f</text>
<text x="128.0" y="32.0" font-size="16" fill="#475569" text-anchor="start" dominant-baseline="auto" font-weight="normal">max kinetic energy</text>
<line x1="280.0" y1="230.0" x2="580.0" y2="50.0" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
<line x1="120.0" y1="326.0" x2="280.0" y2="230.0" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 6"/>
<circle cx="280.0" cy="230.0" r="6.0" fill="#dc2626" stroke="#dc2626" stroke-width="1"/>
<text x="280.0" y="254.0" font-size="16" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="bold">f₀ (threshold)</text>
<text x="110.0" y="326.0" font-size="18" fill="#0f172a" text-anchor="end" dominant-baseline="middle" font-weight="bold">−W</text>
<text x="470.0" y="180.0" font-size="19" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">gradient = h</text>
<text x="380.0" y="300.0" font-size="22" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Ek = hf − W</text>
</svg>
