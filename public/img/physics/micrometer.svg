<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Micrometer screw gauge and its parts</title>
<desc id="d">A micrometer screw gauge: a C-shaped frame holds a fixed anvil facing a moving spindle. The spindle is driven by the thimble, which carries the circular scale and turns against the main scale on the sleeve. The ratchet stops over-tightening.</desc>
