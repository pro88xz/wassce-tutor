<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Forces on a block resting on an inclined plane</title>
<desc id="d">A block on a slope at angle theta. Weight mg acts vertically down and splits into mg sin theta down the slope and mg cos theta into the slope. The normal reaction R and friction F act on the block.</desc>
<defs><marker id="a15803d" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker><marker id="a15803ds" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#15803d"/></marker><marker id="a7c3aed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker><marker id="a7c3aeds" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#7c3aed"/></marker><marker id="adc2626" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="adc2626s" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#dc2626"/></marker><marker id="aea580c" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#ea580c"/></marker><marker id="aea580cs" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#ea580c"/></marker></defs>
<rect width="660" height="420" rx="20" fill="#f8fafc"/>
<polygon points="60.0,370.0 600.0,370.0 600.0,58.2" fill="#e2e8f0" stroke="#0f172a" stroke-width="3" stroke-linejoin="round"/>
<path d="M 130.0 370.0 A 70 70 0 0 0 120.6 335.0" stroke="#0f172a" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="148.0" y="350.0" font-size="24" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal" font-style="italic">θ</text>
<polygon points="318.0,221.0 396.0,176.0 366.0,124.1 288.0,169.1" fill="#dbeafe" stroke="#0f172a" stroke-width="3" stroke-linejoin="round"/>
<line x1="342.0" y1="172.5" x2="342.0" y2="322.5" stroke="#dc2626" stroke-width="5" stroke-linecap="round" marker-end="url(#adc2626)"/>
<text x="356.0" y="332.5" font-size="24" fill="#dc2626" text-anchor="start" dominant-baseline="middle" font-weight="bold" font-style="italic">mg</text>
<line x1="342.0" y1="172.5" x2="277.0" y2="60.0" stroke="#15803d" stroke-width="5" stroke-linecap="round" marker-end="url(#a15803d)"/>
<text x="267.0" y="42.6" font-size="26" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold" font-style="italic">R</text>
<line x1="342.0" y1="172.5" x2="445.9" y2="112.5" stroke="#ea580c" stroke-width="5" stroke-linecap="round" marker-end="url(#aea580c)"/>
