<line x1="342.0" y1="172.5" x2="277.0" y2="210.0" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6" marker-end="url(#a7c3aed)"/>
<text x="256.1" y="237.5" font-size="20" fill="#7c3aed" text-anchor="end" dominant-baseline="middle" font-weight="bold">mg sin θ</text>
<line x1="342.0" y1="172.5" x2="379.5" y2="237.5" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6" marker-end="url(#a7c3aed)"/>
<text x="391.5" y="255.5" font-size="20" fill="#7c3aed" text-anchor="start" dominant-baseline="middle" font-weight="bold">mg cos θ</text>
</svg>
