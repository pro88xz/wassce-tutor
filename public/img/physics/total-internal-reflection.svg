<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Critical angle and total internal reflection</title>
<desc id="d">Three rays inside glass meet the glass-air surface. Below the critical angle the ray refracts out; at the critical angle it travels along the surface; beyond it the ray is totally internally reflected.</desc>
<defs></defs>
<rect width="660" height="360" rx="20" fill="#f8fafc"/>
<rect x="20.0" y="150.0" width="620.0" height="190.0" rx="0" fill="#e0f2fe" stroke="none" stroke-width="0"/>
<line x1="20.0" y1="150.0" x2="640.0" y2="150.0" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
<text x="40.0" y="130.0" font-size="18" fill="#475569" text-anchor="start" dominant-baseline="middle" font-weight="normal">air</text>
<text x="40.0" y="174.0" font-size="18" fill="#475569" text-anchor="start" dominant-baseline="middle" font-weight="normal">glass</text>
<line x1="130.0" y1="60.0" x2="130.0" y2="300.0" stroke="#475569" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 6"/>
<line x1="66.6" y1="285.9" x2="130.0" y2="150.0" stroke="#2563eb" stroke-width="3.5" stroke-linecap="round"/>
<polygon points="103.9,205.9 102.2,224.2 91.1,219.0" fill="#2563eb"/>
<line x1="130.0" y1="150.0" x2="199.7" y2="64.9" stroke="#2563eb" stroke-width="3.5" stroke-linecap="round"/>
<polygon points="175.5,94.4 169.3,111.7 159.8,104.0" fill="#2563eb"/>
<text x="130.0" y="332.0" font-size="16" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">i &lt; c: refracted</text>
<line x1="330.0" y1="60.0" x2="330.0" y2="300.0" stroke="#475569" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 6"/>
<line x1="230.0" y1="261.8" x2="330.0" y2="150.0" stroke="#ea580c" stroke-width="3.5" stroke-linecap="round"/>
<polygon points="288.9,196.0 281.9,212.9 272.8,204.8" fill="#ea580c"/>
<line x1="330.0" y1="150.0" x2="450.0" y2="148.0" stroke="#ea580c" stroke-width="3.5" stroke-linecap="round"/>
<polygon points="407.8,148.7 390.6,155.1 390.4,142.9" fill="#ea580c"/>
<text x="390.0" y="134.0" font-size="16" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">90°</text>
<text x="330.0" y="332.0" font-size="16" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">i = c</text>
<line x1="520.0" y1="60.0" x2="520.0" y2="300.0" stroke="#475569" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 6"/>
<line x1="390.1" y1="225.0" x2="520.0" y2="150.0" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round"/>
<polygon points="466.6,180.8 454.7,194.8 448.6,184.2" fill="#dc2626"/>
<line x1="520.0" y1="150.0" x2="649.9" y2="225.0" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round"/>
<polygon points="603.0,197.9 585.0,194.5 591.1,184.0" fill="#dc2626"/>
<text x="520.0" y="332.0" font-size="16" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="bold">i &gt; c: totally reflected</text>
<text x="330.0" y="40.0" font-size="18" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">for glass (n = 1.5) the critical angle c ≈ 42°</text>
</svg>
