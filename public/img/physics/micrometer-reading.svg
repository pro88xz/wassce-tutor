<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Reading a micrometer screw gauge: 5.78 mm</title>
<desc id="d">The sleeve shows 5 mm and the half-millimetre mark after it, so the sleeve reading is 5.5 mm. The 28th division of the thimble lies on the datum line, adding 28 times 0.01 mm. The reading is 5.78 mm.</desc>
