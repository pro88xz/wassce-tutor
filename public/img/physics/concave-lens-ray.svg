<title id="t">Ray diagram for a diverging (concave) lens</title>
<desc id="d">A ray parallel to the axis leaves the lens as if it came from the focal point F on the object side; a ray through the centre goes straight on. The image is virtual, upright and diminished, between F and the lens.</desc>
