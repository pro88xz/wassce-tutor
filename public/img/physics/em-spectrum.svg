<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The electromagnetic spectrum</title>
<desc id="d">The electromagnetic spectrum in order of decreasing wavelength and increasing frequency: radio waves, microwaves, infrared, visible light, ultraviolet, X-rays, gamma rays.</desc>
<defs><marker id="a2563eb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a2563ebs" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#2563eb"/></marker><marker id="adc2626" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="adc2626s" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#dc2626"/></marker></defs>
<rect width="680" height="300" rx="20" fill="#f8fafc"/>
<defs><linearGradient id="vis" x1="0" x2="1"><stop offset="0" stop-color="#ef4444"/><stop offset="0.2" stop-color="#f97316"/><stop offset="0.4" stop-color="#eab308"/><stop offset="0.6" stop-color="#22c55e"/><stop offset="0.8" stop-color="#3b82f6"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs>
<rect x="30.0" y="90.0" width="88.0" height="80.0" rx="0" fill="#dbeafe" stroke="#0f172a" stroke-width="2"/>
<text x="74.0" y="130.0" font-size="16" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">radio</text>
<rect x="120.0" y="90.0" width="88.0" height="80.0" rx="0" fill="#e0e7ff" stroke="#0f172a" stroke-width="2"/>
<text x="164.0" y="120.0" font-size="16" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">micro-</text>
<text x="164.0" y="140.0" font-size="16" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">waves</text>
<rect x="210.0" y="90.0" width="88.0" height="80.0" rx="0" fill="#fee2e2" stroke="#0f172a" stroke-width="2"/>
<text x="254.0" y="120.0" font-size="16" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">infra-</text>
<text x="254.0" y="140.0" font-size="16" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">red</text>
<rect x="300.0" y="90.0" width="88.0" height="80.0" rx="0" fill="url(#vis)" stroke="#0f172a" stroke-width="2"/>
<text x="344.0" y="130.0" font-size="16" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">visible</text>
<rect x="390.0" y="90.0" width="88.0" height="80.0" rx="0" fill="#ede9fe" stroke="#0f172a" stroke-width="2"/>
<text x="434.0" y="120.0" font-size="16" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">ultra-</text>
<text x="434.0" y="140.0" font-size="16" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">violet</text>
<rect x="480.0" y="90.0" width="88.0" height="80.0" rx="0" fill="#f3e8ff" stroke="#0f172a" stroke-width="2"/>
<text x="524.0" y="130.0" font-size="16" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">X-rays</text>
<rect x="570.0" y="90.0" width="88.0" height="80.0" rx="0" fill="#fae8ff" stroke="#0f172a" stroke-width="2"/>
<text x="614.0" y="120.0" font-size="16" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">gamma</text>
<text x="614.0" y="140.0" font-size="16" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">rays</text>
<line x1="40.0" y1="210.0" x2="640.0" y2="210.0" stroke="#dc2626" stroke-width="3" stroke-linecap="round" marker-end="url(#adc2626)"/>
<text x="340.0" y="234.0" font-size="17" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="bold">frequency and energy increase →</text>
