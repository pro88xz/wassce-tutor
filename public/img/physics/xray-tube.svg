<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">An X-ray tube</title>
<desc id="d">Electrons from a heated cathode are accelerated by a very high voltage across an evacuated tube and strike a tungsten target embedded in a copper anode. X-rays are emitted from the target; most of the energy becomes heat, carried away by the copper and cooling fins.</desc>
