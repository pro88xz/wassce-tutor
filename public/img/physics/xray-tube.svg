<text x="330.0" y="46.0" font-size="16" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">evacuated glass tube</text>
<rect x="110.0" y="140.0" width="30.0" height="40.0" rx="0" fill="#cbd5e1" stroke="#0f172a" stroke-width="2.5"/>
<text x="125.0" y="205.0" font-size="14" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">heated</text>
<text x="125.0" y="222.0" font-size="14" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">cathode</text>
<rect x="470.0" y="120.0" width="150.0" height="80.0" rx="0" fill="#c2410c" stroke="#0f172a" stroke-width="2.5"/>
<polygon points="470.0,120.0 470.0,200.0 430.0,160.0" fill="#64748b" stroke="#0f172a" stroke-width="2.5" stroke-linejoin="round"/>
<text x="545.0" y="160.0" font-size="14" fill="#ffffff" text-anchor="middle" dominant-baseline="middle" font-weight="bold">copper anode</text>
<text x="430.0" y="218.0" font-size="14" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">tungsten target</text>
<line x1="145.0" y1="152.0" x2="425.0" y2="158.4" stroke="#2563eb" stroke-width="2" stroke-linecap="round" marker-end="url(#a2563eb)"/>
