<circle cx="578.0" cy="300.0" r="5.0" fill="#15803d" stroke="#15803d" stroke-width="1"/>
<text x="520.0" y="386.0" font-size="15" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">converging lens corrects it</text>
