<circle cx="288.0" cy="300.0" r="5.0" fill="#ea580c" stroke="#ea580c" stroke-width="1"/>
<text x="200.0" y="386.0" font-size="15" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="normal">focus behind retina</text>
<circle cx="520.0" cy="300.0" r="62.0" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
<ellipse cx="474.0" cy="300.0" rx="10.0" ry="30.0" fill="#e0f2fe" stroke="#0f172a" stroke-width="2"/>
