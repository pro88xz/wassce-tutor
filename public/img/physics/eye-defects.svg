<line x1="410.0" y1="278.0" x2="474.0" y2="286.8" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/>
<line x1="474.0" y1="286.8" x2="578.0" y2="300.0" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/>
<line x1="330.0" y1="322.0" x2="410.0" y2="322.0" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/>
<line x1="410.0" y1="322.0" x2="474.0" y2="313.2" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/>
