<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Block and tackle pulley system</title>
<desc id="d">Two pulley blocks: the upper one hangs from a beam and the lower one carries the load. Four strands of rope support the lower block, so the velocity ratio is 4. The effort pulls down on the free end of the rope.</desc>
