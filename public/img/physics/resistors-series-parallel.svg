<line x1="370.0" y1="304.0" x2="500.0" y2="304.0" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
<rect x="290.0" y="291.0" width="80.0" height="26.0" rx="0" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
