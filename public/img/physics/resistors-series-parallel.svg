<text x="165.0" y="61.0" font-size="20" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">R₁</text>
<line x1="250.0" y1="90.0" x2="295.0" y2="90.0" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
