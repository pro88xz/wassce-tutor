<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Resistors in series and in parallel</title>
<desc id="d">Top: three resistors joined end to end in series; the same current flows through each and R = R1 + R2 + R3. Bottom: three resistors side by side in parallel; the same voltage is across each and 1/R = 1/R1 + 1/R2 + 1/R3.</desc>
<defs></defs>
<rect width="660" height="340" rx="20" fill="#f8fafc"/>
<text x="20.0" y="28.0" font-size="19" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Series: R = R₁ + R₂ + R₃</text>
<line x1="40.0" y1="90.0" x2="80.0" y2="90.0" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
