<rect x="295.0" y="77.0" width="80.0" height="26.0" rx="0" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
<text x="335.0" y="61.0" font-size="20" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">R₂</text>
<line x1="420.0" y1="90.0" x2="465.0" y2="90.0" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
<line x1="545.0" y1="90.0" x2="590.0" y2="90.0" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
<rect x="465.0" y="77.0" width="80.0" height="26.0" rx="0" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
<text x="505.0" y="61.0" font-size="20" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">R₃</text>
<line x1="590.0" y1="90.0" x2="620.0" y2="90.0" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
<circle cx="40.0" cy="90.0" r="5.0" fill="#0f172a" stroke="#0f172a" stroke-width="1"/>
<circle cx="620.0" cy="90.0" r="5.0" fill="#0f172a" stroke="#0f172a" stroke-width="1"/>
<text x="20.0" y="155.0" font-size="19" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Parallel: 1/R = 1/R₁ + 1/R₂ + 1/R₃</text>
<line x1="80.0" y1="252.0" x2="160.0" y2="252.0" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
<line x1="500.0" y1="252.0" x2="580.0" y2="252.0" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
