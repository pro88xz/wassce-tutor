<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Momentum before and after a collision</title>
<desc id="d">Before: a 2 kg trolley at 3 m/s moves towards a 1 kg trolley at rest. After: they stick together and move at 2 m/s. Total momentum is 6 kg m/s before and after.</desc>
<defs><marker id="adc2626" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="adc2626s" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#dc2626"/></marker></defs>
<rect width="660" height="330" rx="20" fill="#f8fafc"/>
<text x="330.0" y="34.0" font-size="21" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Total momentum before = total momentum after</text>
<text x="40.0" y="90.0" font-size="22" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Before</text>
<rect x="80.0" y="110.0" width="120.0" height="60.0" rx="6" fill="#dbeafe" stroke="#0f172a" stroke-width="3"/>
<text x="140.0" y="140.0" font-size="22" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">2 kg</text>
<line x1="210.0" y1="140.0" x2="300.0" y2="140.0" stroke="#dc2626" stroke-width="4" stroke-linecap="round" marker-end="url(#adc2626)"/>
<text x="255.0" y="120.0" font-size="20" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="bold">3 m/s</text>
<rect x="380.0" y="110.0" width="80.0" height="60.0" rx="6" fill="#fef3c7" stroke="#0f172a" stroke-width="3"/>
<text x="420.0" y="140.0" font-size="22" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">1 kg</text>
<text x="420.0" y="190.0" font-size="18" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">at rest</text>
<text x="560.0" y="140.0" font-size="20" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">p = 2 × 3 = 6</text>
<line x1="40.0" y1="210.0" x2="620.0" y2="210.0" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/>
<text x="40.0" y="240.0" font-size="22" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">After</text>
<rect x="160.0" y="250.0" width="120.0" height="60.0" rx="6" fill="#dbeafe" stroke="#0f172a" stroke-width="3"/>
<rect x="280.0" y="250.0" width="80.0" height="60.0" rx="6" fill="#fef3c7" stroke="#0f172a" stroke-width="3"/>
<text x="220.0" y="280.0" font-size="22" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">2 kg</text>
<text x="320.0" y="280.0" font-size="22" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">1 kg</text>
<line x1="370.0" y1="280.0" x2="450.0" y2="280.0" stroke="#dc2626" stroke-width="4" stroke-linecap="round" marker-end="url(#adc2626)"/>
<text x="410.0" y="260.0" font-size="20" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="bold">2 m/s</text>
<text x="560.0" y="280.0" font-size="20" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">p = 3 × 2 = 6</text>
</svg>
