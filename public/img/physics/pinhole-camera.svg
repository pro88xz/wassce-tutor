<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 320" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The pinhole camera</title>
<desc id="d">Light from the top of an object passes through a small pinhole and reaches the bottom of the screen; light from the bottom reaches the top. The image is real and inverted.</desc>
