<title id="t">Vernier calipers and their parts</title>
<desc id="d">Vernier calipers: a fixed jaw on a main-scale beam and a sliding jaw carrying the vernier scale. The large lower jaws grip an object&#x27;s outside; the small upper jaws fit inside a hole; the depth rod measures depth.</desc>
