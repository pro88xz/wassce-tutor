<title id="t">Magnetic fields of a straight wire and a solenoid</title>
<desc id="d">Left: around a straight wire carrying current into the page, the field lines are concentric circles running clockwise. Right: a current-carrying solenoid produces a field like a bar magnet, with a north pole at one end.</desc>
