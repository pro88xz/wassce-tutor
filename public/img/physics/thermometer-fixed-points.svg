<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">A liquid-in-glass thermometer and its fixed points</title>
<desc id="d">A mercury thermometer with a bulb and a narrow capillary tube. The lower fixed point is 0 °C (melting ice) and the upper fixed point is 100 °C (steam at standard pressure).</desc>
<defs></defs>
<rect width="660" height="420" rx="20" fill="#f8fafc"/>
<rect x="270.0" y="40.0" width="30.0" height="300.0" rx="14" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
<circle cx="285.0" cy="360.0" r="30.0" fill="#cbd5e1" stroke="#0f172a" stroke-width="3"/>
<rect x="280.0" y="150.0" width="10.0" height="200.0" rx="0" fill="#cbd5e1" stroke="none" stroke-width="0"/>
<line x1="300.0" y1="320.0" x2="322.0" y2="320.0" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
<text x="330.0" y="320.0" font-size="19" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">0 °C</text>
<line x1="300.0" y1="296.0" x2="312.0" y2="296.0" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
<line x1="300.0" y1="272.0" x2="312.0" y2="272.0" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
<line x1="300.0" y1="248.0" x2="312.0" y2="248.0" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
<line x1="300.0" y1="224.0" x2="312.0" y2="224.0" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
<line x1="300.0" y1="200.0" x2="322.0" y2="200.0" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
<text x="330.0" y="200.0" font-size="19" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">50 °C</text>
<line x1="300.0" y1="176.0" x2="312.0" y2="176.0" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
<line x1="300.0" y1="152.0" x2="312.0" y2="152.0" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
<line x1="300.0" y1="128.0" x2="312.0" y2="128.0" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
<line x1="300.0" y1="104.0" x2="312.0" y2="104.0" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
<line x1="300.0" y1="80.0" x2="322.0" y2="80.0" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
<text x="330.0" y="80.0" font-size="19" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">100 °C</text>
<text x="420.0" y="80.0" font-size="19" fill="#dc2626" text-anchor="start" dominant-baseline="middle" font-weight="bold">upper fixed point:</text>
<text x="420.0" y="104.0" font-size="17" fill="#dc2626" text-anchor="start" dominant-baseline="middle" font-weight="normal">steam above boiling water</text>
<text x="420.0" y="310.0" font-size="19" fill="#2563eb" text-anchor="start" dominant-baseline="middle" font-weight="bold">lower fixed point:</text>
<text x="420.0" y="334.0" font-size="17" fill="#2563eb" text-anchor="start" dominant-baseline="middle" font-weight="normal">pure melting ice</text>
<text x="150.0" y="200.0" font-size="18" fill="#475569" text-anchor="end" dominant-baseline="middle" font-weight="normal">capillary</text>
<line x1="155.0" y1="200.0" x2="265.0" y2="200.0" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
<text x="150.0" y="360.0" font-size="18" fill="#475569" text-anchor="end" dominant-baseline="middle" font-weight="normal">bulb</text>
<line x1="155.0" y1="360.0" x2="253.0" y2="360.0" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
</svg>
