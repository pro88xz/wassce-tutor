<text x="134.0" y="86.0" font-size="17" fill="#2563eb" text-anchor="start" dominant-baseline="middle" font-weight="bold">effort</text>
<polygon points="320.0,139.0 300.0,174.0 340.0,174.0" fill="#e2e8f0" stroke="#0f172a" stroke-width="2.5" stroke-linejoin="round"/>
<text x="320.0" y="188.0" font-size="16" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">fulcrum</text>
<rect x="498.0" y="89.0" width="44.0" height="36.0" rx="3" fill="#dbeafe" stroke="#0f172a" stroke-width="2.5"/>
