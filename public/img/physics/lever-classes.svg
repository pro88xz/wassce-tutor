<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The three classes of lever</title>
<desc id="d">First class: fulcrum between effort and load (see-saw, crowbar). Second class: load between fulcrum and effort (wheelbarrow). Third class: effort between fulcrum and load (forearm, tweezers).</desc>
<defs><marker id="a2563eb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a2563ebs" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#2563eb"/></marker><marker id="adc2626" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="adc2626s" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#dc2626"/></marker></defs>
<rect width="640" height="520" rx="20" fill="#f8fafc"/>
<text x="30.0" y="38.0" font-size="21" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Class 1: fulcrum in the middle</text>
<text x="30.0" y="64.0" font-size="18" fill="#475569" text-anchor="start" dominant-baseline="middle" font-weight="normal">e.g. crowbar, see-saw, scissors</text>
