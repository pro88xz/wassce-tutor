<text x="550.0" y="100.0" font-size="17" fill="#dc2626" text-anchor="start" dominant-baseline="middle" font-weight="bold">load</text>
<text x="30.0" y="198.0" font-size="21" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Class 2: load in the middle</text>
<text x="30.0" y="224.0" font-size="18" fill="#475569" text-anchor="start" dominant-baseline="middle" font-weight="normal">e.g. wheelbarrow, bottle opener</text>
