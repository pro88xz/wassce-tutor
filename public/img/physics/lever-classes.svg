<text x="350.0" y="260.0" font-size="17" fill="#dc2626" text-anchor="start" dominant-baseline="middle" font-weight="bold">load</text>
<line x1="520.0" y1="348.0" x2="520.0" y2="302.0" stroke="#2563eb" stroke-width="4" stroke-linecap="round" marker-end="url(#a2563eb)"/>
