<title id="t">Electrolysis of copper(II) sulphate with copper electrodes</title>
<desc id="d">Two copper electrodes dip into copper sulphate solution and are connected to a battery. Copper ions move to the cathode and are deposited as copper; copper dissolves from the anode.</desc>
