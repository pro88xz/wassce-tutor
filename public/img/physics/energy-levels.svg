<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Energy levels of the hydrogen atom</title>
<desc id="d">Energy level diagram: n = 1 at -13.6 eV, n = 2 at -3.4 eV, n = 3 at -1.51 eV, n = 4 at -0.85 eV, and zero at infinity. An electron dropping from a higher level to a lower one emits a photon whose energy equals the difference.</desc>
<defs><marker id="a2563eb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a2563ebs" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#2563eb"/></marker><marker id="a7c3aed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker><marker id="a7c3aeds" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#7c3aed"/></marker><marker id="adc2626" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="adc2626s" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#dc2626"/></marker></defs>
<rect width="640" height="380" rx="20" fill="#f8fafc"/>
<line x1="120.0" y1="320.0" x2="470.0" y2="320.0" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
<text x="110.0" y="320.0" font-size="17" fill="#0f172a" text-anchor="end" dominant-baseline="middle" font-weight="bold">n = 1</text>
<text x="480.0" y="320.0" font-size="17" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">-13.6 eV</text>
<line x1="120.0" y1="200.0" x2="470.0" y2="200.0" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
<text x="110.0" y="200.0" font-size="17" fill="#0f172a" text-anchor="end" dominant-baseline="middle" font-weight="bold">n = 2</text>
<text x="480.0" y="200.0" font-size="17" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">-3.4 eV</text>
<line x1="120.0" y1="140.0" x2="470.0" y2="140.0" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
<text x="110.0" y="140.0" font-size="17" fill="#0f172a" text-anchor="end" dominant-baseline="middle" font-weight="bold">n = 3</text>
<text x="480.0" y="140.0" font-size="17" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">-1.51 eV</text>
<line x1="120.0" y1="100.0" x2="470.0" y2="100.0" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
<text x="110.0" y="100.0" font-size="17" fill="#0f172a" text-anchor="end" dominant-baseline="middle" font-weight="bold">n = 4</text>
<text x="480.0" y="100.0" font-size="17" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">-0.85 eV</text>
<line x1="120.0" y1="60.0" x2="470.0" y2="60.0" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6"/>
<text x="110.0" y="60.0" font-size="17" fill="#0f172a" text-anchor="end" dominant-baseline="middle" font-weight="bold">n = ∞</text>
<text x="480.0" y="60.0" font-size="17" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">0.0 eV</text>
<line x1="200.0" y1="200.0" x2="200.0" y2="318.0" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" marker-end="url(#a7c3aed)"/>
<line x1="300.0" y1="140.0" x2="300.0" y2="198.0" stroke="#dc2626" stroke-width="3" stroke-linecap="round" marker-end="url(#adc2626)"/>
<line x1="380.0" y1="100.0" x2="380.0" y2="198.0" stroke="#2563eb" stroke-width="3" stroke-linecap="round" marker-end="url(#a2563eb)"/>
<text x="210.0" y="254.1" font-size="16" fill="#7c3aed" text-anchor="start" dominant-baseline="middle" font-weight="bold">UV</text>
<text x="310.0" y="168.3" font-size="16" fill="#dc2626" text-anchor="start" dominant-baseline="middle" font-weight="bold">red</text>
<text x="390.0" y="158.7" font-size="16" fill="#2563eb" text-anchor="start" dominant-baseline="middle" font-weight="bold">blue</text>
<text x="320.0" y="362.0" font-size="17" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">photon energy hf = E(upper) − E(lower)   (not to scale)</text>
</svg>
