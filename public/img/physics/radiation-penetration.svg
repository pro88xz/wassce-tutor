<title id="t">Penetrating power of alpha, beta and gamma radiation</title>
<desc id="d">Alpha particles are stopped by a sheet of paper; beta particles pass paper but are stopped by a few millimetres of aluminium; gamma rays pass both and are only reduced by thick lead or concrete.</desc>
