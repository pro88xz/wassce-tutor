<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">A transformer</title>
<desc id="d">Two coils wound on a laminated soft-iron core. An alternating voltage on the primary coil produces a changing magnetic flux in the core, which induces an alternating voltage in the secondary coil.</desc>
