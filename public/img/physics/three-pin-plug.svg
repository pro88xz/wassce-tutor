<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Wiring a three-pin plug</title>
<desc id="d">Inside a three-pin plug: the brown live wire goes through the fuse to the right-hand pin, the blue neutral wire to the left-hand pin, and the green and yellow earth wire to the top pin. A cord grip holds the cable.</desc>
<defs></defs>
<rect width="560" height="400" rx="20" fill="#f8fafc"/>
<rect x="110.0" y="40.0" width="340.0" height="320.0" rx="30" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
<rect x="255.0" y="70.0" width="50.0" height="80.0" rx="0" fill="#cbd5e1" stroke="#0f172a" stroke-width="2.5"/>
<text x="280.0" y="168.0" font-size="18" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">E</text>
<rect x="160.0" y="200.0" width="46.0" height="70.0" rx="0" fill="#cbd5e1" stroke="#0f172a" stroke-width="2.5"/>
<text x="183.0" y="288.0" font-size="18" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">N</text>
<rect x="354.0" y="200.0" width="46.0" height="70.0" rx="0" fill="#cbd5e1" stroke="#0f172a" stroke-width="2.5"/>
<text x="377.0" y="288.0" font-size="18" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">L</text>
<rect x="360.0" y="120.0" width="34.0" height="70.0" rx="0" fill="#fde68a" stroke="#0f172a" stroke-width="2"/>
<text x="410.0" y="155.0" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">fuse</text>
<rect x="230.0" y="320.0" width="100.0" height="22.0" rx="0" fill="#e2e8f0" stroke="#0f172a" stroke-width="2"/>
<text x="342.0" y="332.0" font-size="15" fill="#475569" text-anchor="start" dominant-baseline="middle" font-weight="normal">cord grip</text>
<path d="M 275 345 C 275 300 280 200 280 150" stroke="#16a34a" stroke-width="7" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 275 345 C 275 300 280 200 280 150" stroke="#facc15" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="10 8"/>
<path d="M 268 345 C 250 300 190 300 183 270" stroke="#2563eb" stroke-width="7" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 290 345 C 320 300 377 240 377 190" stroke="#92400e" stroke-width="7" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="160.0" y="380.0" font-size="15" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">blue = neutral</text>
<text x="290.0" y="380.0" font-size="15" fill="#92400e" text-anchor="middle" dominant-baseline="middle" font-weight="bold">brown = live (via fuse)</text>
<text x="280.0" y="26.0" font-size="15" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">green/yellow = earth</text>
</svg>
