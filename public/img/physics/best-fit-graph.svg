<line x1="347.0" y1="172.7" x2="361.0" y2="158.7" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
<line x1="413.0" y1="121.3" x2="427.0" y2="135.3" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
<line x1="413.0" y1="135.3" x2="427.0" y2="121.3" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
<line x1="479.0" y1="92.4" x2="493.0" y2="106.4" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
