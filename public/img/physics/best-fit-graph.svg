<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Drawing a line of best fit and finding its gradient</title>
<desc id="d">Plotted points scattered about a straight line of best fit. A large right-angled triangle drawn on the line gives the gradient as the change in y divided by the change in x.</desc>
<defs><marker id="a0f172a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f172a"/></marker><marker id="a0f172as" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#0f172a"/></marker></defs>
<rect width="640" height="360" rx="20" fill="#f8fafc"/>
<line x1="90.0" y1="300.0" x2="610.0" y2="300.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<line x1="90.0" y1="300.0" x2="90.0" y2="30.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<text x="610.0" y="326.0" font-size="20" fill="#475569" text-anchor="end" dominant-baseline="middle" font-weight="normal">x</text>
<text x="100.0" y="26.0" font-size="20" fill="#475569" text-anchor="start" dominant-baseline="auto" font-weight="normal">y</text>
<text x="78.0" y="316.0" font-size="18" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">0</text>
