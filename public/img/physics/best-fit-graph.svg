<text x="354.0" y="270.1" font-size="19" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Δx</text>
<text x="531.0" y="163.1" font-size="19" fill="#dc2626" text-anchor="start" dominant-baseline="middle" font-weight="bold">Δy</text>
