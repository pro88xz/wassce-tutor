<line x1="149.0" y1="271.3" x2="163.0" y2="257.3" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
<line x1="215.0" y1="228.4" x2="229.0" y2="242.4" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
<line x1="215.0" y1="242.4" x2="229.0" y2="228.4" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
