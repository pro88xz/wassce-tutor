<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Velocity-time graph for a ball thrown straight up</title>
<desc id="d">Velocity falls in a straight line from +u to zero at the highest point, then becomes negative as the ball falls back. The gradient is -g throughout.</desc>
<defs><marker id="a0f172a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f172a"/></marker><marker id="a0f172as" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#0f172a"/></marker></defs>
<rect width="640" height="420" rx="20" fill="#f8fafc"/>
<line x1="90.0" y1="380.0" x2="90.0" y2="40.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<line x1="90.0" y1="210.0" x2="600.0" y2="210.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<text x="600.0" y="236.0" font-size="20" fill="#475569" text-anchor="end" dominant-baseline="middle" font-weight="normal">time / s</text>
<text x="100.0" y="36.0" font-size="20" fill="#475569" text-anchor="start" dominant-baseline="auto" font-weight="normal">velocity / m s⁻¹ (up +)</text>
<polygon points="90.0,210.0 90.0,80.0 300.0,210.0" fill="#dcfce7" stroke="none" stroke-width="0" stroke-linejoin="round"/>
<polygon points="300.0,210.0 510.0,340.0 510.0,210.0" fill="#fee2e2" stroke="none" stroke-width="0" stroke-linejoin="round"/>
<line x1="90.0" y1="80.0" x2="510.0" y2="340.0" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
<text x="78.0" y="80.0" font-size="22" fill="#0f172a" text-anchor="end" dominant-baseline="middle" font-weight="bold">+u</text>
<text x="78.0" y="340.0" font-size="22" fill="#0f172a" text-anchor="end" dominant-baseline="middle" font-weight="bold">−u</text>
<line x1="84.0" y1="340.0" x2="510.0" y2="340.0" stroke="#e2e8f0" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 6"/>
<circle cx="300.0" cy="210.0" r="7.0" fill="#dc2626" stroke="#dc2626" stroke-width="1"/>
<rect x="306.0" y="161.0" width="234.0" height="30.0" rx="4" fill="#f8fafc" stroke="none" stroke-width="0" opacity="0.92"/>
<text x="306.0" y="176.0" font-size="20" fill="#dc2626" text-anchor="start" dominant-baseline="middle" font-weight="bold">highest point: v = 0</text>
<text x="300.0" y="238.0" font-size="20" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">t = u/g</text>
<text x="510.0" y="238.0" font-size="20" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">2u/g</text>
<text x="170.0" y="175.0" font-size="18" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="normal">going up</text>
<text x="420.0" y="255.0" font-size="18" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="normal">falling</text>
<text x="470.0" y="110.0" font-size="22" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">gradient = −g</text>
</svg>
