<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Free-body diagram of a person in a lift</title>
<desc id="d">A person stands in a lift. Two forces act: the weight mg downwards and the normal reaction R upwards. If the lift accelerates upwards, R is greater than mg.</desc>
<defs><marker id="a15803d" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker><marker id="a15803ds" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#15803d"/></marker><marker id="a2563eb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a2563ebs" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#2563eb"/></marker><marker id="adc2626" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="adc2626s" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#dc2626"/></marker></defs>
<rect width="640" height="400" rx="20" fill="#f8fafc"/>
<rect x="200.0" y="50.0" width="240.0" height="300.0" rx="6" fill="#e2e8f0" stroke="#0f172a" stroke-width="3"/>
<line x1="320.0" y1="10.0" x2="320.0" y2="50.0" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
<text x="334.0" y="26.0" font-size="18" fill="#475569" text-anchor="start" dominant-baseline="middle" font-weight="normal">cable</text>
<rect x="285.0" y="170.0" width="70.0" height="150.0" rx="18" fill="#dbeafe" stroke="#0f172a" stroke-width="2.5"/>
<circle cx="320.0" cy="145.0" r="24.0" fill="#dbeafe" stroke="#0f172a" stroke-width="2.5"/>
<line x1="200.0" y1="320.0" x2="440.0" y2="320.0" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
<line x1="320.0" y1="320.0" x2="320.0" y2="200.0" stroke="#15803d" stroke-width="5" stroke-linecap="round" marker-end="url(#a15803d)"/>
<rect x="345.7" y="222.0" width="24.6" height="36.0" rx="4" fill="#f8fafc" stroke="none" stroke-width="0" opacity="0.92"/>
<text x="358.0" y="240.0" font-size="26" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold" font-style="italic">R</text>
<line x1="320.0" y1="245.0" x2="320.0" y2="385.0" stroke="#dc2626" stroke-width="5" stroke-linecap="round" marker-end="url(#adc2626)"/>
<rect x="339.6" y="355.0" width="36.9" height="34.0" rx="4" fill="#f8fafc" stroke="none" stroke-width="0" opacity="0.92"/>
<text x="358.0" y="372.0" font-size="24" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="bold" font-style="italic">mg</text>
<line x1="500.0" y1="230.0" x2="500.0" y2="140.0" stroke="#2563eb" stroke-width="4" stroke-linecap="round" marker-end="url(#a2563eb)"/>
<text x="512.0" y="180.0" font-size="26" fill="#2563eb" text-anchor="start" dominant-baseline="middle" font-weight="bold" font-style="italic">a</text>
<text x="560.0" y="250.0" font-size="22" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">R − mg = ma</text>
<text x="560.0" y="280.0" font-size="18" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">(accelerating up)</text>
</svg>
