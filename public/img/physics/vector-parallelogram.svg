<text x="260.0" y="330.0" font-size="26" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold" font-style="italic">P</text>
<text x="134.3" y="219.4" font-size="26" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold" font-style="italic">Q</text>
