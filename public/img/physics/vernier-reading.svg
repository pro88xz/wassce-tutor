<line x1="310.0" y1="196.0" x2="370.0" y2="290.0" stroke="#dc2626" stroke-width="1.6" stroke-linecap="round"/>
<text x="374.0" y="296.0" font-size="16" fill="#dc2626" text-anchor="start" dominant-baseline="middle" font-weight="bold">6th vernier mark lines up</text>
<text x="360.0" y="334.0" font-size="21" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Reading = 24 mm + 6 × 0.1 mm = 24.6 mm</text>
<text x="360.0" y="30.0" font-size="17" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">10 vernier divisions = 9 mm, so least count = 0.1 mm</text>
