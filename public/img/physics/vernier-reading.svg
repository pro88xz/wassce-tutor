<text x="445.6" y="160.0" font-size="15" fill="#2563eb" text-anchor="start" dominant-baseline="middle" font-weight="normal">vernier</text>
<line x1="169.6" y1="196.0" x2="169.6" y2="232.0" stroke="#0f172a" stroke-width="1.6" stroke-linecap="round"/>
