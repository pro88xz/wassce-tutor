<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The inclined plane as a machine</title>
<desc id="d">A load is pushed up a slope of length l to a height h. The velocity ratio is l divided by h, which equals 1 over sin theta.</desc>
<defs><marker id="a0f172a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f172a"/></marker><marker id="a0f172as" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#0f172a"/></marker><marker id="a2563eb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a2563ebs" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#2563eb"/></marker></defs>
<rect width="640" height="360" rx="20" fill="#f8fafc"/>
<polygon points="60.0,300.0 580.0,300.0 580.0,120.0" fill="#e2e8f0" stroke="#0f172a" stroke-width="3" stroke-linejoin="round"/>
<path d="M 140.0 300.0 A 80 80 0 0 0 135.6 273.8" stroke="#0f172a" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="160.0" y="286.0" font-size="24" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal" font-style="italic">θ</text>
<polygon points="338.9,203.4 405.1,180.6 390.0,137.1 323.9,160.0" fill="#fef3c7" stroke="#0f172a" stroke-width="3" stroke-linejoin="round"/>
<line x1="227.5" y1="217.7" x2="329.4" y2="181.7" stroke="#2563eb" stroke-width="5" stroke-linecap="round" marker-end="url(#a2563eb)"/>
<text x="231.5" y="202.7" font-size="20" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">effort</text>
<text x="300.0" y="175.0" font-size="26" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold" font-style="italic">l</text>
<line x1="605.0" y1="300.0" x2="605.0" y2="122.0" stroke="#0f172a" stroke-width="2" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<line x1="605.0" y1="122.0" x2="605.0" y2="300.0" stroke="#0f172a" stroke-width="2" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<text x="620.0" y="212.0" font-size="26" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold" font-style="italic">h</text>
<text x="320.0" y="336.0" font-size="24" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">VR = l / h = 1 / sin θ</text>
</svg>
