<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The metre bridge (Wheatstone bridge)</title>
<desc id="d">A uniform resistance wire one metre long has an unknown resistance X and a known resistance R in the gaps. A galvanometer connected through a jockey reads zero at the balance point, dividing the wire into lengths l and 100 minus l.</desc>
