<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Velocity-time graph for uniform acceleration</title>
<desc id="d">Velocity rises in a straight line from u to v in time t. The gradient is the acceleration and the area under the line is the displacement.</desc>
<defs><marker id="a0f172a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f172a"/></marker><marker id="a0f172as" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#0f172a"/></marker><marker id="a15803d" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker><marker id="a15803ds" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#15803d"/></marker></defs>
<rect width="640" height="420" rx="20" fill="#f8fafc"/>
<line x1="90.0" y1="350.0" x2="600.0" y2="350.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<line x1="90.0" y1="350.0" x2="90.0" y2="40.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<text x="600.0" y="376.0" font-size="20" fill="#475569" text-anchor="end" dominant-baseline="middle" font-weight="normal">time / s</text>
<text x="100.0" y="36.0" font-size="20" fill="#475569" text-anchor="start" dominant-baseline="auto" font-weight="normal">velocity / m s⁻¹</text>
<text x="78.0" y="366.0" font-size="18" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">0</text>
<polygon points="90.0,350.0 90.0,270.0 500.0,100.0 500.0,350.0" fill="#dbeafe" stroke="none" stroke-width="0" stroke-linejoin="round"/>
<line x1="90.0" y1="270.0" x2="500.0" y2="270.0" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 6"/>
<line x1="500.0" y1="100.0" x2="500.0" y2="350.0" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 6"/>
<line x1="90.0" y1="270.0" x2="500.0" y2="100.0" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>
<text x="76.0" y="270.0" font-size="24" fill="#0f172a" text-anchor="end" dominant-baseline="middle" font-weight="bold" font-style="italic">u</text>
<text x="76.0" y="100.0" font-size="24" fill="#0f172a" text-anchor="end" dominant-baseline="middle" font-weight="bold" font-style="italic">v</text>
<line x1="84.0" y1="100.0" x2="96.0" y2="100.0" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
<line x1="500.0" y1="100.0" x2="90.0" y2="100.0" stroke="#e2e8f0" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 6"/>
<text x="500.0" y="376.0" font-size="24" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold" font-style="italic">t</text>
<text x="295.0" y="310.0" font-size="22" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">area = displacement s</text>
<text x="295.0" y="336.0" font-size="22" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="normal">= ½(u + v)t</text>
<line x1="530.0" y1="270.0" x2="530.0" y2="104.0" stroke="#15803d" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a15803d)"/>
<text x="540.0" y="186.0" font-size="20" fill="#15803d" text-anchor="start" dominant-baseline="middle" font-weight="normal">v − u</text>
<text x="250.0" y="80.0" font-size="21" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="bold">gradient = a = (v − u)/t</text>
</svg>
