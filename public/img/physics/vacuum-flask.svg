<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 440" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">A vacuum flask</title>
<desc id="d">A double-walled glass bottle with a vacuum between the walls, silvered surfaces, an insulating stopper and a protective case resting on insulating supports.</desc>
<defs></defs>
<rect width="790" height="440" rx="20" fill="#f8fafc"/>
<rect x="140.0" y="70.0" width="280.0" height="340.0" rx="24" fill="#e2e8f0" stroke="#0f172a" stroke-width="3"/>
<rect x="180.0" y="110.0" width="200.0" height="270.0" rx="30" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
<rect x="196.0" y="126.0" width="168.0" height="238.0" rx="22" fill="#fef3c7" stroke="#9ca3af" stroke-width="4"/>
<rect x="212.0" y="142.0" width="136.0" height="206.0" rx="16" fill="#bfdbfe" stroke="#0f172a" stroke-width="3"/>
<rect x="230.0" y="70.0" width="100.0" height="80.0" rx="8" fill="#a16207" stroke="#0f172a" stroke-width="3"/>
<rect x="210.0" y="380.0" width="40.0" height="30.0" rx="0" fill="#a16207" stroke="#0f172a" stroke-width="2"/>
<rect x="310.0" y="380.0" width="40.0" height="30.0" rx="0" fill="#a16207" stroke="#0f172a" stroke-width="2"/>
<line x1="300.0" y1="76.0" x2="430.0" y2="40.0" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
<text x="436.0" y="40.0" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">stopper: cuts conduction and convection</text>
<line x1="362.0" y1="200.0" x2="430.0" y2="160.0" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
<text x="436.0" y="160.0" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">silvered walls: cut radiation</text>
<line x1="372.0" y1="300.0" x2="430.0" y2="260.0" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
<text x="436.0" y="260.0" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">vacuum: no conduction or convection</text>
<line x1="340.0" y1="395.0" x2="430.0" y2="410.0" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
<text x="436.0" y="410.0" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">insulating supports</text>
<text x="280.0" y="250.0" font-size="18" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">hot drink</text>
</svg>
