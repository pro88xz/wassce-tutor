<title id="t">The motor effect and Fleming&#x27;s left-hand rule</title>
<desc id="d">A wire carrying current between the poles of a magnet experiences a force at right angles to both the field and the current. Fleming&#x27;s left-hand rule: First finger Field, seCond finger Current, thuMb Motion.</desc>
