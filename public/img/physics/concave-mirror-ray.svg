<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Ray diagram for a concave mirror</title>
<desc id="d">A concave mirror forms a real, inverted, diminished image between F and C when the object is beyond C. Rays: one parallel to the axis reflects through F; one through F reflects parallel; one through C reflects back on itself.</desc>
