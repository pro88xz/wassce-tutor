<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Ticker-tape patterns</title>
<desc id="d">Three ticker tapes from a 50 Hz timer. Equal gaps between dots mean constant velocity; gaps that grow mean acceleration; gaps that shrink mean deceleration. Each gap is made in 0.02 s.</desc>
