<text x="375.0" y="268.0" font-size="18" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">constant velocity</text>
<line x1="510.0" y1="230.0" x2="700.0" y2="230.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a0f172a)"/>
