<text x="145.0" y="268.0" font-size="18" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">at rest</text>
<line x1="280.0" y1="230.0" x2="470.0" y2="230.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<line x1="280.0" y1="230.0" x2="280.0" y2="60.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<text x="470.0" y="256.0" font-size="18" fill="#475569" text-anchor="end" dominant-baseline="middle" font-weight="normal">t</text>
<text x="290.0" y="56.0" font-size="18" fill="#475569" text-anchor="start" dominant-baseline="auto" font-weight="normal">s</text>
