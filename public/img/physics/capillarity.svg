<title id="t">Capillary rise and capillary depression</title>
<desc id="d">Left: in narrow glass tubes dipped in water, water rises higher in the narrower tube and its surface curves upwards. Right: in mercury, the level in the tube is pushed below the outside level and the surface curves downwards.</desc>
