<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">A gold-leaf electroscope</title>
<desc id="d">A metal cap on a metal rod passes through an insulating plug into a glass-fronted case. A thin gold leaf hangs from the bottom of the rod; when the electroscope is charged, the leaf and rod repel and the leaf rises.</desc>
