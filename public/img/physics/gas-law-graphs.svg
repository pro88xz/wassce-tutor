<title id="t">Graphs of Boyle&#x27;s law and Charles&#x27;s law</title>
<desc id="d">Left: pressure against volume at constant temperature is a curve (a hyperbola). Middle: pressure against 1/V is a straight line through the origin. Right: volume against temperature in Celsius is a straight line that meets the temperature axis at -273 degrees Celsius.</desc>
