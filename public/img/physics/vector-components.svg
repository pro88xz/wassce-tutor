<text x="232.9" y="204.0" font-size="26" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="bold" font-style="italic">F</text>
<text x="252.9" y="352.0" font-size="22" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">F cos θ  (horizontal)</text>
