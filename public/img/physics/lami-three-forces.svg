<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Three forces in equilibrium at a point (Lami&#x27;s theorem)</title>
<desc id="d">Three forces F1, F2 and F3 act at point O and balance. Each force is proportional to the sine of the angle between the other two.</desc>
<defs><marker id="a15803d" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker><marker id="a15803ds" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#15803d"/></marker><marker id="a2563eb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a2563ebs" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#2563eb"/></marker><marker id="adc2626" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="adc2626s" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#dc2626"/></marker></defs>
<rect width="640" height="440" rx="20" fill="#f8fafc"/>
<line x1="320.0" y1="220.0" x2="467.2" y2="135.0" stroke="#2563eb" stroke-width="5" stroke-linecap="round" marker-end="url(#a2563eb)"/>
<text x="491.5" y="121.0" font-size="26" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold" font-style="italic">F₁</text>
<line x1="320.0" y1="220.0" x2="172.8" y2="135.0" stroke="#15803d" stroke-width="5" stroke-linecap="round" marker-end="url(#a15803d)"/>
<text x="148.5" y="121.0" font-size="26" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold" font-style="italic">F₂</text>
<line x1="320.0" y1="220.0" x2="320.0" y2="340.0" stroke="#dc2626" stroke-width="5" stroke-linecap="round" marker-end="url(#adc2626)"/>
<text x="354.0" y="334.0" font-size="26" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="bold" font-style="italic">F₃</text>
<circle cx="320.0" cy="220.0" r="6.0" fill="#0f172a" stroke="#0f172a" stroke-width="1"/>
<text x="338.0" y="242.0" font-size="20" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">O</text>
<path d="M 359.8 197.0 A 46 46 0 0 0 280.2 197.0" stroke="#0f172a" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="320.0" y="154.0" font-size="24" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal" font-style="italic">γ</text>
<path d="M 280.2 197.0 A 46 46 0 0 0 320.0 266.0" stroke="#0f172a" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="260.0" y="256.0" font-size="24" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal" font-style="italic">α</text>
<path d="M 320.0 266.0 A 46 46 0 0 0 359.8 197.0" stroke="#0f172a" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="378.0" y="256.0" font-size="24" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal" font-style="italic">β</text>
<text x="320.0" y="404.0" font-size="24" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">F₁/sin α = F₂/sin β = F₃/sin γ</text>
<text x="320.0" y="34.0" font-size="19" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">α is opposite F₁, β opposite F₂, γ opposite F₃</text>
</svg>
