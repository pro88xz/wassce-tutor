<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Truth table for negation, conjunction, disjunction and implication</title>
<desc id="d">For statements p and q, the table lists all four combinations of true (T) and false (F). Not p reverses p. p and q is true only when both are true. p or q is false only when both are false. If p then q is false only when p is true and q is false.</desc>
