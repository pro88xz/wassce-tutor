<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 450" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">A tree diagram for picking two balls without replacement</title>
<desc id="d">A bag holds 5 red and 3 blue balls. The first pick is red with probability 5/8 or blue with 3/8. After a red, the second pick is red 4/7 or blue 3/7; after a blue, red 5/7 or blue 2/7. Multiplying along the branches: RR 20/56, RB 15/56, BR 15/56, BB 6/56.</desc>
<defs></defs>
<rect width="780" height="450" rx="20" fill="#f8fafc"/>
<text x="390.0" y="34.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">5 red, 3 blue: two picks without replacement</text>
<text x="300.0" y="62.0" font-size="15" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="bold">1st pick</text>
<text x="520.0" y="62.0" font-size="15" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="bold">2nd pick</text>
<text x="680.0" y="62.0" font-size="15" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="bold">probability</text>
<circle cx="70.0" cy="240.0" r="5.0" fill="#0f172a" stroke="#0f172a" stroke-width="1"/>
<line x1="70.0" y1="240.0" x2="282.0" y2="145.0" stroke="#0f172a" stroke-width="2.4" stroke-linecap="round"/>
<rect x="160.6" y="165.5" width="36.9" height="26.0" rx="4" fill="#f8fafc" stroke="none" stroke-width="0" opacity="0.92"/>
<text x="179.0" y="178.5" font-size="16" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">5/8</text>
<text x="300.0" y="145.0" font-size="20" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="bold">R</text>
<line x1="316.0" y1="145.0" x2="502.0" y2="100.0" stroke="#0f172a" stroke-width="2.4" stroke-linecap="round"/>
<rect x="392.4" y="96.0" width="35.2" height="25.0" rx="4" fill="#f8fafc" stroke="none" stroke-width="0" opacity="0.92"/>
<text x="410.0" y="108.5" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">4/7</text>
<text x="520.0" y="100.0" font-size="20" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="bold">R</text>
<text x="680.0" y="100.0" font-size="16" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">RR: 20/56</text>
<line x1="316.0" y1="145.0" x2="502.0" y2="190.0" stroke="#0f172a" stroke-width="2.4" stroke-linecap="round"/>
<rect x="392.4" y="169.0" width="35.2" height="25.0" rx="4" fill="#f8fafc" stroke="none" stroke-width="0" opacity="0.92"/>
<text x="410.0" y="181.5" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">3/7</text>
<text x="520.0" y="190.0" font-size="20" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">B</text>
<text x="680.0" y="190.0" font-size="16" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">RB: 15/56</text>
<line x1="70.0" y1="240.0" x2="282.0" y2="335.0" stroke="#0f172a" stroke-width="2.4" stroke-linecap="round"/>
<rect x="160.6" y="288.5" width="36.9" height="26.0" rx="4" fill="#f8fafc" stroke="none" stroke-width="0" opacity="0.92"/>
<text x="179.0" y="301.5" font-size="16" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">3/8</text>
<text x="300.0" y="335.0" font-size="20" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">B</text>
<line x1="316.0" y1="335.0" x2="502.0" y2="290.0" stroke="#0f172a" stroke-width="2.4" stroke-linecap="round"/>
<rect x="392.4" y="286.0" width="35.2" height="25.0" rx="4" fill="#f8fafc" stroke="none" stroke-width="0" opacity="0.92"/>
<text x="410.0" y="298.5" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">5/7</text>
<text x="520.0" y="290.0" font-size="20" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="bold">R</text>
<text x="680.0" y="290.0" font-size="16" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">BR: 15/56</text>
<line x1="316.0" y1="335.0" x2="502.0" y2="380.0" stroke="#0f172a" stroke-width="2.4" stroke-linecap="round"/>
<rect x="392.4" y="359.0" width="35.2" height="25.0" rx="4" fill="#f8fafc" stroke="none" stroke-width="0" opacity="0.92"/>
<text x="410.0" y="371.5" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">2/7</text>
<text x="520.0" y="380.0" font-size="20" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">B</text>
<text x="680.0" y="380.0" font-size="16" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">BB: 6/56</text>
<text x="390.0" y="425.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Multiply along the branches; add the outcomes you want.</text>
</svg>
