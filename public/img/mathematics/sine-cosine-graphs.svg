<text x="562.5" y="352.0" font-size="14" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">270°</text>
<line x1="720.0" y1="330.0" x2="720.0" y2="90.0" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
