<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Graphs of y = sin x and y = cos x for 0° to 360°</title>
<desc id="d">Both graphs are waves between −1 and 1. y = sin x starts at 0, rises to 1 at 90°, falls to 0 at 180°, reaches −1 at 270° and returns to 0 at 360°. y = cos x starts at 1, is 0 at 90°, −1 at 180°, 0 at 270° and 1 again at 360°.</desc>
