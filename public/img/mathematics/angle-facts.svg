<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Angles on a straight line, at a point, and vertically opposite angles</title>
<desc id="d">Angles on a straight line add up to 180 degrees. Angles at a point add up to 360 degrees. Vertically opposite angles, formed where two straight lines cross, are equal.</desc>
<defs></defs>
<rect width="780" height="330" rx="20" fill="#f8fafc"/>
<text x="390.0" y="34.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Three angle facts</text>
<line x1="30.0" y1="200.0" x2="250.0" y2="200.0" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
<line x1="140.0" y1="200.0" x2="190.0" y2="113.4" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
<path d="M 168.0 200.0 A 28 28 0 0 0 154.0 175.8" stroke="#2563eb" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="181.6" y="176.0" font-size="16" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">a</text>
<path d="M 152.0 179.2 A 24 24 0 0 0 116.0 200.0" stroke="#15803d" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="117.0" y="160.2" font-size="16" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">b</text>
<text x="140.0" y="290.0" font-size="17" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">a + b = 180°</text>
<line x1="390.0" y1="190.0" x2="479.3" y2="157.5" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
<line x1="390.0" y1="190.0" x2="317.2" y2="128.9" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
<line x1="390.0" y1="190.0" x2="357.5" y2="279.3" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
<path d="M 412.6 181.8 A 24 24 0 0 0 371.6 174.6" stroke="#2563eb" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="398.7" y="140.8" font-size="16" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">p</text>
<path d="M 368.6 172.0 A 28 28 0 0 0 380.4 216.3" stroke="#15803d" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="341.7" y="202.9" font-size="16" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">q</text>
<path d="M 379.1 220.1 A 32 32 0 0 0 420.1 179.1" stroke="#ea580c" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="425.4" y="225.4" font-size="16" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">r</text>
<text x="390.0" y="290.0" font-size="17" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">p + q + r = 360°</text>
<line x1="721.9" y1="132.6" x2="558.1" y2="247.4" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
<line x1="558.1" y1="132.6" x2="721.9" y2="247.4" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
<path d="M 661.3 175.1 A 26 26 0 0 0 618.7 175.1" stroke="#2563eb" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="640.0" y="144.0" font-size="16" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">x</text>
<path d="M 618.7 204.9 A 26 26 0 0 0 661.3 204.9" stroke="#2563eb" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="640.0" y="236.0" font-size="16" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">x</text>
<path d="M 622.0 177.4 A 22 22 0 0 0 622.0 202.6" stroke="#15803d" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="598.0" y="190.0" font-size="16" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">y</text>
<path d="M 658.0 202.6 A 22 22 0 0 0 658.0 177.4" stroke="#15803d" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="682.0" y="190.0" font-size="16" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">y</text>
<text x="640.0" y="290.0" font-size="17" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">opposite angles equal</text>
</svg>
