<path d="M 250 128 C 300 80, 400 80, 450 126" stroke="#ea580c" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#aea580c)"/>
<text x="350.0" y="76.0" font-size="17" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">−3 + 4 = 1</text>
<text x="400.0" y="225.0" font-size="15" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">negative integers ← 0 → positive integers</text>
</svg>
