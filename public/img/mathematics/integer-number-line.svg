<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Integers on a number line</title>
<desc id="d">A number line from −6 to 6. Numbers to the right are greater. −2 is greater than −5 because it lies further to the right. Adding 4 to −3 means moving 4 steps right, to 1.</desc>
<defs><marker id="a0f172a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f172a"/></marker><marker id="a0f172as" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#0f172a"/></marker><marker id="aea580c" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#ea580c"/></marker><marker id="aea580cs" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#ea580c"/></marker></defs>
<rect width="800" height="260" rx="20" fill="#f8fafc"/>
<text x="400.0" y="34.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Right is greater; adding moves right</text>
<line x1="80.0" y1="140.0" x2="724.0" y2="140.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<line x1="720.0" y1="140.0" x2="76.0" y2="140.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<line x1="100.0" y1="130.0" x2="100.0" y2="150.0" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
<text x="100.0" y="172.0" font-size="15" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="normal">−6</text>
<line x1="150.0" y1="130.0" x2="150.0" y2="150.0" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
<text x="150.0" y="172.0" font-size="15" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="normal">−5</text>
<line x1="200.0" y1="130.0" x2="200.0" y2="150.0" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
<text x="200.0" y="172.0" font-size="15" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="normal">−4</text>
<line x1="250.0" y1="130.0" x2="250.0" y2="150.0" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
<text x="250.0" y="172.0" font-size="15" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="normal">−3</text>
<line x1="300.0" y1="130.0" x2="300.0" y2="150.0" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
<text x="300.0" y="172.0" font-size="15" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="normal">−2</text>
<line x1="350.0" y1="130.0" x2="350.0" y2="150.0" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
<text x="350.0" y="172.0" font-size="15" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="normal">−1</text>
<line x1="400.0" y1="130.0" x2="400.0" y2="150.0" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
<text x="400.0" y="172.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">0</text>
<line x1="450.0" y1="130.0" x2="450.0" y2="150.0" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
<text x="450.0" y="172.0" font-size="15" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="normal">1</text>
<line x1="500.0" y1="130.0" x2="500.0" y2="150.0" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
<text x="500.0" y="172.0" font-size="15" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="normal">2</text>
<line x1="550.0" y1="130.0" x2="550.0" y2="150.0" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
