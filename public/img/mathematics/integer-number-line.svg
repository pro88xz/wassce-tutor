<text x="650.0" y="172.0" font-size="15" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="normal">5</text>
<line x1="700.0" y1="130.0" x2="700.0" y2="150.0" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
<text x="700.0" y="172.0" font-size="15" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="normal">6</text>
<circle cx="250.0" cy="140.0" r="8.0" fill="#ea580c" stroke="#ea580c" stroke-width="1"/>
