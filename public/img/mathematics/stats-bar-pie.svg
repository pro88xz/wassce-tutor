<text x="564.6" y="280.5" font-size="13" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Okada</text>
<text x="564.6" y="298.5" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">90°</text>
<path d="M 600 220 L 476.4 260.2 A 130 130 0 0 1 523.6 114.8 Z" stroke="#ea580c" stroke-width="2.4" fill="#fef3c7" stroke-linejoin="round" stroke-linecap="round"/>
<text x="525.8" y="186.9" font-size="13" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Poda-poda</text>
<text x="525.8" y="204.9" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">72°</text>
<path d="M 600 220 L 523.6 114.8 A 130 130 0 0 1 600.0 90.0 Z" stroke="#7c3aed" stroke-width="2.4" fill="#ede9fe" stroke-linejoin="round" stroke-linecap="round"/>
<text x="575.9" y="136.8" font-size="13" fill="#7c3aed" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Keke</text>
<text x="575.9" y="154.8" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">36°</text>
<text x="400.0" y="395.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">angle = frequency ÷ total × 360°</text>
</svg>
