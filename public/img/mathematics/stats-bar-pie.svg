<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The same data as a bar chart and a pie chart</title>
<desc id="d">How 40 students travel to school: walk 18, okada 10, poda-poda 8, keke 4. The bar chart shows each frequency as the height of a bar. The pie chart shows each as a sector: walk 162°, okada 90°, poda-poda 72°, keke 36°.</desc>
<defs></defs>
<rect width="800" height="420" rx="20" fill="#f8fafc"/>
<text x="400.0" y="34.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">How 40 students travel to school</text>
<line x1="80.0" y1="350.0" x2="410.0" y2="350.0" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
<line x1="80.0" y1="350.0" x2="80.0" y2="80.0" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
<line x1="80.0" y1="350.0" x2="410.0" y2="350.0" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<text x="70.0" y="350.0" font-size="13" fill="#475569" text-anchor="end" dominant-baseline="middle" font-weight="normal">0</text>
<line x1="80.0" y1="285.0" x2="410.0" y2="285.0" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<text x="70.0" y="285.0" font-size="13" fill="#475569" text-anchor="end" dominant-baseline="middle" font-weight="normal">5</text>
<line x1="80.0" y1="220.0" x2="410.0" y2="220.0" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<text x="70.0" y="220.0" font-size="13" fill="#475569" text-anchor="end" dominant-baseline="middle" font-weight="normal">10</text>
<line x1="80.0" y1="155.0" x2="410.0" y2="155.0" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<text x="70.0" y="155.0" font-size="13" fill="#475569" text-anchor="end" dominant-baseline="middle" font-weight="normal">15</text>
<line x1="80.0" y1="90.0" x2="410.0" y2="90.0" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<text x="70.0" y="90.0" font-size="13" fill="#475569" text-anchor="end" dominant-baseline="middle" font-weight="normal">20</text>
<text x="50.0" y="64.0" font-size="13" fill="#475569" text-anchor="start" dominant-baseline="middle" font-weight="normal">frequency</text>
<rect x="100.0" y="116.0" width="56.0" height="234.0" rx="0" fill="#dbeafe" stroke="#2563eb" stroke-width="2.4"/>
<text x="128.0" y="104.0" font-size="14" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">18</text>
<text x="128.0" y="368.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Walk</text>
<rect x="178.0" y="220.0" width="56.0" height="130.0" rx="0" fill="#dcfce7" stroke="#15803d" stroke-width="2.4"/>
<text x="206.0" y="208.0" font-size="14" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">10</text>
<text x="206.0" y="368.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Okada</text>
<rect x="256.0" y="246.0" width="56.0" height="104.0" rx="0" fill="#fef3c7" stroke="#ea580c" stroke-width="2.4"/>
<text x="284.0" y="234.0" font-size="14" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">8</text>
<text x="284.0" y="368.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Poda-poda</text>
<rect x="334.0" y="298.0" width="56.0" height="52.0" rx="0" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.4"/>
<text x="362.0" y="286.0" font-size="14" fill="#7c3aed" text-anchor="middle" dominant-baseline="middle" font-weight="bold">4</text>
<text x="362.0" y="368.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Keke</text>
<path d="M 600 220 L 600.0 90.0 A 130 130 0 0 1 640.2 343.6 Z" stroke="#2563eb" stroke-width="2.4" fill="#dbeafe" stroke-linejoin="round" stroke-linecap="round"/>
