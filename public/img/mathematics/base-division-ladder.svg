<text x="250.0" y="138.0" font-size="20" fill="#475569" text-anchor="end" dominant-baseline="middle" font-weight="normal">2</text>
<line x1="262.0" y1="120.0" x2="262.0" y2="156.0" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
<line x1="262.0" y1="156.0" x2="380.0" y2="156.0" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
<text x="300.0" y="138.0" font-size="21" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">22</text>
<text x="420.0" y="138.0" font-size="17" fill="#dc2626" text-anchor="start" dominant-baseline="middle" font-weight="bold">remainder 0</text>
