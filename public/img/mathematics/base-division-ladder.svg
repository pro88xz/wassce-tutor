<text x="300.0" y="186.0" font-size="21" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">11</text>
<text x="420.0" y="186.0" font-size="17" fill="#dc2626" text-anchor="start" dominant-baseline="middle" font-weight="bold">remainder 1</text>
<text x="250.0" y="234.0" font-size="20" fill="#475569" text-anchor="end" dominant-baseline="middle" font-weight="normal">2</text>
