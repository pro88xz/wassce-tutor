<title id="t">A cumulative frequency curve (ogive) with the median and quartiles</title>
<desc id="d">Cumulative frequencies 0, 3, 10, 22, 32, 38 and 40 are plotted at the upper class boundaries 0.5 to 60.5 and joined with a smooth S-shaped curve. Reading across from 10, 20 and 30 gives the lower quartile 20.5, the median about 29 and the upper quartile about 38.</desc>
