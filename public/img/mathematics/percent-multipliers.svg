<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Percentage increase and decrease as multipliers</title>
<desc id="d">A 15% increase takes 100% to 115%, so multiply by 1.15. A 20% decrease takes 100% to 80%, so multiply by 0.80. For example, NLe 400 increased by 15% is NLe 460, and NLe 400 decreased by 20% is NLe 320.</desc>
<defs></defs>
<rect width="800" height="380" rx="20" fill="#f8fafc"/>
<text x="400.0" y="34.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Increase or decrease = multiply</text>
<rect x="150.0" y="80.0" width="400.0" height="48.0" rx="6" fill="#e2e8f0" stroke="#0f172a" stroke-width="2.5"/>
<text x="140.0" y="104.0" font-size="16" fill="#0f172a" text-anchor="end" dominant-baseline="middle" font-weight="bold">original</text>
<text x="560.0" y="104.0" font-size="17" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">100%  NLe 400</text>
<rect x="150.0" y="160.0" width="460.0" height="48.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
<text x="140.0" y="184.0" font-size="16" fill="#15803d" text-anchor="end" dominant-baseline="middle" font-weight="bold">+15%</text>
<text x="620.0" y="184.0" font-size="17" fill="#15803d" text-anchor="start" dominant-baseline="middle" font-weight="bold">115%  × 1.15 = NLe 460</text>
<rect x="150.0" y="240.0" width="320.0" height="48.0" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
<text x="140.0" y="264.0" font-size="16" fill="#dc2626" text-anchor="end" dominant-baseline="middle" font-weight="bold">−20%</text>
<text x="480.0" y="264.0" font-size="17" fill="#dc2626" text-anchor="start" dominant-baseline="middle" font-weight="bold">80%  × 0.80 = NLe 320</text>
<line x1="550.0" y1="70.0" x2="550.0" y2="300.0" stroke="#475569" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="6 5"/>
<text x="550.0" y="320.0" font-size="14" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">100% mark</text>
<text x="400.0" y="358.0" font-size="17" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">New amount = original × (100 ± r)/100</text>
</svg>
