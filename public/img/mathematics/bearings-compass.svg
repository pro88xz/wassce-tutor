<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Three-figure bearings and a back bearing</title>
<desc id="d">Left: from P, the bearing of Q is 060°, measured clockwise from north. Right: from Q, the bearing of P is 240°, measured clockwise from north at Q. The back bearing differs from the bearing by 180°.</desc>
<defs><marker id="a0f172a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f172a"/></marker><marker id="a0f172as" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#0f172a"/></marker><marker id="a15803d" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker><marker id="a15803ds" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#15803d"/></marker><marker id="a2563eb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a2563ebs" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#2563eb"/></marker><marker id="adc2626" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="adc2626s" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#dc2626"/></marker></defs>
<rect width="780" height="400" rx="20" fill="#f8fafc"/>
<text x="390.0" y="34.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Bearings: from north, clockwise, three figures</text>
<line x1="180.0" y1="270.0" x2="180.0" y2="150.0" stroke="#0f172a" stroke-width="2.4" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<text x="180.0" y="136.0" font-size="16" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">N</text>
<line x1="180.0" y1="270.0" x2="344.5" y2="175.0" stroke="#2563eb" stroke-width="3" stroke-linecap="round" marker-end="url(#a2563eb)"/>
<circle cx="180.0" cy="270.0" r="6.0" fill="#0f172a" stroke="#0f172a" stroke-width="1"/>
<text x="164.0" y="286.0" font-size="17" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">P</text>
<text x="358.5" y="175.0" font-size="17" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Q</text>
<path d="M 180.0 212.0 A 58 58 0 0 1 230.2 241.0" stroke="#dc2626" stroke-width="2.6" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#adc2626)"/>
<text x="222.0" y="197.3" font-size="17" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="bold">060°</text>
<text x="200.0" y="365.0" font-size="15" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">bearing of Q from P = 060°</text>
<line x1="600.0" y1="190.0" x2="600.0" y2="80.0" stroke="#0f172a" stroke-width="2.4" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<text x="600.0" y="66.0" font-size="16" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">N</text>
<line x1="600.0" y1="190.0" x2="435.5" y2="285.0" stroke="#15803d" stroke-width="3" stroke-linecap="round" marker-end="url(#a15803d)"/>
<circle cx="600.0" cy="190.0" r="6.0" fill="#0f172a" stroke="#0f172a" stroke-width="1"/>
<text x="616.0" y="184.0" font-size="17" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Q</text>
<text x="427.5" y="305.0" font-size="17" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">P</text>
<path d="M 600.0 138.0 A 52 52 0 1 1 555.0 216.0" stroke="#dc2626" stroke-width="2.6" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#adc2626)"/>
<text x="669.3" y="230.0" font-size="17" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="bold">240°</text>
<text x="590.0" y="365.0" font-size="15" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">bearing of P from Q = 060° + 180° = 240°</text>
</svg>
