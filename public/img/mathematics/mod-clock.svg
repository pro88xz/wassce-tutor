<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Arithmetic modulo 12 on a clock and modulo 7 on the days of the week</title>
<desc id="d">On a 12-hour clock, 9 o&#x27;clock plus 5 hours is 2 o&#x27;clock, because 14 is 2 more than 12: 14 ≡ 2 (mod 12). The days of the week work modulo 7: 10 days after Monday is Thursday, because 10 = 7 + 3.</desc>
<defs><marker id="adc2626" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="adc2626s" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#dc2626"/></marker></defs>
