<text x="160.5" y="320.4" font-size="18" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">7</text>
<text x="120.6" y="280.5" font-size="18" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">8</text>
