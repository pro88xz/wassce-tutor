<text x="360.0" y="34.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">An L-shaped plot (all lengths in metres)</text>
<polygon points="170.0,360.0 530.0,360.0 530.0,198.0 386.0,198.0 386.0,90.0 170.0,90.0" fill="#dcfce7" stroke="#0f172a" stroke-width="3" stroke-linejoin="round"/>
