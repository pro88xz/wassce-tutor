<title id="t">An L-shaped plot of land with its measurements</title>
<desc id="d">An L-shaped plot made of two rectangles. The whole plot is 20 m wide along the bottom and 15 m high on the left. A corner 8 m by 6 m is missing at the top right. Dimensions are marked in metres.</desc>
