<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Distance, midpoint and gradient between A(1, 2) and B(7, 10)</title>
<desc id="d">Points A(1, 2) and B(7, 10) are joined. A right-angled triangle has a horizontal side of 6 and a vertical side of 8, so AB = 10 by Pythagoras. The midpoint M is (4, 6) and the gradient of AB is 8 over 6, which is 4 over 3.</desc>
