<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 640" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Six circle theorems</title>
<desc id="d">Six panels. 1: the angle at the centre is twice the angle at the circumference. 2: angles in the same segment are equal. 3: the angle in a semicircle is 90 degrees. 4: opposite angles of a cyclic quadrilateral add to 180 degrees. 5: a tangent is perpendicular to the radius at the point of contact. 6: the two tangents from an external point are equal in length.</desc>
