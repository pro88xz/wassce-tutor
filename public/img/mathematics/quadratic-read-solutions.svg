<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 640" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Using the graph of y = x squared minus 2x minus 3 to solve x squared minus 2x minus 5 = 0</title>
<desc id="d">The line y = 2 cuts the parabola y = x² − 2x − 3 at about x = −1.4 and x = 3.4. These x-values solve x² − 2x − 3 = 2, which is x² − 2x − 5 = 0.</desc>
