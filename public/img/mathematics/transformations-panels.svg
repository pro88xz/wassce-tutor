<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 700" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Four transformations of a triangle</title>
<desc id="d">Four grids. Reflection in the y-axis: the triangle flips to the other side of the mirror line. Rotation of 90° anticlockwise about the origin: each point (x, y) goes to (−y, x). Translation by the vector (6, 1): every point moves 6 right and 1 up. Enlargement with scale factor 2, centre O: every distance from O doubles.</desc>
