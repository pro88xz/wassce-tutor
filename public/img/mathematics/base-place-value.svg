<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Place value in base two and base ten</title>
<desc id="d">In base ten the place values are powers of ten: 1000, 100, 10, 1. In base two they are powers of two: 16, 8, 4, 2, 1. The binary number 10110 means one 16, no 8, one 4, one 2 and no 1, which is 22 in base ten.</desc>
<defs></defs>
<rect width="800" height="380" rx="20" fill="#f8fafc"/>
<text x="400.0" y="34.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Place values are powers of the base</text>
<text x="90.0" y="92.0" font-size="17" fill="#2563eb" text-anchor="start" dominant-baseline="middle" font-weight="bold">Base 10</text>
<rect x="252.0" y="67.0" width="96.0" height="50.0" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="300.0" y="82.0" font-size="14" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">1000</text>
<text x="300.0" y="102.0" font-size="12" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">10³</text>
<rect x="362.0" y="67.0" width="96.0" height="50.0" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="410.0" y="82.0" font-size="14" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">100</text>
<text x="410.0" y="102.0" font-size="12" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">10²</text>
<rect x="472.0" y="67.0" width="96.0" height="50.0" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="520.0" y="82.0" font-size="14" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">10</text>
<text x="520.0" y="102.0" font-size="12" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">10¹</text>
<rect x="582.0" y="67.0" width="96.0" height="50.0" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="630.0" y="82.0" font-size="14" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">1</text>
<text x="630.0" y="102.0" font-size="12" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">10⁰</text>
<text x="90.0" y="205.0" font-size="17" fill="#15803d" text-anchor="start" dominant-baseline="middle" font-weight="bold">Base 2</text>
<rect x="197.0" y="167.0" width="96.0" height="50.0" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
<text x="245.0" y="182.0" font-size="14" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">16</text>
<text x="245.0" y="202.0" font-size="12" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">2⁴</text>
<rect x="215.0" y="232.0" width="60.0" height="44.0" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="2.2"/>
<text x="245.0" y="255.0" font-size="22" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">1</text>
<rect x="307.0" y="167.0" width="96.0" height="50.0" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
<text x="355.0" y="182.0" font-size="14" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">8</text>
<text x="355.0" y="202.0" font-size="12" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">2³</text>
<rect x="325.0" y="232.0" width="60.0" height="44.0" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="2.2"/>
<text x="355.0" y="255.0" font-size="22" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">0</text>
<rect x="417.0" y="167.0" width="96.0" height="50.0" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
<text x="465.0" y="182.0" font-size="14" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">4</text>
<text x="465.0" y="202.0" font-size="12" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">2²</text>
<rect x="435.0" y="232.0" width="60.0" height="44.0" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="2.2"/>
<text x="465.0" y="255.0" font-size="22" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">1</text>
<rect x="527.0" y="167.0" width="96.0" height="50.0" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
<text x="575.0" y="182.0" font-size="14" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">2</text>
<text x="575.0" y="202.0" font-size="12" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">2¹</text>
<rect x="545.0" y="232.0" width="60.0" height="44.0" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="2.2"/>
<text x="575.0" y="255.0" font-size="22" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">1</text>
<rect x="637.0" y="167.0" width="96.0" height="50.0" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
<text x="685.0" y="182.0" font-size="14" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">1</text>
<text x="685.0" y="202.0" font-size="12" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">2⁰</text>
<rect x="655.0" y="232.0" width="60.0" height="44.0" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="2.2"/>
<text x="685.0" y="255.0" font-size="22" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">0</text>
<text x="90.0" y="255.0" font-size="15" fill="#475569" text-anchor="start" dominant-baseline="middle" font-weight="normal">digits</text>
<text x="400.0" y="320.0" font-size="18" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">10110₂ = 1×16 + 0×8 + 1×4 + 1×2 + 0×1 = 22₁₀</text>
<text x="400.0" y="355.0" font-size="14" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Each place is worth the base times the place to its right.</text>
</svg>
