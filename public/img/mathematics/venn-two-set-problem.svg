<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">A two-set Venn diagram problem</title>
<desc id="d">In a class of 40 students, 25 study Physics, 18 study Chemistry and 7 study neither. Then 33 study at least one subject, so 25 + 18 − 33 = 10 study both. The diagram shows 15 Physics only, 10 both, 8 Chemistry only and 7 outside both circles.</desc>
<defs></defs>
<rect width="800" height="440" rx="20" fill="#f8fafc"/>
<text x="400.0" y="34.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">40 students: 25 Physics, 18 Chemistry, 7 neither</text>
<rect x="110.0" y="70.0" width="580.0" height="300.0" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
<text x="130.0" y="92.0" font-size="17" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">U (40)</text>
<circle cx="330.0" cy="225.0" r="120.0" fill="none" stroke="#2563eb" stroke-width="3"/>
<circle cx="470.0" cy="225.0" r="120.0" fill="none" stroke="#15803d" stroke-width="3"/>
<text x="246.0" y="95.0" font-size="19" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Physics (25)</text>
<text x="554.0" y="95.0" font-size="19" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Chemistry (18)</text>
<text x="265.0" y="226.0" font-size="28" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">15</text>
<text x="400.0" y="226.0" font-size="28" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">10</text>
<text x="540.0" y="226.0" font-size="28" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">8</text>
<text x="640.0" y="340.0" font-size="28" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="bold">7</text>
<text x="400.0" y="405.0" font-size="18" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">both = 25 + 18 − (40 − 7) = 10</text>
</svg>
