<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The gradient of a curve is the gradient of its tangent</title>
<desc id="d">The curve y = x² with a tangent touching it at the point (2, 4). The tangent has gradient 4, which matches dy/dx = 2x at x = 2. A small triangle on the tangent shows a rise of 4 for a run of 1.</desc>
