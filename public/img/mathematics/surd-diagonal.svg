<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Constructing the square root of 2 as a diagonal</title>
<desc id="d">A square of side 1 unit has a diagonal of length √2, by Pythagoras&#x27; theorem: 1² + 1² = 2. Swinging the diagonal down onto the number line with compasses marks the point √2 ≈ 1.414, between 1 and 2.</desc>
<defs></defs>
<rect width="800" height="380" rx="20" fill="#f8fafc"/>
<text x="400.0" y="34.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">√2 is a real length you can draw</text>
<line x1="110.0" y1="300.0" x2="602.0" y2="300.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
<line x1="170.0" y1="290.0" x2="170.0" y2="310.0" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
<text x="170.0" y="332.0" font-size="18" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">0</text>
<line x1="350.0" y1="290.0" x2="350.0" y2="310.0" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
<text x="350.0" y="332.0" font-size="18" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">1</text>
<line x1="530.0" y1="290.0" x2="530.0" y2="310.0" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
<text x="530.0" y="332.0" font-size="18" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">2</text>
<polygon points="170.0,300.0 350.0,300.0 350.0,120.0 170.0,120.0" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round"/>
<line x1="170.0" y1="300.0" x2="350.0" y2="120.0" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round"/>
<rect x="226.4" y="183.5" width="31.3" height="29.0" rx="4" fill="#f8fafc" stroke="none" stroke-width="0" opacity="0.92"/>
<text x="242.0" y="198.0" font-size="19" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="bold">√2</text>
<text x="260.0" y="286.0" font-size="16" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">1</text>
<text x="366.0" y="210.0" font-size="16" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">1</text>
<path d="M 350.0 120.0 A 254.55844122715712 254.55844122715712 0 0 1 424.6 300.0" stroke="#dc2626" stroke-width="2.4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="424.6" cy="300.0" r="7.0" fill="#dc2626" stroke="#dc2626" stroke-width="1"/>
<text x="424.6" y="332.0" font-size="17" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="bold">√2 ≈ 1.414</text>
<text x="620.0" y="120.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">1² + 1² = 2</text>
<text x="620.0" y="150.0" font-size="17" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">diagonal = √2</text>
</svg>
