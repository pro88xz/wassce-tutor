<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Sum of the interior angles of a hexagon</title>
<desc id="d">A regular hexagon is divided into four triangles by diagonals from one vertex. Each triangle has angles adding to 180 degrees, so the interior angles of the hexagon add to 4 × 180 = 720 degrees. One side is extended to show an exterior angle of 60 degrees.</desc>
<defs></defs>
<rect width="720" height="400" rx="20" fill="#f8fafc"/>
<text x="360.0" y="34.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">A hexagon = 4 triangles, so its angles add to 4 × 180° = 720°</text>
<polygon points="300.0,75.0 178.8,145.0 178.8,285.0 300.0,355.0 421.2,285.0 421.2,145.0" fill="#dcfce7" stroke="#0f172a" stroke-width="3" stroke-linejoin="round"/>
<line x1="300.0" y1="75.0" x2="178.8" y2="285.0" stroke="#15803d" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="8 6"/>
<line x1="300.0" y1="75.0" x2="300.0" y2="355.0" stroke="#15803d" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="8 6"/>
<line x1="300.0" y1="75.0" x2="421.2" y2="285.0" stroke="#15803d" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="8 6"/>
<text x="219.2" y="168.3" font-size="20" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">1</text>
<text x="259.6" y="238.3" font-size="20" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">2</text>
<text x="340.4" y="238.3" font-size="20" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">3</text>
<text x="380.8" y="168.3" font-size="20" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">4</text>
<line x1="421.2" y1="145.0" x2="421.2" y2="47.0" stroke="#0f172a" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6"/>
<path d="M 421.2 115.0 A 30 30 0 0 0 395.3 130.0" stroke="#dc2626" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="392.2" y="94.8" font-size="16" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="bold">60°</text>
<text x="600.0" y="150.0" font-size="16" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">interior sum</text>
<text x="600.0" y="178.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">(n − 2) × 180°</text>
<text x="600.0" y="250.0" font-size="16" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">exterior angles</text>
<text x="600.0" y="278.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">always add to 360°</text>
</svg>
