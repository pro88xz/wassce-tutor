<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 620" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Four basic loci</title>
<desc id="d">Four panels. Points a fixed distance from a point form a circle. Points equidistant from two points lie on the perpendicular bisector of the line joining them. Points equidistant from two intersecting lines lie on the bisector of the angle between them. Points a fixed distance from a straight line lie on two parallel lines.</desc>
