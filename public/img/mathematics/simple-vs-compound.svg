<title id="t">Simple and compound interest compared</title>
<desc id="d">NLe 10,000 invested at 10% per year. With simple interest the amount grows by NLe 1,000 each year, a straight line, reaching NLe 20,000 after 10 years. With compound interest it grows by 10% of the current amount, a curve, reaching about NLe 25,937 after 10 years.</desc>
