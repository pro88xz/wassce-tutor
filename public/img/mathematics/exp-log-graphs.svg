<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Graphs of y = 2 to the power x and y = log base 2 of x</title>
<desc id="d">The curve y = 2^x passes through (0, 1), (1, 2) and (2, 4). The curve y = log2 x passes through (1, 0), (2, 1) and (4, 2). The two curves are reflections of each other in the line y = x, because the logarithm is the inverse of the exponential.</desc>
