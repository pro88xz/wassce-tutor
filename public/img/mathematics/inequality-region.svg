<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The region where x ≥ 0, y ≥ 0, x + y ≤ 4 and y &lt; x + 1</title>
<desc id="d">The line x + y = 4 is drawn solid because the inequality includes it. The line y = x + 1 is drawn dashed because the inequality is strict. The shaded region below both lines and above the x-axis, to the right of the y-axis, has corners at (0, 0), (4, 0), (1.5, 2.5) and (0, 1).</desc>
