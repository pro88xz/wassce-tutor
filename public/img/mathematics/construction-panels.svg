<title id="t">Three constructions with ruler and compasses</title>
<desc id="d">Panel 1: the perpendicular bisector of a line AB, drawn through the two points where equal arcs from A and B cross. Panel 2: the bisector of an angle, drawn from the vertex through the point where two equal arcs cross. Panel 3: an angle of 60 degrees, made by an equilateral triangle of arcs with the same radius.</desc>
