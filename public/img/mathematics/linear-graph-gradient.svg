<title id="t">Graph of y = 2x + 1 with its gradient and intercept</title>
<desc id="d">The straight line y = 2x + 1 crosses the y-axis at (0, 1), the intercept. A right-angled triangle drawn from (0, 1) to (2, 1) to (2, 5) shows a run of 2 and a rise of 4, so the gradient is 4 divided by 2, which is 2.</desc>
