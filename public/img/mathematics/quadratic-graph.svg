<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 650" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Graph of y = x squared minus 2x minus 3</title>
<desc id="d">The parabola y = x² − 2x − 3 crosses the x-axis at x = −1 and x = 3, the roots of x² − 2x − 3 = 0. It crosses the y-axis at (0, −3). Its lowest point, the minimum or vertex, is (1, −4), and the dashed vertical line x = 1 is its line of symmetry.</desc>
