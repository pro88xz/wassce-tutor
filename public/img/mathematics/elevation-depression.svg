<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Angles of elevation and depression</title>
<desc id="d">An observer at A on level ground looks up at the top T of a tower of height h, a distance d away. The angle of elevation at A is measured up from the horizontal. From T, the angle of depression to A is measured down from the horizontal. The two angles are equal because the horizontals are parallel (alternate angles), and tan α = h / d.</desc>
