<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The sample space for the sum of two dice</title>
<desc id="d">A six by six grid shows every outcome when two dice are thrown, with the sum in each cell. There are 36 equally likely outcomes. The six cells with a sum of 7 lie on a diagonal, so the probability of a sum of 7 is 6/36 = 1/6.</desc>
