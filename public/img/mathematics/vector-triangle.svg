<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Adding vectors with the triangle law</title>
<desc id="d">On a grid, vector a goes 4 right and 1 up. Vector b, drawn from the end of a, goes 1 right and 3 up. The resultant a + b goes from the start of a to the end of b: 5 right and 4 up.</desc>
<defs><marker id="a15803d" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker><marker id="a15803ds" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#15803d"/></marker><marker id="a2563eb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a2563ebs" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#2563eb"/></marker><marker id="adc2626" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="adc2626s" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#dc2626"/></marker></defs>
<rect width="780" height="440" rx="20" fill="#f8fafc"/>
<text x="390.0" y="34.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">The triangle law: a + b goes from start to finish</text>
<line x1="70.0" y1="380.0" x2="70.0" y2="56.0" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<line x1="124.0" y1="380.0" x2="124.0" y2="56.0" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<line x1="178.0" y1="380.0" x2="178.0" y2="56.0" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<line x1="232.0" y1="380.0" x2="232.0" y2="56.0" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<line x1="286.0" y1="380.0" x2="286.0" y2="56.0" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<line x1="340.0" y1="380.0" x2="340.0" y2="56.0" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<line x1="394.0" y1="380.0" x2="394.0" y2="56.0" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<line x1="448.0" y1="380.0" x2="448.0" y2="56.0" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<line x1="70.0" y1="380.0" x2="448.0" y2="380.0" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<line x1="70.0" y1="326.0" x2="448.0" y2="326.0" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<line x1="70.0" y1="272.0" x2="448.0" y2="272.0" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<line x1="70.0" y1="218.0" x2="448.0" y2="218.0" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<line x1="70.0" y1="164.0" x2="448.0" y2="164.0" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<line x1="70.0" y1="110.0" x2="448.0" y2="110.0" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<line x1="70.0" y1="56.0" x2="448.0" y2="56.0" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
