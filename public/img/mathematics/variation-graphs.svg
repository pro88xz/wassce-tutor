<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Graphs of the four kinds of variation</title>
<desc id="d">Direct variation y = kx is a straight line through the origin. Inverse variation y = k/x is a curve that falls as x rises and never meets the axes. Partial variation y = a + kx is a straight line that cuts the y-axis above the origin. y varies as the square of x, y = kx², is a parabola through the origin.</desc>
