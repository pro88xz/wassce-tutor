<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Volume and surface area of common solids</title>
<desc id="d">Five solids with their volume formulas. Cuboid: length times breadth times height. Cylinder: pi r squared h. Cone: one third pi r squared h. Sphere: four thirds pi r cubed. Pyramid: one third times base area times height.</desc>
<defs></defs>
<rect width="780" height="560" rx="20" fill="#f8fafc"/>
<text x="390.0" y="34.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Volumes of solids</text>
<polygon points="60.0,155.0 180.0,155.0 180.0,245.0 60.0,245.0" fill="#dbeafe" stroke="#0f172a" stroke-width="2.6" stroke-linejoin="round"/>
<polygon points="60.0,155.0 110.0,120.0 230.0,120.0 180.0,155.0" fill="#eef2ff" stroke="#0f172a" stroke-width="2.6" stroke-linejoin="round"/>
<polygon points="180.0,155.0 230.0,120.0 230.0,210.0 180.0,245.0" fill="#c7d2fe" stroke="#0f172a" stroke-width="2.6" stroke-linejoin="round"/>
<text x="120.0" y="267.0" font-size="16" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal" font-style="italic">l</text>
<text x="219.0" y="235.0" font-size="16" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal" font-style="italic">b</text>
<text x="46.0" y="200.0" font-size="16" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal" font-style="italic">h</text>
<text x="140.0" y="290.0" font-size="16" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Cuboid  V = lbh</text>
<rect x="330.0" y="130.0" width="120.0" height="110.0" rx="0" fill="#dcfce7" stroke="none" stroke-width="0"/>
<line x1="330.0" y1="130.0" x2="330.0" y2="240.0" stroke="#0f172a" stroke-width="2.6" stroke-linecap="round"/>
<line x1="450.0" y1="130.0" x2="450.0" y2="240.0" stroke="#0f172a" stroke-width="2.6" stroke-linecap="round"/>
<ellipse cx="390.0" cy="240.0" rx="60.0" ry="18.0" fill="#dcfce7" stroke="#0f172a" stroke-width="2.6"/>
<ellipse cx="390.0" cy="130.0" rx="60.0" ry="18.0" fill="#bbf7d0" stroke="#0f172a" stroke-width="2.6"/>
<line x1="390.0" y1="130.0" x2="450.0" y2="130.0" stroke="#dc2626" stroke-width="2.2" stroke-linecap="round"/>
<text x="420.0" y="120.0" font-size="16" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="normal" font-style="italic">r</text>
<text x="464.0" y="185.0" font-size="16" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal" font-style="italic">h</text>
<text x="390.0" y="290.0" font-size="16" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Cylinder  V = πr²h</text>
<polygon points="580.0,250.0 640.0,110.0 700.0,250.0" fill="#fef3c7" stroke="#0f172a" stroke-width="2.6" stroke-linejoin="round"/>
<ellipse cx="640.0" cy="250.0" rx="60.0" ry="18.0" fill="#fef3c7" stroke="#0f172a" stroke-width="2.6"/>
<line x1="640.0" y1="110.0" x2="640.0" y2="250.0" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/>
<line x1="640.0" y1="250.0" x2="700.0" y2="250.0" stroke="#dc2626" stroke-width="2.2" stroke-linecap="round"/>
<text x="628.0" y="180.0" font-size="16" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal" font-style="italic">h</text>
<text x="670.0" y="272.0" font-size="16" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="normal" font-style="italic">r</text>
<text x="640.0" y="290.0" font-size="16" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Cone  V = ⅓πr²h</text>
<circle cx="230.0" cy="420.0" r="70.0" fill="#ede9fe" stroke="#0f172a" stroke-width="2.6"/>
<ellipse cx="230.0" cy="420.0" rx="70.0" ry="20.0" fill="none" stroke="#0f172a" stroke-width="1.8" stroke-dasharray="5 5"/>
<line x1="230.0" y1="420.0" x2="300.0" y2="420.0" stroke="#dc2626" stroke-width="2.2" stroke-linecap="round"/>
<text x="265.0" y="408.0" font-size="16" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="normal" font-style="italic">r</text>
<text x="230.0" y="525.0" font-size="16" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Sphere  V = ⁴⁄₃πr³</text>
<polygon points="470.0,470.0 620.0,470.0 660.0,430.0 510.0,430.0" fill="#e2e8f0" stroke="#0f172a" stroke-width="2.4" stroke-linejoin="round"/>
<line x1="575.0" y1="345.0" x2="470.0" y2="470.0" stroke="#0f172a" stroke-width="2.4" stroke-linecap="round"/>
<line x1="575.0" y1="345.0" x2="620.0" y2="470.0" stroke="#0f172a" stroke-width="2.4" stroke-linecap="round"/>
<line x1="575.0" y1="345.0" x2="660.0" y2="430.0" stroke="#0f172a" stroke-width="2.4" stroke-linecap="round"/>
<line x1="575.0" y1="345.0" x2="510.0" y2="430.0" stroke="#0f172a" stroke-width="2.4" stroke-linecap="round"/>
<line x1="575.0" y1="345.0" x2="575.0" y2="450.0" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/>
<text x="587.0" y="397.5" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal" font-style="italic">h</text>
<text x="575.0" y="525.0" font-size="16" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Pyramid  V = ⅓ × base area × h</text>
</svg>
