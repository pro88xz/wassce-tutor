<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The area under a curve found by integration</title>
<desc id="d">The curve y = 4x − x² rises from 0 at x = 0 to a maximum of 4 at x = 2 and returns to 0 at x = 4. The region between the curve and the x-axis is shaded. Its area is the integral of 4x − x² from 0 to 4, which is 32/3, about 10.7 square units.</desc>
