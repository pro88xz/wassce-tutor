<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The determinant of a 2 by 2 matrix</title>
<desc id="d">For the matrix with rows (a, b) and (c, d), the determinant is ad minus bc: multiply down the leading diagonal, then subtract the product of the other diagonal. For rows (3, 2) and (4, 5), the determinant is 15 − 8 = 7.</desc>
<defs></defs>
<rect width="800" height="360" rx="20" fill="#f8fafc"/>
<text x="400.0" y="34.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Determinant = ad − bc</text>
<path d="M 110 100 Q 90 175 110 250" stroke="#0f172a" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 280 100 Q 300 175 280 250" stroke="#0f172a" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="155.0" y="135.0" font-size="30" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold" font-style="italic">a</text>
<text x="235.0" y="135.0" font-size="30" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold" font-style="italic">b</text>
<text x="155.0" y="215.0" font-size="30" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold" font-style="italic">c</text>
<text x="235.0" y="215.0" font-size="30" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold" font-style="italic">d</text>
<line x1="168.0" y1="148.0" x2="222.0" y2="202.0" stroke="#15803d" stroke-width="3" stroke-linecap="round"/>
<line x1="222.0" y1="148.0" x2="168.0" y2="202.0" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
<text x="195.0" y="290.0" font-size="24" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">ad − bc</text>
<path d="M 480 100 Q 460 175 480 250" stroke="#0f172a" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 650 100 Q 670 175 650 250" stroke="#0f172a" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="525.0" y="135.0" font-size="30" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">3</text>
<text x="605.0" y="135.0" font-size="30" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">2</text>
<text x="525.0" y="215.0" font-size="30" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">4</text>
<text x="605.0" y="215.0" font-size="30" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">5</text>
<line x1="538.0" y1="148.0" x2="592.0" y2="202.0" stroke="#15803d" stroke-width="3" stroke-linecap="round"/>
<line x1="592.0" y1="148.0" x2="538.0" y2="202.0" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
<text x="565.0" y="290.0" font-size="22" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">3×5 − 2×4 = 7</text>
<text x="195.0" y="330.0" font-size="15" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">green product minus red product</text>
<text x="565.0" y="330.0" font-size="15" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">determinant = 7</text>
</svg>
