<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The water (hydrological) cycle</title>
<desc id="d">Water evaporates from the sea and lakes and transpires from plants. The water vapour rises, cools and condenses into clouds, which are carried over the land and fall as precipitation. On land, water runs off over the surface into rivers, or infiltrates the soil and percolates down to become groundwater, and both flow back to the sea.</desc>
