<text x="705.0" y="170.0" font-size="16" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">4-figure: 2247</text>
<text x="705.0" y="215.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Point A</text>
