<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Four-figure and six-figure grid references</title>
<desc id="d">A map grid with eastings 21 to 25 along the bottom and northings 46 to 49 up the side. The shaded square has the four-figure reference 2247, given by the easting and northing of its bottom left corner. Point A, a church, lies four-tenths of the way across and seven-tenths of the way up that square, so its six-figure reference is 224477. Eastings are always given before northings.</desc>
