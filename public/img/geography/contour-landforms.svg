<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Contour patterns of common landforms</title>
<desc id="d">Six contour patterns: a conical hill shown by roughly circular contours with the highest in the middle; a spur, whose V-shaped contours point towards lower ground; a valley, whose V-shaped contours point upstream towards higher ground with a river along the V; an escarpment with closely spaced contours on the steep scarp slope and widely spaced contours on the gentle dip slope; a plateau with close contours at its edges and a large flat top; and a saddle, a low col between two hills. Heights are in metres.</desc>
