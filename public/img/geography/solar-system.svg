<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The planets of the solar system in order from the Sun</title>
<desc id="d">The eight planets in order from the Sun are Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus and Neptune. The first four are small rocky inner planets; the outer four are giant planets made mostly of gas or ice. Sizes are shown roughly; distances are not to scale.</desc>
<defs></defs>
<rect width="800" height="360" rx="20" fill="#f8fafc"/>
<text x="400.0" y="34.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">The eight planets in order from the Sun</text>
<circle cx="-60.0" cy="190.0" r="150.0" fill="#fde68a" stroke="#ea580c" stroke-width="3"/>
<text x="40.0" y="190.0" font-size="20" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Sun</text>
<circle cx="157.0" cy="190.0" r="6.0" fill="#a8a29e" stroke="#0f172a" stroke-width="1.5"/>
<text x="157.0" y="224.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Mercury</text>
<circle cx="189.0" cy="190.0" r="10.0" fill="#fbbf24" stroke="#0f172a" stroke-width="1.5"/>
<text x="189.0" y="242.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Venus</text>
<circle cx="226.0" cy="190.0" r="11.0" fill="#3b82f6" stroke="#0f172a" stroke-width="1.5"/>
<text x="226.0" y="224.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Earth</text>
<circle cx="261.0" cy="190.0" r="8.0" fill="#dc2626" stroke="#0f172a" stroke-width="1.5"/>
<text x="261.0" y="242.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Mars</text>
<circle cx="329.0" cy="190.0" r="34.0" fill="#d97706" stroke="#0f172a" stroke-width="1.5"/>
<text x="329.0" y="246.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Jupiter</text>
<ellipse cx="417.0" cy="190.0" rx="44.0" ry="7.0" fill="none" stroke="#a16207" stroke-width="2.5"/>
<circle cx="417.0" cy="190.0" r="28.0" fill="#facc15" stroke="#0f172a" stroke-width="1.5"/>
<text x="417.0" y="258.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Saturn</text>
<circle cx="489.0" cy="190.0" r="18.0" fill="#67e8f9" stroke="#0f172a" stroke-width="1.5"/>
<text x="489.0" y="230.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Uranus</text>
<circle cx="550.0" cy="190.0" r="17.0" fill="#2563eb" stroke="#0f172a" stroke-width="1.5"/>
<text x="550.0" y="247.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Neptune</text>
<line x1="130.0" y1="300.0" x2="395.0" y2="300.0" stroke="#15803d" stroke-width="2.5" stroke-linecap="round"/>
<text x="262.0" y="322.0" font-size="15" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">inner rocky planets</text>
<line x1="410.0" y1="300.0" x2="780.0" y2="300.0" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/>
<text x="595.0" y="322.0" font-size="15" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">outer giant planets</text>
<text x="400.0" y="350.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Memory aid: My Very Educated Mother Just Served Us Noodles. Earth is third, about 150 million km from the Sun.</text>
</svg>
