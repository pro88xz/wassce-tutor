<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Layers (stratification) of the tropical rainforest</title>
<desc id="d">The tropical rainforest has layers: scattered emergent trees over 40 m tall; a continuous canopy at about 25 to 35 m; an under-canopy of smaller trees; a shrub layer; and a dark forest floor with little undergrowth, covered in leaf litter. Lianas (climbers) and epiphytes grow on the trees.</desc>
