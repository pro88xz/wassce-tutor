<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">How an ox-bow lake forms</title>
<desc id="d">1: a meander bends, with erosion on the outer bank and deposition on the inner bank. 2: erosion narrows the neck of the meander. 3: in a flood the river cuts through the neck and flows straight. 4: deposition seals the old bend, leaving a crescent-shaped ox-bow lake.</desc>
<defs></defs>
<rect width="800" height="400" rx="20" fill="#f8fafc"/>
<text x="400.0" y="34.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">From meander to ox-bow lake in four stages</text>
<path d="M 30 330 C 30 260, 65.0 250, 75.0 220 C 20 160, 40 90, 110 90 C 180 90, 200 160, 145.0 220 C 155.0 250, 190 260, 190 330" stroke="#2563eb" stroke-width="12" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="110.0" y="368.0" font-size="22" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">1</text>
<path d="M 220 330 C 220 260, 267.5 250, 277.5 220 C 210 160, 230 90, 300 90 C 370 90, 390 160, 322.5 220 C 332.5 250, 380 260, 380 330" stroke="#2563eb" stroke-width="12" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="300.0" y="368.0" font-size="22" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">2</text>
<path d="M 410 330 C 410 260, 480.0 250, 490.0 220 C 400 160, 420 90, 490 90 C 560 90, 580 160, 490.0 220 C 500.0 250, 570 260, 570 330" stroke="#2563eb" stroke-width="12" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="460.0" y1="222.0" x2="520.0" y2="222.0" stroke="#2563eb" stroke-width="12" stroke-linecap="round"/>
<text x="490.0" y="368.0" font-size="22" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">3</text>
<path d="M 600 330 C 600 260, 670.0 250, 680.0 220 C 590 160, 610 90, 680 90 C 750 90, 770 160, 680.0 220 C 690.0 250, 760 260, 760 330" stroke="#93c5fd" stroke-width="9" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="650.0" y1="222.0" x2="710.0" y2="222.0" stroke="#2563eb" stroke-width="12" stroke-linecap="round"/>
<text x="680.0" y="140.0" font-size="14" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">ox-bow</text>
<text x="680.0" y="158.0" font-size="14" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">lake</text>
<text x="680.0" y="368.0" font-size="22" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">4</text>
<text x="110.0" y="60.0" font-size="13" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="bold">erosion on outer bend</text>
<text x="300.0" y="60.0" font-size="13" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="bold">neck narrows</text>
<text x="490.0" y="60.0" font-size="13" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="bold">flood cuts through</text>
<text x="680.0" y="60.0" font-size="13" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="bold">old bend cut off</text>
</svg>
