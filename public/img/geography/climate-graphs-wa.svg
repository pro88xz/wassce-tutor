<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Climate graphs for Freetown and Kano</title>
<desc id="d">Freetown (tropical monsoon, coast of Sierra Leone) has very heavy rain from May to October, peaking at about 800 to 900 mm in July and August, and almost none from December to March; temperatures stay about 26 to 28 °C. Kano (savanna, northern Nigeria) has much less rain, about 800 mm a year, mostly from June to September, and a larger temperature range, about 22 to 31 °C. Values are approximate long-term averages.</desc>
