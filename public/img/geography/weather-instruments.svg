<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Weather instruments in a weather station</title>
<desc id="d">A weather station has a Stevenson screen, a white louvred box that shades thermometers (maximum and minimum, and wet- and dry-bulb for humidity). Outside are a rain gauge for rainfall, a wind vane for wind direction, a cup anemometer for wind speed and a sunshine recorder. A barometer indoors measures air pressure.</desc>
<defs></defs>
<rect width="800" height="500" rx="20" fill="#f8fafc"/>
<text x="400.0" y="34.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">What each instrument measures</text>
<rect x="30.0" y="90.0" width="160.0" height="104.0" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
<text x="110.0" y="218.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Stevenson screen</text>
<text x="110.0" y="236.0" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">houses thermometers</text>
<text x="110.0" y="252.0" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">and hygrometer</text>
<rect x="220.0" y="90.0" width="160.0" height="104.0" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
<text x="300.0" y="218.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Rain gauge</text>
<text x="300.0" y="236.0" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">rainfall (mm)</text>
<rect x="420.0" y="90.0" width="160.0" height="104.0" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
<text x="500.0" y="218.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Wind vane</text>
<text x="500.0" y="236.0" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">wind direction</text>
<rect x="610.0" y="90.0" width="160.0" height="104.0" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
<text x="690.0" y="218.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Cup anemometer</text>
<text x="690.0" y="236.0" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">wind speed</text>
<text x="690.0" y="252.0" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">(km/h or knots)</text>
<rect x="30.0" y="310.0" width="160.0" height="104.0" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
<text x="110.0" y="438.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Max–min thermometer</text>
<text x="110.0" y="456.0" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">highest and lowest</text>
<text x="110.0" y="472.0" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">temperature (°C)</text>
<rect x="220.0" y="310.0" width="160.0" height="104.0" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
<text x="300.0" y="438.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Wet- and dry-bulb</text>
<text x="300.0" y="456.0" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">relative humidity (%)</text>
<text x="300.0" y="472.0" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">(hygrometer)</text>
<rect x="420.0" y="310.0" width="160.0" height="104.0" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
<text x="500.0" y="438.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Barometer</text>
<text x="500.0" y="456.0" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">air pressure</text>
<text x="500.0" y="472.0" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">(millibars)</text>
<rect x="610.0" y="310.0" width="160.0" height="104.0" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
<text x="690.0" y="438.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Sunshine recorder</text>
<text x="690.0" y="456.0" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">hours of sunshine</text>
