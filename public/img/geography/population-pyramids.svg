<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Population pyramids of a developing and a developed country</title>
<desc id="d">A developing country&#x27;s pyramid, like Sierra Leone&#x27;s, has a wide base and narrow top: high birth rates, many children and few old people. A developed country&#x27;s pyramid has a narrow base and straighter sides: low birth rates, long life expectancy and more old people.</desc>
