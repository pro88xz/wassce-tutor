<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The Earth&#x27;s revolution around the Sun and the seasons</title>
<desc id="d">The Earth travels around the Sun once in about 365¼ days, with its axis tilted at 23½°. Around 21 June the northern hemisphere leans towards the Sun (overhead Sun on the Tropic of Cancer); around 22 December the southern hemisphere does (Tropic of Capricorn). Around 21 March and 23 September the Sun is overhead at the Equator (the equinoxes).</desc>
<defs></defs>
<rect width="800" height="500" rx="20" fill="#f8fafc"/>
<text x="400.0" y="34.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Revolution + tilt of 23½° = changing seasons</text>
<ellipse cx="400.0" cy="275.0" rx="290.0" ry="120.0" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="7 6"/>
<circle cx="400.0" cy="275.0" r="46.0" fill="#fde68a" stroke="#ea580c" stroke-width="3"/>
<text x="400.0" y="275.0" font-size="18" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Sun</text>
<circle cx="690.0" cy="275.0" r="26.0" fill="#bfdbfe" stroke="#2563eb" stroke-width="2.5"/>
<line x1="675.6" y1="242.0" x2="704.4" y2="308.0" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
<line x1="664.0" y1="275.0" x2="716.0" y2="275.0" stroke="#dc2626" stroke-width="1.5" stroke-linecap="round"/>
<text x="690.0" y="165.0" font-size="16" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">21 June</text>
<text x="690.0" y="184.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Sun overhead at</text>
<text x="690.0" y="201.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Tropic of Cancer</text>
<circle cx="400.0" cy="155.0" r="26.0" fill="#bfdbfe" stroke="#2563eb" stroke-width="2.5"/>
<line x1="385.6" y1="122.0" x2="414.4" y2="188.0" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
<line x1="374.0" y1="155.0" x2="426.0" y2="155.0" stroke="#dc2626" stroke-width="1.5" stroke-linecap="round"/>
<text x="440.0" y="129.0" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">23 September</text>
<text x="440.0" y="148.0" font-size="13" fill="#475569" text-anchor="start" dominant-baseline="middle" font-weight="normal">equinox: Sun</text>
<text x="440.0" y="165.0" font-size="13" fill="#475569" text-anchor="start" dominant-baseline="middle" font-weight="normal">overhead at Equator</text>
<circle cx="110.0" cy="275.0" r="26.0" fill="#bfdbfe" stroke="#2563eb" stroke-width="2.5"/>
<line x1="95.6" y1="242.0" x2="124.4" y2="308.0" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
<line x1="84.0" y1="275.0" x2="136.0" y2="275.0" stroke="#dc2626" stroke-width="1.5" stroke-linecap="round"/>
<text x="110.0" y="165.0" font-size="16" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">22 December</text>
<text x="110.0" y="184.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Sun overhead at</text>
<text x="110.0" y="201.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Tropic of Capricorn</text>
<circle cx="400.0" cy="395.0" r="26.0" fill="#bfdbfe" stroke="#2563eb" stroke-width="2.5"/>
<line x1="385.6" y1="362.0" x2="414.4" y2="428.0" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
<line x1="374.0" y1="395.0" x2="426.0" y2="395.0" stroke="#dc2626" stroke-width="1.5" stroke-linecap="round"/>
<text x="440.0" y="401.0" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">21 March</text>
<text x="440.0" y="420.0" font-size="13" fill="#475569" text-anchor="start" dominant-baseline="middle" font-weight="normal">equinox: Sun</text>
<text x="440.0" y="437.0" font-size="13" fill="#475569" text-anchor="start" dominant-baseline="middle" font-weight="normal">overhead at Equator</text>
<text x="110.0" y="470.0" font-size="15" fill="#15803d" text-anchor="start" dominant-baseline="middle" font-weight="bold">one revolution ≈ 365¼ days</text>
<text x="690.0" y="470.0" font-size="14" fill="#0f172a" text-anchor="end" dominant-baseline="middle" font-weight="bold">axis tilted 23½°</text>
</svg>
