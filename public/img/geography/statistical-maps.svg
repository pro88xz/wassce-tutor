<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Four kinds of statistical map</title>
<desc id="d">A dot map, where each dot stands for a fixed number of people; a choropleth map, where areas are shaded darker for higher values such as population density; an isopleth map, where lines join places of equal value, such as isohyets of equal rainfall; and a flow map, where arrows of different widths show the amount of movement between places.</desc>
