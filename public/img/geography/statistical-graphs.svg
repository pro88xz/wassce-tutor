<title id="t">Four statistical graphs drawn from geographical data</title>
<desc id="d">Four graphs of illustrative data: a simple bar graph of rice production over five years; a line graph of monthly temperature; a pie chart of land use in a district (farming 45%, forest 25%, mining 12%, settlement 10%, other 8%); and a divided (compound) bar showing the same land use as parts of one bar.</desc>
