<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Nucleated, dispersed and linear settlement patterns</title>
<desc id="d">In a nucleated settlement, houses are clustered closely around a centre such as a market, water point or crossroads. In a dispersed settlement, houses are scattered far apart across farmland. In a linear settlement, houses are built in a line along a road, river, railway or coast.</desc>
