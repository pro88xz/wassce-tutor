<text x="140.0" y="330.0" font-size="18" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Nucleated</text>
<text x="140.0" y="352.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">clustered around a centre</text>
<rect x="285.0" y="70.0" width="230.0" height="230.0" rx="8" fill="#ecfccb" stroke="#475569" stroke-width="1.5"/>
<text x="400.0" y="330.0" font-size="18" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Dispersed</text>
<text x="400.0" y="352.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">scattered over farmland</text>
