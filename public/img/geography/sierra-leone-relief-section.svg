<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Relief regions of Sierra Leone: a west–east cross-section</title>
<desc id="d">A simplified cross-section from the Atlantic Ocean eastwards across Sierra Leone: the mountains of the Freetown Peninsula (Picket Hill, 888 m), the low coastal plain with swamps and estuaries, the interior lowland plains with isolated hills, the plateau of the north and east, and the Loma Mountains, where Bintumani (1,945 m) is the highest point in Sierra Leone. Not to scale.</desc>
