<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">How a hydroelectric power station works</title>
<desc id="d">Water stored in a reservoir behind a dam flows down through a pipe (penstock), spinning a turbine connected to a generator, which produces electricity. The electricity is stepped up by transformers and carried away on power lines, and the water flows on downstream.</desc>
<defs></defs>
<rect width="800" height="420" rx="20" fill="#f8fafc"/>
<text x="400.0" y="34.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Falling water → turbine → generator → electricity</text>
<rect x="0.0" y="340.0" width="800.0" height="80.0" rx="0" fill="#d9c49a" stroke="none" stroke-width="0"/>
<polygon points="0.0,150.0 300.0,150.0 300.0,340.0 0.0,340.0" fill="#93c5fd" stroke="none" stroke-width="0" stroke-linejoin="round"/>
<polygon points="300.0,110.0 360.0,110.0 420.0,340.0 300.0,340.0" fill="#9ca3af" stroke="#0f172a" stroke-width="2" stroke-linejoin="round"/>
<text x="150.0" y="200.0" font-size="17" fill="#1e3a8a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">reservoir</text>
<path d="M 300 260 L 430 320" stroke="#2563eb" stroke-width="14" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="372.0" y="270.0" font-size="12" fill="#ffffff" text-anchor="middle" dominant-baseline="middle" font-weight="bold">penstock</text>
<rect x="430.0" y="290.0" width="110.0" height="50.0" rx="0" fill="#e5e7eb" stroke="#0f172a" stroke-width="2"/>
<circle cx="462.0" cy="315.0" r="16.0" fill="#fde68a" stroke="#0f172a" stroke-width="1.5"/>
<text x="462.0" y="315.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">T</text>
<circle cx="510.0" cy="315.0" r="16.0" fill="#fca5a5" stroke="#0f172a" stroke-width="1.5"/>
<text x="510.0" y="315.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">G</text>
<text x="485.0" y="275.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">power station</text>
<path d="M 540 330 Q 650 345 800 335" stroke="#2563eb" stroke-width="10" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="690.0" y="370.0" font-size="13" fill="#1e3a8a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">river flows on</text>
<line x1="600.0" y1="180.0" x2="600.0" y2="300.0" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
<line x1="580.0" y1="190.0" x2="620.0" y2="190.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
<line x1="700.0" y1="160.0" x2="700.0" y2="300.0" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
<line x1="680.0" y1="170.0" x2="720.0" y2="170.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
<path d="M 580 190 Q 640 205 680 170 M 620 190 Q 660 205 720 170" stroke="#ea580c" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="650.0" y="140.0" font-size="13" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">power lines</text>
<text x="462.0" y="360.0" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">T = turbine, G = generator</text>
</svg>
