<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Lines of latitude and longitude on the globe</title>
<desc id="d">Lines of latitude run east to west and measure distance north or south of the Equator (0°), up to 90° at the poles; the Tropics of Cancer and Capricorn are at 23½° N and S. Lines of longitude run from pole to pole and measure distance east or west of the Prime (Greenwich) Meridian (0°), up to 180°. Freetown is at about 8½° N, 13° W.</desc>
