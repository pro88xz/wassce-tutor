<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Primary, secondary and tertiary industries</title>
<desc id="d">Primary industries extract raw materials (farming, fishing, mining, logging). Secondary industries process them into manufactured goods. Tertiary industries provide services such as transport, trade, banking and teaching. Examples: cocoa farming, a chocolate factory, shops selling chocolate.</desc>
