<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Cross-section of major relief features</title>
<desc id="d">A cross-section from the coast inland shows a low coastal plain, an escarpment rising steeply to a plateau with a flat top, an inselberg standing alone on the plateau, a river valley cut into the plateau, and mountains rising to high peaks.</desc>
