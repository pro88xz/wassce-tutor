<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Push and pull factors of rural–urban migration</title>
<desc id="d">Push factors in rural areas, such as poverty, unemployment, poor amenities, land shortage and insecurity, drive people away. Pull factors in towns, such as jobs, better amenities, education, security and relatives already there, attract them. Obstacles such as cost, distance and family ties may slow migration.</desc>
<defs><marker id="a0f172a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f172a"/></marker><marker id="a0f172as" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#0f172a"/></marker></defs>
<rect width="800" height="440" rx="20" fill="#f8fafc"/>
<text x="400.0" y="34.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Rural–urban migration: pushed out, pulled in</text>
<rect x="25.0" y="95.0" width="270.0" height="260.0" rx="12" fill="#fef3c7" stroke="#ea580c" stroke-width="2.5"/>
<text x="160.0" y="144.5" font-size="17" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">RURAL AREA</text>
<text x="160.0" y="167.5" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">push factors:</text>
<text x="160.0" y="190.5" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">poverty, low farm income</text>
<text x="160.0" y="213.5" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">unemployment</text>
<text x="160.0" y="236.5" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">no electricity, water,</text>
<text x="160.0" y="259.5" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">hospitals, schools</text>
<text x="160.0" y="282.5" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">land shortage, poor harvests</text>
<text x="160.0" y="305.5" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">insecurity, disasters</text>
<rect x="505.0" y="95.0" width="270.0" height="260.0" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="640.0" y="144.5" font-size="17" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">TOWN</text>
<text x="640.0" y="167.5" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">pull factors:</text>
<text x="640.0" y="190.5" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">jobs, higher wages</text>
<text x="640.0" y="213.5" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">schools and colleges</text>
<text x="640.0" y="236.5" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">hospitals, electricity,</text>
<text x="640.0" y="259.5" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">pipe-borne water</text>
<text x="640.0" y="282.5" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">security</text>
<text x="640.0" y="305.5" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">relatives, city life</text>
<line x1="305.0" y1="225.0" x2="495.0" y2="225.0" stroke="#0f172a" stroke-width="5" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<text x="400.0" y="200.0" font-size="16" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">migration</text>
<text x="400.0" y="300.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="bold">obstacles:</text>
<text x="400.0" y="318.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">cost, distance,</text>
<text x="400.0" y="336.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">family ties</text>
<text x="400.0" y="415.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Most migrants are young adults looking for work or education.</text>
</svg>
