<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Causes and effects of desertification</title>
<desc id="d">Desertification is the spread of desert-like conditions into dry lands such as the Sahel. Its causes are overgrazing, over-cultivation, cutting trees for fuel, bush burning and drought. Its effects include loss of farmland and pasture, food shortages, migration, dust storms and conflict over land and water.</desc>
