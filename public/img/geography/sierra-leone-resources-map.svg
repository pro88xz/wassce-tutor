<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 760" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Map of Sierra Leone&#x27;s main mineral and economic resources</title>
<desc id="d">Sketch map of Sierra Leone showing diamonds in Kono and around Tongo, iron ore at Tonkolili and Marampa with the railway to the port of Pepel, rutile in Moyamba and Bonthe districts, bauxite at Mokanji, gold at Baomahun, the Bumbuna hydroelectric dam, the port of Freetown, the cocoa and coffee belt in the east and the main rice and oil palm areas. Positions are approximate.</desc>
