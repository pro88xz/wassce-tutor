<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Common drainage patterns</title>
<desc id="d">Dendritic drainage branches like a tree on rocks of even resistance. Trellis drainage has parallel main streams joined at right angles by tributaries, on alternating hard and soft rock. Radial drainage flows outwards from a central high point such as a volcano. Centripetal drainage flows inwards to a central basin or lake. Rectangular drainage follows right-angled joints. Parallel drainage forms on a uniform slope.</desc>
