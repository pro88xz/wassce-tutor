<text x="560.0" y="330.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">arch</text>
<rect x="640.0" y="250.0" width="34.0" height="54.0" rx="0" fill="#d9c49a" stroke="#0f172a" stroke-width="2"/>
<text x="657.0" y="330.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">stack</text>
<rect x="710.0" y="286.0" width="34.0" height="18.0" rx="0" fill="#d9c49a" stroke="#0f172a" stroke-width="2"/>
<text x="727.0" y="330.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">stump</text>
<path d="M 0 180 Q 60 240 160 230 Q 260 220 330 180" stroke="#0f172a" stroke-width="2" fill="#fde68a" stroke-linejoin="round" stroke-linecap="round"/>
<text x="165.0" y="210.0" font-size="14" fill="#92400e" text-anchor="middle" dominant-baseline="middle" font-weight="bold">bay with sandy beach</text>
<path d="M 60 250 Q 130 270 230 300 Q 250 306 260 300" stroke="#92400e" stroke-width="10" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
