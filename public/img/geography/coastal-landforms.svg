<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Coastal landforms of erosion and deposition</title>
<desc id="d">Waves erode a headland: hydraulic action and abrasion enlarge a crack into a cave, the cave cuts through into an arch, the arch roof collapses to leave a stack, and the stack is worn down to a stump. Between headlands, sheltered bays collect sand as beaches, and longshore drift can build a spit across a bay or river mouth.</desc>
