<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Methods of mining</title>
<desc id="d">Open-cast (surface) mining removes the overburden and digs minerals from a large open pit, as for iron ore and bauxite. Underground (shaft) mining reaches deep deposits through vertical shafts and horizontal tunnels, as for gold and some diamonds. Alluvial (placer) mining recovers minerals from river gravels by digging, washing and sieving, or by dredging, as for alluvial diamonds, gold and rutile.</desc>
