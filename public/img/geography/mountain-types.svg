<text x="675.0" y="400.0" font-size="17" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Volcanic mountain</text>
<text x="675.0" y="422.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">lava and ash layers:</text>
<text x="675.0" y="440.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Mt Cameroon, Kilimanjaro</text>
<text x="400.0" y="120.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">A rift valley (graben) forms where land between two faults sinks: East African Rift Valley.</text>
