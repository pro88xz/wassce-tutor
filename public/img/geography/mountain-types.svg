<line x1="270.0" y1="300.0" x2="240.0" y2="300.0" stroke="#dc2626" stroke-width="3" stroke-linecap="round" marker-end="url(#adc2626)"/>
<text x="140.0" y="400.0" font-size="17" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Fold mountains</text>
<text x="140.0" y="422.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">compression: Atlas, Alps,</text>
<text x="140.0" y="440.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Himalayas, Andes</text>
<polygon points="300.0,330.0 350.0,330.0 370.0,220.0 430.0,220.0 450.0,330.0 500.0,330.0 500.0,360.0 300.0,360.0" fill="#cbd5e1" stroke="#0f172a" stroke-width="2" stroke-linejoin="round"/>
