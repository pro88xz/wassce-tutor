<line x1="430.0" y1="220.0" x2="448.0" y2="360.0" stroke="#dc2626" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="6 4"/>
<line x1="400.0" y1="290.0" x2="400.0" y2="240.0" stroke="#dc2626" stroke-width="2.6" stroke-linecap="round" marker-end="url(#adc2626)"/>
<text x="400.0" y="400.0" font-size="16" fill="#7c3aed" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Block mountain (horst)</text>
<text x="400.0" y="422.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">uplift between faults:</text>
<text x="400.0" y="440.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Ruwenzori, Vosges</text>
<polygon points="560.0,360.0 660.0,200.0 690.0,200.0 790.0,360.0" fill="#78716c" stroke="#0f172a" stroke-width="2" stroke-linejoin="round"/>
