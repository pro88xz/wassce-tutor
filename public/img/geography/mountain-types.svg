<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Fold, block and volcanic mountains</title>
<desc id="d">Fold mountains form when compression pushes rock layers up into folds, as in the Atlas Mountains. Block mountains (horsts) form when land between two faults is pushed up, and a rift valley (graben) forms when land between faults sinks, as in the East African Rift Valley. Volcanic mountains are built from layers of lava and ash, such as Mount Cameroon.</desc>
