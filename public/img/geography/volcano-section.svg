<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Cross-section of a volcano and intrusive features</title>
<desc id="d">Magma rises from a magma chamber through a pipe to the vent and crater, building a cone of layers of lava and ash. Magma that cools underground forms intrusive features: a dyke cuts across the rock layers, a sill lies between them, a laccolith bulges them upwards, and a batholith is a huge mass deep below.</desc>
