<text x="720.0" y="228.0" font-size="18" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="bold">B</text>
<rect x="240.0" y="100.0" width="128.0" height="70.0" rx="0" fill="#e2e8f0" stroke="#0f172a" stroke-width="2"/>
<text x="304.0" y="135.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">building</text>
