<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">A chain survey with offsets</title>
<desc id="d">A straight chain line runs from station A to station B, measured every 20 metres. Offsets are measured at right angles from the chain line to features: two corners of a building, a tree, and the points where a path and a stream cross. The chainage along the line and the offset distance fix the position of each feature.</desc>
<defs></defs>
<rect width="800" height="470" rx="20" fill="#f8fafc"/>
<text x="400.0" y="34.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Chain survey: chain line plus right-angle offsets</text>
<line x1="80.0" y1="260.0" x2="720.0" y2="260.0" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
<line x1="80.0" y1="252.0" x2="80.0" y2="268.0" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
<text x="80.0" y="286.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">0 m</text>
<line x1="208.0" y1="252.0" x2="208.0" y2="268.0" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
<text x="208.0" y="286.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">20 m</text>
<line x1="336.0" y1="252.0" x2="336.0" y2="268.0" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
<text x="336.0" y="286.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">40 m</text>
<line x1="464.0" y1="252.0" x2="464.0" y2="268.0" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
<text x="464.0" y="286.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">60 m</text>
<line x1="592.0" y1="252.0" x2="592.0" y2="268.0" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
<text x="592.0" y="286.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">80 m</text>
<line x1="720.0" y1="252.0" x2="720.0" y2="268.0" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
<text x="720.0" y="286.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">100 m</text>
<polygon points="80.0,242.0 68.0,264.0 92.0,264.0" fill="#ffffff" stroke="#dc2626" stroke-width="2.5" stroke-linejoin="round"/>
<text x="80.0" y="228.0" font-size="18" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="bold">A</text>
