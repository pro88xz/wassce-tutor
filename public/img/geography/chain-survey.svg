<text x="205.2" y="90.0" font-size="13" fill="#2563eb" text-anchor="start" dominant-baseline="middle" font-weight="normal" font-style="italic">stream</text>
<text x="400.0" y="450.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Each feature is fixed by its chainage along A–B and its offset at a right angle.</text>
