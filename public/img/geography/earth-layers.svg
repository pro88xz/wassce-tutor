<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The internal structure of the Earth</title>
<desc id="d">A cross-section of the Earth shows the thin crust (about 5 to 70 km thick), the mantle down to about 2,900 km, the liquid outer core from about 2,900 to 5,100 km, and the solid inner core from about 5,100 km to the centre at about 6,370 km, where the temperature is about 5,500 °C.</desc>
<defs></defs>
<rect width="800" height="500" rx="20" fill="#f8fafc"/>
<text x="400.0" y="34.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Crust, mantle, outer core, inner core</text>
<path d="M 300 470 L 300 50 A 420 420 0 0 1 663.7306695894642 259.99999999999994 Z" stroke="#0f172a" stroke-width="2" fill="#a3e635" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 300 470 L 300 64 A 406 406 0 0 1 651.6063139364821 266.99999999999994 Z" stroke="#0f172a" stroke-width="2" fill="#f97316" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 300 470 L 300 238.99999999999997 A 231.00000000000003 231.00000000000003 0 0 1 500.05186827420533 354.49999999999994 Z" stroke="#0f172a" stroke-width="2" fill="#facc15" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 300 470 L 300 390.2 A 79.8 79.8 0 0 1 369.1088272219982 430.1 Z" stroke="#0f172a" stroke-width="2" fill="#fef08a" stroke-linejoin="round" stroke-linecap="round"/>
<text x="760.0" y="48.0" font-size="18" fill="#15803d" text-anchor="end" dominant-baseline="middle" font-weight="bold">Crust</text>
<text x="760.0" y="70.0" font-size="14" fill="#0f172a" text-anchor="end" dominant-baseline="middle" font-weight="normal">5–70 km thick; solid rock</text>
<text x="760.0" y="148.0" font-size="18" fill="#ea580c" text-anchor="end" dominant-baseline="middle" font-weight="bold">Mantle</text>
<text x="760.0" y="170.0" font-size="14" fill="#0f172a" text-anchor="end" dominant-baseline="middle" font-weight="normal">to about 2,900 km;</text>
<text x="760.0" y="192.0" font-size="14" fill="#0f172a" text-anchor="end" dominant-baseline="middle" font-weight="normal">hot, slowly flowing rock</text>
<text x="760.0" y="258.0" font-size="18" fill="#a16207" text-anchor="end" dominant-baseline="middle" font-weight="bold">Outer core</text>
<text x="760.0" y="280.0" font-size="14" fill="#0f172a" text-anchor="end" dominant-baseline="middle" font-weight="normal">2,900–5,100 km;</text>
<text x="760.0" y="302.0" font-size="14" fill="#0f172a" text-anchor="end" dominant-baseline="middle" font-weight="normal">liquid iron and nickel</text>
<text x="760.0" y="368.0" font-size="18" fill="#a16207" text-anchor="end" dominant-baseline="middle" font-weight="bold">Inner core</text>
<text x="760.0" y="390.0" font-size="14" fill="#0f172a" text-anchor="end" dominant-baseline="middle" font-weight="normal">5,100–6,370 km; solid</text>
<text x="760.0" y="412.0" font-size="14" fill="#0f172a" text-anchor="end" dominant-baseline="middle" font-weight="normal">iron and nickel, ~5,500 °C</text>
<line x1="560.0" y1="64.0" x2="493.9" y2="105.3" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
<line x1="560.0" y1="174.0" x2="453.8" y2="180.7" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
<line x1="560.0" y1="284.0" x2="373.0" y2="332.8" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
<line x1="560.0" y1="394.0" x2="317.7" y2="436.6" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
<text x="286.0" y="466.0" font-size="13" fill="#475569" text-anchor="end" dominant-baseline="middle" font-weight="normal">centre</text>
</svg>
