<title id="t">Drawing a cross-section from a contour map</title>
<desc id="d">Top: a line A–B drawn across contours from 100 m to 400 m. A strip of paper is laid along A–B and the points where each contour crosses it are marked with their heights. Bottom: the marks are transferred to a graph with a vertical scale, plotted at the right heights and joined with a smooth curve to show the shape of the land.</desc>
