<line x1="355.0" y1="196.0" x2="349.0" y2="228.0" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
<line x1="373.0" y1="196.0" x2="367.0" y2="228.0" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
<line x1="391.0" y1="196.0" x2="385.0" y2="228.0" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
<line x1="450.0" y1="200.0" x2="530.0" y2="300.0" stroke="#ea580c" stroke-width="2.4" stroke-linecap="round" marker-end="url(#aea580c)"/>
<text x="320.0" y="300.0" font-size="12" fill="#2563eb" text-anchor="end" dominant-baseline="middle" font-weight="bold">windward:</text>
<text x="320.0" y="316.0" font-size="12" fill="#2563eb" text-anchor="end" dominant-baseline="middle" font-weight="bold">wet</text>
<text x="462.0" y="316.0" font-size="12" fill="#ffffff" text-anchor="start" dominant-baseline="middle" font-weight="bold">leeward: dry</text>
<text x="462.0" y="332.0" font-size="12" fill="#ffffff" text-anchor="start" dominant-baseline="middle" font-weight="bold">rain shadow</text>
<text x="415.0" y="380.0" font-size="17" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Relief (orographic)</text>
<text x="415.0" y="402.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">moist wind forced over</text>
<text x="415.0" y="420.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">mountains</text>
<path d="M 580 350 L 780 350 L 780 240 Q 700 300 580 350 Z" stroke="#2563eb" stroke-width="2" fill="#dbeafe" stroke-linejoin="round" stroke-linecap="round"/>
<text x="735.0" y="320.0" font-size="13" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">cold air</text>
<line x1="600.0" y1="330.0" x2="720.0" y2="220.0" stroke="#dc2626" stroke-width="2.6" stroke-linecap="round" marker-end="url(#adc2626)"/>
<text x="640.0" y="240.0" font-size="13" fill="#dc2626" text-anchor="end" dominant-baseline="middle" font-weight="bold">warm air</text>
<ellipse cx="720.0" cy="180.0" rx="60.0" ry="24.0" fill="#e5e7eb" stroke="#475569" stroke-width="2"/>
<line x1="700.0" y1="206.0" x2="694.0" y2="236.0" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
<line x1="718.0" y1="206.0" x2="712.0" y2="236.0" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
<line x1="736.0" y1="206.0" x2="730.0" y2="236.0" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
<text x="680.0" y="380.0" font-size="17" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Frontal (cyclonic)</text>
<text x="680.0" y="402.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">warm air rises over</text>
<text x="680.0" y="420.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">cold air (temperate lands)</text>
<text x="400.0" y="455.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">In every case: air rises → cools → water vapour condenses → clouds → rain</text>
</svg>
