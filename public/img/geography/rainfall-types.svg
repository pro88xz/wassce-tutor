<line x1="176.0" y1="200.0" x2="170.0" y2="236.0" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
<text x="140.0" y="380.0" font-size="17" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Convectional</text>
<text x="140.0" y="402.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">strong heating; afternoon</text>
<text x="140.0" y="420.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">storms (equatorial regions)</text>
<polygon points="290.0,350.0 400.0,180.0 440.0,180.0 540.0,350.0" fill="#a8a29e" stroke="#0f172a" stroke-width="2" stroke-linejoin="round"/>
