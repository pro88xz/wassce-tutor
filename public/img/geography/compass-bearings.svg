<line x1="210.0" y1="250.0" x2="164.1" y2="139.1" stroke="#475569" stroke-width="1" stroke-linecap="round"/>
<text x="144.9" y="92.9" font-size="12" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">NNW</text>
<line x1="560.0" y1="290.0" x2="560.0" y2="140.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
