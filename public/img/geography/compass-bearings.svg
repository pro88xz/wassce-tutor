<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Compass points and bearings</title>
<desc id="d">Left: the sixteen points of the compass from north through north-north-east, north-east and so on. Right: a bearing is the angle measured clockwise from north, written with three figures. From X, the bearing of Y is 060°; the back bearing, from Y to X, is 060° + 180° = 240°.</desc>
<defs></defs>
<rect width="800" height="460" rx="20" fill="#f8fafc"/>
<text x="400.0" y="34.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Sixteen compass points, and bearings measured clockwise from north</text>
<circle cx="210.0" cy="250.0" r="150.0" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<line x1="210.0" y1="250.0" x2="210.0" y2="108.0" stroke="#0f172a" stroke-width="2.2" stroke-linecap="round"/>
<text x="210.0" y="80.0" font-size="15" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="bold">N</text>
<line x1="210.0" y1="250.0" x2="255.9" y2="139.1" stroke="#475569" stroke-width="1" stroke-linecap="round"/>
<text x="275.1" y="92.9" font-size="12" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">NNE</text>
<line x1="210.0" y1="250.0" x2="294.9" y2="165.1" stroke="#475569" stroke-width="1" stroke-linecap="round"/>
<text x="330.2" y="129.8" font-size="12" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">NE</text>
<line x1="210.0" y1="250.0" x2="320.9" y2="204.1" stroke="#475569" stroke-width="1" stroke-linecap="round"/>
<text x="367.1" y="184.9" font-size="12" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">ENE</text>
<line x1="210.0" y1="250.0" x2="352.0" y2="250.0" stroke="#0f172a" stroke-width="2.2" stroke-linecap="round"/>
<text x="380.0" y="250.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">E</text>
<line x1="210.0" y1="250.0" x2="320.9" y2="295.9" stroke="#475569" stroke-width="1" stroke-linecap="round"/>
<text x="367.1" y="315.1" font-size="12" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">ESE</text>
