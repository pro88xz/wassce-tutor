<line x1="210.0" y1="250.0" x2="255.9" y2="360.9" stroke="#475569" stroke-width="1" stroke-linecap="round"/>
<text x="275.1" y="407.1" font-size="12" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">SSE</text>
<line x1="210.0" y1="250.0" x2="210.0" y2="392.0" stroke="#0f172a" stroke-width="2.2" stroke-linecap="round"/>
<text x="210.0" y="420.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">S</text>
<line x1="210.0" y1="250.0" x2="164.1" y2="360.9" stroke="#475569" stroke-width="1" stroke-linecap="round"/>
