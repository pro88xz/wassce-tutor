<line x1="560.0" y1="290.0" x2="681.2" y2="220.0" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
<path d="M 560.0 230.0 A 60 60 0 0 1 612.0 260.0" stroke="#ea580c" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="582.2" y="199.0" width="27.5" height="18.0" rx="4" fill="#f8fafc" stroke="none" stroke-width="0" opacity="0.92"/>
<text x="596.0" y="208.0" font-size="14" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">60°</text>
<circle cx="560.0" cy="290.0" r="6.0" fill="#0f172a" stroke="#0f172a" stroke-width="1"/>
<text x="542.0" y="294.0" font-size="18" fill="#0f172a" text-anchor="end" dominant-baseline="middle" font-weight="bold">X</text>
<circle cx="681.2" cy="220.0" r="6.0" fill="#0f172a" stroke="#0f172a" stroke-width="1"/>
<text x="695.2" y="220.0" font-size="18" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Y</text>
<text x="580.0" y="350.0" font-size="15" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">bearing of Y from X = 060°</text>
<text x="580.0" y="374.0" font-size="15" fill="#7c3aed" text-anchor="middle" dominant-baseline="middle" font-weight="bold">back bearing (Y to X) = 240°</text>
<text x="580.0" y="398.0" font-size="14" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">back bearing = bearing ± 180°</text>
</svg>
