<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The rock cycle</title>
<desc id="d">Magma cools and solidifies to form igneous rock. Weathering and erosion break rocks into sediments, which are deposited, compacted and cemented into sedimentary rock. Heat and pressure change igneous or sedimentary rock into metamorphic rock. Melting turns any rock back into magma.</desc>
