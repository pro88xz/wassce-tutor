<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Source documents and the books of original entry they are recorded in</title>
<desc id="d">Each source document is first recorded in a book of original entry: purchase invoices received go to the purchases day book; sales invoices sent go to the sales day book; credit notes received go to the returns outwards book; credit notes sent go to the returns inwards book; receipts, cheque counterfoils and bank paying-in slips go to the cash book; petty cash vouchers go to the petty cash book; and other items such as credit purchases of assets and corrections go to the general journal.</desc>
