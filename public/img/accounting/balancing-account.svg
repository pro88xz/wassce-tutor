<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Balancing off a ledger account</title>
<desc id="d">Worked example of balancing a cash account. Debit side: capital 20,000 and sales 8,000, total 28,000. Credit side: purchases 6,500, rent 2,000, wages 1,500 and balance carried down 18,000, total 28,000. The balance of 18,000 is brought down on the debit side on 1 May, showing cash in hand.</desc>
