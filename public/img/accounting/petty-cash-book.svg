<title id="t">An analytical petty cash book under the imprest system</title>
<desc id="d">Worked example of a petty cash book for March 2026 with an imprest of NLe 5,000. Payments: postage 300, bus fares 450, cleaning 600, envelopes and pens 700, payment to J. Conteh 1,200, taxi fare 550 and cleaning materials 500, totalling 4,300. Analysis column totals: postage 300, travelling 1,000, cleaning 1,100, stationery 700, ledger 1,200. The balance carried down is 700, and the main cashier reimburses 4,300 to restore the imprest of 5,000.</desc>
