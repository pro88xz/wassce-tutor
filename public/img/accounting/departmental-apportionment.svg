<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Apportioning a shared expense between departments</title>
<desc id="d">Rent of NLe 36,000 shared between three departments in proportion to floor area: Department A has 300 square metres, B 200 and C 100, a total of 600. A is charged half, NLe 18,000; B a third, NLe 12,000; C a sixth, NLe 6,000.</desc>
<defs></defs>
<rect width="800" height="400" rx="20" fill="#f8fafc"/>
<text x="400.0" y="34.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Rent NLe 36,000 shared by floor area (300 : 200 : 100 m²)</text>
<rect x="80.0" y="120.0" width="320.0" height="90.0" rx="0" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="240.0" y="150.0" font-size="17" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Dept A</text>
<text x="240.0" y="178.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">300 m²</text>
<text x="240.0" y="250.0" font-size="14" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">300/600 × 36,000</text>
<text x="240.0" y="278.0" font-size="17" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">NLe 18,000</text>
<rect x="400.0" y="120.0" width="213.3" height="90.0" rx="0" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
<text x="506.7" y="150.0" font-size="17" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Dept B</text>
<text x="506.7" y="178.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">200 m²</text>
<text x="506.7" y="250.0" font-size="14" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">200/600 × 36,000</text>
<text x="506.7" y="278.0" font-size="17" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">NLe 12,000</text>
<rect x="613.3" y="120.0" width="106.7" height="90.0" rx="0" fill="#fef3c7" stroke="#ea580c" stroke-width="2.5"/>
<text x="666.7" y="150.0" font-size="17" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Dept C</text>
<text x="666.7" y="178.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">100 m²</text>
<text x="666.7" y="250.0" font-size="14" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">100/600 × 36,000</text>
<text x="666.7" y="278.0" font-size="17" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">NLe 6,000</text>
<text x="400.0" y="370.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Common bases: floor area (rent, rates), sales (advertising), staff numbers (canteen), value (insurance).</text>
</svg>
