<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">A computerised accounting system</title>
<desc id="d">Input: source documents such as invoices, receipts and payroll data are keyed in or imported. Processing: the accounting software posts each entry to the sales ledger, purchases ledger, general ledger, inventory and payroll modules automatically by double entry. Output: reports such as the trial balance, income statement, statement of financial position, aged receivables and VAT or GST returns, produced instantly. Controls include passwords, user access levels, backups and an audit trail.</desc>
