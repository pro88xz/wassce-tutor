<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">A three-column cash book with discounts and contra entries</title>
<desc id="d">Worked example of a three-column cash book for February 2026 in new leones. Debit side: balances brought down (cash 2,000, bank 15,000), a cheque of 4,750 from Kamara with 250 discount allowed, cash sales of 6,000, a contra of 4,000 cash paid into the bank, and a contra of 2,000 withdrawn from the bank for office use. Credit side: a cheque of 9,700 to Sesay with 300 discount received, cash wages 1,500, cash paid into bank 4,000, cash withdrawn from bank 2,000, rent by cheque 3,500, and balances carried down of cash 4,500 and bank 8,550. Both sides total discount, cash 10,000 and bank 23,750.</desc>
