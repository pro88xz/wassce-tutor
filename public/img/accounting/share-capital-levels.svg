<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Levels of share capital</title>
<desc id="d">Authorised share capital is the maximum the company may issue under its constitution. Issued share capital is the part actually issued to shareholders. Called-up capital is the part of the issued capital the company has asked shareholders to pay so far, and paid-up capital is the part actually received. Each level is equal to or smaller than the one above it.</desc>
<defs></defs>
<rect width="800" height="470" rx="20" fill="#f8fafc"/>
<text x="400.0" y="34.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Authorised ≥ issued ≥ called-up ≥ paid-up</text>
<rect x="60.0" y="76.0" width="680.0" height="68.0" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
<text x="400.0" y="101.0" font-size="18" fill="#7c3aed" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Authorised capital</text>
<text x="400.0" y="125.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">the most the company may issue</text>
<rect x="120.0" y="164.0" width="560.0" height="68.0" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="400.0" y="189.0" font-size="18" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Issued capital</text>
<text x="400.0" y="213.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">shares actually issued to shareholders</text>
<rect x="180.0" y="252.0" width="440.0" height="68.0" rx="12" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/>
<text x="400.0" y="277.0" font-size="18" fill="#0f766e" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Called-up capital</text>
<text x="400.0" y="301.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">amount shareholders have been asked to pay</text>
<rect x="240.0" y="340.0" width="320.0" height="68.0" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
<text x="400.0" y="365.0" font-size="18" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Paid-up capital</text>
<text x="400.0" y="389.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">amount actually received</text>
<text x="400.0" y="455.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Only issued (called-up) capital appears in the statement of financial position.</text>
</svg>
