<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Classification of accounting errors</title>
<desc id="d">Errors that do not affect the agreement of the trial balance: omission, commission, principle, original entry, complete reversal and compensating errors. Errors that do affect the agreement of the trial balance: an entry on one side only, unequal amounts on the two sides, two debits or two credits, casting (addition) errors in one account, and wrong extraction of a balance. Errors that affect the agreement cause a difference that is placed in a suspense account until found.</desc>
<defs><marker id="a475569" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker><marker id="a475569s" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#475569"/></marker></defs>
<rect width="800" height="500" rx="20" fill="#f8fafc"/>
<text x="400.0" y="34.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Two families of errors</text>
<rect x="290.0" y="58.0" width="220.0" height="54.0" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
<text x="400.0" y="85.0" font-size="19" fill="#7c3aed" text-anchor="middle" dominant-baseline="middle" font-weight="bold">ERRORS</text>
<rect x="25.0" y="140.0" width="360.0" height="300.0" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
<text x="205.0" y="198.0" font-size="17" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Do NOT affect the</text>
<text x="205.0" y="221.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">trial balance totals</text>
<text x="205.0" y="244.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal"></text>
<text x="205.0" y="267.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">omission (not recorded at all)</text>
<text x="205.0" y="290.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">commission (wrong person&#x27;s a/c)</text>
<text x="205.0" y="313.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">principle (wrong class of a/c)</text>
<text x="205.0" y="336.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">original entry (wrong amount both sides)</text>
<text x="205.0" y="359.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">complete reversal (Dr and Cr swapped)</text>
<text x="205.0" y="382.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">compensating (two errors cancel out)</text>
<rect x="415.0" y="140.0" width="360.0" height="300.0" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
<text x="595.0" y="198.0" font-size="17" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="bold">DO affect the</text>
<text x="595.0" y="221.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">trial balance totals</text>
<text x="595.0" y="244.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal"></text>
<text x="595.0" y="267.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">single entry (one side only)</text>
<text x="595.0" y="290.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">unequal amounts on the two sides</text>
<text x="595.0" y="313.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">two debits or two credits</text>
<text x="595.0" y="336.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">casting error in one account</text>
<text x="595.0" y="359.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">balance extracted wrongly</text>
<text x="595.0" y="382.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">→ difference to SUSPENSE a/c</text>
<line x1="400.0" y1="118.0" x2="205.0" y2="134.0" stroke="#475569" stroke-width="2.2" stroke-linecap="round" marker-end="url(#a475569)"/>
<line x1="400.0" y1="118.0" x2="595.0" y2="134.0" stroke="#475569" stroke-width="2.2" stroke-linecap="round" marker-end="url(#a475569)"/>
</svg>
