<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The accounting cycle</title>
<desc id="d">The accounting cycle: business transactions are evidenced by source documents, recorded first in the books of original entry, posted to ledger accounts by double entry, listed in a trial balance, adjusted for items such as accruals, prepayments and depreciation, and summarised in the final accounts: the income statement and the statement of financial position. The cycle then starts again for the next period.</desc>
<defs><marker id="a475569" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker><marker id="a475569s" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#475569"/></marker></defs>
<rect width="800" height="470" rx="20" fill="#f8fafc"/>
<text x="400.0" y="34.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">From transaction to final accounts</text>
<rect x="30.0" y="92.0" width="220.0" height="96.0" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="140.0" y="118.0" font-size="16" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">1. Transaction</text>
<text x="140.0" y="140.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">evidenced by a</text>
<text x="140.0" y="162.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">source document</text>
<rect x="290.0" y="92.0" width="220.0" height="96.0" rx="12" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/>
<text x="400.0" y="118.0" font-size="16" fill="#0f766e" text-anchor="middle" dominant-baseline="middle" font-weight="bold">2. Books of</text>
<text x="400.0" y="140.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">original entry</text>
<text x="400.0" y="162.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">day books, cash book, journal</text>
<rect x="550.0" y="92.0" width="220.0" height="96.0" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
<text x="660.0" y="118.0" font-size="16" fill="#7c3aed" text-anchor="middle" dominant-baseline="middle" font-weight="bold">3. Ledger</text>
<text x="660.0" y="140.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">double entry:</text>
<text x="660.0" y="162.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">a debit and a credit</text>
<rect x="550.0" y="282.0" width="220.0" height="96.0" rx="12" fill="#fef3c7" stroke="#ea580c" stroke-width="2.5"/>
<text x="660.0" y="308.0" font-size="16" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">4. Trial balance</text>
<text x="660.0" y="330.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">checks that total</text>
<text x="660.0" y="352.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">debits = total credits</text>
<rect x="290.0" y="282.0" width="220.0" height="96.0" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
<text x="400.0" y="308.0" font-size="16" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="bold">5. Adjustments</text>
<text x="400.0" y="330.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">accruals, prepayments,</text>
<text x="400.0" y="352.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">depreciation, bad debts</text>
<rect x="30.0" y="282.0" width="220.0" height="96.0" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
<text x="140.0" y="308.0" font-size="16" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">6. Final accounts</text>
<text x="140.0" y="330.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">income statement and</text>
<text x="140.0" y="352.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">financial position</text>
<line x1="256.0" y1="140.0" x2="284.0" y2="140.0" stroke="#475569" stroke-width="2.6" stroke-linecap="round" marker-end="url(#a475569)"/>
<line x1="516.0" y1="140.0" x2="544.0" y2="140.0" stroke="#475569" stroke-width="2.6" stroke-linecap="round" marker-end="url(#a475569)"/>
<line x1="660.0" y1="194.0" x2="660.0" y2="276.0" stroke="#475569" stroke-width="2.6" stroke-linecap="round" marker-end="url(#a475569)"/>
<line x1="544.0" y1="330.0" x2="516.0" y2="330.0" stroke="#475569" stroke-width="2.6" stroke-linecap="round" marker-end="url(#a475569)"/>
<line x1="284.0" y1="330.0" x2="256.0" y2="330.0" stroke="#475569" stroke-width="2.6" stroke-linecap="round" marker-end="url(#a475569)"/>
<path d="M 140 378 Q 60 430 40 300 Q 30 180 60 140" stroke="#475569" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#a475569)"/>
<text x="70.0" y="440.0" font-size="13" fill="#475569" text-anchor="start" dominant-baseline="middle" font-weight="normal">next period</text>
<text x="400.0" y="455.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Steps 1–3 record; steps 4–6 check and summarise.</text>
</svg>
