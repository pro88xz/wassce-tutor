<title id="t">A sales ledger control account</title>
<desc id="d">Worked sales ledger control account for January 2026 in new leones. Debit side: balance brought down 45,000; credit sales 120,000; dishonoured cheques 1,500; interest charged 300; total 166,800. Credit side: cash and cheques received 98,000; discount allowed 2,400; returns inwards 3,600; bad debts 1,800; set-off against the purchases ledger 2,000; balance carried down 59,000; total 166,800. The closing balance should equal the total of the individual customer balances in the sales ledger.</desc>
