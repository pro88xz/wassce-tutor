<rect x="80.0" y="325.0" width="330.0" height="90.0" rx="12" fill="#fef3c7" stroke="#ea580c" stroke-width="2.5"/>
<text x="245.0" y="358.5" font-size="17" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Non-current liabilities</text>
<text x="245.0" y="381.5" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">debentures, long-term loans</text>
