<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Equity and liabilities of a limited company</title>
<desc id="d">The capital side of a company&#x27;s statement of financial position. Equity is made up of share capital (ordinary and preference shares) and reserves: capital reserves such as share premium and revaluation reserve, which cannot normally be paid out as dividends, and revenue reserves such as the general reserve and retained earnings, which can. Below equity come non-current liabilities, such as debentures and long-term loans, and current liabilities, such as trade payables, tax payable and accrued expenses.</desc>
<defs><marker id="a475569" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker><marker id="a475569s" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#475569"/></marker></defs>
<rect width="800" height="470" rx="20" fill="#f8fafc"/>
<text x="400.0" y="34.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Equity and liabilities of a limited company</text>
