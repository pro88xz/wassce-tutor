<text x="590.0" y="358.5" font-size="17" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Current liabilities</text>
<text x="590.0" y="381.5" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">payables, tax payable, accruals</text>
<text x="400.0" y="450.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Capital reserves cannot normally be paid out as dividends; revenue reserves can.</text>
