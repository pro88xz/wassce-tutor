<text x="150.0" y="177.0" font-size="17" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Share capital</text>
<text x="150.0" y="200.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">ordinary shares</text>
<text x="150.0" y="223.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">preference shares</text>
<rect x="290.0" y="145.0" width="220.0" height="110.0" rx="12" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/>
<text x="400.0" y="177.0" font-size="17" fill="#0f766e" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Capital reserves</text>
<text x="400.0" y="200.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">share premium</text>
<text x="400.0" y="223.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">revaluation reserve</text>
<rect x="520.0" y="145.0" width="240.0" height="110.0" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
<text x="640.0" y="177.0" font-size="17" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Revenue reserves</text>
<text x="640.0" y="200.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">general reserve</text>
<text x="640.0" y="223.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">retained earnings</text>
