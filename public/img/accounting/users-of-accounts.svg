<text x="130.0" y="105.5" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">profit, value of capital</text>
<line x1="400.0" y1="196.0" x2="130.0" y2="132.0" stroke="#475569" stroke-width="1.8" stroke-linecap="round" marker-end="url(#a475569)"/>
<rect x="290.0" y="49.0" width="220.0" height="62.0" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="400.0" y="69.5" font-size="15" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Managers</text>
<text x="400.0" y="90.5" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">planning and control</text>
<line x1="400.0" y1="196.0" x2="400.0" y2="117.0" stroke="#475569" stroke-width="1.8" stroke-linecap="round" marker-end="url(#a475569)"/>
<rect x="560.0" y="64.0" width="220.0" height="62.0" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="670.0" y="84.5" font-size="15" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Lenders and banks</text>
<text x="670.0" y="105.5" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">can loans be repaid?</text>
<line x1="400.0" y1="196.0" x2="670.0" y2="132.0" stroke="#475569" stroke-width="1.8" stroke-linecap="round" marker-end="url(#a475569)"/>
