<line x1="400.0" y1="284.0" x2="400.0" y2="363.0" stroke="#475569" stroke-width="1.8" stroke-linecap="round" marker-end="url(#a475569)"/>
<rect x="560.0" y="354.0" width="220.0" height="62.0" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="670.0" y="374.5" font-size="15" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Customers</text>
<text x="670.0" y="395.5" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">will supply continue?</text>
<line x1="400.0" y1="284.0" x2="670.0" y2="348.0" stroke="#475569" stroke-width="1.8" stroke-linecap="round" marker-end="url(#a475569)"/>
