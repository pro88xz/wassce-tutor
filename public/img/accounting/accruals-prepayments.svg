<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Accruals and prepayments on a timeline</title>
<desc id="d">A financial year from 1 January to 31 December 2026. Rent of NLe 1,000 a month: payments of NLe 11,000 cover January to November, so December&#x27;s NLe 1,000 is owing at the year end, an accrual; the charge for the year is NLe 12,000. Insurance of NLe 6,000 paid on 1 October covers twelve months to 30 September 2027, so nine months, NLe 4,500, is paid in advance, a prepayment; the charge for 2026 is NLe 1,500.</desc>
