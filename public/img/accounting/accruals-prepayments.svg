<text x="400.0" y="405.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Rent charge 2026 = 11,000 + 1,000 = 12,000      Insurance charge 2026 = 6,000 − 4,500 = 1,500</text>
