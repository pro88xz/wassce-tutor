<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The rules of debit and credit</title>
<desc id="d">A large T-account. The debit (left) side records increases in assets, expenses and drawings, and decreases in liabilities, capital and income. The credit (right) side records increases in liabilities, capital and income, and decreases in assets. Every transaction has a debit entry and a credit entry of equal amount. The memory aid DEAD CLIC stands for Debit: Expenses, Assets, Drawings; Credit: Liabilities, Income, Capital.</desc>
<defs></defs>
<rect width="800" height="500" rx="20" fill="#f8fafc"/>
<text x="400.0" y="34.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">One debit, one credit, equal amounts</text>
<line x1="80.0" y1="110.0" x2="720.0" y2="110.0" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
<line x1="400.0" y1="110.0" x2="400.0" y2="400.0" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
<text x="240.0" y="88.0" font-size="18" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">DEBIT (Dr) — left side</text>
<text x="560.0" y="88.0" font-size="18" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">CREDIT (Cr) — right side</text>
<text x="110.0" y="140.0" font-size="16" fill="#2563eb" text-anchor="start" dominant-baseline="middle" font-weight="bold">Increase in:</text>
<text x="110.0" y="168.0" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">assets</text>
<text x="110.0" y="196.0" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">expenses and losses</text>
<text x="110.0" y="224.0" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">drawings</text>
<text x="110.0" y="252.0" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal"></text>
<text x="110.0" y="280.0" font-size="16" fill="#2563eb" text-anchor="start" dominant-baseline="middle" font-weight="bold">Decrease in:</text>
<text x="110.0" y="308.0" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">liabilities</text>
<text x="110.0" y="336.0" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">capital</text>
<text x="110.0" y="364.0" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">income</text>
<text x="430.0" y="140.0" font-size="16" fill="#ea580c" text-anchor="start" dominant-baseline="middle" font-weight="bold">Increase in:</text>
<text x="430.0" y="168.0" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">liabilities</text>
<text x="430.0" y="196.0" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">capital</text>
<text x="430.0" y="224.0" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">income and gains</text>
<text x="430.0" y="252.0" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal"></text>
<text x="430.0" y="280.0" font-size="16" fill="#ea580c" text-anchor="start" dominant-baseline="middle" font-weight="bold">Decrease in:</text>
<text x="430.0" y="308.0" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">assets</text>
<rect x="110.0" y="420.0" width="580.0" height="58.0" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
<text x="400.0" y="440.0" font-size="16" fill="#7c3aed" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Memory aid: DEAD CLIC</text>
<text x="400.0" y="463.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Debit: Expenses, Assets, Drawings   •   Credit: Liabilities, Income, Capital</text>
</svg>
