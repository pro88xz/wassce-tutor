<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">How the imprest system works</title>
<desc id="d">The imprest system: at the start of the period the main cashier gives the petty cashier a fixed float, the imprest, for example NLe 5,000. The petty cashier pays small expenses against signed vouchers. At the end of the period the petty cashier shows the vouchers and is reimbursed exactly the amount spent, so the float is restored to the imprest.</desc>
<defs><marker id="a475569" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker><marker id="a475569s" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#475569"/></marker></defs>
<rect width="800" height="360" rx="20" fill="#f8fafc"/>
<text x="400.0" y="34.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Imprest system: spend, show vouchers, get exactly the amount spent back</text>
<rect x="35.0" y="115.0" width="230.0" height="110.0" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="150.0" y="147.0" font-size="17" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">1. Float given</text>
<text x="150.0" y="170.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">imprest</text>
<text x="150.0" y="193.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">NLe 5,000</text>
<rect x="285.0" y="115.0" width="230.0" height="110.0" rx="12" fill="#fef3c7" stroke="#ea580c" stroke-width="2.5"/>
<text x="400.0" y="147.0" font-size="17" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">2. Petty expenses</text>
<text x="400.0" y="170.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">paid on vouchers</text>
<text x="400.0" y="193.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">spent NLe 4,300</text>
<rect x="535.0" y="115.0" width="230.0" height="110.0" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
<text x="650.0" y="147.0" font-size="17" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">3. Reimbursed</text>
<text x="650.0" y="170.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">the amount spent</text>
<text x="650.0" y="193.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">NLe 4,300</text>
<line x1="271.0" y1="170.0" x2="279.0" y2="170.0" stroke="#475569" stroke-width="2.6" stroke-linecap="round" marker-end="url(#a475569)"/>
<line x1="521.0" y1="170.0" x2="529.0" y2="170.0" stroke="#475569" stroke-width="2.6" stroke-linecap="round" marker-end="url(#a475569)"/>
<path d="M 650 230 Q 650 300 400 300 Q 150 300 150 230" stroke="#475569" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#a475569)"/>
<rect x="207.8" y="289.0" width="384.3" height="22.0" rx="4" fill="#f8fafc" stroke="none" stroke-width="0" opacity="0.92"/>
<text x="400.0" y="300.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">cash in hand back to NLe 700 + 4,300 = NLe 5,000</text>
<text x="400.0" y="345.0" font-size="14" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Advantages: control of small spending, cashier&#x27;s time saved, theft or errors noticed quickly.</text>
</svg>
