<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Where the figures in a sales ledger control account come from</title>
<desc id="d">The sales ledger control account is written up from totals in the books of original entry: credit sales from the sales day book; returns inwards from the returns inwards book; cash and cheques received and discount allowed from the cash book; bad debts, set-offs and interest from the general journal. Its balance is compared with the total of the list of customers&#x27; balances in the sales ledger.</desc>
