<text x="160.0" y="206.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">returns inwards (Cr)</text>
<line x1="301.0" y1="195.0" x2="429.0" y2="238.0" stroke="#475569" stroke-width="2" stroke-linecap="round" marker-end="url(#a475569)"/>
