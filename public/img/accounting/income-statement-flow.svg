<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">How the income statement is built up</title>
<desc id="d">The income statement has two parts. In the trading section, net sales (sales less returns inwards) minus the cost of sales gives gross profit; cost of sales is opening inventory plus net purchases plus carriage inwards minus closing inventory. In the profit and loss section, gross profit plus other income (such as discount received, rent or commission received) minus expenses (such as wages, rent, carriage outwards, depreciation and discount allowed) gives net profit, which is added to the owner&#x27;s capital.</desc>
<defs><marker id="a475569" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker><marker id="a475569s" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#475569"/></marker></defs>
<rect width="800" height="500" rx="20" fill="#f8fafc"/>
<text x="400.0" y="34.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Income statement: trading section, then profit and loss section</text>
<rect x="60.0" y="80.0" width="680.0" height="60.0" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="400.0" y="98.5" font-size="17" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Net sales</text>
<text x="400.0" y="121.5" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">sales − returns inwards</text>
<rect x="60.0" y="160.0" width="680.0" height="60.0" rx="12" fill="#fef3c7" stroke="#ea580c" stroke-width="2.5"/>
<text x="400.0" y="178.5" font-size="17" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">− Cost of sales</text>
<text x="400.0" y="201.5" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">opening inventory + net purchases + carriage in − closing inventory</text>
<line x1="400.0" y1="146.0" x2="400.0" y2="154.0" stroke="#475569" stroke-width="2" stroke-linecap="round" marker-end="url(#a475569)"/>
<rect x="60.0" y="240.0" width="680.0" height="60.0" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
<text x="400.0" y="258.5" font-size="17" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">= GROSS PROFIT</text>
<text x="400.0" y="281.5" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">trading section ends here</text>
<line x1="400.0" y1="226.0" x2="400.0" y2="234.0" stroke="#475569" stroke-width="2" stroke-linecap="round" marker-end="url(#a475569)"/>
<rect x="60.0" y="320.0" width="680.0" height="60.0" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
<text x="400.0" y="338.5" font-size="17" fill="#7c3aed" text-anchor="middle" dominant-baseline="middle" font-weight="bold">+ Other income − Expenses</text>
<text x="400.0" y="361.5" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">discount received, rent received; wages, rent, depreciation, carriage out</text>
<line x1="400.0" y1="306.0" x2="400.0" y2="314.0" stroke="#475569" stroke-width="2" stroke-linecap="round" marker-end="url(#a475569)"/>
<rect x="60.0" y="400.0" width="680.0" height="60.0" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
<text x="400.0" y="418.5" font-size="17" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">= NET PROFIT</text>
<text x="400.0" y="441.5" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">added to capital in the statement of financial position</text>
<line x1="400.0" y1="386.0" x2="400.0" y2="394.0" stroke="#475569" stroke-width="2" stroke-linecap="round" marker-end="url(#a475569)"/>
</svg>
