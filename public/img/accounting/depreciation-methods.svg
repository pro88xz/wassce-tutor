<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Straight-line and reducing-balance depreciation compared</title>
<desc id="d">Graph of the carrying amount of a machine costing NLe 100,000 over five years. Under the straight-line method at 20% of cost a year, the carrying amount falls by the same NLe 20,000 each year: 100,000, 80,000, 60,000, 40,000, 20,000 and 0. Under the reducing-balance method at 30% a year, the charge is largest in the first year and gets smaller: 100,000, 70,000, 49,000, 34,300, 24,010 and 16,807.</desc>
<defs></defs>
<rect width="800" height="470" rx="20" fill="#f8fafc"/>
<text x="400.0" y="34.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Carrying amount of a NLe 100,000 machine</text>
<line x1="110.0" y1="400.0" x2="720.0" y2="400.0" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
<line x1="110.0" y1="400.0" x2="110.0" y2="90.0" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
<text x="110.0" y="420.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Start</text>
<line x1="110.0" y1="400.0" x2="110.0" y2="100.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/>
