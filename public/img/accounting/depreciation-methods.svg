<text x="100.0" y="340.0" font-size="12" fill="#475569" text-anchor="end" dominant-baseline="middle" font-weight="normal">20,000</text>
<line x1="110.0" y1="340.0" x2="710.0" y2="340.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/>
