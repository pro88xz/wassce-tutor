<line x1="230.0" y1="400.0" x2="230.0" y2="100.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/>
<text x="350.0" y="420.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Year 2</text>
<line x1="350.0" y1="400.0" x2="350.0" y2="100.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/>
<text x="470.0" y="420.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Year 3</text>
<line x1="470.0" y1="400.0" x2="470.0" y2="100.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/>
<text x="590.0" y="420.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Year 4</text>
<line x1="590.0" y1="400.0" x2="590.0" y2="100.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/>
