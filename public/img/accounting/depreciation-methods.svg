<text x="522.0" y="110.0" font-size="13" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">straight line, 20% of cost</text>
<line x1="484.0" y1="136.0" x2="514.0" y2="136.0" stroke="#ea580c" stroke-width="3.5" stroke-linecap="round"/>
<text x="522.0" y="136.0" font-size="13" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">reducing balance, 30%</text>
<text x="400.0" y="450.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Straight line: equal charge each year.  Reducing balance: highest charge in year 1, never reaches zero.</text>
