<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The road to peace in Sierra Leone, 1996–2002</title>
<desc id="d">Flow diagram of the peace process: the Abidjan Peace Accord, November 1996; the AFRC coup, May 1997; the Conakry Peace Plan, October 1997; ECOMOG restores President Kabbah, February to March 1998; the invasion of Freetown, January 1999; the Lomé Peace Agreement, July 1999; the UN mission UNAMSIL, from October 1999; the hostage crisis and British intervention, May 2000; the Abuja ceasefire agreements, 2000 to 2001, and disarmament; and the end of the war on 18 January 2002, followed by elections in May 2002, the Truth and Reconciliation Commission and the Special Court.</desc>
<defs><marker id="a0f172a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f172a"/></marker><marker id="a0f172as" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#0f172a"/></marker></defs>
<rect width="800" height="700" rx="20" fill="#f8fafc"/>
<text x="400.0" y="34.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">The long road to peace, 1996–2002</text>
