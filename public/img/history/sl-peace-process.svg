<line x1="140.0" y1="294.0" x2="140.0" y2="336.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<line x1="261.0" y1="380.0" x2="279.0" y2="380.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a0f172a)"/>
