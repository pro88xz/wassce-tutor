<text x="205.0" y="120.0" font-size="16" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Governor</text>
<rect x="40.0" y="173.0" width="330.0" height="54.0" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
