<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">British indirect rule and French direct rule compared</title>
<desc id="d">Two chains of authority. British indirect rule: the Governor, then Residents or District Commissioners, then the Native Authority of traditional chiefs, then district and village heads, then the people; chiefs kept their positions and ruled through local custom under British supervision. French direct rule: the Governor-General of French West Africa at Dakar, then Lieutenant-Governors of each colony, then commandants of districts (cercles), then appointed canton and village chiefs, then the people; chiefs became agents of the French administration.</desc>
<defs><marker id="a475569" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker><marker id="a475569s" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#475569"/></marker></defs>
