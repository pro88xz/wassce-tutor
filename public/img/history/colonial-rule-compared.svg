<text x="205.0" y="70.0" font-size="17" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="bold">BRITISH: indirect rule</text>
<text x="595.0" y="70.0" font-size="17" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">FRENCH: direct rule</text>
