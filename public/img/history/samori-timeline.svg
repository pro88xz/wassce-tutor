<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Samori Toure&#x27;s resistance to the French</title>
<desc id="d">Timeline: Samori Toure born about 1830; in the 1870s he builds the Mandinka empire with its capital at Bissandugu; first clash with the French at Kenieba-Koura in 1882; takes the title Almami in 1884; treaties with France in 1886 and 1887; the French take Kankan and Bissandugu in 1891 and Samori retreats using scorched-earth tactics; from 1892 he builds a second empire further east; captured at Guelemou on 29 September 1898 and exiled to Gabon, where he died in 1900.</desc>
<defs></defs>
<rect width="800" height="640" rx="20" fill="#f8fafc"/>
<text x="400.0" y="34.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Samori Toure: seventeen years of resistance</text>
<line x1="170.0" y1="78.0" x2="170.0" y2="596.0" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
<circle cx="170.0" cy="92.0" r="9.0" fill="#0f172a" stroke="#ffffff" stroke-width="2.5"/>
<text x="148.0" y="92.0" font-size="19" fill="#0f172a" text-anchor="end" dominant-baseline="middle" font-weight="bold">c. 1830</text>
<text x="194.0" y="80.5" font-size="18" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Samori Toure is born</text>
<text x="194.0" y="103.5" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">Mandinka trader&#x27;s son, in present-day Guinea</text>
<circle cx="170.0" cy="162.0" r="9.0" fill="#15803d" stroke="#ffffff" stroke-width="2.5"/>
<text x="148.0" y="162.0" font-size="19" fill="#15803d" text-anchor="end" dominant-baseline="middle" font-weight="bold">1870s</text>
<text x="194.0" y="150.5" font-size="18" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Builds the Mandinka (Wassoulou) empire</text>
<text x="194.0" y="173.5" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">capital at Bissandugu; a strong standing army</text>
<circle cx="170.0" cy="232.0" r="9.0" fill="#dc2626" stroke="#ffffff" stroke-width="2.5"/>
<text x="148.0" y="232.0" font-size="19" fill="#dc2626" text-anchor="end" dominant-baseline="middle" font-weight="bold">1882</text>
<text x="194.0" y="220.5" font-size="18" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">First clash with the French</text>
<text x="194.0" y="243.5" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">at Kenieba-Koura</text>
<circle cx="170.0" cy="302.0" r="9.0" fill="#15803d" stroke="#ffffff" stroke-width="2.5"/>
<text x="148.0" y="302.0" font-size="19" fill="#15803d" text-anchor="end" dominant-baseline="middle" font-weight="bold">1884</text>
<text x="194.0" y="290.5" font-size="18" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Takes the title Almami</text>
<text x="194.0" y="313.5" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">religious and political leader</text>
<circle cx="170.0" cy="372.0" r="9.0" fill="#2563eb" stroke="#ffffff" stroke-width="2.5"/>
<text x="148.0" y="372.0" font-size="19" fill="#2563eb" text-anchor="end" dominant-baseline="middle" font-weight="bold">1886–87</text>
<text x="194.0" y="360.5" font-size="18" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Treaties with France</text>
<text x="194.0" y="383.5" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">Kenieba-Koura (1886) and Bissandugu (1887)</text>
<circle cx="170.0" cy="442.0" r="9.0" fill="#dc2626" stroke="#ffffff" stroke-width="2.5"/>
<text x="148.0" y="442.0" font-size="19" fill="#dc2626" text-anchor="end" dominant-baseline="middle" font-weight="bold">1891</text>
<text x="194.0" y="430.5" font-size="18" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">French take Kankan and Bissandugu</text>
<text x="194.0" y="453.5" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">Samori retreats, burning the land behind him</text>
<circle cx="170.0" cy="512.0" r="9.0" fill="#ea580c" stroke="#ffffff" stroke-width="2.5"/>
<text x="148.0" y="512.0" font-size="19" fill="#ea580c" text-anchor="end" dominant-baseline="middle" font-weight="bold">1892–98</text>
<text x="194.0" y="500.5" font-size="18" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Builds a second empire to the east</text>
<text x="194.0" y="523.5" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">in present-day Côte d&#x27;Ivoire and Ghana</text>
<circle cx="170.0" cy="582.0" r="9.0" fill="#dc2626" stroke="#ffffff" stroke-width="2.5"/>
<text x="148.0" y="582.0" font-size="19" fill="#dc2626" text-anchor="end" dominant-baseline="middle" font-weight="bold">1898</text>
<text x="194.0" y="570.5" font-size="18" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Captured at Guelemou, 29 September</text>
<text x="194.0" y="593.5" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">exiled to Gabon; dies in 1900</text>
</svg>
