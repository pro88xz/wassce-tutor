<text x="400.0" y="410.0" font-size="15" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="bold">2. enslaved Africans</text>
<rect x="324.2" y="422.5" width="151.6" height="19.0" rx="4" fill="#f8fafc" stroke="none" stroke-width="0" opacity="0.92"/>
<text x="400.0" y="432.0" font-size="13" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="normal">(the Middle Passage)</text>
<line x1="170.0" y1="318.0" x2="290.0" y2="150.0" stroke="#15803d" stroke-width="4" stroke-linecap="round" marker-end="url(#a15803d)"/>
<rect x="60.4" y="215.0" width="139.3" height="20.0" rx="4" fill="#f8fafc" stroke="none" stroke-width="0" opacity="0.92"/>
<text x="130.0" y="225.0" font-size="14" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">3. sugar, cotton,</text>
<rect x="48.6" y="236.0" width="162.8" height="20.0" rx="4" fill="#f8fafc" stroke="none" stroke-width="0" opacity="0.92"/>
<text x="130.0" y="246.0" font-size="14" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">tobacco, rum, coffee</text>
</svg>
