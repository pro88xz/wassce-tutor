<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">How the Second World War changed Africa</title>
<desc id="d">Diagram: the Second World War of 1939 to 1945 led to six changes. West African soldiers fought in Burma and elsewhere and came home as ex-servicemen; the Atlantic Charter of 1941 spoke of the right of all peoples to choose their government; Britain and France were weakened; the USA and USSR opposed old-style colonialism; the United Nations Charter of 1945 supported self-determination; and wartime shortages, price controls and unfair produce marketing caused hardship. Together these strengthened demands for independence, seen in the Accra riots of 1948 and new mass parties.</desc>
<defs><marker id="a475569" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker><marker id="a475569s" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#475569"/></marker></defs>
