<text x="400.0" y="34.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">How the Second World War changed Africa</text>
<rect x="190.0" y="70.0" width="420.0" height="60.0" rx="12" fill="#e2e8f0" stroke="#0f172a" stroke-width="2.5"/>
<text x="400.0" y="100.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">SECOND WORLD WAR, 1939–1945</text>
<rect x="90.0" y="505.0" width="620.0" height="70.0" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
<text x="400.0" y="528.0" font-size="18" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Stronger demands for independence</text>
<text x="400.0" y="552.0" font-size="16" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Accra riots (1948), mass parties, independence from 1957</text>
<rect x="32.0" y="148.0" width="236.0" height="104.0" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
<text x="150.0" y="178.0" font-size="16" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">African soldiers</text>
<text x="150.0" y="200.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">fought in Burma; came</text>
<text x="150.0" y="222.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">home as ex-servicemen</text>
<line x1="150.0" y1="130.0" x2="150.0" y2="144.0" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
<rect x="282.0" y="148.0" width="236.0" height="104.0" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="400.0" y="178.0" font-size="16" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Atlantic Charter (1941)</text>
<text x="400.0" y="200.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">the right of peoples to</text>
<text x="400.0" y="222.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">choose their government</text>
<line x1="400.0" y1="136.0" x2="400.0" y2="142.0" stroke="#475569" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a475569)"/>
<rect x="532.0" y="148.0" width="236.0" height="104.0" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
<text x="650.0" y="178.0" font-size="16" fill="#7c3aed" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Europe weakened</text>
<text x="650.0" y="200.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Britain and France</text>
<text x="650.0" y="222.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">exhausted and in debt</text>
<line x1="650.0" y1="130.0" x2="650.0" y2="144.0" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
<rect x="32.0" y="308.0" width="236.0" height="104.0" rx="12" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/>
<text x="150.0" y="338.0" font-size="16" fill="#0f766e" text-anchor="middle" dominant-baseline="middle" font-weight="bold">New superpowers</text>
<text x="150.0" y="360.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">USA and USSR opposed</text>
<text x="150.0" y="382.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">old-style colonialism</text>
<line x1="150.0" y1="418.0" x2="400.0" y2="499.0" stroke="#475569" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a475569)"/>
<rect x="282.0" y="308.0" width="236.0" height="104.0" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
<text x="400.0" y="338.0" font-size="16" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">United Nations (1945)</text>
<text x="400.0" y="360.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Charter supported</text>
<text x="400.0" y="382.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">self-determination</text>
<line x1="400.0" y1="418.0" x2="400.0" y2="499.0" stroke="#475569" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a475569)"/>
<rect x="532.0" y="308.0" width="236.0" height="104.0" rx="12" fill="#fef3c7" stroke="#ea580c" stroke-width="2.5"/>
<text x="650.0" y="338.0" font-size="16" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Economic hardship</text>
<text x="650.0" y="360.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">shortages, price controls,</text>
<text x="650.0" y="382.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">unfair produce buying</text>
<line x1="650.0" y1="418.0" x2="400.0" y2="499.0" stroke="#475569" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a475569)"/>
