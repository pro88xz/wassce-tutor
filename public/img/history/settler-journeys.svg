<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Four journeys to Freetown</title>
<desc id="d">Schematic diagram, not to scale, of the four main groups who settled in Freetown: the Black Poor sailed from London in 1787; Black Loyalists who had sided with Britain in the American Revolution were moved to Nova Scotia in 1783 and sailed from Halifax to Freetown in 1792; the Jamaican Maroons were deported from Jamaica to Nova Scotia in 1796 and brought to Freetown in 1800; and from 1808 the Royal Navy landed Liberated Africans freed from slave ships off the West African coast.</desc>
<defs><marker id="a0f172a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f172a"/></marker><marker id="a0f172as" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#0f172a"/></marker><marker id="a2563eb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a2563ebs" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#2563eb"/></marker><marker id="adc2626" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="adc2626s" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#dc2626"/></marker><marker id="aea580c" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#ea580c"/></marker><marker id="aea580cs" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#ea580c"/></marker></defs>
<rect width="800" height="620" rx="20" fill="#f8fafc"/>
<text x="400.0" y="34.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Four journeys to Freetown (not to scale)</text>
<rect x="35.0" y="80.0" width="230.0" height="60.0" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="150.0" y="98.5" font-size="17" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">NOVA SCOTIA</text>
<text x="150.0" y="121.5" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Halifax, Canada</text>
<rect x="20.0" y="270.0" width="200.0" height="60.0" rx="12" fill="#e2e8f0" stroke="#0f172a" stroke-width="2.5"/>
<text x="120.0" y="289.0" font-size="16" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">AMERICAN COLONIES</text>
<text x="120.0" y="311.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Black Loyalists</text>
<rect x="285.0" y="510.0" width="230.0" height="60.0" rx="12" fill="#fef3c7" stroke="#ea580c" stroke-width="2.5"/>
<text x="400.0" y="528.5" font-size="17" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">JAMAICA</text>
<text x="400.0" y="551.5" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Trelawny Town Maroons</text>
<rect x="525.0" y="80.0" width="230.0" height="60.0" rx="12" fill="#e2e8f0" stroke="#0f172a" stroke-width="2.5"/>
<text x="640.0" y="98.5" font-size="17" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">LONDON</text>
<text x="640.0" y="121.5" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">the Black Poor</text>
<rect x="525.0" y="365.0" width="230.0" height="70.0" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
<text x="640.0" y="387.5" font-size="19" fill="#7c3aed" text-anchor="middle" dominant-baseline="middle" font-weight="bold">FREETOWN</text>
<text x="640.0" y="412.5" font-size="17" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Sierra Leone</text>
<rect x="540.0" y="532.0" width="240.0" height="56.0" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
<text x="660.0" y="549.5" font-size="15" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Slave ships captured at sea</text>
<text x="660.0" y="570.5" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">by the Royal Navy</text>
<line x1="120.0" y1="264.0" x2="150.0" y2="146.0" stroke="#0f172a" stroke-width="3" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<rect x="152.0" y="194.5" width="132.0" height="21.0" rx="4" fill="#f8fafc" stroke="none" stroke-width="0" opacity="0.92"/>
<text x="152.0" y="205.0" font-size="15" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">1783: evacuated</text>
<line x1="400.0" y1="504.0" x2="150.0" y2="146.0" stroke="#ea580c" stroke-width="3" stroke-linecap="round" marker-end="url(#aea580c)"/>
<rect x="-3.0" y="-10.5" width="6.0" height="21.0" rx="4" fill="#f8fafc" stroke="none" stroke-width="0" opacity="0.92"/>
<text x="0.0" y="0.0" font-size="15" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold"></text>
<rect x="292.0" y="341.5" width="123.6" height="21.0" rx="4" fill="#f8fafc" stroke="none" stroke-width="0" opacity="0.92"/>
<text x="292.0" y="352.0" font-size="15" fill="#ea580c" text-anchor="start" dominant-baseline="middle" font-weight="bold">1796: deported</text>
<line x1="640.0" y1="146.0" x2="640.0" y2="359.0" stroke="#0f172a" stroke-width="3" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<rect x="574.0" y="239.5" width="132.0" height="21.0" rx="4" fill="#f8fafc" stroke="none" stroke-width="0" opacity="0.92"/>
<text x="640.0" y="250.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">1787: about 400</text>
<line x1="150.0" y1="146.0" x2="640.0" y2="359.0" stroke="#2563eb" stroke-width="3" stroke-linecap="round" marker-end="url(#a2563eb)"/>
<rect x="261.8" y="225.5" width="266.4" height="21.0" rx="4" fill="#f8fafc" stroke="none" stroke-width="0" opacity="0.92"/>
<text x="395.0" y="236.0" font-size="15" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">1792: about 1,190 Nova Scotians</text>
<rect x="295.4" y="289.5" width="199.2" height="21.0" rx="4" fill="#f8fafc" stroke="none" stroke-width="0" opacity="0.92"/>
<text x="395.0" y="300.0" font-size="15" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">1800: about 550 Maroons</text>
<line x1="660.0" y1="526.0" x2="640.0" y2="441.0" stroke="#dc2626" stroke-width="3" stroke-linecap="round" marker-end="url(#adc2626)"/>
<rect x="-3.0" y="-10.5" width="6.0" height="21.0" rx="4" fill="#f8fafc" stroke="none" stroke-width="0" opacity="0.92"/>
<text x="0.0" y="0.0" font-size="15" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="bold"></text>
<rect x="681.6" y="467.5" width="98.4" height="21.0" rx="4" fill="#f8fafc" stroke="none" stroke-width="0" opacity="0.92"/>
<text x="780.0" y="478.0" font-size="15" fill="#dc2626" text-anchor="end" dominant-baseline="middle" font-weight="bold">1808–1860s:</text>
<rect x="622.8" y="487.5" width="157.2" height="21.0" rx="4" fill="#f8fafc" stroke="none" stroke-width="0" opacity="0.92"/>
<text x="780.0" y="498.0" font-size="15" fill="#dc2626" text-anchor="end" dominant-baseline="middle" font-weight="bold">Liberated Africans</text>
</svg>
