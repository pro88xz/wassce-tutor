<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Sierra Leone in the international community</title>
<desc id="d">Diagram of the international organisations Sierra Leone belongs to: the United Nations (joined 27 September 1961), the Commonwealth (1961), the Organisation of African Unity (founding member, 1963) and its successor the African Union (2002), the Mano River Union (founding member, 1973), the Economic Community of West African States (founding member, 1975), the Non-Aligned Movement, and the Organisation of Islamic Cooperation.</desc>
