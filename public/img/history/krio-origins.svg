<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Where the Krio came from</title>
<desc id="d">Diagram: four groups of settlers joined to form the Krio people of Sierra Leone: the Black Poor from London (1787), the Nova Scotians, formerly enslaved Black Loyalists who arrived from Canada in 1792, the Jamaican Maroons (1800), and the Liberated Africans or recaptives, freed from slave ships by the Royal Navy and landed at Freetown from 1808 to the 1860s, who became the largest group. Krio culture combined the Krio language, Christianity and Islam, Western education, and trade and the professions.</desc>
<defs><marker id="a475569" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker><marker id="a475569s" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#475569"/></marker></defs>
<rect width="800" height="560" rx="20" fill="#f8fafc"/>
