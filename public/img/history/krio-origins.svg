<text x="140.0" y="462.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">English-based, with</text>
<text x="140.0" y="484.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Yoruba and other words</text>
<line x1="400.0" y1="344.0" x2="140.0" y2="404.0" stroke="#475569" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a475569)"/>
<rect x="282.0" y="410.0" width="236.0" height="104.0" rx="12" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
<text x="400.0" y="440.0" font-size="16" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Religion</text>
<text x="400.0" y="462.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">mostly Christian;</text>
<text x="400.0" y="484.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Muslim Krio (Aku)</text>
<line x1="400.0" y1="344.0" x2="400.0" y2="404.0" stroke="#475569" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a475569)"/>
<rect x="542.0" y="410.0" width="236.0" height="104.0" rx="12" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
<text x="660.0" y="440.0" font-size="16" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Education and work</text>
<text x="660.0" y="462.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">teachers, clergy, lawyers,</text>
<text x="660.0" y="484.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">doctors, traders</text>
<line x1="400.0" y1="344.0" x2="660.0" y2="404.0" stroke="#475569" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a475569)"/>
