<text x="400.0" y="286.5" font-size="21" fill="#7c3aed" text-anchor="middle" dominant-baseline="middle" font-weight="bold">THE KRIO</text>
<text x="400.0" y="313.5" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Freetown and the Colony villages</text>
