<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">How the Sokoto Caliphate was organised</title>
<desc id="d">Diagram of the Sokoto Caliphate. At the top, Usman dan Fodio, Amir al-Mu&#x27;minin or Commander of the Faithful. From 1812 the caliphate was run in two halves: the eastern emirates, such as Kano, Katsina, Zaria, Bauchi, Adamawa, Gombe, Hadejia and Katagum, under Muhammad Bello at Sokoto; and the western emirates, such as Ilorin, Nupe, Agaie and Lapai, under Abdullahi at Gwandu. Each emirate was ruled by an emir who received a flag from the caliph, kept Islamic courts and paid tribute.</desc>
<defs><marker id="a475569" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker><marker id="a475569s" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#475569"/></marker></defs>
<rect width="800" height="560" rx="20" fill="#f8fafc"/>
<text x="400.0" y="34.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">How the Sokoto Caliphate was organised</text>
<rect x="120.0" y="73.0" width="560.0" height="70.0" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
<text x="400.0" y="96.0" font-size="18" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Usman dan Fodio</text>
<text x="400.0" y="120.0" font-size="16" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Amir al-Mu&#x27;minin (Commander of the Faithful)</text>
<rect x="40.0" y="201.0" width="340.0" height="70.0" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="210.0" y="224.5" font-size="17" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">SOKOTO (east)</text>
<text x="210.0" y="247.5" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Muhammad Bello, his son</text>
<rect x="420.0" y="201.0" width="340.0" height="70.0" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
<text x="590.0" y="224.5" font-size="17" fill="#7c3aed" text-anchor="middle" dominant-baseline="middle" font-weight="bold">GWANDU (west)</text>
<text x="590.0" y="247.5" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Abdullahi, his brother</text>
<rect x="40.0" y="312.0" width="340.0" height="104.0" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
<text x="210.0" y="331.0" font-size="16" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Eastern emirates</text>
<text x="210.0" y="353.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Kano · Katsina · Zaria</text>
<text x="210.0" y="375.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Bauchi · Adamawa · Gombe</text>
<text x="210.0" y="397.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Hadejia · Katagum and others</text>
<rect x="420.0" y="312.0" width="340.0" height="104.0" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5"/>
<text x="590.0" y="342.0" font-size="16" fill="#7c3aed" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Western emirates</text>
<text x="590.0" y="364.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Ilorin · Nupe (Bida)</text>
<text x="590.0" y="386.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Agaie · Lapai and others</text>
<line x1="400.0" y1="149.0" x2="210.0" y2="195.0" stroke="#475569" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a475569)"/>
<line x1="400.0" y1="149.0" x2="590.0" y2="195.0" stroke="#475569" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a475569)"/>
<line x1="210.0" y1="277.0" x2="210.0" y2="306.0" stroke="#475569" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a475569)"/>
<line x1="590.0" y1="277.0" x2="590.0" y2="306.0" stroke="#475569" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a475569)"/>
<rect x="30.0" y="452.0" width="740.0" height="64.0" rx="12" fill="#fef3c7" stroke="#0f172a" stroke-width="2.5"/>
<text x="400.0" y="473.5" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Each emir: a flag from the caliph, Islamic courts (alkali) and tribute to Sokoto or Gwandu</text>
<text x="400.0" y="494.5" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">From 1812 the caliphate was run in two halves; Bello became caliph in 1817.</text>
</svg>
