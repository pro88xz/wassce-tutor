<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Europeans on the West African coast, 1440s to 1670s</title>
<desc id="d">Timeline: Portuguese sailors reach the Senegal coast in the 1440s; Pedro de Sintra names Sierra Leone in 1462; the Portuguese build Elmina Castle in 1482; the Dutch capture Elmina in 1637; the English take Cape Coast Castle in 1664; and English traders build a fort on Bunce Island in the Sierra Leone River around 1670.</desc>
<defs></defs>
<rect width="800" height="470" rx="20" fill="#f8fafc"/>
<text x="400.0" y="34.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Europeans on the West African coast</text>
<line x1="140.0" y1="78.0" x2="140.0" y2="436.0" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
<circle cx="140.0" cy="92.0" r="9.0" fill="#2563eb" stroke="#ffffff" stroke-width="2.5"/>
<text x="118.0" y="92.0" font-size="19" fill="#2563eb" text-anchor="end" dominant-baseline="middle" font-weight="bold">1440s</text>
<text x="164.0" y="80.5" font-size="18" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Portuguese sailors reach the Senegal coast</text>
<text x="164.0" y="103.5" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">the start of direct sea trade with West Africa</text>
<circle cx="140.0" cy="158.0" r="9.0" fill="#15803d" stroke="#ffffff" stroke-width="2.5"/>
<text x="118.0" y="158.0" font-size="19" fill="#15803d" text-anchor="end" dominant-baseline="middle" font-weight="bold">1462</text>
<text x="164.0" y="146.5" font-size="18" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Pedro de Sintra names Sierra Leone</text>
<text x="164.0" y="169.5" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">&#x27;Serra Leoa&#x27;, the lion mountains</text>
<circle cx="140.0" cy="224.0" r="9.0" fill="#2563eb" stroke="#ffffff" stroke-width="2.5"/>
<text x="118.0" y="224.0" font-size="19" fill="#2563eb" text-anchor="end" dominant-baseline="middle" font-weight="bold">1482</text>
<text x="164.0" y="212.5" font-size="18" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Portuguese build Elmina Castle</text>
<text x="164.0" y="235.5" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">on the Gold Coast, to control the gold trade</text>
<circle cx="140.0" cy="290.0" r="9.0" fill="#ea580c" stroke="#ffffff" stroke-width="2.5"/>
<text x="118.0" y="290.0" font-size="19" fill="#ea580c" text-anchor="end" dominant-baseline="middle" font-weight="bold">1637</text>
<text x="164.0" y="278.5" font-size="18" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">The Dutch capture Elmina</text>
<text x="164.0" y="301.5" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">Portugal&#x27;s monopoly is broken</text>
<circle cx="140.0" cy="356.0" r="9.0" fill="#dc2626" stroke="#ffffff" stroke-width="2.5"/>
<text x="118.0" y="356.0" font-size="19" fill="#dc2626" text-anchor="end" dominant-baseline="middle" font-weight="bold">1664</text>
<text x="164.0" y="344.5" font-size="18" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">The English take Cape Coast Castle</text>
<text x="164.0" y="367.5" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">which becomes their Gold Coast headquarters</text>
<circle cx="140.0" cy="422.0" r="9.0" fill="#7c3aed" stroke="#ffffff" stroke-width="2.5"/>
<text x="118.0" y="422.0" font-size="19" fill="#7c3aed" text-anchor="end" dominant-baseline="middle" font-weight="bold">c. 1670</text>
<text x="164.0" y="410.5" font-size="18" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">English traders fortify Bunce Island</text>
<text x="164.0" y="433.5" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">in the Sierra Leone River estuary</text>
</svg>
