<text x="40.0" y="270.0" font-size="17" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">•  People: British subjects</text>
<text x="430.0" y="270.0" font-size="17" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">•  People: British-protected persons</text>
<text x="40.0" y="318.0" font-size="17" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">•  English law and courts</text>
<text x="430.0" y="318.0" font-size="17" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">•  five districts under District</text>
<text x="40.0" y="366.0" font-size="17" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">•  Legislative Council from 1863</text>
<text x="452.0" y="366.0" font-size="17" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">Commissioners (DCs)</text>
<text x="40.0" y="414.0" font-size="17" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">•  Freetown City Council, 1893</text>
<text x="430.0" y="414.0" font-size="17" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">•  paramount chiefs; customary law</text>
<text x="40.0" y="462.0" font-size="17" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">•  Krio, settlers and others</text>
<text x="430.0" y="462.0" font-size="17" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">•  hut tax from 1898</text>
