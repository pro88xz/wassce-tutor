<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The Colony and the Protectorate of Sierra Leone after 1896</title>
<desc id="d">Diagram comparing the two parts of Sierra Leone under one Governor after 1896. The Colony, made up of Freetown, the peninsula, Sherbro and other coastal areas, whose people were British subjects under English law, with a Legislative Council from 1863. The Protectorate, the hinterland declared on 31 August 1896, whose people were British-protected persons, divided into five districts (Karene, Ronietta, Bandajuma, Panguma and Koinadugu) under District Commissioners, ruled through paramount chiefs and customary law, and taxed by the hut tax from 1898.</desc>
<defs><marker id="a475569" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker><marker id="a475569s" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#475569"/></marker></defs>
