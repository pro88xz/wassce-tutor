<text x="595.0" y="183.5" font-size="19" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">THE PROTECTORATE</text>
<text x="595.0" y="208.5" font-size="17" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">the hinterland, from 31 August 1896</text>
