<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 740" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Sierra Leone&#x27;s road to independence, 1946–1961</title>
<desc id="d">Timeline: 1946, Protectorate Assembly set up; 1947, Governor Stevenson proposes a new constitution; 1950, Colony leaders form the NCSL; 1951, the SLPP is formed, the Stevenson Constitution introduced and the SLPP wins the elections; 1953, African ministers, with Milton Margai Chief Minister from 1954; 1955, strikes and riots in Freetown and later in the north; 1957, elections to the new House of Representatives; 1958, Margai becomes Premier and the PNP is formed; 1960, the Lancaster House conference and the founding of the APC; 27 April 1961, independence.</desc>
<defs></defs>
<rect width="800" height="740" rx="20" fill="#f8fafc"/>
<text x="400.0" y="34.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Sierra Leone&#x27;s road to independence, 1946–1961</text>
<line x1="150.0" y1="76.0" x2="150.0" y2="698.0" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
<circle cx="150.0" cy="90.0" r="9.0" fill="#0f172a" stroke="#ffffff" stroke-width="2.5"/>
<text x="128.0" y="90.0" font-size="19" fill="#0f172a" text-anchor="end" dominant-baseline="middle" font-weight="bold">1946</text>
<text x="174.0" y="78.5" font-size="18" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Protectorate Assembly set up</text>
<text x="174.0" y="101.5" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">a voice for the Protectorate</text>
<circle cx="150.0" cy="156.0" r="9.0" fill="#2563eb" stroke="#ffffff" stroke-width="2.5"/>
<text x="128.0" y="156.0" font-size="19" fill="#2563eb" text-anchor="end" dominant-baseline="middle" font-weight="bold">1947</text>
<text x="174.0" y="144.5" font-size="18" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Stevenson proposals</text>
<text x="174.0" y="167.5" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">African majority in the Legislative Council</text>
<circle cx="150.0" cy="222.0" r="9.0" fill="#7c3aed" stroke="#ffffff" stroke-width="2.5"/>
<text x="128.0" y="222.0" font-size="19" fill="#7c3aed" text-anchor="end" dominant-baseline="middle" font-weight="bold">1950</text>
<text x="174.0" y="210.5" font-size="18" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">NCSL formed by Colony leaders</text>
<text x="174.0" y="233.5" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">led by Dr H. C. Bankole-Bright</text>
<circle cx="150.0" cy="288.0" r="9.0" fill="#15803d" stroke="#ffffff" stroke-width="2.5"/>
<text x="128.0" y="288.0" font-size="19" fill="#15803d" text-anchor="end" dominant-baseline="middle" font-weight="bold">1951</text>
<text x="174.0" y="276.5" font-size="18" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">SLPP formed; Stevenson Constitution</text>
<text x="174.0" y="299.5" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">SLPP wins; Milton Margai leads</text>
<circle cx="150.0" cy="354.0" r="9.0" fill="#15803d" stroke="#ffffff" stroke-width="2.5"/>
<text x="128.0" y="354.0" font-size="19" fill="#15803d" text-anchor="end" dominant-baseline="middle" font-weight="bold">1953–54</text>
<text x="174.0" y="342.5" font-size="18" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">African ministers</text>
<text x="174.0" y="365.5" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">Margai becomes Chief Minister (1954)</text>
<circle cx="150.0" cy="420.0" r="9.0" fill="#dc2626" stroke="#ffffff" stroke-width="2.5"/>
<text x="128.0" y="420.0" font-size="19" fill="#dc2626" text-anchor="end" dominant-baseline="middle" font-weight="bold">1955</text>
<text x="174.0" y="408.5" font-size="18" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Strike and riots in Freetown</text>
<text x="174.0" y="431.5" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">tax riots in the north, 1955–56</text>
<circle cx="150.0" cy="486.0" r="9.0" fill="#2563eb" stroke="#ffffff" stroke-width="2.5"/>
<text x="128.0" y="486.0" font-size="19" fill="#2563eb" text-anchor="end" dominant-baseline="middle" font-weight="bold">1957</text>
<text x="174.0" y="474.5" font-size="18" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Elections to the House of Representatives</text>
<text x="174.0" y="497.5" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">most members directly elected</text>
<circle cx="150.0" cy="552.0" r="9.0" fill="#ea580c" stroke="#ffffff" stroke-width="2.5"/>
<text x="128.0" y="552.0" font-size="19" fill="#ea580c" text-anchor="end" dominant-baseline="middle" font-weight="bold">1958</text>
<text x="174.0" y="540.5" font-size="18" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Margai becomes Premier</text>
<text x="174.0" y="563.5" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">Albert Margai and Siaka Stevens form the PNP</text>
<circle cx="150.0" cy="618.0" r="9.0" fill="#ea580c" stroke="#ffffff" stroke-width="2.5"/>
<text x="128.0" y="618.0" font-size="19" fill="#ea580c" text-anchor="end" dominant-baseline="middle" font-weight="bold">1960</text>
<text x="174.0" y="606.5" font-size="18" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Lancaster House conference, London</text>
<text x="174.0" y="629.5" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">Stevens refuses to sign; APC formed</text>
<circle cx="150.0" cy="684.0" r="9.0" fill="#15803d" stroke="#ffffff" stroke-width="2.5"/>
<text x="128.0" y="684.0" font-size="19" fill="#15803d" text-anchor="end" dominant-baseline="middle" font-weight="bold">1961</text>
<text x="174.0" y="672.5" font-size="18" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Independence, 27 April</text>
<text x="174.0" y="695.5" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">Sir Milton Margai Prime Minister</text>
</svg>
