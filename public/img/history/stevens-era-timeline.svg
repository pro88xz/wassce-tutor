<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The Siaka Stevens era, 1968–1985</title>
<desc id="d">Timeline: 1968, Siaka Stevens becomes Prime Minister; 1971, a failed coup, Guinean troops invited, and on 19 April Sierra Leone becomes a republic with Stevens as executive President; 1973, the SLPP withdraws from elections; 1977, student demonstrations and a violent election; 1978, the one-party constitution makes the APC the only legal party; 1980, Freetown hosts the OAU summit; 1981, a general strike; 1985, Stevens retires and hands over to Joseph Saidu Momoh.</desc>
<defs></defs>
<rect width="800" height="700" rx="20" fill="#f8fafc"/>
<text x="400.0" y="34.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">The Siaka Stevens era, 1968–1985</text>
<line x1="140.0" y1="78.0" x2="140.0" y2="624.0" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
<circle cx="140.0" cy="92.0" r="9.0" fill="#7c3aed" stroke="#ffffff" stroke-width="2.5"/>
<text x="118.0" y="92.0" font-size="19" fill="#7c3aed" text-anchor="end" dominant-baseline="middle" font-weight="bold">1968</text>
<text x="164.0" y="80.5" font-size="18" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Stevens becomes Prime Minister</text>
<text x="164.0" y="103.5" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">after the Sergeants&#x27; revolt</text>
<circle cx="140.0" cy="166.0" r="9.0" fill="#dc2626" stroke="#ffffff" stroke-width="2.5"/>
<text x="118.0" y="166.0" font-size="19" fill="#dc2626" text-anchor="end" dominant-baseline="middle" font-weight="bold">1971</text>
<text x="164.0" y="154.5" font-size="18" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Failed coup; Guinean troops invited</text>
<text x="164.0" y="177.5" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">Republic, 19 April; Stevens President</text>
<circle cx="140.0" cy="240.0" r="9.0" fill="#ea580c" stroke="#ffffff" stroke-width="2.5"/>
<text x="118.0" y="240.0" font-size="19" fill="#ea580c" text-anchor="end" dominant-baseline="middle" font-weight="bold">1973</text>
<text x="164.0" y="228.5" font-size="18" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">General election</text>
<text x="164.0" y="251.5" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">SLPP withdraws amid violence</text>
<circle cx="140.0" cy="314.0" r="9.0" fill="#dc2626" stroke="#ffffff" stroke-width="2.5"/>
<text x="118.0" y="314.0" font-size="19" fill="#dc2626" text-anchor="end" dominant-baseline="middle" font-weight="bold">1977</text>
<text x="164.0" y="302.5" font-size="18" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Student demonstrations</text>
<text x="164.0" y="325.5" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">followed by a violent election</text>
<circle cx="140.0" cy="388.0" r="9.0" fill="#dc2626" stroke="#ffffff" stroke-width="2.5"/>
<text x="118.0" y="388.0" font-size="19" fill="#dc2626" text-anchor="end" dominant-baseline="middle" font-weight="bold">1978</text>
<text x="164.0" y="376.5" font-size="18" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">One-party constitution</text>
<text x="164.0" y="399.5" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">the APC becomes the only legal party</text>
<circle cx="140.0" cy="462.0" r="9.0" fill="#2563eb" stroke="#ffffff" stroke-width="2.5"/>
<text x="118.0" y="462.0" font-size="19" fill="#2563eb" text-anchor="end" dominant-baseline="middle" font-weight="bold">1980</text>
<text x="164.0" y="450.5" font-size="18" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Freetown hosts the OAU summit</text>
<text x="164.0" y="473.5" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">Stevens OAU chairman; huge costs</text>
<circle cx="140.0" cy="536.0" r="9.0" fill="#ea580c" stroke="#ffffff" stroke-width="2.5"/>
<text x="118.0" y="536.0" font-size="19" fill="#ea580c" text-anchor="end" dominant-baseline="middle" font-weight="bold">1981</text>
<text x="164.0" y="524.5" font-size="18" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">General strike</text>
<text x="164.0" y="547.5" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">over prices, pay and shortages</text>
<circle cx="140.0" cy="610.0" r="9.0" fill="#0f172a" stroke="#ffffff" stroke-width="2.5"/>
<text x="118.0" y="610.0" font-size="19" fill="#0f172a" text-anchor="end" dominant-baseline="middle" font-weight="bold">1985</text>
<text x="164.0" y="598.5" font-size="18" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Stevens retires</text>
<text x="164.0" y="621.5" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">hands over to Joseph Saidu Momoh</text>
</svg>
