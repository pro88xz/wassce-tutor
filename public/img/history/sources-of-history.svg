<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Sources of West African history</title>
<desc id="d">Historians use written sources, such as Arabic chronicles and travellers&#x27; accounts, European records and archives, and modern documents; and unwritten sources, such as oral tradition kept by griots and elders, archaeology, linguistics, art and artefacts, ethnography and place names. Each source is checked against others.</desc>
<defs><marker id="a475569" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker><marker id="a475569s" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#475569"/></marker></defs>
<rect width="800" height="470" rx="20" fill="#f8fafc"/>
<text x="400.0" y="34.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">How we know about the past</text>
<rect x="250.0" y="58.0" width="300.0" height="54.0" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
<text x="400.0" y="85.0" font-size="18" fill="#7c3aed" text-anchor="middle" dominant-baseline="middle" font-weight="bold">SOURCES OF HISTORY</text>
<rect x="25.0" y="135.0" width="360.0" height="290.0" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="205.0" y="188.0" font-size="17" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">WRITTEN sources</text>
<text x="205.0" y="211.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal"></text>
<text x="205.0" y="234.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Arabic chronicles and</text>
<text x="205.0" y="257.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">travellers&#x27; accounts</text>
<text x="205.0" y="280.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">(al-Bakri, Ibn Battuta,</text>
<text x="205.0" y="303.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Tarikh al-Sudan)</text>
<text x="205.0" y="326.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">European records:</text>
<text x="205.0" y="349.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">ships&#x27; logs, letters, treaties</text>
<text x="205.0" y="372.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">colonial archives, newspapers</text>
<rect x="415.0" y="135.0" width="360.0" height="290.0" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
<text x="595.0" y="188.0" font-size="17" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">UNWRITTEN sources</text>
<text x="595.0" y="211.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal"></text>
<text x="595.0" y="234.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">oral tradition: griots,</text>
<text x="595.0" y="257.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">elders, praise songs</text>
<text x="595.0" y="280.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">archaeology: digs at sites</text>
<text x="595.0" y="303.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">such as Kumbi Saleh</text>
<text x="595.0" y="326.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">linguistics, place names</text>
<text x="595.0" y="349.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">art and artefacts</text>
<text x="595.0" y="372.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">(Benin bronzes, Ife heads)</text>
<line x1="400.0" y1="118.0" x2="205.0" y2="129.0" stroke="#475569" stroke-width="2" stroke-linecap="round" marker-end="url(#a475569)"/>
<line x1="400.0" y1="118.0" x2="595.0" y2="129.0" stroke="#475569" stroke-width="2" stroke-linecap="round" marker-end="url(#a475569)"/>
</svg>
