<text x="660.0" y="232.0" font-size="16" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Existing system</text>
<text x="660.0" y="254.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">no kings: elders and</text>
<text x="660.0" y="276.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">village assemblies</text>
<rect x="542.0" y="358.0" width="236.0" height="104.0" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
<text x="660.0" y="388.0" font-size="16" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="bold">FAILED</text>
<text x="660.0" y="410.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">warrant chiefs; Aba</text>
