<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Indirect rule in Nigeria: why results differed</title>
<desc id="d">Three columns. Northern Nigeria: emirs already had courts, taxes and officials, so indirect rule worked well and the emirs ran Native Authorities. Western Nigeria: obas were checked by councils of chiefs, so indirect rule partly worked but made obas too powerful and caused protests. Eastern Nigeria: most communities had no kings and were governed by elders and village councils, so the British appointed warrant chiefs; indirect rule failed and led to the Aba Women&#x27;s War of 1929.</desc>
