<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Sierra Leone under the Margais, 1961–1968</title>
<desc id="d">Timeline: 27 April 1961, independence under Sir Milton Margai; September 1961, Sierra Leone joins the United Nations; 1962, the SLPP wins the first general election after independence; 1963, Sierra Leone is a founding member of the OAU; 1964, Sir Milton Margai dies and Albert Margai becomes Prime Minister, and the leone replaces the West African pound; 1966, Albert Margai proposes a one-party state; 1967, the APC wins the election and the army seizes power; 1968, the Sergeants&#x27; revolt restores civilian rule under Siaka Stevens.</desc>
<defs></defs>
<rect width="800" height="640" rx="20" fill="#f8fafc"/>
<text x="400.0" y="34.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Independence and the Margai era, 1961–1968</text>
<line x1="140.0" y1="78.0" x2="140.0" y2="582.0" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
<circle cx="140.0" cy="92.0" r="9.0" fill="#15803d" stroke="#ffffff" stroke-width="2.5"/>
<text x="118.0" y="92.0" font-size="19" fill="#15803d" text-anchor="end" dominant-baseline="middle" font-weight="bold">1961</text>
<text x="164.0" y="80.5" font-size="18" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Independence, 27 April</text>
<text x="164.0" y="103.5" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">Sir Milton Margai Prime Minister</text>
<circle cx="140.0" cy="160.0" r="9.0" fill="#2563eb" stroke="#ffffff" stroke-width="2.5"/>
<text x="118.0" y="160.0" font-size="19" fill="#2563eb" text-anchor="end" dominant-baseline="middle" font-weight="bold">1961</text>
<text x="164.0" y="148.5" font-size="18" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Joins the United Nations</text>
<text x="164.0" y="171.5" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">27 September; also the Commonwealth</text>
<circle cx="140.0" cy="228.0" r="9.0" fill="#15803d" stroke="#ffffff" stroke-width="2.5"/>
<text x="118.0" y="228.0" font-size="19" fill="#15803d" text-anchor="end" dominant-baseline="middle" font-weight="bold">1962</text>
<text x="164.0" y="216.5" font-size="18" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">First general election after independence</text>
<text x="164.0" y="239.5" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">the SLPP wins</text>
<circle cx="140.0" cy="296.0" r="9.0" fill="#2563eb" stroke="#ffffff" stroke-width="2.5"/>
<text x="118.0" y="296.0" font-size="19" fill="#2563eb" text-anchor="end" dominant-baseline="middle" font-weight="bold">1963</text>
<text x="164.0" y="284.5" font-size="18" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Founding member of the OAU</text>
<text x="164.0" y="307.5" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">Addis Ababa, 25 May</text>
<circle cx="140.0" cy="364.0" r="9.0" fill="#ea580c" stroke="#ffffff" stroke-width="2.5"/>
<text x="118.0" y="364.0" font-size="19" fill="#ea580c" text-anchor="end" dominant-baseline="middle" font-weight="bold">1964</text>
<text x="164.0" y="352.5" font-size="18" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Milton Margai dies; Albert Margai PM</text>
<text x="164.0" y="375.5" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">the leone and the Bank of Sierra Leone</text>
<circle cx="140.0" cy="432.0" r="9.0" fill="#dc2626" stroke="#ffffff" stroke-width="2.5"/>
<text x="118.0" y="432.0" font-size="19" fill="#dc2626" text-anchor="end" dominant-baseline="middle" font-weight="bold">1966</text>
<text x="164.0" y="420.5" font-size="18" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">One-party state proposed</text>
<text x="164.0" y="443.5" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">strong opposition from the APC and public</text>
<circle cx="140.0" cy="500.0" r="9.0" fill="#dc2626" stroke="#ffffff" stroke-width="2.5"/>
<text x="118.0" y="500.0" font-size="19" fill="#dc2626" text-anchor="end" dominant-baseline="middle" font-weight="bold">1967</text>
<text x="164.0" y="488.5" font-size="18" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">APC wins the election</text>
<text x="164.0" y="511.5" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">army seizes power; NRC military rule</text>
<circle cx="140.0" cy="568.0" r="9.0" fill="#7c3aed" stroke="#ffffff" stroke-width="2.5"/>
<text x="118.0" y="568.0" font-size="19" fill="#7c3aed" text-anchor="end" dominant-baseline="middle" font-weight="bold">1968</text>
<text x="164.0" y="556.5" font-size="18" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Sergeants&#x27; revolt</text>
<text x="164.0" y="579.5" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">civilian rule; Siaka Stevens Prime Minister</text>
</svg>
