<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">From the Province of Freedom to the Crown Colony, 1786–1808</title>
<desc id="d">Timeline: 1786, the Committee for the Relief of the Black Poor is formed in London; 1787, about 400 settlers found the Province of Freedom on land obtained from King Tom; 1788, King Naimbana confirms the grant; 1789, Granville Town is burned; 1791, the Sierra Leone Company is formed; 1792, about 1,190 Nova Scotians arrive with John Clarkson and Freetown is founded; 1794, a French squadron sacks Freetown; 1800, the Nova Scotian rising is put down and the Jamaican Maroons arrive; 1808, Sierra Leone becomes a Crown Colony.</desc>
<defs></defs>
<rect width="800" height="680" rx="20" fill="#f8fafc"/>
<text x="400.0" y="34.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">From the Province of Freedom to the Crown Colony</text>
<line x1="130.0" y1="76.0" x2="130.0" y2="648.0" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
<circle cx="130.0" cy="90.0" r="9.0" fill="#0f172a" stroke="#ffffff" stroke-width="2.5"/>
<text x="108.0" y="90.0" font-size="19" fill="#0f172a" text-anchor="end" dominant-baseline="middle" font-weight="bold">1786</text>
<text x="154.0" y="78.5" font-size="18" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Committee for the Relief of the Black Poor</text>
<text x="154.0" y="101.5" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">formed in London; Granville Sharp supports it</text>
<circle cx="130.0" cy="158.0" r="9.0" fill="#15803d" stroke="#ffffff" stroke-width="2.5"/>
<text x="108.0" y="158.0" font-size="19" fill="#15803d" text-anchor="end" dominant-baseline="middle" font-weight="bold">1787</text>
<text x="154.0" y="146.5" font-size="18" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Province of Freedom founded</text>
<text x="154.0" y="169.5" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">about 400 settlers; land from King Tom</text>
<circle cx="130.0" cy="226.0" r="9.0" fill="#15803d" stroke="#ffffff" stroke-width="2.5"/>
<text x="108.0" y="226.0" font-size="19" fill="#15803d" text-anchor="end" dominant-baseline="middle" font-weight="bold">1788</text>
<text x="154.0" y="214.5" font-size="18" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">King Naimbana confirms the grant</text>
<text x="154.0" y="237.5" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">of land to the settlers</text>
<circle cx="130.0" cy="294.0" r="9.0" fill="#dc2626" stroke="#ffffff" stroke-width="2.5"/>
<text x="108.0" y="294.0" font-size="19" fill="#dc2626" text-anchor="end" dominant-baseline="middle" font-weight="bold">1789</text>
<text x="154.0" y="282.5" font-size="18" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Granville Town burned</text>
<text x="154.0" y="305.5" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">after a quarrel with the Temne ruler King Jimmy</text>
<circle cx="130.0" cy="362.0" r="9.0" fill="#2563eb" stroke="#ffffff" stroke-width="2.5"/>
<text x="108.0" y="362.0" font-size="19" fill="#2563eb" text-anchor="end" dominant-baseline="middle" font-weight="bold">1791</text>
<text x="154.0" y="350.5" font-size="18" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Sierra Leone Company formed</text>
<text x="154.0" y="373.5" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">Henry Thornton, Wilberforce, Sharp, Clarkson</text>
<circle cx="130.0" cy="430.0" r="9.0" fill="#15803d" stroke="#ffffff" stroke-width="2.5"/>
<text x="108.0" y="430.0" font-size="19" fill="#15803d" text-anchor="end" dominant-baseline="middle" font-weight="bold">1792</text>
<text x="154.0" y="418.5" font-size="18" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Nova Scotians arrive; Freetown founded</text>
<text x="154.0" y="441.5" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">about 1,190 settlers led by John Clarkson</text>
<circle cx="130.0" cy="498.0" r="9.0" fill="#dc2626" stroke="#ffffff" stroke-width="2.5"/>
<text x="108.0" y="498.0" font-size="19" fill="#dc2626" text-anchor="end" dominant-baseline="middle" font-weight="bold">1794</text>
<text x="154.0" y="486.5" font-size="18" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">French squadron sacks Freetown</text>
<text x="154.0" y="509.5" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">during the war between Britain and France</text>
<circle cx="130.0" cy="566.0" r="9.0" fill="#ea580c" stroke="#ffffff" stroke-width="2.5"/>
<text x="108.0" y="566.0" font-size="19" fill="#ea580c" text-anchor="end" dominant-baseline="middle" font-weight="bold">1800</text>
<text x="154.0" y="554.5" font-size="18" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Nova Scotian rising put down</text>
<text x="154.0" y="577.5" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">about 550 Jamaican Maroons arrive</text>
<circle cx="130.0" cy="634.0" r="9.0" fill="#2563eb" stroke="#ffffff" stroke-width="2.5"/>
<text x="108.0" y="634.0" font-size="19" fill="#2563eb" text-anchor="end" dominant-baseline="middle" font-weight="bold">1808</text>
<text x="154.0" y="622.5" font-size="18" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Sierra Leone becomes a Crown Colony</text>
<text x="154.0" y="645.5" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">1 January; the Company hands over to Britain</text>
</svg>
