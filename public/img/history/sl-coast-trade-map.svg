<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">European trading and slave-trading posts on the Sierra Leone coast</title>
<desc id="d">Map of the Sierra Leone coast showing places used by European and Afro-European traders from the sixteenth to the nineteenth centuries: Bunce Island in the Sierra Leone River, a British slave-trading fort whose captives were shipped to South Carolina and Georgia; the Banana Islands; Plantain Island and York Island in the Sherbro; and the Gallinas, centre of the illegal slave trade in the 1820s to 1840s, where the Amistad captives were held at Lomboko. Positions are approximate.</desc>
