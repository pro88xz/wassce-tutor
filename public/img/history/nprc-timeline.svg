<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The NPRC military government, 1992–1996</title>
<desc id="d">Timeline: 29 April 1992, young officers led by Captain Valentine Strasser seize power as the National Provisional Ruling Council; December 1992, alleged coup plotters executed; 1994 to 1995, the RUF advances and attacks come close to Freetown; 1995, the government hires the private military company Executive Outcomes and holds the first Bintumani conference; 16 January 1996, Brigadier Julius Maada Bio replaces Strasser; February 1996, the second Bintumani conference backs elections before peace and elections are held; 29 March 1996, power is handed to the elected President, Ahmad Tejan Kabbah.</desc>
<defs></defs>
<rect width="800" height="640" rx="20" fill="#f8fafc"/>
<text x="400.0" y="34.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">The NPRC years, 1992–1996</text>
<line x1="140.0" y1="78.0" x2="140.0" y2="550.0" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
<circle cx="140.0" cy="92.0" r="9.0" fill="#7c3aed" stroke="#ffffff" stroke-width="2.5"/>
<text x="118.0" y="92.0" font-size="19" fill="#7c3aed" text-anchor="end" dominant-baseline="middle" font-weight="bold">1992</text>
<text x="164.0" y="80.5" font-size="18" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">NPRC coup, 29 April</text>
<text x="164.0" y="103.5" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">Captain Valentine Strasser, aged 25</text>
<circle cx="140.0" cy="166.0" r="9.0" fill="#dc2626" stroke="#ffffff" stroke-width="2.5"/>
<text x="118.0" y="166.0" font-size="19" fill="#dc2626" text-anchor="end" dominant-baseline="middle" font-weight="bold">1992</text>
<text x="164.0" y="154.5" font-size="18" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Executions, December</text>
<text x="164.0" y="177.5" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">of alleged coup plotters</text>
<circle cx="140.0" cy="240.0" r="9.0" fill="#dc2626" stroke="#ffffff" stroke-width="2.5"/>
<text x="118.0" y="240.0" font-size="19" fill="#dc2626" text-anchor="end" dominant-baseline="middle" font-weight="bold">1994–95</text>
<text x="164.0" y="228.5" font-size="18" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">RUF advances</text>
<text x="164.0" y="251.5" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">attacks reach near Freetown</text>
<circle cx="140.0" cy="314.0" r="9.0" fill="#ea580c" stroke="#ffffff" stroke-width="2.5"/>
<text x="118.0" y="314.0" font-size="19" fill="#ea580c" text-anchor="end" dominant-baseline="middle" font-weight="bold">1995</text>
<text x="164.0" y="302.5" font-size="18" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Executive Outcomes hired</text>
<text x="164.0" y="325.5" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">Bintumani I conference</text>
<circle cx="140.0" cy="388.0" r="9.0" fill="#7c3aed" stroke="#ffffff" stroke-width="2.5"/>
<text x="118.0" y="388.0" font-size="19" fill="#7c3aed" text-anchor="end" dominant-baseline="middle" font-weight="bold">1996</text>
<text x="164.0" y="376.5" font-size="18" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Palace coup, 16 January</text>
<text x="164.0" y="399.5" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">Brigadier Julius Maada Bio replaces Strasser</text>
<circle cx="140.0" cy="462.0" r="9.0" fill="#2563eb" stroke="#ffffff" stroke-width="2.5"/>
<text x="118.0" y="462.0" font-size="19" fill="#2563eb" text-anchor="end" dominant-baseline="middle" font-weight="bold">1996</text>
<text x="164.0" y="450.5" font-size="18" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Bintumani II and elections</text>
<text x="164.0" y="473.5" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">&#x27;elections before peace&#x27;, February</text>
<circle cx="140.0" cy="536.0" r="9.0" fill="#15803d" stroke="#ffffff" stroke-width="2.5"/>
<text x="118.0" y="536.0" font-size="19" fill="#15803d" text-anchor="end" dominant-baseline="middle" font-weight="bold">1996</text>
<text x="164.0" y="524.5" font-size="18" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Handover, 29 March</text>
<text x="164.0" y="547.5" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">Ahmad Tejan Kabbah President</text>
</svg>
