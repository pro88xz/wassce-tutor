<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 820" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Main ethnic groups of Sierra Leone</title>
<desc id="d">Map of Sierra Leone showing where the main ethnic groups mostly live. Mande-speaking peoples: Mende in the south and east, Kono in the east, Koranko and Yalunka in the north-east, Susu in the north-west, Loko, Vai, and Fula and Mandinka communities in the north. Atlantic-speaking peoples: Temne in the north-west and centre, Limba in the north, Bullom on the northern coast, Sherbro on the southern coast and Sherbro Island, Kissi in the far east, Krim and Gola in the south-east. The Krio live mainly in Freetown and the Western Area. Locations are approximate and people of every group live throughout the country.</desc>
