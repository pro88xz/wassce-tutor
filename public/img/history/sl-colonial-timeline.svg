<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 760" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Colonial Sierra Leone, 1863–1945: key political events</title>
<desc id="d">Timeline: 1863, Legislative Council set up; 1893, Freetown City Council created, with Samuel Lewis as first mayor in 1895; 1896, Protectorate declared; 1898, Hut Tax War; 1906, Bo School opened for the sons of chiefs; 1919, riots and a railway strike in Freetown; 1920, Sierra Leone joins the National Congress of British West Africa; 1924, new constitution with the first elected members and paramount chiefs in the Legislative Council; 1926, railway workers&#x27; strike; 1938, I. T. A. Wallace-Johnson founds the Sierra Leone branch of the West African Youth League; 1939, strikes and Wallace-Johnson&#x27;s detention.</desc>
<defs></defs>
<rect width="800" height="760" rx="20" fill="#f8fafc"/>
<text x="400.0" y="34.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Colonial Sierra Leone: political milestones, 1863–1945</text>
<line x1="150.0" y1="76.0" x2="150.0" y2="698.0" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
<circle cx="150.0" cy="90.0" r="9.0" fill="#0f172a" stroke="#ffffff" stroke-width="2.5"/>
<text x="128.0" y="90.0" font-size="19" fill="#0f172a" text-anchor="end" dominant-baseline="middle" font-weight="bold">1863</text>
<text x="174.0" y="78.5" font-size="18" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Legislative Council set up</text>
<text x="174.0" y="101.5" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">Governor with officials and nominated members</text>
<circle cx="150.0" cy="156.0" r="9.0" fill="#7c3aed" stroke="#ffffff" stroke-width="2.5"/>
<text x="128.0" y="156.0" font-size="19" fill="#7c3aed" text-anchor="end" dominant-baseline="middle" font-weight="bold">1893</text>
<text x="174.0" y="144.5" font-size="18" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Freetown City Council created</text>
<text x="174.0" y="167.5" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">Sir Samuel Lewis first mayor, 1895</text>
<circle cx="150.0" cy="222.0" r="9.0" fill="#15803d" stroke="#ffffff" stroke-width="2.5"/>
<text x="128.0" y="222.0" font-size="19" fill="#15803d" text-anchor="end" dominant-baseline="middle" font-weight="bold">1896</text>
<text x="174.0" y="210.5" font-size="18" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Protectorate declared</text>
<text x="174.0" y="233.5" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">31 August; five districts</text>
<circle cx="150.0" cy="288.0" r="9.0" fill="#dc2626" stroke="#ffffff" stroke-width="2.5"/>
<text x="128.0" y="288.0" font-size="19" fill="#dc2626" text-anchor="end" dominant-baseline="middle" font-weight="bold">1898</text>
<text x="174.0" y="276.5" font-size="18" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Hut Tax War</text>
<text x="174.0" y="299.5" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">Bai Bureh and the Mende rising</text>
<circle cx="150.0" cy="354.0" r="9.0" fill="#15803d" stroke="#ffffff" stroke-width="2.5"/>
<text x="128.0" y="354.0" font-size="19" fill="#15803d" text-anchor="end" dominant-baseline="middle" font-weight="bold">1906</text>
<text x="174.0" y="342.5" font-size="18" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Bo School opens</text>
<text x="174.0" y="365.5" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">for the sons and nominees of chiefs</text>
<circle cx="150.0" cy="420.0" r="9.0" fill="#dc2626" stroke="#ffffff" stroke-width="2.5"/>
<text x="128.0" y="420.0" font-size="19" fill="#dc2626" text-anchor="end" dominant-baseline="middle" font-weight="bold">1919</text>
<text x="174.0" y="408.5" font-size="18" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Freetown riots and railway strike</text>
<text x="174.0" y="431.5" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">high prices, rice shortage, low pay</text>
<circle cx="150.0" cy="486.0" r="9.0" fill="#2563eb" stroke="#ffffff" stroke-width="2.5"/>
<text x="128.0" y="486.0" font-size="19" fill="#2563eb" text-anchor="end" dominant-baseline="middle" font-weight="bold">1920</text>
<text x="174.0" y="474.5" font-size="18" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Sierra Leone in the NCBWA</text>
<text x="174.0" y="497.5" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">Bankole-Bright among the delegates</text>
<circle cx="150.0" cy="552.0" r="9.0" fill="#2563eb" stroke="#ffffff" stroke-width="2.5"/>
<text x="128.0" y="552.0" font-size="19" fill="#2563eb" text-anchor="end" dominant-baseline="middle" font-weight="bold">1924</text>
<text x="174.0" y="540.5" font-size="18" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">New constitution</text>
<text x="174.0" y="563.5" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">first elected members; 3 paramount chiefs</text>
<circle cx="150.0" cy="618.0" r="9.0" fill="#ea580c" stroke="#ffffff" stroke-width="2.5"/>
<text x="128.0" y="618.0" font-size="19" fill="#ea580c" text-anchor="end" dominant-baseline="middle" font-weight="bold">1926</text>
<text x="174.0" y="606.5" font-size="18" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Railway workers&#x27; strike</text>
<text x="174.0" y="629.5" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">a landmark in labour history</text>
<circle cx="150.0" cy="684.0" r="9.0" fill="#ea580c" stroke="#ffffff" stroke-width="2.5"/>
<text x="128.0" y="684.0" font-size="19" fill="#ea580c" text-anchor="end" dominant-baseline="middle" font-weight="bold">1938–39</text>
<text x="174.0" y="672.5" font-size="18" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">West African Youth League</text>
<text x="174.0" y="695.5" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">Wallace-Johnson; strikes; detained 1939</text>
</svg>
