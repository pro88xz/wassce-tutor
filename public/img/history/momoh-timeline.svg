<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The Momoh years, 1985–1992</title>
<desc id="d">Timeline: November 1985, Major-General Joseph Saidu Momoh becomes President; 1986, one-party elections; 1987, an alleged coup plot and a state of economic emergency; 1989, former Vice-President Francis Minah executed; 1990, the Tucker Constitutional Review Commission; 23 March 1991, the RUF attacks Bomaru and the civil war begins; 1 October 1991, the multi-party constitution comes into force; 29 April 1992, the NPRC coup overthrows Momoh.</desc>
<defs></defs>
<rect width="800" height="640" rx="20" fill="#f8fafc"/>
<text x="400.0" y="34.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Joseph Saidu Momoh&#x27;s government, 1985–1992</text>
<line x1="140.0" y1="78.0" x2="140.0" y2="582.0" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
<circle cx="140.0" cy="92.0" r="9.0" fill="#0f172a" stroke="#ffffff" stroke-width="2.5"/>
<text x="118.0" y="92.0" font-size="19" fill="#0f172a" text-anchor="end" dominant-baseline="middle" font-weight="bold">1985</text>
<text x="164.0" y="80.5" font-size="18" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Momoh becomes President</text>
<text x="164.0" y="103.5" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">army commander; the &#x27;New Order&#x27;</text>
<circle cx="140.0" cy="160.0" r="9.0" fill="#ea580c" stroke="#ffffff" stroke-width="2.5"/>
<text x="118.0" y="160.0" font-size="19" fill="#ea580c" text-anchor="end" dominant-baseline="middle" font-weight="bold">1986</text>
<text x="164.0" y="148.5" font-size="18" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">One-party elections</text>
<text x="164.0" y="171.5" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">only APC candidates</text>
<circle cx="140.0" cy="228.0" r="9.0" fill="#dc2626" stroke="#ffffff" stroke-width="2.5"/>
<text x="118.0" y="228.0" font-size="19" fill="#dc2626" text-anchor="end" dominant-baseline="middle" font-weight="bold">1987</text>
<text x="164.0" y="216.5" font-size="18" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Alleged coup plot</text>
<text x="164.0" y="239.5" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">state of economic emergency</text>
<circle cx="140.0" cy="296.0" r="9.0" fill="#dc2626" stroke="#ffffff" stroke-width="2.5"/>
<text x="118.0" y="296.0" font-size="19" fill="#dc2626" text-anchor="end" dominant-baseline="middle" font-weight="bold">1989</text>
<text x="164.0" y="284.5" font-size="18" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Francis Minah executed</text>
<text x="164.0" y="307.5" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">former Vice-President</text>
<circle cx="140.0" cy="364.0" r="9.0" fill="#2563eb" stroke="#ffffff" stroke-width="2.5"/>
<text x="118.0" y="364.0" font-size="19" fill="#2563eb" text-anchor="end" dominant-baseline="middle" font-weight="bold">1990</text>
<text x="164.0" y="352.5" font-size="18" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Tucker Commission</text>
<text x="164.0" y="375.5" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">reviews the constitution</text>
<circle cx="140.0" cy="432.0" r="9.0" fill="#dc2626" stroke="#ffffff" stroke-width="2.5"/>
<text x="118.0" y="432.0" font-size="19" fill="#dc2626" text-anchor="end" dominant-baseline="middle" font-weight="bold">1991</text>
<text x="164.0" y="420.5" font-size="18" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">War begins, 23 March</text>
<text x="164.0" y="443.5" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">RUF attacks Bomaru, Kailahun</text>
<circle cx="140.0" cy="500.0" r="9.0" fill="#15803d" stroke="#ffffff" stroke-width="2.5"/>
<text x="118.0" y="500.0" font-size="19" fill="#15803d" text-anchor="end" dominant-baseline="middle" font-weight="bold">1991</text>
<text x="164.0" y="488.5" font-size="18" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Multi-party constitution</text>
<text x="164.0" y="511.5" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">in force from 1 October</text>
<circle cx="140.0" cy="568.0" r="9.0" fill="#7c3aed" stroke="#ffffff" stroke-width="2.5"/>
<text x="118.0" y="568.0" font-size="19" fill="#7c3aed" text-anchor="end" dominant-baseline="middle" font-weight="bold">1992</text>
<text x="164.0" y="556.5" font-size="18" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">NPRC coup, 29 April</text>
<text x="164.0" y="579.5" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">Momoh flees to Guinea</text>
</svg>
