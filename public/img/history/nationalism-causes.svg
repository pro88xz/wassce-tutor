<text x="655.0" y="300.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Pan-Africanism; India free</text>
<text x="655.0" y="322.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">(1947); United Nations</text>
