<text x="400.0" y="287.0" font-size="20" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="bold">RISE OF</text>
<text x="400.0" y="313.0" font-size="18" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">nationalism</text>
