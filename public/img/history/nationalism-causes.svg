<text x="145.0" y="300.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">West African Pilot, Evening</text>
<text x="145.0" y="322.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">News, Sierra Leone Weekly News</text>
<line x1="286.0" y1="300.0" x2="310.0" y2="300.0" stroke="#475569" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a475569)"/>
<rect x="10.0" y="418.0" width="270.0" height="104.0" rx="12" fill="#fef3c7" stroke="#ea580c" stroke-width="2.5"/>
<text x="145.0" y="448.0" font-size="16" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Colonial grievances</text>
<text x="145.0" y="470.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">racial discrimination, low</text>
<text x="145.0" y="492.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">prices, forced labour, taxes</text>
