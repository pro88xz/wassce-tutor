<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Causes of nationalism in West Africa</title>
<desc id="d">Diagram of six causes feeding the rise of nationalism in West Africa: Western education, which produced an educated elite; the African press, such as the West African Pilot, the Accra Evening News and the Sierra Leone Weekly News; colonial grievances such as racial discrimination, low produce prices, forced labour and taxes; the Second World War, with returning ex-servicemen, the Atlantic Charter of 1941 and a weakened Europe; outside influences such as Pan-Africanism, India&#x27;s independence in 1947 and the United Nations; and organisations such as the National Congress of British West Africa (1920), youth movements, trade unions and political parties.</desc>
<defs><marker id="a475569" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker><marker id="a475569s" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#475569"/></marker></defs>
