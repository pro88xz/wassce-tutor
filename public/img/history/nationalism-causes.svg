<text x="655.0" y="448.0" font-size="16" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Organisations</text>
<text x="655.0" y="470.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">NCBWA (1920), youth leagues,</text>
<text x="655.0" y="492.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">trade unions, parties</text>
