<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The Hut Tax War of 1898: causes and results</title>
<desc id="d">Diagram. Causes: the hut tax of 5 or 10 shillings a year from January 1898; brutal collection by the Frontier Police; chiefs losing their powers under the Protectorate Ordinance; fears that the government would take land; and anger at Krio traders and missionaries seen as part of colonial rule. Results: the Chalmers Commission of 1899 blamed the tax and the police, but the Colonial Office kept the tax; British control of the Protectorate was completed; Bai Bureh was exiled; the West African Regiment was formed; distrust grew between the Colony and the Protectorate; and chiefs became agents of colonial rule.</desc>
