<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The Colony–Protectorate divide over the 1951 constitution</title>
<desc id="d">Diagram of the debate over the Stevenson Constitution. In the Colony, the National Council of the Colony of Sierra Leone (NCSL), led by Dr H. C. Bankole-Bright, opposed it, arguing that the Colony&#x27;s British subjects should not be ruled by a Protectorate majority, that the Protectorate was less educated, and that the two areas should advance separately. In the Protectorate, the Sierra Leone People&#x27;s Party (SLPP), led by Dr Milton Margai, supported it, arguing that the Protectorate had most of the people and wealth and deserved a majority, and that the country must advance as one. The SLPP won the 1951 elections.</desc>
<defs></defs>
<rect width="800" height="600" rx="20" fill="#f8fafc"/>
<text x="400.0" y="34.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">The 1951 constitution: Colony against Protectorate</text>
<rect x="30.0" y="78.0" width="350.0" height="76.0" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
<text x="205.0" y="104.0" font-size="18" fill="#7c3aed" text-anchor="middle" dominant-baseline="middle" font-weight="bold">THE COLONY</text>
<text x="205.0" y="128.0" font-size="16" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">NCSL, led by Dr Bankole-Bright</text>
<rect x="420.0" y="78.0" width="350.0" height="76.0" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
<text x="595.0" y="104.0" font-size="18" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">THE PROTECTORATE</text>
<text x="595.0" y="128.0" font-size="16" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">SLPP, led by Dr Milton Margai</text>
<text x="205.0" y="186.0" font-size="17" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="bold">OPPOSED the constitution</text>
<text x="595.0" y="186.0" font-size="17" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">SUPPORTED the constitution</text>
<rect x="30.0" y="223.0" width="350.0" height="78.0" rx="12" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
<text x="205.0" y="251.0" font-size="16" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Colony people were British</text>
<text x="205.0" y="273.0" font-size="16" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">subjects with older rights</text>
<rect x="420.0" y="223.0" width="350.0" height="78.0" rx="12" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
<text x="595.0" y="251.0" font-size="16" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Protectorate had most of the</text>
<text x="595.0" y="273.0" font-size="16" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">people and the wealth</text>
<rect x="30.0" y="319.0" width="350.0" height="78.0" rx="12" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
<text x="205.0" y="347.0" font-size="16" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Protectorate had fewer</text>
<text x="205.0" y="369.0" font-size="16" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">educated people</text>
<rect x="420.0" y="319.0" width="350.0" height="78.0" rx="12" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
<text x="595.0" y="347.0" font-size="16" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">a majority was only fair</text>
<text x="595.0" y="369.0" font-size="16" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">and democratic</text>
<rect x="30.0" y="415.0" width="350.0" height="78.0" rx="12" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
<text x="205.0" y="443.0" font-size="16" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">two areas should advance</text>
<text x="205.0" y="465.0" font-size="16" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">separately</text>
<rect x="420.0" y="415.0" width="350.0" height="78.0" rx="12" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
<text x="595.0" y="443.0" font-size="16" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">the country must advance</text>
<text x="595.0" y="465.0" font-size="16" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">as one nation</text>
<rect x="30.0" y="528.0" width="740.0" height="56.0" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
<text x="400.0" y="556.0" font-size="17" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Result: the SLPP won the 1951 elections; Milton Margai led government business</text>
</svg>
