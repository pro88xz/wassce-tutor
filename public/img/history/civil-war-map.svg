<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Key places in the Sierra Leone Civil War, 1991–2002</title>
<desc id="d">Map of Sierra Leone marking key places in the civil war: Bomaru in Kailahun District, where the RUF attack on 23 March 1991 began the war; Kailahun, an RUF stronghold; the Kono diamond fields, fought over throughout the war; Makeni, the RUF&#x27;s headquarters around 2000; Lungi, base of UN and British forces in 2000; and Freetown, invaded by AFRC and RUF forces on 6 January 1999. Positions are approximate.</desc>
