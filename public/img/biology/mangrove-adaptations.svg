<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Adaptations of mangrove trees to salty, waterlogged mud</title>
<desc id="d">Two mangrove trees on soft mud with salty tidal water. The red mangrove on the left stands on arching stilt roots that prop it up in the soft mud. The white mangrove on the right sends up pencil-like breathing roots (pneumatophores) from the mud to take in air at low tide. A seedling grows while still on the parent tree (vivipary) and drops into the mud. Leaves have thick waxy cuticles and some excrete salt.</desc>
