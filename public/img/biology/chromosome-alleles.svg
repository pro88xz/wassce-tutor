<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Chromosomes, genes and alleles</title>
<desc id="d">A homologous pair of chromosomes, one from each parent. A gene for a characteristic sits at the same place, the locus, on both chromosomes. The two copies may be the same allele (homozygous, such as TT or tt) or different alleles (heterozygous, Tt).</desc>
<defs></defs>
<rect width="780" height="400" rx="20" fill="#f8fafc"/>
<text x="390.0" y="34.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">A homologous pair: same genes, possibly different alleles</text>
<rect x="182.0" y="70.0" width="36.0" height="280.0" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2.6"/>
<ellipse cx="200.0" cy="170.0" rx="20.0" ry="9.0" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<rect x="182.0" y="111.0" width="36.0" height="18.0" rx="0" fill="#2563eb" stroke="#2563eb" stroke-width="1"/>
<text x="200.0" y="121.0" font-size="14" fill="#ffffff" text-anchor="middle" dominant-baseline="middle" font-weight="bold">T</text>
<rect x="182.0" y="231.0" width="36.0" height="18.0" rx="0" fill="#2563eb" stroke="#2563eb" stroke-width="1"/>
<text x="200.0" y="241.0" font-size="14" fill="#ffffff" text-anchor="middle" dominant-baseline="middle" font-weight="bold">B</text>
<rect x="182.0" y="296.0" width="36.0" height="18.0" rx="0" fill="#2563eb" stroke="#2563eb" stroke-width="1"/>
<text x="200.0" y="306.0" font-size="14" fill="#ffffff" text-anchor="middle" dominant-baseline="middle" font-weight="bold">r</text>
<rect x="282.0" y="70.0" width="36.0" height="280.0" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="2.6"/>
<ellipse cx="300.0" cy="170.0" rx="20.0" ry="9.0" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
<rect x="282.0" y="111.0" width="36.0" height="18.0" rx="0" fill="#dc2626" stroke="#dc2626" stroke-width="1"/>
<text x="300.0" y="121.0" font-size="14" fill="#ffffff" text-anchor="middle" dominant-baseline="middle" font-weight="bold">t</text>
<rect x="282.0" y="231.0" width="36.0" height="18.0" rx="0" fill="#dc2626" stroke="#dc2626" stroke-width="1"/>
<text x="300.0" y="241.0" font-size="14" fill="#ffffff" text-anchor="middle" dominant-baseline="middle" font-weight="bold">B</text>
<rect x="282.0" y="296.0" width="36.0" height="18.0" rx="0" fill="#dc2626" stroke="#dc2626" stroke-width="1"/>
<text x="300.0" y="306.0" font-size="14" fill="#ffffff" text-anchor="middle" dominant-baseline="middle" font-weight="bold">r</text>
<text x="200.0" y="372.0" font-size="14" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="normal">from father</text>
<text x="300.0" y="372.0" font-size="14" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="normal">from mother</text>
<line x1="320.0" y1="120.0" x2="420.0" y2="120.0" stroke="#0f172a" stroke-width="1.6" stroke-linecap="round"/>
<text x="430.0" y="112.0" font-size="15" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">height gene: T and t</text>
<text x="430.0" y="134.0" font-size="14" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">different alleles → heterozygous (Tt)</text>
<line x1="320.0" y1="240.0" x2="420.0" y2="240.0" stroke="#0f172a" stroke-width="1.6" stroke-linecap="round"/>
<text x="430.0" y="232.0" font-size="15" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">another gene: B and B</text>
<text x="430.0" y="254.0" font-size="14" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">same allele → homozygous (BB)</text>
<line x1="320.0" y1="305.0" x2="420.0" y2="305.0" stroke="#0f172a" stroke-width="1.6" stroke-linecap="round"/>
<text x="430.0" y="297.0" font-size="15" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">r and r: homozygous recessive</text>
<text x="430.0" y="319.0" font-size="14" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">the recessive feature shows</text>
<line x1="222.0" y1="170.0" x2="420.0" y2="178.0" stroke="#475569" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="4 4"/>
<text x="430.0" y="182.0" font-size="14" fill="#475569" text-anchor="start" dominant-baseline="middle" font-weight="normal">centromere</text>
</svg>
