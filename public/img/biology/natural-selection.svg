<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">How natural selection works</title>
<desc id="d">Six steps. Individuals in a population vary. More offspring are produced than can survive. They compete in a struggle for existence. Those with useful variations survive and reproduce. They pass the useful alleles to their offspring. Over many generations the population changes.</desc>
<defs><marker id="a475569" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker><marker id="a475569s" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#475569"/></marker></defs>
<rect width="780" height="470" rx="20" fill="#f8fafc"/>
<text x="390.0" y="34.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Natural selection in six steps</text>
<rect x="30.0" y="74.0" width="220.0" height="92.0" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="140.0" y="109.5" font-size="15" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">1  Variation</text>
<text x="140.0" y="130.5" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">individuals differ</text>
<rect x="280.0" y="74.0" width="220.0" height="92.0" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
<text x="390.0" y="109.5" font-size="15" fill="#7c3aed" text-anchor="middle" dominant-baseline="middle" font-weight="bold">2  Over-production</text>
<text x="390.0" y="130.5" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">more young than can survive</text>
<rect x="530.0" y="74.0" width="220.0" height="92.0" rx="12" fill="#fef3c7" stroke="#ea580c" stroke-width="2.5"/>
<text x="640.0" y="109.5" font-size="15" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">3  Struggle</text>
<text x="640.0" y="130.5" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">competition for food and mates</text>
<rect x="530.0" y="284.0" width="220.0" height="92.0" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
<text x="640.0" y="319.5" font-size="15" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">4  Survival of the fittest</text>
<text x="640.0" y="340.5" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">the best-adapted live longer</text>
<rect x="280.0" y="284.0" width="220.0" height="92.0" rx="12" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/>
<text x="390.0" y="319.5" font-size="15" fill="#0f766e" text-anchor="middle" dominant-baseline="middle" font-weight="bold">5  Inheritance</text>
<text x="390.0" y="340.5" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">survivors pass on useful alleles</text>
<rect x="30.0" y="284.0" width="220.0" height="92.0" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
<text x="140.0" y="319.5" font-size="15" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="bold">6  Change</text>
<text x="140.0" y="340.5" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">the useful allele spreads</text>
<line x1="256.0" y1="120.0" x2="274.0" y2="120.0" stroke="#475569" stroke-width="2.6" stroke-linecap="round" marker-end="url(#a475569)"/>
<line x1="506.0" y1="120.0" x2="524.0" y2="120.0" stroke="#475569" stroke-width="2.6" stroke-linecap="round" marker-end="url(#a475569)"/>
<line x1="640.0" y1="172.0" x2="640.0" y2="278.0" stroke="#475569" stroke-width="2.6" stroke-linecap="round" marker-end="url(#a475569)"/>
<line x1="524.0" y1="330.0" x2="506.0" y2="330.0" stroke="#475569" stroke-width="2.6" stroke-linecap="round" marker-end="url(#a475569)"/>
<line x1="274.0" y1="330.0" x2="256.0" y2="330.0" stroke="#475569" stroke-width="2.6" stroke-linecap="round" marker-end="url(#a475569)"/>
<text x="390.0" y="440.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Example: malaria parasites resistant to a drug survive treatment and multiply.</text>
</svg>
