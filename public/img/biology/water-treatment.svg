<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Stages in treating water for a town</title>
<desc id="d">River or reservoir water is screened to remove large objects, left in sedimentation tanks so that mud settles (helped by alum), filtered through beds of sand and gravel, and chlorinated to kill microorganisms before being stored and piped to homes.</desc>
<defs><marker id="a0f172a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f172a"/></marker><marker id="a0f172as" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#0f172a"/></marker></defs>
<rect width="800" height="300" rx="20" fill="#f8fafc"/>
<text x="400.0" y="34.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">From river to tap: treating a town&#x27;s water</text>
<rect x="15.0" y="102.0" width="140.0" height="96.0" rx="12" fill="#e2e8f0" stroke="#0f172a" stroke-width="2.5"/>
<text x="85.0" y="129.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Screening</text>
<text x="85.0" y="150.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">removes leaves,</text>
<text x="85.0" y="171.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">sticks, rubbish</text>
<rect x="172.0" y="102.0" width="140.0" height="96.0" rx="12" fill="#fef3c7" stroke="#ea580c" stroke-width="2.5"/>
<text x="242.0" y="129.0" font-size="15" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Sedimentation</text>
<text x="242.0" y="150.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">mud settles;</text>
<text x="242.0" y="171.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">alum helps</text>
<line x1="161.0" y1="150.0" x2="166.0" y2="150.0" stroke="#0f172a" stroke-width="2.6" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<rect x="329.0" y="102.0" width="140.0" height="96.0" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="399.0" y="129.0" font-size="15" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Filtration</text>
<text x="399.0" y="150.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">sand and gravel</text>
<text x="399.0" y="171.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">beds trap particles</text>
<line x1="318.0" y1="150.0" x2="323.0" y2="150.0" stroke="#0f172a" stroke-width="2.6" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<rect x="486.0" y="102.0" width="140.0" height="96.0" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
<text x="556.0" y="129.0" font-size="15" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Chlorination</text>
<text x="556.0" y="150.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">chlorine kills</text>
<text x="556.0" y="171.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">microorganisms</text>
<line x1="475.0" y1="150.0" x2="480.0" y2="150.0" stroke="#0f172a" stroke-width="2.6" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<rect x="643.0" y="102.0" width="140.0" height="96.0" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
<text x="713.0" y="129.0" font-size="15" fill="#7c3aed" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Storage</text>
<text x="713.0" y="150.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">covered tanks,</text>
<text x="713.0" y="171.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">then pipes</text>
<line x1="632.0" y1="150.0" x2="637.0" y2="150.0" stroke="#0f172a" stroke-width="2.6" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<text x="400.0" y="250.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">At home: boil water for at least one minute, or treat it with chlorine tablets or bleach.</text>
</svg>
