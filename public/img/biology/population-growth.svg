<title id="t">The S-shaped growth curve of a population</title>
<desc id="d">A population introduced to a new habitat grows slowly at first (lag phase), then rapidly (exponential phase), then levels off at the carrying capacity of the environment (stationary phase) as food, space and other resources run short.</desc>
