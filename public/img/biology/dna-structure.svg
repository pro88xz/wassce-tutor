<title id="t">The structure of DNA</title>
<desc id="d">DNA is two strands twisted into a double helix, shown here untwisted as a ladder. Each strand has a backbone of alternating sugar (deoxyribose) and phosphate. The rungs are pairs of bases: adenine always pairs with thymine, and guanine always pairs with cytosine.</desc>
