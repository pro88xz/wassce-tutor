<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The life cycle of the malaria parasite</title>
<desc id="d">An infected female Anopheles mosquito bites a person and injects Plasmodium sporozoites from its saliva. They travel to the liver and multiply. Merozoites burst out and invade red blood cells, multiplying and bursting the cells every 48 to 72 hours, which causes fever. Some become gametocytes, which are sucked up by another mosquito. In the mosquito they fuse and develop into new sporozoites in its salivary glands.</desc>
<defs><marker id="a0f172a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f172a"/></marker><marker id="a0f172as" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#0f172a"/></marker></defs>
<rect width="800" height="470" rx="20" fill="#f8fafc"/>
<text x="400.0" y="34.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Malaria: Plasmodium passes between mosquito and human</text>
<text x="200.0" y="76.0" font-size="14" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="bold">IN THE HUMAN</text>
<text x="600.0" y="76.0" font-size="14" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">IN THE MOSQUITO</text>
<line x1="400.0" y1="66.0" x2="400.0" y2="420.0" stroke="#475569" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="6 6"/>
<rect x="75.0" y="108.0" width="250.0" height="64.0" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
<text x="200.0" y="130.0" font-size="14" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="bold">1  Bite injects sporozoites</text>
<text x="200.0" y="150.0" font-size="12" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">from the mosquito&#x27;s saliva</text>
<rect x="75.0" y="218.0" width="250.0" height="64.0" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
<text x="200.0" y="240.0" font-size="14" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="bold">2  Liver</text>
<text x="200.0" y="260.0" font-size="12" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">sporozoites multiply</text>
<rect x="75.0" y="325.0" width="250.0" height="70.0" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
<text x="200.0" y="350.0" font-size="14" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="bold">3  Red blood cells</text>
<text x="200.0" y="370.0" font-size="12" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">burst every 2–3 days: fever</text>
<rect x="475.0" y="328.0" width="250.0" height="64.0" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
<text x="600.0" y="350.0" font-size="14" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">4  Bite takes up</text>
<text x="600.0" y="370.0" font-size="12" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">gametocytes from blood</text>
<rect x="475.0" y="218.0" width="250.0" height="64.0" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
<text x="600.0" y="240.0" font-size="14" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">5  Gut of mosquito</text>
<text x="600.0" y="260.0" font-size="12" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">gametes fuse; parasite grows</text>
<rect x="475.0" y="108.0" width="250.0" height="64.0" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
<text x="600.0" y="130.0" font-size="14" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">6  Salivary glands</text>
<text x="600.0" y="150.0" font-size="12" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">fill with sporozoites</text>
<line x1="200.0" y1="178.0" x2="200.0" y2="212.0" stroke="#0f172a" stroke-width="2.6" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<line x1="200.0" y1="288.0" x2="200.0" y2="319.0" stroke="#0f172a" stroke-width="2.6" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<line x1="331.0" y1="360.0" x2="469.0" y2="360.0" stroke="#0f172a" stroke-width="2.6" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<line x1="600.0" y1="322.0" x2="600.0" y2="288.0" stroke="#0f172a" stroke-width="2.6" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<line x1="600.0" y1="212.0" x2="600.0" y2="178.0" stroke="#0f172a" stroke-width="2.6" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<line x1="469.0" y1="140.0" x2="331.0" y2="140.0" stroke="#0f172a" stroke-width="2.6" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<text x="400.0" y="448.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">The female Anopheles mosquito is the vector; Plasmodium is the pathogen.</text>
</svg>
