<text x="605.0" y="362.0" font-size="14" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">blood group</text>
<text x="605.0" y="70.0" font-size="16" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Discontinuous: blood group</text>
<text x="605.0" y="92.0" font-size="14" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">separate categories, no in-between</text>
