<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Continuous and discontinuous variation</title>
<desc id="d">Left: the heights of students form a smooth bell-shaped distribution with many intermediate values: continuous variation. Right: ABO blood groups fall into four separate categories, A, B, AB and O, with no values in between: discontinuous variation.</desc>
