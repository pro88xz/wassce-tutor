<text x="223.0" y="338.0" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">160</text>
<text x="291.0" y="338.0" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">170</text>
<text x="359.0" y="338.0" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">180</text>
