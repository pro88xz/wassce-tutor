<text x="510.0" y="338.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">A</text>
<rect x="552.0" y="224.0" width="44.0" height="96.0" rx="0" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
