<rect x="342.0" y="297.2" width="34.0" height="22.8" rx="0" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
<path d="M 87.0 304.8 L 121.0 282.0 L 155.0 236.4 L 189.0 175.6 L 223.0 130.0 L 257.0 160.4 L 291.0 221.2 L 325.0 274.4 L 359.0 297.2" stroke="#dc2626" stroke-width="2.4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
