<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The carbon cycle</title>
<desc id="d">Carbon dioxide in the air is taken in by green plants in photosynthesis. Carbon passes to animals by feeding. Plants, animals and decomposers return carbon dioxide to the air by respiration. Dead remains and wastes are broken down by decomposers. Over millions of years some remains become fossil fuels, and burning fossil fuels and wood (combustion) releases carbon dioxide.</desc>
