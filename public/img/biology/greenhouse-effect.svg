<circle cx="90.0" cy="100.0" r="40.0" fill="#fde68a" stroke="#ea580c" stroke-width="3"/>
<text x="90.0" y="101.0" font-size="15" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Sun</text>
<rect x="20.0" y="170.0" width="740.0" height="70.0" rx="0" fill="#e0f2fe" stroke="none" stroke-width="0" opacity="0.9"/>
<text x="740.0" y="186.0" font-size="13" fill="#2563eb" text-anchor="end" dominant-baseline="middle" font-weight="bold">atmosphere with CO₂, CH₄, water vapour</text>
<circle cx="260.0" cy="212.0" r="9.0" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<circle cx="380.0" cy="212.0" r="9.0" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<circle cx="500.0" cy="212.0" r="9.0" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<circle cx="620.0" cy="212.0" r="9.0" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<rect x="20.0" y="340.0" width="740.0" height="60.0" rx="0" fill="#dcfce7" stroke="#15803d" stroke-width="2.4"/>
<text x="390.0" y="372.0" font-size="15" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Earth&#x27;s surface</text>
<line x1="130.0" y1="130.0" x2="300.0" y2="336.0" stroke="#ea580c" stroke-width="3.2" stroke-linecap="round" marker-end="url(#aea580c)"/>
<text x="150.0" y="260.0" font-size="14" fill="#ea580c" text-anchor="start" dominant-baseline="middle" font-weight="bold">sunlight in</text>
<line x1="400.0" y1="336.0" x2="470.0" y2="120.0" stroke="#dc2626" stroke-width="2.6" stroke-linecap="round" marker-end="url(#adc2626)"/>
<text x="478.0" y="112.0" font-size="13" fill="#dc2626" text-anchor="start" dominant-baseline="middle" font-weight="normal">some heat escapes</text>
