<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">A ventilated improved pit (VIP) latrine</title>
<desc id="d">A deep pit lined at the top, covered by a concrete slab with a squat hole. A shelter is built over it and kept dark inside. A vent pipe runs from the pit to above the roof, with a fly screen on top. Air flows down through the hole and up the pipe, carrying smells away. Flies are attracted to the light at the top of the pipe and are trapped by the screen.</desc>
