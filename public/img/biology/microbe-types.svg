<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Four groups of microorganisms</title>
<desc id="d">A bacterium: a single cell with a cell wall, cytoplasm, a loop of DNA with no nucleus, and a flagellum. A virus: not a cell; genetic material inside a protein coat; it can only reproduce inside a host cell. A fungus (bread mould): thread-like hyphae forming a mycelium, with sporangia releasing spores. A protozoan (Amoeba): a single cell with a nucleus, cytoplasm, a contractile vacuole and pseudopodia.</desc>
