<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The parts of a compound light microscope</title>
<desc id="d">A light microscope with its parts labelled: eyepiece lens at the top of the body tube; revolving nosepiece holding the objective lenses; the stage with clips holding the slide; the condenser and diaphragm under the stage; the mirror or lamp at the base; coarse and fine focus knobs on the arm; and the base.</desc>
