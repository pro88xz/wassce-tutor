<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The nitrogen cycle</title>
<desc id="d">Nitrogen gas in the air is fixed by nitrogen-fixing bacteria, many in the root nodules of legumes, and by lightning. Plants absorb nitrates through their roots and make proteins; animals get proteins by feeding. Decomposers turn dead remains and wastes into ammonium compounds. Nitrifying bacteria turn ammonium into nitrites and then nitrates. Denitrifying bacteria turn nitrates back into nitrogen gas.</desc>
