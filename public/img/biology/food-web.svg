<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">A food web on farmland in Sierra Leone</title>
<desc id="d">Producers: grass and maize. Primary consumers: grasshopper, caterpillar, rat and weaver bird. Secondary consumers: lizard. Tertiary consumers: snake. The hawk is the top consumer, eating snakes, lizards, rats and weaver birds. Arrows point from the food to the feeder, the direction energy flows.</desc>
