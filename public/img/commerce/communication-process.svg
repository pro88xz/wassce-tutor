<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 320" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The communication process</title>
<desc id="d">A sender encodes a message and sends it through a channel to a receiver, who decodes it and sends feedback. Noise can distort the message along the way.</desc>
<defs><marker id="a0f172a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f172a"/></marker><marker id="a0f172as" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#0f172a"/></marker><marker id="a15803d" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker><marker id="a15803ds" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#15803d"/></marker></defs>
<rect width="780" height="320" rx="20" fill="#f8fafc"/>
<rect x="20.0" y="120.0" width="140.0" height="60.0" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="90.0" y="150.0" font-size="17" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Sender</text>
<rect x="195.0" y="120.0" width="150.0" height="60.0" rx="12" fill="#fef3c7" stroke="#ea580c" stroke-width="2.5"/>
<text x="270.0" y="139.0" font-size="16" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Message</text>
<text x="270.0" y="161.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">(encoded)</text>
<rect x="380.0" y="120.0" width="150.0" height="60.0" rx="12" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/>
<text x="455.0" y="139.0" font-size="16" fill="#0f766e" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Channel</text>
<text x="455.0" y="161.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">phone, letter, email</text>
<rect x="575.0" y="120.0" width="150.0" height="60.0" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
<text x="650.0" y="139.0" font-size="16" fill="#7c3aed" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Receiver</text>
<text x="650.0" y="161.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">(decodes)</text>
<line x1="166.0" y1="150.0" x2="189.0" y2="150.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<line x1="351.0" y1="150.0" x2="374.0" y2="150.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<line x1="536.0" y1="150.0" x2="569.0" y2="150.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<path d="M 650 186 C 650 280, 90 280, 90 186" stroke="#15803d" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 6" marker-end="url(#a15803d)"/>
<text x="370.0" y="268.0" font-size="16" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">feedback</text>
<text x="455.0" y="88.0" font-size="14" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="normal" font-style="italic">noise: poor network, unclear words</text>
<line x1="455.0" y1="98.0" x2="455.0" y2="116.0" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
<text x="390.0" y="34.0" font-size="18" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Communication is complete only when feedback returns</text>
</svg>
