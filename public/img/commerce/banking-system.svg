<title id="t">The banking system in Sierra Leone</title>
<desc id="d">The Bank of Sierra Leone is the central bank. It regulates and supervises commercial banks, community banks, development and other specialised banks, and microfinance and mobile money providers. These take deposits from and lend to households, businesses and government.</desc>
