<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Services of the wholesaler</title>
<desc id="d">The wholesaler stands between manufacturers and retailers. To manufacturers it buys in bulk, stores goods, pays promptly and passes on market information. To retailers it breaks bulk, gives credit, offers variety, delivers and advises.</desc>
<defs><marker id="a0f172a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f172a"/></marker><marker id="a0f172as" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#0f172a"/></marker></defs>
<rect width="780" height="440" rx="20" fill="#f8fafc"/>
<rect x="25.0" y="190.0" width="170.0" height="60.0" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="110.0" y="220.0" font-size="17" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Manufacturers</text>
<rect x="305.0" y="190.0" width="170.0" height="60.0" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
<text x="390.0" y="220.0" font-size="19" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Wholesaler</text>
<rect x="585.0" y="190.0" width="170.0" height="60.0" rx="12" fill="#fef3c7" stroke="#ea580c" stroke-width="2.5"/>
<text x="670.0" y="220.0" font-size="17" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Retailers</text>
<line x1="201.0" y1="220.0" x2="299.0" y2="220.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<line x1="481.0" y1="220.0" x2="579.0" y2="220.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<rect x="155.0" y="290.0" width="220.0" height="140.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<text x="265.0" y="310.0" font-size="14" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">to manufacturers</text>
<text x="265.0" y="334.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">buys in bulk</text>
<text x="265.0" y="354.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">stores the goods</text>
<text x="265.0" y="374.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">pays promptly (finance)</text>
<text x="265.0" y="394.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">market information</text>
<text x="265.0" y="414.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">bears some risk</text>
<rect x="405.0" y="290.0" width="220.0" height="140.0" rx="10" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
<text x="515.0" y="310.0" font-size="14" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">to retailers</text>
<text x="515.0" y="334.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">breaks bulk</text>
<text x="515.0" y="354.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">gives credit</text>
<text x="515.0" y="374.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">wide variety</text>
<text x="515.0" y="394.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">delivers goods</text>
<text x="515.0" y="414.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">advice on new products</text>
<text x="390.0" y="168.0" font-size="15" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal" font-style="italic">goods flow →</text>
<text x="390.0" y="40.0" font-size="18" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">The wholesaler serves both ends of the chain</text>
</svg>
