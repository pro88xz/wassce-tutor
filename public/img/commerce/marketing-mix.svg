<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 480" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The marketing mix: the four Ps</title>
<desc id="d">The four Ps of the marketing mix surround the target customer: product, price, place and promotion.</desc>
<defs><marker id="a15803d" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker><marker id="a15803ds" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#15803d"/></marker><marker id="a2563eb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a2563ebs" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#2563eb"/></marker><marker id="a7c3aed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker><marker id="a7c3aeds" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#7c3aed"/></marker><marker id="aea580c" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#ea580c"/></marker><marker id="aea580cs" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#ea580c"/></marker></defs>
<rect width="660" height="480" rx="20" fill="#f8fafc"/>
<rect x="235.0" y="215.0" width="190.0" height="70.0" rx="12" fill="#e2e8f0" stroke="#0f172a" stroke-width="2.5"/>
<text x="330.0" y="237.5" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Target</text>
<text x="330.0" y="262.5" font-size="17" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">customer</text>
<rect x="225.0" y="52.0" width="210.0" height="86.0" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="330.0" y="72.0" font-size="17" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Product</text>
<text x="330.0" y="95.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">what is sold: quality, design,</text>
<text x="330.0" y="118.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">brand, packaging</text>
<line x1="330.0" y1="144.0" x2="330.0" y2="209.0" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a2563eb)"/>
<rect x="5.0" y="207.0" width="210.0" height="86.0" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
<text x="110.0" y="227.0" font-size="17" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Price</text>
<text x="110.0" y="250.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">what customers pay:</text>
<text x="110.0" y="273.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">discounts, credit terms</text>
<line x1="221.0" y1="250.0" x2="229.0" y2="250.0" stroke="#15803d" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a15803d)"/>
<rect x="445.0" y="207.0" width="210.0" height="86.0" rx="12" fill="#fef3c7" stroke="#ea580c" stroke-width="2.5"/>
<text x="550.0" y="227.0" font-size="17" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Place</text>
<text x="550.0" y="250.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">where and how it is sold:</text>
<text x="550.0" y="273.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">channels, outlets</text>
<line x1="439.0" y1="250.0" x2="431.0" y2="250.0" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round" marker-end="url(#aea580c)"/>
<rect x="225.0" y="367.0" width="210.0" height="86.0" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
<text x="330.0" y="387.0" font-size="17" fill="#7c3aed" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Promotion</text>
<text x="330.0" y="410.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">how buyers learn of it:</text>
<text x="330.0" y="433.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">advertising, sales promotion</text>
<line x1="330.0" y1="361.0" x2="330.0" y2="291.0" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a7c3aed)"/>
