<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Warehousing bridges the gap between production and consumption</title>
<desc id="d">Rice is harvested mainly from September to December, but people eat it every month. In the harvest months production is above consumption and the surplus is stored; in the other months consumption is met from the warehouse.</desc>
