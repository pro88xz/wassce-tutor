<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 430" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The product life cycle</title>
<desc id="d">Sales of a product rise slowly at introduction, quickly during growth, level off at maturity and fall in decline.</desc>
