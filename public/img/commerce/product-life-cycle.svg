<text x="654.0" y="384.0" font-size="16" fill="#475569" text-anchor="end" dominant-baseline="middle" font-weight="normal">Time</text>
<text x="88.0" y="68.0" font-size="16" fill="#475569" text-anchor="start" dominant-baseline="middle" font-weight="normal">Sales</text>
