<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Public and private ownership</title>
<desc id="d">Nationalisation moves a business from private to government ownership; privatisation moves it from government to private owners. Commercialisation keeps it in government ownership but runs it on commercial lines for profit. Indigenisation transfers ownership from foreigners to citizens.</desc>
<defs><marker id="a15803d" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker><marker id="a15803ds" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#15803d"/></marker><marker id="a2563eb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a2563ebs" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#2563eb"/></marker><marker id="a7c3aed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker><marker id="a7c3aeds" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#7c3aed"/></marker></defs>
<rect width="780" height="420" rx="20" fill="#f8fafc"/>
<rect x="15.0" y="88.0" width="210.0" height="84.0" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="120.0" y="118.5" font-size="17" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Public sector</text>
<text x="120.0" y="141.5" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">owned by government</text>
<rect x="555.0" y="88.0" width="210.0" height="84.0" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
<text x="660.0" y="118.5" font-size="17" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Private sector</text>
<text x="660.0" y="141.5" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">owned by individuals</text>
<line x1="548.0" y1="100.0" x2="232.0" y2="100.0" stroke="#2563eb" stroke-width="3" stroke-linecap="round" marker-end="url(#a2563eb)"/>
<rect x="317.8" y="87.0" width="144.4" height="26.0" rx="4" fill="#f8fafc" stroke="none" stroke-width="0" opacity="0.92"/>
<text x="390.0" y="100.0" font-size="16" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">nationalisation</text>
<line x1="232.0" y1="160.0" x2="548.0" y2="160.0" stroke="#15803d" stroke-width="3" stroke-linecap="round" marker-end="url(#a15803d)"/>
<rect x="326.8" y="147.0" width="126.5" height="26.0" rx="4" fill="#f8fafc" stroke="none" stroke-width="0" opacity="0.92"/>
<text x="390.0" y="160.0" font-size="16" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">privatisation</text>
<rect x="22.0" y="227.0" width="236.0" height="70.0" rx="12" fill="#fef3c7" stroke="#ea580c" stroke-width="2.5"/>
<text x="140.0" y="251.0" font-size="16" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Commercialisation</text>
<text x="140.0" y="273.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">state-owned, run for profit</text>
<line x1="130.0" y1="172.0" x2="130.0" y2="227.0" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 5"/>
<rect x="385.0" y="268.0" width="170.0" height="64.0" rx="12" fill="#e2e8f0" stroke="#475569" stroke-width="2.5"/>
<text x="470.0" y="289.0" font-size="16" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Foreign</text>
<text x="470.0" y="311.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">owners</text>
<rect x="615.0" y="268.0" width="150.0" height="64.0" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
<text x="690.0" y="300.0" font-size="17" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Citizens</text>
<line x1="561.0" y1="300.0" x2="609.0" y2="300.0" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a7c3aed)"/>
<text x="580.0" y="360.0" font-size="16" fill="#7c3aed" text-anchor="middle" dominant-baseline="middle" font-weight="bold">indigenisation</text>
<text x="390.0" y="36.0" font-size="18" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Moving businesses between owners</text>
</svg>
