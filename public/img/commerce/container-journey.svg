<line x1="501.0" y1="130.0" x2="539.0" y2="130.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<line x1="650.0" y1="172.0" x2="650.0" y2="268.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<rect x="598.8" y="207.5" width="102.4" height="25.0" rx="4" fill="#f8fafc" stroke="none" stroke-width="0" opacity="0.92"/>
<text x="650.0" y="220.0" font-size="15" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">ship at sea</text>
<line x1="539.0" y1="310.0" x2="501.0" y2="310.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<line x1="279.0" y1="310.0" x2="241.0" y2="310.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<text x="390.0" y="392.0" font-size="15" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal" font-style="italic">the same sealed box all the way: less handling, theft and damage</text>
<text x="390.0" y="40.0" font-size="18" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Containerisation: one box from door to door</text>
</svg>
