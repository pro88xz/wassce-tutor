<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Types of business combination</title>
<desc id="d">Stages in the rice trade run from rice farms to a rice mill, a wholesaler and retail shops. A rice mill joining a farm is backward vertical integration; joining a wholesaler or shops is forward vertical integration; joining another rice mill is horizontal integration; joining an unrelated firm such as a soap factory is lateral (conglomerate) integration.</desc>
