<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Open and crossed cheques</title>
<desc id="d">An open cheque can be cashed over the counter. A general crossing (two parallel lines) means it must be paid into a bank account. A special crossing names the bank. &#x27;Account payee only&#x27; means it can be paid only into the payee&#x27;s account.</desc>
