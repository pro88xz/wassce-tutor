<title id="t">The branches of commerce</title>
<desc id="d">Commerce is divided into trade and aids to trade. Trade is home trade (retail and wholesale) or foreign trade (import, export and entrepôt). Aids to trade are transport, communication, banking, insurance, warehousing and advertising.</desc>
