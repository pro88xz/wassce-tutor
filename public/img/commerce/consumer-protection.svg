<text x="130.0" y="188.5" font-size="17" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Consumer</text>
<text x="130.0" y="211.5" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">associations</text>
<line x1="250.0" y1="200.0" x2="274.0" y2="255.0" stroke="#15803d" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a15803d)"/>
