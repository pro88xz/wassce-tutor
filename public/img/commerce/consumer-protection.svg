<text x="585.0" y="408.5" font-size="17" fill="#0f766e" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Consumers</text>
<text x="585.0" y="431.5" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">themselves: care, receipts</text>
<line x1="585.0" y1="377.0" x2="380.0" y2="296.0" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a0f766e)"/>
