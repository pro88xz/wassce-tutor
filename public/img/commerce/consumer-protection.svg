<text x="175.0" y="431.5" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">exposes bad practice</text>
<line x1="175.0" y1="377.0" x2="380.0" y2="296.0" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a7c3aed)"/>
