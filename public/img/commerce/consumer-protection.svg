<text x="380.0" y="242.5" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">The</text>
<text x="380.0" y="267.5" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">consumer</text>
<rect x="266.0" y="41.0" width="228.0" height="74.0" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="380.0" y="66.5" font-size="17" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Government</text>
<text x="380.0" y="89.5" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">laws, agencies, courts</text>
<line x1="380.0" y1="121.0" x2="380.0" y2="214.0" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a2563eb)"/>
