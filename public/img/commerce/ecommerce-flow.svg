<text x="236.0" y="139.0" font-size="16" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Online shop</text>
<text x="236.0" y="161.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">website or app</text>
<line x1="153.0" y1="150.0" x2="165.0" y2="150.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a0f172a)"/>
