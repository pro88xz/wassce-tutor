<title id="t">Communication services</title>
<desc id="d">Postal services carry letters and parcels, with registered post, post office boxes and express mail. Courier companies give fast, tracked door-to-door delivery. Telecommunication covers mobile calls and SMS, the internet and email, and radio and television.</desc>
