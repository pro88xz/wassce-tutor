<text x="249.4" y="387.2" font-size="15" fill="#7c3aed" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Intention to</text>
<text x="249.4" y="408.2" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">create legal relations</text>
<line x1="249.4" y1="362.7" x2="360.0" y2="284.0" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a7c3aed)"/>
