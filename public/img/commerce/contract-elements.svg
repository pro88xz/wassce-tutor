<text x="111.4" y="278.9" font-size="15" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Legality</text>
<line x1="210.4" y1="278.9" x2="256.0" y2="240.0" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round" marker-end="url(#adc2626)"/>
