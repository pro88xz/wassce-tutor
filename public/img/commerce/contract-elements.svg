<text x="160.6" y="130.9" font-size="15" fill="#0f766e" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Genuine consent</text>
<line x1="160.6" y1="161.9" x2="360.0" y2="196.0" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a0f766e)"/>
