<rect x="260.0" y="200.0" width="200.0" height="80.0" rx="12" fill="#e2e8f0" stroke="#0f172a" stroke-width="2.5"/>
<text x="360.0" y="227.0" font-size="20" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Valid</text>
<text x="360.0" y="253.0" font-size="18" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">contract</text>
<rect x="265.0" y="38.0" width="190.0" height="54.0" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
