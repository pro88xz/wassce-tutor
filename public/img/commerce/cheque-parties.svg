<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The three parties to a cheque</title>
<desc id="d">On a cheque, the drawer (the account holder who signs it) orders the drawee (the bank) to pay a sum of money to the payee (the person named).</desc>
<defs><marker id="a15803d" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker><marker id="a15803ds" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#15803d"/></marker><marker id="a2563eb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a2563ebs" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#2563eb"/></marker><marker id="a7c3aed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker><marker id="a7c3aeds" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#7c3aed"/></marker></defs>
<rect width="720" height="360" rx="20" fill="#f8fafc"/>
<rect x="130.0" y="90.0" width="460.0" height="150.0" rx="8" fill="#fffdf5" stroke="#0f172a" stroke-width="2"/>
<text x="144.0" y="112.0" font-size="13" fill="#2563eb" text-anchor="start" dominant-baseline="middle" font-weight="bold">ABC BANK  ·  Freetown</text>
<text x="576.0" y="112.0" font-size="12" fill="#475569" text-anchor="end" dominant-baseline="middle" font-weight="normal">Date: 12/03/2026</text>
<text x="144.0" y="142.0" font-size="13" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">Pay: Kamara Hardware Ltd</text>
<line x1="180.0" y1="148.0" x2="470.0" y2="148.0" stroke="#475569" stroke-width="1" stroke-linecap="round"/>
<text x="144.0" y="170.0" font-size="12" fill="#475569" text-anchor="start" dominant-baseline="middle" font-weight="normal">Two thousand leones only</text>
<rect x="480.0" y="154.0" width="96.0" height="26.0" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
<text x="528.0" y="167.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">NLe 2,000</text>
<text x="576.0" y="226.0" font-size="14" fill="#0f172a" text-anchor="end" dominant-baseline="middle" font-weight="normal" font-style="italic">F. Conteh</text>
<line x1="600.0" y1="320.0" x2="560.0" y2="236.0" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a7c3aed)"/>
<text x="600.0" y="336.0" font-size="15" fill="#7c3aed" text-anchor="middle" dominant-baseline="middle" font-weight="bold">drawer: signs (F. Conteh)</text>
<line x1="160.0" y1="64.0" x2="170.0" y2="100.0" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a2563eb)"/>
