<text x="80.0" y="400.0" font-size="15" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">many insured pay</text>
<text x="80.0" y="380.0" font-size="13" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="normal">small premiums</text>
<circle cx="640.0" cy="160.0" r="16.0" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
