<text x="630.0" y="330.0" font-size="15" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="bold">the few who suffer</text>
<text x="630.0" y="350.0" font-size="15" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="bold">a loss are compensated</text>
<text x="380.0" y="30.0" font-size="17" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">The losses of the few are paid by the contributions of the many</text>
</svg>
