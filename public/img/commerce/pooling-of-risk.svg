<text x="380.0" y="198.0" font-size="18" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Insurance fund</text>
<text x="380.0" y="222.0" font-size="16" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">(the pool)</text>
