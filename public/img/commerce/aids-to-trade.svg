<text x="360.0" y="88.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">removed by</text>
<line x1="286.0" y1="100.0" x2="444.0" y2="100.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<rect x="40.0" y="142.0" width="240.0" height="48.0" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
<text x="160.0" y="166.0" font-size="16" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Time</text>
