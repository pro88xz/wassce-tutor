<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">How the aids to trade remove hindrances to trade</title>
<desc id="d">Each hindrance to trade is removed by an aid: distance by transport, time by warehousing, risk by insurance, lack of finance by banking, lack of information by advertising, and distance between traders by communication.</desc>
