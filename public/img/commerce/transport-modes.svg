<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Modes of transport</title>
<desc id="d">Transport is by land (road, rail and pipeline), by water (inland waterways, coastal shipping and ocean shipping by liners and tramps) and by air (scheduled passenger and cargo flights, and charter flights).</desc>
