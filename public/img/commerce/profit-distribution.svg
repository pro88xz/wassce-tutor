<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The order in which company profit is paid out</title>
<desc id="d">Out of a profit of NLe 56,000: first debenture interest of NLe 6,000, then the preference dividend of NLe 8,000, then NLe 12,000 kept as reserves, leaving NLe 30,000 for the ordinary dividend.</desc>
<defs></defs>
<rect width="780" height="340" rx="20" fill="#f8fafc"/>
<rect x="60.0" y="140.0" width="70.7" height="60.0" rx="0" fill="#fef3c7" stroke="#ea580c" stroke-width="2.5"/>
<line x1="95.4" y1="140.0" x2="95.4" y2="118.0" stroke="#ea580c" stroke-width="2" stroke-linecap="round"/>
<text x="95.4" y="88.0" font-size="15" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">1 Debenture interest</text>
<text x="95.4" y="108.0" font-size="14" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="normal">NLe 6,000</text>
<rect x="130.7" y="140.0" width="94.3" height="60.0" rx="0" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
<line x1="177.9" y1="200.0" x2="177.9" y2="222.0" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/>
<text x="177.9" y="236.0" font-size="15" fill="#7c3aed" text-anchor="middle" dominant-baseline="middle" font-weight="bold">2 Preference dividend</text>
<text x="177.9" y="256.0" font-size="14" fill="#7c3aed" text-anchor="middle" dominant-baseline="middle" font-weight="normal">NLe 8,000</text>
<rect x="225.0" y="140.0" width="141.4" height="60.0" rx="0" fill="#e2e8f0" stroke="#475569" stroke-width="2.5"/>
<line x1="295.7" y1="140.0" x2="295.7" y2="118.0" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
<text x="295.7" y="88.0" font-size="15" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="bold">3 Reserves</text>
<text x="295.7" y="108.0" font-size="14" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">NLe 12,000</text>
<rect x="366.4" y="140.0" width="353.6" height="60.0" rx="0" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
<line x1="543.2" y1="200.0" x2="543.2" y2="222.0" stroke="#15803d" stroke-width="2" stroke-linecap="round"/>
<text x="543.2" y="236.0" font-size="15" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">4 Ordinary dividend</text>
<text x="543.2" y="256.0" font-size="14" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="normal">NLe 30,000</text>
<text x="390.0" y="300.0" font-size="15" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal" font-style="italic">profit NLe 56,000: creditors are paid first, ordinary shareholders last</text>
<text x="390.0" y="30.0" font-size="18" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Creditors first, owners last</text>
</svg>
