<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Grouping binary digits to convert to octal and hexadecimal</title>
<desc id="d">For octal, group the bits in threes from the right: 10 011 101 gives 2, 3 and 5, so 10011101 in binary is 235 in octal. For hexadecimal, group the bits in fours: 1001 1101 gives 9 and 13, and 13 is D, so 10011101 in binary is 9D in hexadecimal.</desc>
<defs><marker id="a2563eb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a2563ebs" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#2563eb"/></marker><marker id="aea580c" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#ea580c"/></marker><marker id="aea580cs" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#ea580c"/></marker></defs>
<rect width="720" height="400" rx="20" fill="#f8fafc"/>
<text x="360.0" y="30.0" font-size="18" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">10011101₂ in octal and in hexadecimal</text>
<text x="170.0" y="95.0" font-size="18" fill="#ea580c" text-anchor="end" dominant-baseline="middle" font-weight="bold">Octal:</text>
<text x="170.0" y="120.0" font-size="14" fill="#475569" text-anchor="end" dominant-baseline="middle" font-weight="normal">groups of 3</text>
<rect x="195.0" y="70.0" width="76.0" height="50.0" rx="8" fill="#fef3c7" stroke="#ea580c" stroke-width="2.5"/>
<text x="233.0" y="95.0" font-size="24" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">10</text>
<line x1="233.0" y1="126.0" x2="233.0" y2="152.0" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round" marker-end="url(#aea580c)"/>
<text x="233.0" y="172.0" font-size="26" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">2</text>
<rect x="289.0" y="70.0" width="102.0" height="50.0" rx="8" fill="#fef3c7" stroke="#ea580c" stroke-width="2.5"/>
<text x="340.0" y="95.0" font-size="24" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">011</text>
<line x1="340.0" y1="126.0" x2="340.0" y2="152.0" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round" marker-end="url(#aea580c)"/>
<text x="340.0" y="172.0" font-size="26" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">3</text>
<rect x="409.0" y="70.0" width="102.0" height="50.0" rx="8" fill="#fef3c7" stroke="#ea580c" stroke-width="2.5"/>
<text x="460.0" y="95.0" font-size="24" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">101</text>
<line x1="460.0" y1="126.0" x2="460.0" y2="152.0" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round" marker-end="url(#aea580c)"/>
<text x="460.0" y="172.0" font-size="26" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">5</text>
<text x="559.0" y="172.0" font-size="24" fill="#ea580c" text-anchor="start" dominant-baseline="middle" font-weight="bold">= 235₈</text>
<text x="170.0" y="255.0" font-size="18" fill="#2563eb" text-anchor="end" dominant-baseline="middle" font-weight="bold">Hexadecimal:</text>
<text x="170.0" y="280.0" font-size="14" fill="#475569" text-anchor="end" dominant-baseline="middle" font-weight="normal">groups of 4</text>
<rect x="195.0" y="230.0" width="128.0" height="50.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="259.0" y="255.0" font-size="24" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">1001</text>
<line x1="259.0" y1="286.0" x2="259.0" y2="312.0" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a2563eb)"/>
<text x="259.0" y="332.0" font-size="24" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">9</text>
<rect x="341.0" y="230.0" width="128.0" height="50.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="405.0" y="255.0" font-size="24" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">1101</text>
<line x1="405.0" y1="286.0" x2="405.0" y2="312.0" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a2563eb)"/>
<text x="405.0" y="332.0" font-size="24" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">D (13)</text>
<text x="517.0" y="332.0" font-size="24" fill="#2563eb" text-anchor="start" dominant-baseline="middle" font-weight="bold">= 9D₁₆</text>
<text x="360.0" y="380.0" font-size="15" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Hex digits after 9: A = 10, B = 11, C = 12, D = 13, E = 14, F = 15</text>
</svg>
