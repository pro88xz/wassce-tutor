<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Variables and an array in memory</title>
<desc id="d">Variables drawn as labelled boxes in memory: age holds the integer 17; price holds the real number 2.5; name holds the string Fatmata; passed holds the Boolean value True. Below, an array called marks holds five values, 67, 82, 45, 90 and 73, in boxes numbered by their index from 0 to 4, so marks[3] is 90.</desc>
<defs></defs>
<rect width="880" height="470" rx="20" fill="#f8fafc"/>
<text x="440.0" y="30.0" font-size="15" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Each variable is a named box in memory that holds one value of one data type</text>
<text x="120.0" y="72.0" font-size="17" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">age</text>
<rect x="35.0" y="88.0" width="170.0" height="66.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="120" y="121" font-size="22" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-family="Consolas, Courier New, monospace">17</text>
<text x="120.0" y="176.0" font-size="14" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">integer</text>
<text x="333.0" y="72.0" font-size="17" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">price</text>
<rect x="248.0" y="88.0" width="170.0" height="66.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
<text x="333" y="121" font-size="22" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-family="Consolas, Courier New, monospace">2.5</text>
<text x="333.0" y="176.0" font-size="14" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">real (float)</text>
<text x="546.0" y="72.0" font-size="17" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">name</text>
<rect x="461.0" y="88.0" width="170.0" height="66.0" rx="6" fill="#fef3c7" stroke="#ea580c" stroke-width="2.5"/>
<text x="546" y="121" font-size="22" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-family="Consolas, Courier New, monospace">&quot;Fatmata&quot;</text>
<text x="546.0" y="176.0" font-size="14" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">string</text>
<text x="759.0" y="72.0" font-size="17" fill="#7c3aed" text-anchor="middle" dominant-baseline="middle" font-weight="bold">passed</text>
<rect x="674.0" y="88.0" width="170.0" height="66.0" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
<text x="759" y="121" font-size="22" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-family="Consolas, Courier New, monospace">True</text>
<text x="759.0" y="176.0" font-size="14" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Boolean</text>
<line x1="40.0" y1="210.0" x2="840.0" y2="210.0" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
<text x="440.0" y="240.0" font-size="15" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="bold">An array holds many values of the same type under one name, each found by its index</text>
<text x="110.0" y="300.0" font-size="19" fill="#0f766e" text-anchor="end" dominant-baseline="middle" font-weight="bold">marks</text>
<rect x="130.0" y="270.0" width="140.0" height="62.0" rx="0" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/>
<text x="200" y="302" font-size="24" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-family="Consolas, Courier New, monospace">67</text>
<text x="200.0" y="352.0" font-size="14" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">index 0</text>
<rect x="270.0" y="270.0" width="140.0" height="62.0" rx="0" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/>
<text x="340" y="302" font-size="24" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-family="Consolas, Courier New, monospace">82</text>
<text x="340.0" y="352.0" font-size="14" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">index 1</text>
<rect x="410.0" y="270.0" width="140.0" height="62.0" rx="0" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/>
<text x="480" y="302" font-size="24" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-family="Consolas, Courier New, monospace">45</text>
<text x="480.0" y="352.0" font-size="14" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">index 2</text>
<rect x="550.0" y="270.0" width="140.0" height="62.0" rx="0" fill="#fef3c7" stroke="#ea580c" stroke-width="2.5"/>
<text x="620" y="302" font-size="24" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-family="Consolas, Courier New, monospace">90</text>
<text x="620.0" y="352.0" font-size="14" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">index 3</text>
<rect x="690.0" y="270.0" width="140.0" height="62.0" rx="0" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/>
<text x="760" y="302" font-size="24" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-family="Consolas, Courier New, monospace">73</text>
<text x="760.0" y="352.0" font-size="14" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">index 4</text>
<text x="440" y="405" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-family="Consolas, Courier New, monospace">marks[3] is 90</text>
<text x="440.0" y="440.0" font-size="14" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Most languages, including Python, number array positions from 0.</text>
</svg>
