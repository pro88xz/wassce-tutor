<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Uses of ICT in society</title>
<desc id="d">ICT at the centre, linked to ten areas of life: education (e-learning, online results), health (telemedicine, patient records), banking (mobile money, online banking, ATMs), agriculture (weather and market prices by phone), commerce (e-commerce, point-of-sale), government (e-government, digital ID, elections), communication (calls, messaging, social media), transport (GPS, online tickets), entertainment (streaming, games) and security (CCTV, biometrics).</desc>
