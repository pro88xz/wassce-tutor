<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 430" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Where the operating system sits</title>
<desc id="d">Four layers, from top to bottom: the user, application software, the operating system and the hardware. Arrows run both ways between each pair of layers: the operating system sits between applications and the hardware. A side panel lists the functions of an operating system: managing the processor, memory, files and storage, and input and output devices, providing the user interface, and security.</desc>
<defs><marker id="a475569" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker><marker id="a475569s" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#475569"/></marker></defs>
<rect width="840" height="430" rx="20" fill="#f8fafc"/>
<rect x="40.0" y="29.0" width="380.0" height="62.0" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
<text x="230.0" y="48.0" font-size="18" fill="#7c3aed" text-anchor="middle" dominant-baseline="middle" font-weight="bold">User</text>
<text x="230.0" y="72.0" font-size="16" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">gives commands, sees results</text>
<rect x="40.0" y="129.0" width="380.0" height="62.0" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
<text x="230.0" y="148.0" font-size="18" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Application software</text>
<text x="230.0" y="172.0" font-size="16" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">word processor, browser, games</text>
<rect x="40.0" y="229.0" width="380.0" height="62.0" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="230.0" y="248.0" font-size="18" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Operating system</text>
<text x="230.0" y="272.0" font-size="16" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Windows, Android, Linux, macOS, iOS</text>
<rect x="40.0" y="329.0" width="380.0" height="62.0" rx="12" fill="#fef3c7" stroke="#ea580c" stroke-width="2.5"/>
<text x="230.0" y="348.0" font-size="18" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Hardware</text>
<text x="230.0" y="372.0" font-size="16" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">CPU, memory, disks, keyboard, screen</text>
<line x1="216.0" y1="97.0" x2="216.0" y2="123.0" stroke="#475569" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a475569)"/>
<line x1="244.0" y1="123.0" x2="244.0" y2="97.0" stroke="#475569" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a475569)"/>
<line x1="216.0" y1="197.0" x2="216.0" y2="223.0" stroke="#475569" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a475569)"/>
<line x1="244.0" y1="223.0" x2="244.0" y2="197.0" stroke="#475569" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a475569)"/>
<line x1="216.0" y1="297.0" x2="216.0" y2="323.0" stroke="#475569" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a475569)"/>
<line x1="244.0" y1="323.0" x2="244.0" y2="297.0" stroke="#475569" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a475569)"/>
<rect x="470.0" y="60.0" width="340.0" height="330.0" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
<text x="640.0" y="92.0" font-size="17" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Functions of an operating system</text>
<text x="492.0" y="136.0" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">• manages the processor (tasks)</text>
<text x="492.0" y="174.0" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">• manages memory (RAM)</text>
<text x="492.0" y="212.0" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">• manages files and storage</text>
<text x="492.0" y="250.0" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">• controls input and output devices</text>
<text x="492.0" y="288.0" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">• provides the user interface</text>
<text x="492.0" y="326.0" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">• keeps the computer secure</text>
<text x="492.0" y="364.0" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">• reports errors</text>
</svg>
