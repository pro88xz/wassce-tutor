<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Parts of the desktop</title>
<desc id="d">A computer desktop. Icons such as This PC, Recycle Bin and Documents sit on the background (wallpaper). An open window has a title bar with minimise, maximise and close buttons. Along the bottom is the taskbar, with the Start button at the left, buttons for open and pinned programs, and the notification area with the clock at the right. A mouse pointer is on the screen.</desc>
