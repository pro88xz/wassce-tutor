<text x="74.0" y="544.0" font-size="14" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">Top of the screen at or just below eye level</text>
<circle cx="54.0" cy="570.0" r="13.0" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>
<text x="54.0" y="570.0" font-size="14" fill="#ffffff" text-anchor="middle" dominant-baseline="middle" font-weight="bold">2</text>
<text x="74.0" y="570.0" font-size="14" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">Screen about an arm&#x27;s length away (50–70 cm)</text>
<circle cx="54.0" cy="596.0" r="13.0" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>
<text x="54.0" y="596.0" font-size="14" fill="#ffffff" text-anchor="middle" dominant-baseline="middle" font-weight="bold">3</text>
<text x="74.0" y="596.0" font-size="14" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">Back upright and supported by the chair</text>
<circle cx="54.0" cy="622.0" r="13.0" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>
<text x="54.0" y="622.0" font-size="14" fill="#ffffff" text-anchor="middle" dominant-baseline="middle" font-weight="bold">4</text>
<text x="74.0" y="622.0" font-size="14" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">Elbows at about 90°, forearms level</text>
<circle cx="474.0" cy="544.0" r="13.0" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>
<text x="474.0" y="544.0" font-size="14" fill="#ffffff" text-anchor="middle" dominant-baseline="middle" font-weight="bold">5</text>
<text x="494.0" y="544.0" font-size="14" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">Wrists straight; keyboard and mouse close</text>
<circle cx="474.0" cy="570.0" r="13.0" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>
<text x="474.0" y="570.0" font-size="14" fill="#ffffff" text-anchor="middle" dominant-baseline="middle" font-weight="bold">6</text>
<text x="494.0" y="570.0" font-size="14" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">Thighs level, knees at about 90°</text>
