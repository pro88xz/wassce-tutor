<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 690" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">A healthy computer workstation</title>
<desc id="d">Side view of a person sitting correctly at a computer: the top of the screen is at or slightly below eye level, about an arm&#x27;s length (50 to 70 centimetres) away; the back is upright and supported by the chair; the shoulders are relaxed; the elbows are bent at about 90 degrees with the forearms level; the wrists are straight; the thighs are level with the knees at about 90 degrees; and the feet are flat on the floor or a footrest. Rest the eyes every 20 minutes and take regular breaks.</desc>
