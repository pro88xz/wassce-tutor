<title id="t">Folders and files on a drive</title>
<desc id="d">A folder tree, as shown in a file manager. The drive Local Disk (C:) is the root. It contains the folders Program Files, Users and Windows. Users contains the folder Aminata, which contains Documents and Pictures. Documents contains School, which contains SSS3, which holds the files ICT notes.docx and Maths results.xlsx. Pictures holds graduation.jpg. The path to the ICT notes file is C:\Users\Aminata\Documents\School\SSS3\ICT notes.docx.</desc>
