<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Client-server and peer-to-peer networks</title>
<desc id="d">Two ways of organising a network. In a client-server network, one powerful central computer, the server, stores the shared files, programs and security, and the other computers, the clients, ask it for services. In a peer-to-peer network there is no server: every computer is equal and shares its own files and printer directly with the others.</desc>
