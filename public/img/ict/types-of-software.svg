<rect x="95.0" y="174.0" width="290.0" height="48.0" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
<text x="240.0" y="187.5" font-size="15" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Operating system</text>
<text x="240.0" y="208.5" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Windows, Android, Linux, macOS</text>
<line x1="85.0" y1="254.0" x2="89.0" y2="254.0" stroke="#475569" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a475569)"/>
<rect x="95.0" y="230.0" width="290.0" height="48.0" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
<text x="240.0" y="243.5" font-size="15" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Utility programs</text>
<text x="240.0" y="264.5" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">antivirus, backup, disk cleanup</text>
<line x1="85.0" y1="310.0" x2="89.0" y2="310.0" stroke="#475569" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a475569)"/>
