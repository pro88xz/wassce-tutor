<text x="240.0" y="355.5" font-size="15" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Device drivers</text>
<text x="240.0" y="376.5" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">printer and graphics drivers</text>
<line x1="475.0" y1="168.0" x2="475.0" y2="310.0" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>
<line x1="475.0" y1="198.0" x2="479.0" y2="198.0" stroke="#475569" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a475569)"/>
<rect x="485.0" y="174.0" width="290.0" height="48.0" rx="12" fill="#ffffff" stroke="#15803d" stroke-width="2.5"/>
<text x="630.0" y="187.5" font-size="15" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">General-purpose packages</text>
<text x="630.0" y="208.5" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">word processor, spreadsheet</text>
<line x1="475.0" y1="254.0" x2="479.0" y2="254.0" stroke="#475569" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a475569)"/>
<rect x="485.0" y="230.0" width="290.0" height="48.0" rx="12" fill="#ffffff" stroke="#15803d" stroke-width="2.5"/>
<text x="630.0" y="243.5" font-size="15" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Special-purpose software</text>
<text x="630.0" y="264.5" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">payroll, school results, hotel booking</text>
<line x1="475.0" y1="310.0" x2="479.0" y2="310.0" stroke="#475569" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a475569)"/>
<rect x="485.0" y="286.0" width="290.0" height="48.0" rx="12" fill="#ffffff" stroke="#15803d" stroke-width="2.5"/>
<text x="630.0" y="299.5" font-size="15" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Bespoke (custom) software</text>
<text x="630.0" y="320.5" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">written for one organisation</text>
<text x="630.0" y="400.0" font-size="14" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">packages are bought ready-made (&#x27;off the shelf&#x27;);</text>
<text x="630.0" y="422.0" font-size="14" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">bespoke software is written to order</text>
</svg>
