<text x="240.0" y="299.5" font-size="15" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Language translators</text>
<text x="240.0" y="320.5" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">compiler, interpreter, assembler</text>
<line x1="85.0" y1="366.0" x2="89.0" y2="366.0" stroke="#475569" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a475569)"/>
