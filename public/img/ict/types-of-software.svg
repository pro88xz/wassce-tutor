<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Types of software</title>
<desc id="d">Software is divided into system software, which runs and manages the computer, and application software, which does users&#x27; tasks. System software includes the operating system, utility programs, language translators and device drivers. Application software includes general-purpose packages such as word processors and spreadsheets, special-purpose software such as payroll programs, and bespoke (custom) software written for one organisation.</desc>
<defs><marker id="a475569" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker><marker id="a475569s" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#475569"/></marker></defs>
<rect width="820" height="460" rx="20" fill="#f8fafc"/>
<rect x="310.0" y="25.0" width="200.0" height="46.0" rx="12" fill="#e2e8f0" stroke="#0f172a" stroke-width="2.5"/>
<text x="410.0" y="48.0" font-size="20" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Software</text>
<rect x="65.0" y="112.0" width="300.0" height="56.0" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="215.0" y="128.5" font-size="17" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">System software</text>
<text x="215.0" y="151.5" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">runs and manages the computer</text>
<rect x="455.0" y="112.0" width="300.0" height="56.0" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
<text x="605.0" y="128.5" font-size="17" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Application software</text>
<text x="605.0" y="151.5" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">does the user&#x27;s tasks</text>
