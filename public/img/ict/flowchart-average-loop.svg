<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 760" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Flowchart: a loop to average five marks</title>
<desc id="d">A flowchart with a loop. Start; set total to 0 and count to 1; decision: is count less than or equal to 5? If yes: input a mark, add it to the total, add 1 to count, and go back to the decision. If no: work out average = total divided by 5, print the average, and stop.</desc>
<defs><marker id="a0f172a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f172a"/></marker><marker id="a0f172as" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#0f172a"/></marker></defs>
<rect width="760" height="760" rx="20" fill="#f8fafc"/>
<rect x="230.0" y="18.0" width="140.0" height="44.0" rx="22.0" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
<text x="300.0" y="40.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Start</text>
<rect x="190.0" y="93.0" width="220.0" height="50.0" rx="0" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
<text x="300.0" y="109.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">total = 0</text>
<text x="300.0" y="127.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">count = 1</text>
<polygon points="300.0,186.0 410.0,238.0 300.0,290.0 190.0,238.0" fill="#fef3c7" stroke="#ea580c" stroke-width="2.5" stroke-linejoin="round"/>
<text x="300.0" y="238.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">count ≤ 5?</text>
<polygon points="221.0,336.0 395.0,336.0 379.0,384.0 205.0,384.0" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round"/>
<text x="300.0" y="360.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Input mark</text>
<rect x="185.0" y="416.0" width="230.0" height="48.0" rx="0" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
<text x="300.0" y="440.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">total = total + mark</text>
<rect x="185.0" y="494.0" width="230.0" height="48.0" rx="0" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
<text x="300.0" y="518.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">count = count + 1</text>
<rect x="490.0" y="336.0" width="220.0" height="48.0" rx="0" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
<text x="600.0" y="360.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">average = total ÷ 5</text>
<polygon points="516.0,426.0 700.0,426.0 684.0,474.0 500.0,474.0" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round"/>
<text x="600.0" y="450.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Print average</text>
<rect x="530.0" y="518.0" width="140.0" height="44.0" rx="22.0" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
<text x="600.0" y="540.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Stop</text>
<line x1="300.0" y1="64.0" x2="300.0" y2="89.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<line x1="300.0" y1="145.0" x2="300.0" y2="182.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<line x1="300.0" y1="292.0" x2="300.0" y2="332.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<line x1="300.0" y1="386.0" x2="300.0" y2="412.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<line x1="300.0" y1="466.0" x2="300.0" y2="490.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<path d="M 300.0 542.0 L 300.0 580.0 L 80.0 580.0 L 80.0 238.0 L 182.0 238.0" stroke="#0f172a" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<rect x="42.2" y="398.5" width="75.5" height="23.0" rx="4" fill="#f8fafc" stroke="none" stroke-width="0" opacity="0.92"/>
<text x="80.0" y="410.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">loop back</text>
<rect x="304.4" y="287.5" width="35.2" height="25.0" rx="4" fill="#f8fafc" stroke="none" stroke-width="0" opacity="0.92"/>
<text x="322.0" y="300.0" font-size="15" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Yes</text>
<path d="M 410.0 238.0 L 600.0 238.0 L 600.0 330.0" stroke="#0f172a" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<rect x="456.6" y="209.5" width="26.8" height="25.0" rx="4" fill="#f8fafc" stroke="none" stroke-width="0" opacity="0.92"/>
<text x="470.0" y="222.0" font-size="15" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="bold">No</text>
<line x1="600.0" y1="386.0" x2="600.0" y2="422.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<line x1="600.0" y1="476.0" x2="600.0" y2="514.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<rect x="40.0" y="620.0" width="680.0" height="120.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="380.0" y="645.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">The loop body runs 5 times (count = 1, 2, 3, 4, 5); when count becomes 6 the test is No.</text>
<text x="380.0" y="675.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Marks 12, 15, 9, 18, 16 give total = 70, so average = 70 ÷ 5 = 14.</text>
<text x="380.0" y="712.0" font-size="14" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Sequence: steps in order.  Selection: the decision.  Iteration: the loop.</text>
</svg>
