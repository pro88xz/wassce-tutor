<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The program development life cycle</title>
<desc id="d">The program development life cycle as a circle of seven stages: problem definition, problem analysis, program design (algorithms, flowcharts, pseudocode), coding, testing and debugging, implementation, and maintenance, which leads back to problem definition when changes are needed. Documentation, in the centre, is written at every stage.</desc>
<defs><marker id="a475569" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker><marker id="a475569s" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#475569"/></marker></defs>
<rect width="900" height="600" rx="20" fill="#f8fafc"/>
