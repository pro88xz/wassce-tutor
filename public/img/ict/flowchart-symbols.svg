<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Flowchart symbols</title>
<desc id="d">The standard flowchart symbols: the terminal, an oval, marks Start and Stop; the parallelogram is for input and output, such as reading a number or printing a result; the rectangle is a process, such as a calculation; the diamond is a decision with Yes and No exits; the small circle is a connector that joins parts of a flowchart; the arrow, a flow line, shows the order of steps; and a rectangle with double sides is a predefined process, a subroutine described elsewhere.</desc>
<defs><marker id="a0f172a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f172a"/></marker><marker id="a0f172as" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#0f172a"/></marker></defs>
