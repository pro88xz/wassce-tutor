<title id="t">The classification of computers</title>
<desc id="d">Computers are classified in three ways. By type (how they handle data): analogue, digital and hybrid. By size and power: supercomputer, mainframe, minicomputer and microcomputer. By purpose: general-purpose and special-purpose.</desc>
