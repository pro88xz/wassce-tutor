<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Flowchart: pass or fail</title>
<desc id="d">A flowchart with a decision. Start; input the mark; decision: is the mark greater than or equal to 50? If yes, print Pass; if no, print Fail; both paths join and go to Stop.</desc>
<defs><marker id="a0f172a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f172a"/></marker><marker id="a0f172as" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#0f172a"/></marker></defs>
<rect width="640" height="600" rx="20" fill="#f8fafc"/>
<rect x="250.0" y="22.0" width="140.0" height="46.0" rx="23.0" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
<text x="320.0" y="45.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Start</text>
<polygon points="236.0,110.0 420.0,110.0 404.0,160.0 220.0,160.0" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round"/>
<text x="320.0" y="135.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Input mark</text>
<polygon points="320.0,205.0 430.0,260.0 320.0,315.0 210.0,260.0" fill="#fef3c7" stroke="#ea580c" stroke-width="2.5" stroke-linejoin="round"/>
<text x="320.0" y="260.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">mark ≥ 50?</text>
<polygon points="66.0,365.0 230.0,365.0 214.0,415.0 50.0,415.0" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round"/>
<text x="140.0" y="390.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Print &quot;Pass&quot;</text>
<polygon points="426.0,365.0 590.0,365.0 574.0,415.0 410.0,415.0" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round"/>
<text x="500.0" y="390.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Print &quot;Fail&quot;</text>
<rect x="250.0" y="517.0" width="140.0" height="46.0" rx="23.0" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
<text x="320.0" y="540.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Stop</text>
<line x1="320.0" y1="70.0" x2="320.0" y2="106.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<line x1="320.0" y1="162.0" x2="320.0" y2="201.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<path d="M 210.0 260.0 L 140.0 260.0 L 140.0 361.0" stroke="#0f172a" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<path d="M 430.0 260.0 L 500.0 260.0 L 500.0 361.0" stroke="#0f172a" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<rect x="152.4" y="229.5" width="35.2" height="25.0" rx="4" fill="#f8fafc" stroke="none" stroke-width="0" opacity="0.92"/>
<text x="170.0" y="242.0" font-size="15" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Yes</text>
<rect x="456.6" y="229.5" width="26.8" height="25.0" rx="4" fill="#f8fafc" stroke="none" stroke-width="0" opacity="0.92"/>
<text x="470.0" y="242.0" font-size="15" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="bold">No</text>
<path d="M 140.0 415.0 L 140.0 470.0 L 320.0 470.0" stroke="#0f172a" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 500.0 415.0 L 500.0 470.0 L 320.0 470.0" stroke="#0f172a" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="320.0" y1="470.0" x2="320.0" y2="513.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a0f172a)"/>
</svg>
