<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Common computer ports</title>
<desc id="d">Eight common ports with what they connect: USB-A for flash drives, mice, keyboards and printers; USB-C for charging, data and displays on newer devices; HDMI for sending video and sound to a monitor, TV or projector; VGA, an older analogue video port for monitors and projectors; Ethernet (RJ-45) for a wired network cable; the 3.5 mm audio jack for headphones and speakers; the SD card slot for camera memory cards; and the power socket for the charger.</desc>
