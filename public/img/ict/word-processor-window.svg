<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Parts of a word processor window</title>
<desc id="d">A word processor window. From the top: the title bar with the document&#x27;s name and the minimise, maximise and close buttons; the menu tabs (File, Home, Insert, Layout, Review, View); the ribbon of command buttons in groups such as Clipboard, Font and Paragraph; the ruler showing margins and tabs; the document area, where text is typed at the flashing insertion point (cursor); the vertical scroll bar at the right; and the status bar at the bottom, showing the page number, word count and zoom.</desc>
