<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Network topologies</title>
<desc id="d">Four network topologies. Bus: every computer joins one main cable, the backbone, with a terminator at each end; a break in the backbone stops the network. Star: every computer has its own cable to a central switch; if one cable fails only that computer is cut off, but if the switch fails all are. Ring: each computer joins the next to form a closed loop, and data passes round in one direction. Mesh: every computer is linked to every other, so there are many routes and the network keeps working if a link fails.</desc>
