<text x="220.0" y="64.0" font-size="19" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Bus</text>
<text x="220.0" y="262.0" font-size="14" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">one backbone cable; a break stops all</text>
<rect x="455.0" y="40.0" width="410.0" height="240.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="660.0" y="64.0" font-size="19" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Star</text>
<text x="660.0" y="262.0" font-size="14" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">a central switch; most common in LANs</text>
<rect x="15.0" y="300.0" width="410.0" height="240.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="220.0" y="324.0" font-size="19" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Ring</text>
<text x="220.0" y="522.0" font-size="14" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">a closed loop; data goes one way round</text>
