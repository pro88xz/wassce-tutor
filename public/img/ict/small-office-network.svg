<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Devices in a small network</title>
<desc id="d">A small office or school network. Three desktop computers and a shared printer are joined by cables to a switch. A wireless access point, also cabled to the switch, lets a laptop and a phone join by Wi-Fi. The switch connects to a router with a firewall, which links the local network to the outside; a modem connects the router to the Internet service provider (ISP), which connects to the Internet.</desc>
