<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Parts of a spreadsheet</title>
<desc id="d">A spreadsheet of test marks. Columns are lettered A to D and rows numbered 1 to 6; the cell where column D meets row 2 is cell D2. The name box shows D2, the active cell, and the formula bar shows its formula =SUM(B2:C2). Column A holds names, B and C two test marks and D the totals 33, 28, 36 and 25. The range B2:C5 is shaded, and cell C4, in column C and row 4, holds 19. Row 6 holds averages worked out with formulas such as =AVERAGE(B2:B5) in cell B6: 14.5, 16 and 30.5.</desc>
