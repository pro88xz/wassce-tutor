<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">A database table and a relationship</title>
<desc id="d">Two tables in a school database. The Students table has the fields StudentID, Surname, First name and Class; each row is a record, such as S002 Kamara Aminata SSS3. StudentID is the primary key: it is different for every student. The Fees table has Receipt No, StudentID, Amount and Date. StudentID in Fees is a foreign key that links each payment to one student: one student can have many fee payments, a one-to-many relationship.</desc>
