<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Types of printers</title>
<desc id="d">Printers are impact or non-impact. Impact printers strike an inked ribbon against the paper: dot-matrix, daisy-wheel and line printers; they are noisy but can print carbon copies. Non-impact printers do not touch the paper with a printing head: inkjet, laser and thermal printers, and 3D printers that build solid objects; they are quieter and give better quality.</desc>
