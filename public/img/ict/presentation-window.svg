<title id="t">Parts of a presentation program window</title>
<desc id="d">A presentation program in Normal view. At the left is the slide pane (thumbnails) showing four slides, with slide 2 selected. In the middle is the slide being edited, with a title placeholder and a content placeholder of bullet points. Below it is the notes pane for the speaker&#x27;s notes. The status bar shows Slide 2 of 4 and buttons to change the view and start the slide show.</desc>
