<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 470" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Converting 25 to binary by repeated division by 2</title>
<desc id="d">Divide 25 by 2 again and again, writing each remainder: 25 divided by 2 is 12 remainder 1; 12 divided by 2 is 6 remainder 0; 6 divided by 2 is 3 remainder 0; 3 divided by 2 is 1 remainder 1; 1 divided by 2 is 0 remainder 1. Read the remainders from the bottom up: 25 in decimal is 11001 in binary.</desc>
<defs><marker id="a2563eb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a2563ebs" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#2563eb"/></marker></defs>
<rect width="620" height="470" rx="20" fill="#f8fafc"/>
<text x="310.0" y="30.0" font-size="18" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">25 in binary: divide by 2, keep the remainders</text>
<text x="190.0" y="70.0" font-size="16" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="bold">divide</text>
<text x="360.0" y="70.0" font-size="16" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="bold">remainder</text>
<text x="190.0" y="110.0" font-size="24" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">2 | 25</text>
<rect x="330.0" y="90.0" width="60.0" height="40.0" rx="8" fill="#fef3c7" stroke="#ea580c" stroke-width="2"/>
<text x="360.0" y="110.0" font-size="24" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">1</text>
<text x="190.0" y="162.0" font-size="24" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">2 | 12</text>
<rect x="330.0" y="142.0" width="60.0" height="40.0" rx="8" fill="#fef3c7" stroke="#ea580c" stroke-width="2"/>
<text x="360.0" y="162.0" font-size="24" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">0</text>
<text x="190.0" y="214.0" font-size="24" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">2 | 6</text>
<rect x="330.0" y="194.0" width="60.0" height="40.0" rx="8" fill="#fef3c7" stroke="#ea580c" stroke-width="2"/>
<text x="360.0" y="214.0" font-size="24" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">0</text>
<text x="190.0" y="266.0" font-size="24" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">2 | 3</text>
<rect x="330.0" y="246.0" width="60.0" height="40.0" rx="8" fill="#fef3c7" stroke="#ea580c" stroke-width="2"/>
<text x="360.0" y="266.0" font-size="24" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">1</text>
<text x="190.0" y="318.0" font-size="24" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">2 | 1</text>
<rect x="330.0" y="298.0" width="60.0" height="40.0" rx="8" fill="#fef3c7" stroke="#ea580c" stroke-width="2"/>
<text x="360.0" y="318.0" font-size="24" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">1</text>
<text x="190.0" y="370.0" font-size="24" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">0</text>
<line x1="450.0" y1="318.0" x2="450.0" y2="100.0" stroke="#2563eb" stroke-width="4" stroke-linecap="round" marker-end="url(#a2563eb)"/>
<text x="470.0" y="200.0" font-size="17" fill="#2563eb" text-anchor="start" dominant-baseline="middle" font-weight="bold">read</text>
<text x="470.0" y="222.0" font-size="17" fill="#2563eb" text-anchor="start" dominant-baseline="middle" font-weight="bold">upwards</text>
<rect x="130.0" y="400.0" width="360.0" height="50.0" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="310.0" y="425.0" font-size="26" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">25₁₀ = 11001₂</text>
</svg>
