<title id="t">Parts of a smartphone</title>
<desc id="d">Front and back of a smartphone with labelled parts. Front: the touch screen, the front camera, the earpiece speaker, the microphone and the charging port (USB-C). Back: the rear cameras with flash, and the fingerprint sensor. Inside: the battery, the SIM card tray, the processor and memory, and sensors such as GPS, the accelerometer and the gyroscope.</desc>
