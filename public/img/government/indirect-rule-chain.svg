<text x="712.0" y="288.0" font-size="14" fill="#2563eb" text-anchor="start" dominant-baseline="middle" font-weight="bold">officials</text>
<text x="712.0" y="400.0" font-size="14" fill="#ea580c" text-anchor="start" dominant-baseline="middle" font-weight="bold">African</text>
<text x="712.0" y="418.0" font-size="14" fill="#ea580c" text-anchor="start" dominant-baseline="middle" font-weight="bold">rulers</text>
