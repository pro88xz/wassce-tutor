<text x="650.0" y="250.0" font-size="16" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Sub-chiefs</text>
<rect x="540.0" y="312.0" width="220.0" height="56.0" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
<text x="650.0" y="340.0" font-size="16" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Town chiefs</text>
<rect x="540.0" y="402.0" width="220.0" height="56.0" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
<text x="650.0" y="430.0" font-size="16" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Village heads</text>
<line x1="650.0" y1="156.0" x2="400.0" y2="209.0" stroke="#15803d" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a15803d)"/>
<line x1="650.0" y1="156.0" x2="650.0" y2="216.0" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a2563eb)"/>
<line x1="650.0" y1="284.0" x2="650.0" y2="306.0" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a2563eb)"/>
<line x1="650.0" y1="374.0" x2="650.0" y2="396.0" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a2563eb)"/>
<rect x="25.0" y="275.0" width="230.0" height="110.0" rx="12" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/>
<text x="140.0" y="298.5" font-size="15" fill="#0f766e" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Rituals and</text>
<text x="140.0" y="319.5" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">religion bind</text>
<text x="140.0" y="340.5" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">chief and people;</text>
<text x="140.0" y="361.5" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Islam in the north</text>
</svg>
