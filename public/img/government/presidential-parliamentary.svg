<line x1="600.0" y1="254.0" x2="600.0" y2="276.0" stroke="#15803d" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a15803d)"/>
<line x1="600.0" y1="344.0" x2="600.0" y2="364.0" stroke="#15803d" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a15803d)"/>
<text x="600.0" y="448.0" font-size="14" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">fusion of powers · no-confidence vote</text>
