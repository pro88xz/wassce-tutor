<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The institutions of ECOWAS</title>
<desc id="d">ECOWAS was founded by the Treaty of Lagos on 28 May 1975 and revised in 1993. Its supreme body is the Authority of Heads of State and Government, supported by the Council of Ministers and the ECOWAS Commission in Abuja. Other institutions include the Community Parliament, the Community Court of Justice and the ECOWAS Bank for Investment and Development. ECOMOG was its military monitoring group.</desc>
