<text x="400.0" y="274.5" font-size="15" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">ECOWAS Commission (Abuja)</text>
<text x="400.0" y="295.5" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">runs programmes; headed by a President</text>
