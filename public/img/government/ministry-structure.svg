<text x="265.0" y="275.0" font-size="12" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">administrative head,</text>
<text x="265.0" y="295.0" font-size="12" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">accounting officer</text>
<rect x="440.0" y="242.0" width="250.0" height="66.0" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
<text x="565.0" y="255.0" font-size="14" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Professional head</text>
<text x="565.0" y="275.0" font-size="12" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">e.g. Chief Medical Officer,</text>
<text x="565.0" y="295.0" font-size="12" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Chief Education Officer</text>
