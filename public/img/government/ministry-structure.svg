<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Structure of a ministry in Sierra Leone</title>
<desc id="d">A ministry is headed politically by a minister, assisted by deputy ministers. The permanent secretary is the administrative head and accounting officer, and a professional head (such as a chief medical officer) leads the technical staff. Directors head divisions, which reach down to district offices. The Secretary to the Cabinet is Head of the Civil Service, and the Public Service Commission handles appointments.</desc>
