<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The road to independence, 1938 to 1961</title>
<desc id="d">1938 West African Youth League (Wallace-Johnson). 1950 National Council of Sierra Leone. 1951 SLPP founded and wins the election. 1955 Freetown strike and riots; 1955–56 tax riots in the north. 1957 general election won by the SLPP. 1958 Albert Margai and Siaka Stevens form the PNP. 1960 United National Front and the Lancaster House conference; Stevens refuses to sign and forms the APC. 27 April 1961 independence.</desc>
<defs></defs>
<rect width="800" height="560" rx="20" fill="#f8fafc"/>
<text x="400.0" y="34.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Movements, parties and milestones</text>
<line x1="150.0" y1="72.0" x2="150.0" y2="538.0" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
<circle cx="150.0" cy="88.0" r="9.0" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
<text x="128.0" y="88.0" font-size="16" fill="#2563eb" text-anchor="end" dominant-baseline="middle" font-weight="bold">1938</text>
<text x="174.0" y="78.0" font-size="15" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">West African Youth League branch</text>
<text x="174.0" y="99.0" font-size="14" fill="#475569" text-anchor="start" dominant-baseline="middle" font-weight="normal">I. T. A. Wallace-Johnson</text>
<circle cx="150.0" cy="150.0" r="9.0" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
<text x="128.0" y="150.0" font-size="16" fill="#2563eb" text-anchor="end" dominant-baseline="middle" font-weight="bold">1950</text>
<text x="174.0" y="140.0" font-size="15" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">National Council of Sierra Leone</text>
<text x="174.0" y="161.0" font-size="14" fill="#475569" text-anchor="start" dominant-baseline="middle" font-weight="normal">Colony party (Bankole-Bright)</text>
<circle cx="150.0" cy="212.0" r="9.0" fill="#ffffff" stroke="#15803d" stroke-width="3"/>
<text x="128.0" y="212.0" font-size="16" fill="#15803d" text-anchor="end" dominant-baseline="middle" font-weight="bold">1951</text>
<text x="174.0" y="202.0" font-size="15" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">SLPP founded; wins the election</text>
<text x="174.0" y="223.0" font-size="14" fill="#475569" text-anchor="start" dominant-baseline="middle" font-weight="normal">Dr Milton Margai</text>
<circle cx="150.0" cy="274.0" r="9.0" fill="#ffffff" stroke="#ea580c" stroke-width="3"/>
<text x="128.0" y="274.0" font-size="16" fill="#ea580c" text-anchor="end" dominant-baseline="middle" font-weight="bold">1955</text>
<text x="174.0" y="264.0" font-size="15" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Freetown strike and riots</text>
<text x="174.0" y="285.0" font-size="14" fill="#475569" text-anchor="start" dominant-baseline="middle" font-weight="normal">followed by tax riots in the north</text>
<circle cx="150.0" cy="336.0" r="9.0" fill="#ffffff" stroke="#15803d" stroke-width="3"/>
<text x="128.0" y="336.0" font-size="16" fill="#15803d" text-anchor="end" dominant-baseline="middle" font-weight="bold">1957</text>
<text x="174.0" y="326.0" font-size="15" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">General election</text>
<text x="174.0" y="347.0" font-size="14" fill="#475569" text-anchor="start" dominant-baseline="middle" font-weight="normal">SLPP wins most seats</text>
<circle cx="150.0" cy="398.0" r="9.0" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
<text x="128.0" y="398.0" font-size="16" fill="#2563eb" text-anchor="end" dominant-baseline="middle" font-weight="bold">1958</text>
<text x="174.0" y="388.0" font-size="15" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">People&#x27;s National Party (PNP)</text>
<text x="174.0" y="409.0" font-size="14" fill="#475569" text-anchor="start" dominant-baseline="middle" font-weight="normal">Albert Margai and Siaka Stevens</text>
<circle cx="150.0" cy="460.0" r="9.0" fill="#ffffff" stroke="#dc2626" stroke-width="3"/>
<text x="128.0" y="460.0" font-size="16" fill="#dc2626" text-anchor="end" dominant-baseline="middle" font-weight="bold">1960</text>
<text x="174.0" y="450.0" font-size="15" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">United Front; Lancaster House</text>
<text x="174.0" y="471.0" font-size="14" fill="#475569" text-anchor="start" dominant-baseline="middle" font-weight="normal">Stevens refuses to sign; APC formed</text>
<circle cx="150.0" cy="522.0" r="9.0" fill="#ffffff" stroke="#dc2626" stroke-width="3"/>
<text x="128.0" y="522.0" font-size="16" fill="#dc2626" text-anchor="end" dominant-baseline="middle" font-weight="bold">1961</text>
<text x="174.0" y="522.0" font-size="15" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Independence, 27 April</text>
</svg>
