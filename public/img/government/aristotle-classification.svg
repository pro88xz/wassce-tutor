<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Aristotle&#x27;s classification of governments</title>
<desc id="d">Aristotle classified governments by how many rule and in whose interest. Rule by one: monarchy (good) or tyranny (perverted). Rule by a few: aristocracy (good) or oligarchy (perverted). Rule by many: polity (good) or democracy, which he meant as mob rule (perverted).</desc>
<defs></defs>
<rect width="800" height="430" rx="20" fill="#f8fafc"/>
<text x="400.0" y="34.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Aristotle: who rules, and for whom?</text>
<text x="330.0" y="82.0" font-size="17" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">For the good of all</text>
<text x="620.0" y="82.0" font-size="17" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="bold">For the rulers&#x27; own good</text>
<text x="40.0" y="140.0" font-size="17" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">One person</text>
<rect x="220.0" y="108.0" width="220.0" height="64.0" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
<text x="330.0" y="140.0" font-size="19" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Monarchy</text>
<rect x="510.0" y="108.0" width="220.0" height="64.0" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
<text x="620.0" y="140.0" font-size="19" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Tyranny</text>
<text x="40.0" y="230.0" font-size="17" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">A few</text>
<rect x="220.0" y="198.0" width="220.0" height="64.0" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
<text x="330.0" y="230.0" font-size="19" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Aristocracy</text>
<rect x="510.0" y="198.0" width="220.0" height="64.0" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
<text x="620.0" y="230.0" font-size="19" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Oligarchy</text>
<text x="40.0" y="320.0" font-size="17" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">The many</text>
<rect x="220.0" y="288.0" width="220.0" height="64.0" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
<text x="330.0" y="320.0" font-size="19" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Polity</text>
<rect x="510.0" y="288.0" width="220.0" height="64.0" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
<text x="620.0" y="320.0" font-size="19" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Democracy*</text>
<text x="400.0" y="410.0" font-size="14" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">* Aristotle used &#x27;democracy&#x27; for rule by the poor mob, not the modern meaning.</text>
</svg>
