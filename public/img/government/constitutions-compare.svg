<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Sierra Leone&#x27;s constitutions compared</title>
<desc id="d">1961: parliamentary system, British monarch as head of state, multi-party, final appeal to the Privy Council. 1971: republic with an executive President, multi-party in law, Supreme Court final. 1978: executive President, one-party state (APC), Supreme Court final. 1991: executive President, multi-party democracy, two-term limit, Supreme Court final.</desc>
