<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">How public opinion is formed and measured</title>
<desc id="d">Public opinion is shaped by agents such as the family, school, mass media, religious bodies, political parties, pressure groups, peer groups and government. It is expressed and measured through elections, opinion polls, referendums, letters and phone-in programmes, demonstrations and social media.</desc>
