<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The United Nations in Sierra Leone</title>
<desc id="d">Sierra Leone joined the UN on 27 September 1961. During and after the civil war the UN deployed an observer mission (UNOMSIL, 1998–1999), the peacekeeping mission UNAMSIL (1999–2005), and the peacebuilding offices UNIOSIL (2006–2008) and UNIPSIL (2008–2014). It backed the Special Court for Sierra Leone (2002–2013). UN agencies such as WHO, UNICEF, WFP and UNDP support health, education, food and development.</desc>
<defs></defs>
<rect width="800" height="540" rx="20" fill="#f8fafc"/>
<text x="400.0" y="34.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">From membership to peacekeeping and development</text>
<line x1="150.0" y1="74.0" x2="150.0" y2="526.0" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
<circle cx="150.0" cy="90.0" r="9.0" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
<text x="128.0" y="90.0" font-size="16" fill="#2563eb" text-anchor="end" dominant-baseline="middle" font-weight="bold">1961</text>
<text x="174.0" y="80.0" font-size="15" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Joins the UN, 27 September</text>
<text x="174.0" y="101.0" font-size="14" fill="#475569" text-anchor="start" dominant-baseline="middle" font-weight="normal">a new member soon after independence</text>
<circle cx="150.0" cy="150.0" r="9.0" fill="#ffffff" stroke="#ea580c" stroke-width="3"/>
<text x="128.0" y="150.0" font-size="16" fill="#ea580c" text-anchor="end" dominant-baseline="middle" font-weight="bold">1998</text>
<text x="174.0" y="140.0" font-size="15" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">UNOMSIL observer mission</text>
<text x="174.0" y="161.0" font-size="14" fill="#475569" text-anchor="start" dominant-baseline="middle" font-weight="normal">monitors security and disarmament</text>
<circle cx="150.0" cy="210.0" r="9.0" fill="#ffffff" stroke="#dc2626" stroke-width="3"/>
<text x="128.0" y="210.0" font-size="16" fill="#dc2626" text-anchor="end" dominant-baseline="middle" font-weight="bold">1999</text>
<text x="174.0" y="200.0" font-size="15" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">UNAMSIL peacekeepers (to 2005)</text>
<text x="174.0" y="221.0" font-size="14" fill="#475569" text-anchor="start" dominant-baseline="middle" font-weight="normal">disarmament of over 70,000 fighters</text>
<circle cx="150.0" cy="270.0" r="9.0" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/>
<text x="128.0" y="270.0" font-size="16" fill="#7c3aed" text-anchor="end" dominant-baseline="middle" font-weight="bold">2002</text>
<text x="174.0" y="260.0" font-size="15" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Special Court for Sierra Leone</text>
<text x="174.0" y="281.0" font-size="14" fill="#475569" text-anchor="start" dominant-baseline="middle" font-weight="normal">set up with the UN; closed 2013</text>
<circle cx="150.0" cy="330.0" r="9.0" fill="#ffffff" stroke="#15803d" stroke-width="3"/>
<text x="128.0" y="330.0" font-size="16" fill="#15803d" text-anchor="end" dominant-baseline="middle" font-weight="bold">2006</text>
<text x="174.0" y="320.0" font-size="15" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">UNIOSIL peacebuilding office</text>
<text x="174.0" y="341.0" font-size="14" fill="#475569" text-anchor="start" dominant-baseline="middle" font-weight="normal">supports institutions (to 2008)</text>
<circle cx="150.0" cy="390.0" r="9.0" fill="#ffffff" stroke="#15803d" stroke-width="3"/>
<text x="128.0" y="390.0" font-size="16" fill="#15803d" text-anchor="end" dominant-baseline="middle" font-weight="bold">2008</text>
<text x="174.0" y="380.0" font-size="15" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">UNIPSIL political mission</text>
<text x="174.0" y="401.0" font-size="14" fill="#475569" text-anchor="start" dominant-baseline="middle" font-weight="normal">elections, reconciliation (to 2014)</text>
<circle cx="150.0" cy="450.0" r="9.0" fill="#ffffff" stroke="#ea580c" stroke-width="3"/>
<text x="128.0" y="450.0" font-size="16" fill="#ea580c" text-anchor="end" dominant-baseline="middle" font-weight="bold">2014</text>
<text x="174.0" y="440.0" font-size="15" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Ebola response</text>
<text x="174.0" y="461.0" font-size="14" fill="#475569" text-anchor="start" dominant-baseline="middle" font-weight="normal">WHO, UNICEF, WFP and UNMEER</text>
<circle cx="150.0" cy="510.0" r="9.0" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
<text x="128.0" y="510.0" font-size="16" fill="#2563eb" text-anchor="end" dominant-baseline="middle" font-weight="bold">2024</text>
<text x="174.0" y="500.0" font-size="15" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Security Council seat</text>
<text x="174.0" y="521.0" font-size="14" fill="#475569" text-anchor="start" dominant-baseline="middle" font-weight="normal">non-permanent member, 2024–2025</text>
</svg>
