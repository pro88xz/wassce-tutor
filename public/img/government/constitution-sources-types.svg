<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Sources and types of constitutions</title>
<desc id="d">Sources of a constitution: constitutional conferences and constituent assemblies, statutes (acts of the legislature), judicial precedents, conventions, historical documents, customs and traditions, and the works of constitutional experts. Types: written or unwritten, rigid or flexible, unitary or federal, presidential or parliamentary, monarchical or republican.</desc>
<defs></defs>
<rect width="800" height="500" rx="20" fill="#f8fafc"/>
<text x="400.0" y="34.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Where constitutions come from, and their types</text>
<text x="200.0" y="76.0" font-size="18" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Sources</text>
<rect x="50.0" y="95.0" width="300.0" height="42.0" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="200.0" y="116.0" font-size="15" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Constitutional conferences</text>
<rect x="50.0" y="147.0" width="300.0" height="42.0" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="200.0" y="168.0" font-size="15" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Statutes (Acts of Parliament)</text>
