<text x="200.0" y="220.0" font-size="15" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Judicial precedents</text>
<rect x="50.0" y="251.0" width="300.0" height="42.0" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="200.0" y="272.0" font-size="15" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Conventions</text>
<rect x="50.0" y="303.0" width="300.0" height="42.0" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="200.0" y="324.0" font-size="15" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Historical documents</text>
<rect x="50.0" y="355.0" width="300.0" height="42.0" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
