<rect x="615.0" y="357.0" width="130.0" height="46.0" rx="12" fill="#ffffff" stroke="#ea580c" stroke-width="2.5"/>
<text x="680.0" y="380.0" font-size="15" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Monarchical</text>
<text x="400.0" y="482.0" font-size="14" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Sierra Leone&#x27;s 1991 Constitution: written, rigid, unitary, presidential and republican.</text>
