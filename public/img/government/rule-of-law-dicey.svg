<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">A. V. Dicey&#x27;s three principles of the rule of law</title>
<desc id="d">The British jurist A. V. Dicey (1885) set out three principles: supremacy of the law (no one is punished except for a breach of law proved in court; no arbitrary power), equality before the law (everyone, including officials, is subject to the same law and courts), and rights secured by the courts (fundamental rights are protected by the ordinary courts and the constitution).</desc>
<defs></defs>
<rect width="800" height="400" rx="20" fill="#f8fafc"/>
<text x="400.0" y="34.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">The rule of law: Dicey&#x27;s three principles</text>
<rect x="60.0" y="70.0" width="680.0" height="40.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
<text x="400.0" y="90.0" font-size="19" fill="#7c3aed" text-anchor="middle" dominant-baseline="middle" font-weight="bold">THE RULE OF LAW</text>
<rect x="40.0" y="135.0" width="220.0" height="190.0" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="150.0" y="197.0" font-size="16" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Supremacy of the law</text>
<text x="150.0" y="219.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">no punishment except</text>
<text x="150.0" y="241.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">for a breach of law</text>
<text x="150.0" y="263.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">proved in court</text>
<rect x="290.0" y="135.0" width="220.0" height="190.0" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
<text x="400.0" y="197.0" font-size="16" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Equality before the law</text>
<text x="400.0" y="219.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">leaders and citizens</text>
<text x="400.0" y="241.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">obey the same laws</text>
<text x="400.0" y="263.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">and courts</text>
<rect x="540.0" y="135.0" width="220.0" height="190.0" rx="12" fill="#fef3c7" stroke="#ea580c" stroke-width="2.5"/>
<text x="650.0" y="197.0" font-size="16" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Rights protected by courts</text>
<text x="650.0" y="219.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">courts and the</text>
<text x="650.0" y="241.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">constitution protect</text>
<text x="650.0" y="263.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">individual liberty</text>
<rect x="60.0" y="340.0" width="680.0" height="20.0" rx="4" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
<text x="400.0" y="384.0" font-size="14" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">A. V. Dicey, Introduction to the Study of the Law of the Constitution (1885)</text>
</svg>
