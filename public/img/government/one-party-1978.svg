<text x="400.0" y="189.0" font-size="16" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">President</text>
<text x="400.0" y="211.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">single party candidate; seven-year term</text>
<rect x="110.0" y="272.0" width="260.0" height="56.0" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
<text x="240.0" y="300.0" font-size="15" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">First Vice-President</text>
