<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Who has governed Sierra Leone since independence</title>
<desc id="d">SLPP 1961 to 1967 (Milton Margai, Albert Margai); military NRC 1967 to 1968; APC 1968 to 1992 (Siaka Stevens, then Joseph Momoh from 1985; one-party state 1978 to 1991); military NPRC 1992 to 1996 (Valentine Strasser, Julius Maada Bio); SLPP 1996 to 2007 (Ahmad Tejan Kabbah, interrupted by the AFRC junta 1997 to 1998); APC 2007 to 2018 (Ernest Bai Koroma); SLPP from 2018 (Julius Maada Bio).</desc>
<defs></defs>
<rect width="800" height="560" rx="20" fill="#f8fafc"/>
