<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Military interventions in Sierra Leone</title>
<desc id="d">March 1967: Brigadier David Lansana seizes power, then officers form the National Reformation Council under Andrew Juxon-Smith. April 1968: the Sergeants&#x27; revolt (Anti-Corruption Revolutionary Movement) restores civilian rule. April 1992: the National Provisional Ruling Council under Valentine Strasser overthrows President Momoh. January 1996: Julius Maada Bio replaces Strasser, then hands over to the elected Kabbah. May 1997: the Armed Forces Revolutionary Council under Johnny Paul Koroma; ECOMOG restores Kabbah in 1998.</desc>
<defs></defs>
<rect width="800" height="520" rx="20" fill="#f8fafc"/>
<text x="400.0" y="34.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Coups and juntas</text>
<line x1="150.0" y1="72.0" x2="150.0" y2="476.0" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
<circle cx="150.0" cy="88.0" r="9.0" fill="#ffffff" stroke="#dc2626" stroke-width="3"/>
<text x="128.0" y="88.0" font-size="16" fill="#dc2626" text-anchor="end" dominant-baseline="middle" font-weight="bold">1967</text>
<text x="174.0" y="78.0" font-size="15" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Lansana coup; National Reformation Council</text>
<text x="174.0" y="99.0" font-size="14" fill="#475569" text-anchor="start" dominant-baseline="middle" font-weight="normal">Juxon-Smith rules by decree</text>
<circle cx="150.0" cy="150.0" r="9.0" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
<text x="128.0" y="150.0" font-size="16" fill="#2563eb" text-anchor="end" dominant-baseline="middle" font-weight="bold">1968</text>
<text x="174.0" y="140.0" font-size="15" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Sergeants&#x27; revolt</text>
<text x="174.0" y="161.0" font-size="14" fill="#475569" text-anchor="start" dominant-baseline="middle" font-weight="normal">civilian rule restored; Stevens PM</text>
<circle cx="150.0" cy="212.0" r="9.0" fill="#ffffff" stroke="#dc2626" stroke-width="3"/>
<text x="128.0" y="212.0" font-size="16" fill="#dc2626" text-anchor="end" dominant-baseline="middle" font-weight="bold">1992</text>
<text x="174.0" y="202.0" font-size="15" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">NPRC coup, 29 April</text>
<text x="174.0" y="223.0" font-size="14" fill="#475569" text-anchor="start" dominant-baseline="middle" font-weight="normal">Captain Valentine Strasser</text>
<circle cx="150.0" cy="274.0" r="9.0" fill="#ffffff" stroke="#ea580c" stroke-width="3"/>
<text x="128.0" y="274.0" font-size="16" fill="#ea580c" text-anchor="end" dominant-baseline="middle" font-weight="bold">1996</text>
<text x="174.0" y="264.0" font-size="15" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Palace coup: Julius Maada Bio</text>
<text x="174.0" y="285.0" font-size="14" fill="#475569" text-anchor="start" dominant-baseline="middle" font-weight="normal">hands over to elected President Kabbah</text>
<circle cx="150.0" cy="336.0" r="9.0" fill="#ffffff" stroke="#dc2626" stroke-width="3"/>
<text x="128.0" y="336.0" font-size="16" fill="#dc2626" text-anchor="end" dominant-baseline="middle" font-weight="bold">1997</text>
<text x="174.0" y="326.0" font-size="15" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">AFRC coup, 25 May</text>
<text x="174.0" y="347.0" font-size="14" fill="#475569" text-anchor="start" dominant-baseline="middle" font-weight="normal">Johnny Paul Koroma; joins with the RUF</text>
<circle cx="150.0" cy="398.0" r="9.0" fill="#ffffff" stroke="#15803d" stroke-width="3"/>
<text x="128.0" y="398.0" font-size="16" fill="#15803d" text-anchor="end" dominant-baseline="middle" font-weight="bold">1998</text>
<text x="174.0" y="388.0" font-size="15" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">ECOMOG restores Kabbah</text>
<text x="174.0" y="409.0" font-size="14" fill="#475569" text-anchor="start" dominant-baseline="middle" font-weight="normal">Nigerian-led ECOWAS force</text>
<circle cx="150.0" cy="460.0" r="9.0" fill="#ffffff" stroke="#15803d" stroke-width="3"/>
<text x="128.0" y="460.0" font-size="16" fill="#15803d" text-anchor="end" dominant-baseline="middle" font-weight="bold">Since</text>
<text x="174.0" y="450.0" font-size="15" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">No successful coup since 1998</text>
<text x="174.0" y="471.0" font-size="14" fill="#475569" text-anchor="start" dominant-baseline="middle" font-weight="normal">elected governments, 2002 onward</text>
</svg>
