<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The Legislative Council under the 1924 Slater Constitution</title>
<desc id="d">The Governor presided over a Legislative Council with an official majority. For the first time three members were elected, by Colony voters on a limited franchise (two for Freetown, one for the rural Colony), and three Paramount Chiefs were nominated to represent the Protectorate. Other unofficial members were nominated by the Governor.</desc>
<defs></defs>
<rect width="800" height="470" rx="20" fill="#f8fafc"/>
<text x="400.0" y="34.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Legislative Council, 1924</text>
<rect x="250.0" y="62.0" width="300.0" height="56.0" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
<text x="400.0" y="79.0" font-size="16" fill="#7c3aed" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Governor</text>
<text x="400.0" y="101.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">presides; can veto</text>
<rect x="100.0" y="150.0" width="600.0" height="70.0" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="400.0" y="174.0" font-size="16" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Official members (the majority)</text>
<text x="400.0" y="196.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">colonial officials who vote with the Governor</text>
<text x="400.0" y="255.0" font-size="17" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Unofficial members</text>
<rect x="50.0" y="280.0" width="220.0" height="100.0" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
<text x="160.0" y="308.0" font-size="16" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">3 elected</text>
<text x="160.0" y="330.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Colony voters,</text>
<text x="160.0" y="352.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">limited franchise</text>
<rect x="290.0" y="280.0" width="220.0" height="100.0" rx="12" fill="#fef3c7" stroke="#ea580c" stroke-width="2.5"/>
<text x="400.0" y="308.0" font-size="16" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">3 Paramount</text>
<text x="400.0" y="330.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Chiefs</text>
<text x="400.0" y="352.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">nominated</text>
<rect x="530.0" y="280.0" width="220.0" height="100.0" rx="12" fill="#e2e8f0" stroke="#475569" stroke-width="2.5"/>
<text x="640.0" y="308.0" font-size="16" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Others</text>
<text x="640.0" y="330.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">nominated by</text>
<text x="640.0" y="352.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">the Governor</text>
<text x="400.0" y="440.0" font-size="14" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">First elected members and first Protectorate voice, but power stayed with officials.</text>
</svg>
