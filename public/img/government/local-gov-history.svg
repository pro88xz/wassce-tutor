<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Milestones in local government in Sierra Leone</title>
<desc id="d">1893 Freetown becomes a municipality with a city council. 1896 the Protectorate is ruled through chiefs. 1937 Native Administration reforms with chiefdom treasuries. 1940s District Councils and the Protectorate Assembly. 1972 local councils abolished. 2004 Local Government Act revives councils, with elections. 2017 new chiefdoms bring the total to 190. 2022 a new Local Government Act.</desc>
<defs></defs>
<rect width="800" height="520" rx="20" fill="#f8fafc"/>
<text x="400.0" y="34.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Local government through the years</text>
<line x1="150.0" y1="72.0" x2="150.0" y2="510.0" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
<circle cx="150.0" cy="88.0" r="9.0" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
<text x="128.0" y="88.0" font-size="16" fill="#2563eb" text-anchor="end" dominant-baseline="middle" font-weight="bold">1893</text>
<text x="174.0" y="78.0" font-size="15" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Freetown becomes a municipality</text>
<text x="174.0" y="99.0" font-size="14" fill="#475569" text-anchor="start" dominant-baseline="middle" font-weight="normal">a city council for the capital</text>
<circle cx="150.0" cy="146.0" r="9.0" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
<text x="128.0" y="146.0" font-size="16" fill="#2563eb" text-anchor="end" dominant-baseline="middle" font-weight="bold">1896</text>
<text x="174.0" y="136.0" font-size="15" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Protectorate ruled through chiefs</text>
<text x="174.0" y="157.0" font-size="14" fill="#475569" text-anchor="start" dominant-baseline="middle" font-weight="normal">indirect rule</text>
<circle cx="150.0" cy="204.0" r="9.0" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
<text x="128.0" y="204.0" font-size="16" fill="#2563eb" text-anchor="end" dominant-baseline="middle" font-weight="bold">1937</text>
<text x="174.0" y="194.0" font-size="15" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Native Administration reforms</text>
<text x="174.0" y="215.0" font-size="14" fill="#475569" text-anchor="start" dominant-baseline="middle" font-weight="normal">chiefdom treasuries and estimates</text>
<circle cx="150.0" cy="262.0" r="9.0" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
<text x="128.0" y="262.0" font-size="16" fill="#2563eb" text-anchor="end" dominant-baseline="middle" font-weight="bold">1940s</text>
<text x="174.0" y="262.0" font-size="15" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">District Councils; Protectorate Assembly</text>
<circle cx="150.0" cy="320.0" r="9.0" fill="#ffffff" stroke="#dc2626" stroke-width="3"/>
<text x="128.0" y="320.0" font-size="16" fill="#dc2626" text-anchor="end" dominant-baseline="middle" font-weight="bold">1972</text>
<text x="174.0" y="310.0" font-size="15" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Local councils abolished</text>
<text x="174.0" y="331.0" font-size="14" fill="#475569" text-anchor="start" dominant-baseline="middle" font-weight="normal">power centralised in Freetown</text>
<circle cx="150.0" cy="378.0" r="9.0" fill="#ffffff" stroke="#15803d" stroke-width="3"/>
<text x="128.0" y="378.0" font-size="16" fill="#15803d" text-anchor="end" dominant-baseline="middle" font-weight="bold">2004</text>
<text x="174.0" y="368.0" font-size="15" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Local Government Act</text>
<text x="174.0" y="389.0" font-size="14" fill="#475569" text-anchor="start" dominant-baseline="middle" font-weight="normal">councils revived; elections held</text>
<circle cx="150.0" cy="436.0" r="9.0" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
<text x="128.0" y="436.0" font-size="16" fill="#2563eb" text-anchor="end" dominant-baseline="middle" font-weight="bold">2017</text>
<text x="174.0" y="436.0" font-size="15" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">New chiefdoms: 190 in total</text>
<circle cx="150.0" cy="494.0" r="9.0" fill="#ffffff" stroke="#15803d" stroke-width="3"/>
<text x="128.0" y="494.0" font-size="16" fill="#15803d" text-anchor="end" dominant-baseline="middle" font-weight="bold">2022</text>
<text x="174.0" y="484.0" font-size="15" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Local Government Act 2022</text>
<text x="174.0" y="505.0" font-size="14" fill="#475569" text-anchor="start" dominant-baseline="middle" font-weight="normal">replaces the 2004 Act</text>
</svg>
