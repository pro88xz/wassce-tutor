<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">First-past-the-post compared with proportional representation</title>
<desc id="d">Illustration with ten seats. Party A wins 46% of the votes, B 34% and C 20%. Under first-past-the-post, A might win 7 seats, B 3 and C none, because only the leading candidate in each constituency wins. Under proportional representation the seats follow the vote shares: A 5, B 3, C 2.</desc>
<defs></defs>
<rect width="800" height="470" rx="20" fill="#f8fafc"/>
<text x="400.0" y="34.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Same votes, different seats (10 seats)</text>
<text x="130.0" y="80.0" font-size="17" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Votes</text>
<text x="60.0" y="120.0" font-size="18" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">A</text>
<rect x="80.0" y="104.0" width="147.2" height="32.0" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="253.2" y="120.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">46%</text>
<text x="60.0" y="176.0" font-size="18" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">B</text>
<rect x="80.0" y="160.0" width="108.8" height="32.0" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="214.8" y="176.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">34%</text>
<text x="60.0" y="232.0" font-size="18" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">C</text>
<rect x="80.0" y="216.0" width="64.0" height="32.0" rx="4" fill="#fef3c7" stroke="#ea580c" stroke-width="2"/>
<text x="170.0" y="232.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">20%</text>
<text x="580.0" y="80.0" font-size="17" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">First-past-the-post</text>
<circle cx="470.0" cy="120.0" r="18.0" fill="#dbeafe" stroke="#2563eb" stroke-width="2.4"/>
<text x="470.0" y="121.0" font-size="14" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">A</text>
