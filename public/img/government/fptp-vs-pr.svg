<text x="562.0" y="220.0" font-size="15" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="bold">A 7  B 3  C 0</text>
<text x="580.0" y="290.0" font-size="17" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Proportional representation</text>
<circle cx="470.0" cy="330.0" r="18.0" fill="#dbeafe" stroke="#2563eb" stroke-width="2.4"/>
<text x="470.0" y="331.0" font-size="14" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">A</text>
<circle cx="516.0" cy="330.0" r="18.0" fill="#dbeafe" stroke="#2563eb" stroke-width="2.4"/>
<text x="516.0" y="331.0" font-size="14" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">A</text>
<circle cx="562.0" cy="330.0" r="18.0" fill="#dbeafe" stroke="#2563eb" stroke-width="2.4"/>
<text x="562.0" y="331.0" font-size="14" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">A</text>
<circle cx="608.0" cy="330.0" r="18.0" fill="#dbeafe" stroke="#2563eb" stroke-width="2.4"/>
<text x="608.0" y="331.0" font-size="14" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">A</text>
<circle cx="654.0" cy="330.0" r="18.0" fill="#dbeafe" stroke="#2563eb" stroke-width="2.4"/>
<text x="654.0" y="331.0" font-size="14" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">A</text>
<circle cx="470.0" cy="380.0" r="18.0" fill="#dcfce7" stroke="#15803d" stroke-width="2.4"/>
<text x="470.0" y="381.0" font-size="14" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">B</text>
<circle cx="516.0" cy="380.0" r="18.0" fill="#dcfce7" stroke="#15803d" stroke-width="2.4"/>
<text x="516.0" y="381.0" font-size="14" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">B</text>
<circle cx="562.0" cy="380.0" r="18.0" fill="#dcfce7" stroke="#15803d" stroke-width="2.4"/>
<text x="562.0" y="381.0" font-size="14" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">B</text>
<circle cx="608.0" cy="380.0" r="18.0" fill="#fef3c7" stroke="#ea580c" stroke-width="2.4"/>
<text x="608.0" y="381.0" font-size="14" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">C</text>
<circle cx="654.0" cy="380.0" r="18.0" fill="#fef3c7" stroke="#ea580c" stroke-width="2.4"/>
<text x="654.0" y="381.0" font-size="14" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">C</text>
<text x="562.0" y="430.0" font-size="15" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="bold">A 5  B 3  C 2</text>
<text x="200.0" y="330.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">FPTP: the winner in each</text>
<text x="200.0" y="352.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">constituency takes the seat;</text>
<text x="200.0" y="374.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">small parties lose out.</text>
<text x="200.0" y="408.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">PR: seats follow vote shares.</text>
</svg>
