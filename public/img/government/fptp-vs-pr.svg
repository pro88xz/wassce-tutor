<text x="516.0" y="121.0" font-size="14" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">A</text>
<circle cx="562.0" cy="120.0" r="18.0" fill="#dbeafe" stroke="#2563eb" stroke-width="2.4"/>
<text x="562.0" y="121.0" font-size="14" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">A</text>
<circle cx="608.0" cy="120.0" r="18.0" fill="#dbeafe" stroke="#2563eb" stroke-width="2.4"/>
<text x="608.0" y="121.0" font-size="14" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">A</text>
<circle cx="654.0" cy="120.0" r="18.0" fill="#dbeafe" stroke="#2563eb" stroke-width="2.4"/>
<text x="654.0" y="121.0" font-size="14" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">A</text>
