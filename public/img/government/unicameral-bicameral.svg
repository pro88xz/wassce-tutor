<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Unicameral and bicameral legislatures</title>
<desc id="d">A unicameral legislature has one chamber, as in Sierra Leone and Ghana. A bicameral legislature has two chambers: an upper house (such as the Senate in Nigeria and the USA, or the House of Lords in Britain) and a lower house (the House of Representatives or the House of Commons).</desc>
<defs></defs>
<rect width="800" height="420" rx="20" fill="#f8fafc"/>
<text x="400.0" y="34.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">One chamber or two?</text>
<rect x="20.0" y="56.0" width="360.0" height="330.0" rx="14" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
<text x="200.0" y="84.0" font-size="20" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Unicameral</text>
<rect x="420.0" y="56.0" width="360.0" height="330.0" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<text x="600.0" y="84.0" font-size="20" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Bicameral</text>
<rect x="70.0" y="145.0" width="260.0" height="110.0" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
<text x="200.0" y="177.0" font-size="17" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Parliament</text>
<text x="200.0" y="200.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">one chamber makes</text>
<text x="200.0" y="223.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">all the laws</text>
<text x="200.0" y="300.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Sierra Leone, Ghana,</text>
<text x="200.0" y="322.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">The Gambia</text>
<rect x="465.0" y="117.0" width="270.0" height="66.0" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="600.0" y="139.5" font-size="15" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Upper house</text>
<text x="600.0" y="160.5" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Senate / House of Lords</text>
<rect x="465.0" y="222.0" width="270.0" height="66.0" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="600.0" y="244.5" font-size="15" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Lower house</text>
<text x="600.0" y="265.5" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Representatives / Commons</text>
<line x1="600.0" y1="184.0" x2="600.0" y2="222.0" stroke="#2563eb" stroke-width="2.6" stroke-linecap="round"/>
<text x="612.0" y="205.0" font-size="13" fill="#475569" text-anchor="start" dominant-baseline="middle" font-weight="normal">both must pass a bill</text>
<text x="600.0" y="322.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Nigeria, Liberia,</text>
<text x="600.0" y="344.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">USA, Britain</text>
</svg>
