<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">From the OAU to the African Union</title>
<desc id="d">The Organisation of African Unity was founded in Addis Ababa on 25 May 1963 to promote unity, defend sovereignty and end colonialism, but held to non-interference in members&#x27; internal affairs. The African Union replaced it, launched in Durban on 9 July 2002. The AU may intervene in a member state in cases of war crimes, genocide and crimes against humanity, suspends governments that seize power unconstitutionally, and has more organs, including the Pan-African Parliament and the Peace and Security Council.</desc>
<defs></defs>
<rect width="800" height="520" rx="20" fill="#f8fafc"/>
<text x="400.0" y="34.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">OAU (1963–2002) and AU (2002 onward)</text>
<text x="115.0" y="80.0" font-size="1" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal"></text>
<rect x="265.0" y="56.0" width="230.0" height="48.0" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="380.0" y="80.0" font-size="19" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">OAU</text>
<rect x="515.0" y="56.0" width="250.0" height="48.0" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
<text x="640.0" y="80.0" font-size="19" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">African Union</text>
<text x="140.0" y="150.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Founded</text>
<rect x="265.0" y="126.0" width="230.0" height="48.0" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
<text x="380.0" y="150.0" font-size="14" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="normal">25 May 1963</text>
<rect x="515.0" y="126.0" width="250.0" height="48.0" rx="12" fill="#ffffff" stroke="#15803d" stroke-width="2.5"/>
<text x="640.0" y="150.0" font-size="14" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="normal">9 July 2002</text>
<text x="140.0" y="210.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Headquarters</text>
<rect x="265.0" y="186.0" width="230.0" height="48.0" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
<text x="380.0" y="210.0" font-size="14" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Addis Ababa</text>
<rect x="515.0" y="186.0" width="250.0" height="48.0" rx="12" fill="#ffffff" stroke="#15803d" stroke-width="2.5"/>
<text x="640.0" y="210.0" font-size="14" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Addis Ababa</text>
<text x="140.0" y="270.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Main focus</text>
<rect x="265.0" y="246.0" width="230.0" height="48.0" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
<text x="380.0" y="270.0" font-size="14" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="normal">end colonialism; unity</text>
<rect x="515.0" y="246.0" width="250.0" height="48.0" rx="12" fill="#ffffff" stroke="#15803d" stroke-width="2.5"/>
<text x="640.0" y="270.0" font-size="14" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="normal">integration, peace, development</text>
<text x="140.0" y="330.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Internal conflicts</text>
<rect x="265.0" y="306.0" width="230.0" height="48.0" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
<text x="380.0" y="330.0" font-size="14" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="normal">non-interference</text>
<rect x="515.0" y="306.0" width="250.0" height="48.0" rx="12" fill="#ffffff" stroke="#15803d" stroke-width="2.5"/>
<text x="640.0" y="330.0" font-size="14" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="normal">may intervene (Art. 4h)</text>
<text x="140.0" y="390.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Coups</text>
<rect x="265.0" y="366.0" width="230.0" height="48.0" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
<text x="380.0" y="390.0" font-size="14" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="normal">often tolerated</text>
<rect x="515.0" y="366.0" width="250.0" height="48.0" rx="12" fill="#ffffff" stroke="#15803d" stroke-width="2.5"/>
<text x="640.0" y="390.0" font-size="14" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="normal">members suspended</text>
<text x="140.0" y="450.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Key organs</text>
<rect x="265.0" y="426.0" width="230.0" height="48.0" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
<text x="380.0" y="450.0" font-size="14" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Assembly, Council, Secretariat</text>
<rect x="515.0" y="426.0" width="250.0" height="48.0" rx="12" fill="#ffffff" stroke="#15803d" stroke-width="2.5"/>
<text x="640.0" y="450.0" font-size="14" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="normal">+ Parliament, PSC, Court</text>
<text x="400.0" y="505.0" font-size="14" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Africa Day, 25 May, marks the founding of the OAU.</text>
</svg>
