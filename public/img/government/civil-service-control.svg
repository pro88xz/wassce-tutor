<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Controls on the civil service</title>
<desc id="d">The civil service is controlled by ministers, Parliament (questions and the Public Accounts Committee), the courts, the Public Service Commission, the Auditor-General, the Anti-Corruption Commission, the Ombudsman, and the press and public opinion.</desc>
