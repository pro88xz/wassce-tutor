<rect x="508.0" y="344.0" width="224.0" height="64.0" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
<text x="620.0" y="376.0" font-size="16" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="normal">UN, AU and ECOWAS</text>
