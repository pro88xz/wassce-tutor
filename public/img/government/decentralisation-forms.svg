<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Centralisation and forms of decentralisation</title>
<desc id="d">Power can be centralised in the capital or decentralised. Deconcentration moves central officials to the districts but keeps decisions at the centre. Delegation hands specific tasks to bodies such as public corporations. Devolution transfers real legal powers and resources to elected local councils, as Sierra Leone&#x27;s Local Government Act does.</desc>
<defs><marker id="a475569" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker><marker id="a475569s" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#475569"/></marker></defs>
<rect width="800" height="420" rx="20" fill="#f8fafc"/>
<text x="400.0" y="34.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">How far is power moved from the centre?</text>
<line x1="70.0" y1="330.0" x2="740.0" y2="330.0" stroke="#475569" stroke-width="3" stroke-linecap="round" marker-end="url(#a475569)"/>
<text x="70.0" y="360.0" font-size="14" fill="#475569" text-anchor="start" dominant-baseline="middle" font-weight="normal">power stays at the centre</text>
<text x="740.0" y="360.0" font-size="14" fill="#475569" text-anchor="end" dominant-baseline="middle" font-weight="normal">power moved to local bodies</text>
<rect x="55.0" y="125.0" width="170.0" height="150.0" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
<text x="140.0" y="179.0" font-size="15" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Centralisation</text>
<text x="140.0" y="200.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">all decisions</text>
<text x="140.0" y="221.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">made in the capital</text>
<line x1="140.0" y1="278.0" x2="140.0" y2="322.0" stroke="#dc2626" stroke-width="2.2" stroke-linecap="round"/>
<circle cx="140.0" cy="330.0" r="7.0" fill="#dc2626" stroke="#dc2626" stroke-width="1"/>
<rect x="235.0" y="125.0" width="170.0" height="150.0" rx="12" fill="#fef3c7" stroke="#ea580c" stroke-width="2.5"/>
<text x="320.0" y="179.0" font-size="15" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Deconcentration</text>
<text x="320.0" y="200.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">central officials</text>
<text x="320.0" y="221.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">posted to districts</text>
<line x1="320.0" y1="278.0" x2="320.0" y2="322.0" stroke="#ea580c" stroke-width="2.2" stroke-linecap="round"/>
<circle cx="320.0" cy="330.0" r="7.0" fill="#ea580c" stroke="#ea580c" stroke-width="1"/>
<rect x="415.0" y="125.0" width="170.0" height="150.0" rx="12" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/>
<text x="500.0" y="179.0" font-size="15" fill="#0f766e" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Delegation</text>
<text x="500.0" y="200.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">tasks handed to</text>
<text x="500.0" y="221.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">agencies, corporations</text>
<line x1="500.0" y1="278.0" x2="500.0" y2="322.0" stroke="#0f766e" stroke-width="2.2" stroke-linecap="round"/>
<circle cx="500.0" cy="330.0" r="7.0" fill="#0f766e" stroke="#0f766e" stroke-width="1"/>
<rect x="595.0" y="125.0" width="170.0" height="150.0" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
<text x="680.0" y="179.0" font-size="15" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Devolution</text>
<text x="680.0" y="200.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">legal powers and</text>
<text x="680.0" y="221.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">money to elected councils</text>
<line x1="680.0" y1="278.0" x2="680.0" y2="322.0" stroke="#15803d" stroke-width="2.2" stroke-linecap="round"/>
<circle cx="680.0" cy="330.0" r="7.0" fill="#15803d" stroke="#15803d" stroke-width="1"/>
<text x="400.0" y="400.0" font-size="14" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Decentralisation = deconcentration, delegation or devolution.</text>
</svg>
