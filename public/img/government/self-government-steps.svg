<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Steps towards self-government in Sierra Leone</title>
<desc id="d">1863 Executive and Legislative Councils. 1924 Slater Constitution: first elected members. 1951 constitution: African majority in the Legislative Council, with Protectorate members. 1953 ministerial system. 1956 constitution: House of Representatives; 1957 elections. 1958: Premier and an all-Sierra Leonean Executive Council. 1960 Lancaster House conference. 27 April 1961 independence.</desc>
<defs></defs>
<rect width="800" height="560" rx="20" fill="#f8fafc"/>
<text x="400.0" y="34.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Constitutional steps to independence</text>
<line x1="150.0" y1="72.0" x2="150.0" y2="538.0" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
<circle cx="150.0" cy="88.0" r="9.0" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
<text x="128.0" y="88.0" font-size="16" fill="#2563eb" text-anchor="end" dominant-baseline="middle" font-weight="bold">1863</text>
<text x="174.0" y="78.0" font-size="15" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Executive and Legislative Councils</text>
<text x="174.0" y="99.0" font-size="14" fill="#475569" text-anchor="start" dominant-baseline="middle" font-weight="normal">officials and nominated members only</text>
<circle cx="150.0" cy="150.0" r="9.0" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
<text x="128.0" y="150.0" font-size="16" fill="#2563eb" text-anchor="end" dominant-baseline="middle" font-weight="bold">1924</text>
<text x="174.0" y="140.0" font-size="15" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Slater Constitution</text>
<text x="174.0" y="161.0" font-size="14" fill="#475569" text-anchor="start" dominant-baseline="middle" font-weight="normal">first 3 elected members; 3 chiefs nominated</text>
<circle cx="150.0" cy="212.0" r="9.0" fill="#ffffff" stroke="#15803d" stroke-width="3"/>
<text x="128.0" y="212.0" font-size="16" fill="#15803d" text-anchor="end" dominant-baseline="middle" font-weight="bold">1951</text>
<text x="174.0" y="202.0" font-size="15" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Stevenson / Beresford-Stooke Constitution</text>
<text x="174.0" y="223.0" font-size="14" fill="#475569" text-anchor="start" dominant-baseline="middle" font-weight="normal">African majority; Protectorate represented</text>
<circle cx="150.0" cy="274.0" r="9.0" fill="#ffffff" stroke="#15803d" stroke-width="3"/>
<text x="128.0" y="274.0" font-size="16" fill="#15803d" text-anchor="end" dominant-baseline="middle" font-weight="bold">1953</text>
<text x="174.0" y="264.0" font-size="15" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Ministerial system</text>
<text x="174.0" y="285.0" font-size="14" fill="#475569" text-anchor="start" dominant-baseline="middle" font-weight="normal">Africans head government departments</text>
<circle cx="150.0" cy="336.0" r="9.0" fill="#ffffff" stroke="#15803d" stroke-width="3"/>
<text x="128.0" y="336.0" font-size="16" fill="#15803d" text-anchor="end" dominant-baseline="middle" font-weight="bold">1956</text>
<text x="174.0" y="326.0" font-size="15" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">House of Representatives replaces LegCo</text>
<text x="174.0" y="347.0" font-size="14" fill="#475569" text-anchor="start" dominant-baseline="middle" font-weight="normal">elections held in 1957</text>
<circle cx="150.0" cy="398.0" r="9.0" fill="#ffffff" stroke="#15803d" stroke-width="3"/>
<text x="128.0" y="398.0" font-size="16" fill="#15803d" text-anchor="end" dominant-baseline="middle" font-weight="bold">1958</text>
<text x="174.0" y="388.0" font-size="15" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Premier; all-Sierra Leonean Executive Council</text>
<text x="174.0" y="409.0" font-size="14" fill="#475569" text-anchor="start" dominant-baseline="middle" font-weight="normal">internal self-government</text>
<circle cx="150.0" cy="460.0" r="9.0" fill="#ffffff" stroke="#ea580c" stroke-width="3"/>
<text x="128.0" y="460.0" font-size="16" fill="#ea580c" text-anchor="end" dominant-baseline="middle" font-weight="bold">1960</text>
<text x="174.0" y="450.0" font-size="15" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Lancaster House conference, London</text>
<text x="174.0" y="471.0" font-size="14" fill="#475569" text-anchor="start" dominant-baseline="middle" font-weight="normal">independence terms agreed</text>
<circle cx="150.0" cy="522.0" r="9.0" fill="#ffffff" stroke="#dc2626" stroke-width="3"/>
<text x="128.0" y="522.0" font-size="16" fill="#dc2626" text-anchor="end" dominant-baseline="middle" font-weight="bold">1961</text>
<text x="174.0" y="512.0" font-size="15" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Independence, 27 April</text>
<text x="174.0" y="533.0" font-size="14" fill="#475569" text-anchor="start" dominant-baseline="middle" font-weight="normal">Sir Milton Margai, Prime Minister</text>
</svg>
