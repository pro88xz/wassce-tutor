<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Key political events from 1961 to 1971</title>
<desc id="d">1961 independence under Sir Milton Margai. 1964 Milton Margai dies; Albert Margai becomes Prime Minister. 1967 the APC wins the general election; Brigadier Lansana declares martial law; officers form the National Reformation Council. 1968 the Sergeants&#x27; revolt ends NRC rule and Siaka Stevens becomes Prime Minister. 1971 attempted coup; Sierra Leone becomes a republic on 19 April and Stevens executive President.</desc>
<defs></defs>
<rect width="800" height="560" rx="20" fill="#f8fafc"/>
<text x="400.0" y="34.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">From independence to republic</text>
<line x1="150.0" y1="72.0" x2="150.0" y2="538.0" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
<circle cx="150.0" cy="88.0" r="9.0" fill="#ffffff" stroke="#15803d" stroke-width="3"/>
<text x="128.0" y="88.0" font-size="16" fill="#15803d" text-anchor="end" dominant-baseline="middle" font-weight="bold">1961</text>
<text x="174.0" y="78.0" font-size="15" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Independence</text>
<text x="174.0" y="99.0" font-size="14" fill="#475569" text-anchor="start" dominant-baseline="middle" font-weight="normal">Sir Milton Margai, Prime Minister (SLPP)</text>
<circle cx="150.0" cy="150.0" r="9.0" fill="#ffffff" stroke="#15803d" stroke-width="3"/>
<text x="128.0" y="150.0" font-size="16" fill="#15803d" text-anchor="end" dominant-baseline="middle" font-weight="bold">1964</text>
<text x="174.0" y="140.0" font-size="15" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Milton Margai dies</text>
<text x="174.0" y="161.0" font-size="14" fill="#475569" text-anchor="start" dominant-baseline="middle" font-weight="normal">Albert Margai becomes Prime Minister</text>
<circle cx="150.0" cy="212.0" r="9.0" fill="#ffffff" stroke="#ea580c" stroke-width="3"/>
<text x="128.0" y="212.0" font-size="16" fill="#ea580c" text-anchor="end" dominant-baseline="middle" font-weight="bold">1966</text>
<text x="174.0" y="202.0" font-size="15" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Albert Margai proposes a one-party state</text>
<text x="174.0" y="223.0" font-size="14" fill="#475569" text-anchor="start" dominant-baseline="middle" font-weight="normal">and a republic; strong opposition</text>
<circle cx="150.0" cy="274.0" r="9.0" fill="#ffffff" stroke="#dc2626" stroke-width="3"/>
<text x="128.0" y="274.0" font-size="16" fill="#dc2626" text-anchor="end" dominant-baseline="middle" font-weight="bold">1967</text>
<text x="174.0" y="264.0" font-size="15" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">APC wins the election; Stevens sworn in</text>
<text x="174.0" y="285.0" font-size="14" fill="#475569" text-anchor="start" dominant-baseline="middle" font-weight="normal">Brigadier Lansana declares martial law</text>
<circle cx="150.0" cy="336.0" r="9.0" fill="#ffffff" stroke="#dc2626" stroke-width="3"/>
<text x="128.0" y="336.0" font-size="16" fill="#dc2626" text-anchor="end" dominant-baseline="middle" font-weight="bold">1967</text>
<text x="174.0" y="326.0" font-size="15" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">National Reformation Council (NRC)</text>
<text x="174.0" y="347.0" font-size="14" fill="#475569" text-anchor="start" dominant-baseline="middle" font-weight="normal">military rule, Juxon-Smith</text>
<circle cx="150.0" cy="398.0" r="9.0" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
<text x="128.0" y="398.0" font-size="16" fill="#2563eb" text-anchor="end" dominant-baseline="middle" font-weight="bold">1968</text>
<text x="174.0" y="388.0" font-size="15" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Sergeants&#x27; revolt ends NRC rule</text>
<text x="174.0" y="409.0" font-size="14" fill="#475569" text-anchor="start" dominant-baseline="middle" font-weight="normal">Siaka Stevens becomes Prime Minister (APC)</text>
<circle cx="150.0" cy="460.0" r="9.0" fill="#ffffff" stroke="#ea580c" stroke-width="3"/>
<text x="128.0" y="460.0" font-size="16" fill="#ea580c" text-anchor="end" dominant-baseline="middle" font-weight="bold">1971</text>
<text x="174.0" y="460.0" font-size="15" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Attempted coup (March)</text>
<circle cx="150.0" cy="522.0" r="9.0" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
<text x="128.0" y="522.0" font-size="16" fill="#2563eb" text-anchor="end" dominant-baseline="middle" font-weight="bold">1971</text>
<text x="174.0" y="512.0" font-size="15" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Republic declared, 19 April</text>
<text x="174.0" y="533.0" font-size="14" fill="#475569" text-anchor="start" dominant-baseline="middle" font-weight="normal">Stevens executive President</text>
</svg>
