<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Amending Sierra Leone&#x27;s 1991 Constitution</title>
<desc id="d">A bill to alter the Constitution must be supported by at least two-thirds of all Members of Parliament at its second and third readings. For the entrenched provisions, it must also be approved at a referendum in which at least half of the registered voters vote in favour and at least two-thirds of the valid votes cast support it. It then goes to the President for assent.</desc>
<defs><marker id="a475569" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker><marker id="a475569s" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#475569"/></marker><marker id="aea580c" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#ea580c"/></marker><marker id="aea580cs" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#ea580c"/></marker></defs>
<rect width="800" height="470" rx="20" fill="#f8fafc"/>
<text x="400.0" y="34.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">A rigid constitution: two hurdles, sometimes three</text>
<rect x="190.0" y="70.0" width="420.0" height="60.0" rx="12" fill="#e2e8f0" stroke="#0f172a" stroke-width="2.5"/>
<text x="400.0" y="89.5" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Bill to alter the Constitution</text>
<text x="400.0" y="110.5" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">published and introduced in Parliament</text>
<rect x="190.0" y="167.0" width="420.0" height="66.0" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="400.0" y="189.5" font-size="15" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Parliament: at least two-thirds of all MPs</text>
<text x="400.0" y="210.5" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">at the second and third readings</text>
<rect x="380.0" y="268.0" width="360.0" height="84.0" rx="12" fill="#fef3c7" stroke="#ea580c" stroke-width="2.5"/>
<text x="560.0" y="290.0" font-size="14" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Entrenched provisions only:</text>
<text x="560.0" y="310.0" font-size="12" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">referendum: half of registered voters</text>
<text x="560.0" y="330.0" font-size="12" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">and two-thirds of valid votes in favour</text>
<rect x="70.0" y="380.0" width="300.0" height="60.0" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
<text x="220.0" y="399.5" font-size="15" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Presidential assent</text>
<text x="220.0" y="420.5" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">the amendment becomes law</text>
<line x1="400.0" y1="136.0" x2="400.0" y2="161.0" stroke="#475569" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a475569)"/>
<line x1="400.0" y1="239.0" x2="560.0" y2="262.0" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round" marker-end="url(#aea580c)"/>
<line x1="300.0" y1="234.0" x2="230.0" y2="378.0" stroke="#475569" stroke-width="2.6" stroke-linecap="round" marker-end="url(#a475569)"/>
<rect x="161.8" y="288.5" width="126.5" height="23.0" rx="4" fill="#f8fafc" stroke="none" stroke-width="0" opacity="0.92"/>
<text x="225.0" y="300.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">other provisions</text>
<line x1="470.0" y1="352.0" x2="370.0" y2="410.0" stroke="#ea580c" stroke-width="2.6" stroke-linecap="round" marker-end="url(#aea580c)"/>
</svg>
