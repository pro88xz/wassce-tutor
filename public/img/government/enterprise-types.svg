<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Government department, public corporation and private company</title>
<desc id="d">A government department is part of a ministry, financed from the budget and run by civil servants under a minister. A public corporation is created by an Act, owned by the state, run by a board with day-to-day independence, and aims to provide a service at reasonable cost. A private company is owned by shareholders and run for profit.</desc>
<defs></defs>
<rect width="800" height="470" rx="20" fill="#f8fafc"/>
<text x="400.0" y="34.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Three ways to run an enterprise</text>
<text x="110.0" y="160.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Created by</text>
<text x="110.0" y="218.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Owned by</text>
