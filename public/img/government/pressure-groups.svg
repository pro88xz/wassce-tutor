<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Types and methods of pressure groups</title>
<desc id="d">Interest (sectional or protective) groups defend their members, such as trade unions and professional bodies. Promotional (cause) groups promote an idea, such as human rights or women&#x27;s representation. Institutional groups are bodies within government or society, such as religious councils. Anomic groups arise suddenly, such as spontaneous protests. Methods include lobbying, petitions, media campaigns, strikes, demonstrations, court action and boycotts.</desc>
<defs></defs>
<rect width="800" height="480" rx="20" fill="#f8fafc"/>
<text x="400.0" y="34.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Pressure groups: who they are and how they act</text>
<rect x="20.0" y="80.0" width="180.0" height="140.0" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="110.0" y="108.0" font-size="15" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Interest</text>
<text x="110.0" y="129.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">(sectional)</text>
<text x="110.0" y="150.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">defend members:</text>
<text x="110.0" y="171.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">SLTU, Labour</text>
<text x="110.0" y="192.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Congress, Bar</text>
<rect x="215.0" y="80.0" width="180.0" height="140.0" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="305.0" y="108.0" font-size="15" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Promotional</text>
<text x="305.0" y="129.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">(cause)</text>
<text x="305.0" y="150.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">promote an idea:</text>
<text x="305.0" y="171.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">50/50 Group,</text>
<text x="305.0" y="192.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">rights groups</text>
<rect x="410.0" y="80.0" width="180.0" height="140.0" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="500.0" y="108.0" font-size="15" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Institutional</text>
<text x="500.0" y="129.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">inside society</text>
<text x="500.0" y="150.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">or the state:</text>
<text x="500.0" y="171.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Inter-Religious</text>
<text x="500.0" y="192.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Council</text>
<rect x="605.0" y="80.0" width="180.0" height="140.0" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="695.0" y="108.0" font-size="15" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Anomic</text>
<text x="695.0" y="129.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">sudden and</text>
<text x="695.0" y="150.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">unorganised:</text>
<text x="695.0" y="171.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">spontaneous</text>
<text x="695.0" y="192.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">street protests</text>
<text x="400.0" y="255.0" font-size="18" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Methods</text>
<rect x="20.0" y="278.0" width="180.0" height="44.0" rx="12" fill="#fef3c7" stroke="#ea580c" stroke-width="2.5"/>
<text x="110.0" y="300.0" font-size="15" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="normal">lobbying officials</text>
<rect x="215.0" y="278.0" width="180.0" height="44.0" rx="12" fill="#fef3c7" stroke="#ea580c" stroke-width="2.5"/>
<text x="305.0" y="300.0" font-size="15" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="normal">petitions</text>
<rect x="410.0" y="278.0" width="180.0" height="44.0" rx="12" fill="#fef3c7" stroke="#ea580c" stroke-width="2.5"/>
<text x="500.0" y="300.0" font-size="15" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="normal">press and radio</text>
<rect x="605.0" y="278.0" width="180.0" height="44.0" rx="12" fill="#fef3c7" stroke="#ea580c" stroke-width="2.5"/>
<text x="695.0" y="300.0" font-size="15" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="normal">strikes</text>
<rect x="20.0" y="338.0" width="180.0" height="44.0" rx="12" fill="#fef3c7" stroke="#ea580c" stroke-width="2.5"/>
<text x="110.0" y="360.0" font-size="15" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="normal">demonstrations</text>
<rect x="215.0" y="338.0" width="180.0" height="44.0" rx="12" fill="#fef3c7" stroke="#ea580c" stroke-width="2.5"/>
<text x="305.0" y="360.0" font-size="15" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="normal">court action</text>
<rect x="410.0" y="338.0" width="180.0" height="44.0" rx="12" fill="#fef3c7" stroke="#ea580c" stroke-width="2.5"/>
<text x="500.0" y="360.0" font-size="15" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="normal">boycotts</text>
<rect x="605.0" y="338.0" width="180.0" height="44.0" rx="12" fill="#fef3c7" stroke="#ea580c" stroke-width="2.5"/>
<text x="695.0" y="360.0" font-size="15" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="normal">funding candidates</text>
<text x="400.0" y="455.0" font-size="14" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Pressure groups seek to influence policy; unlike parties, they do not seek to form a government.</text>
</svg>
