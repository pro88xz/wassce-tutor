<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Safeguards of judicial independence</title>
<desc id="d">Judges are independent when they are appointed on merit through the Judicial and Legal Service Commission with Parliament&#x27;s approval, have security of tenure until retirement at 65, can be removed only for proven misconduct or incapacity by a special procedure, are paid salaries that cannot be reduced and are charged on the Consolidated Fund, have immunity for judicial acts, and stay out of party politics.</desc>
<defs><marker id="a475569" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker><marker id="a475569s" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#475569"/></marker></defs>
<rect width="800" height="450" rx="20" fill="#f8fafc"/>
<text x="400.0" y="34.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">What keeps judges independent?</text>
<rect x="290.0" y="200.0" width="220.0" height="70.0" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
<text x="400.0" y="222.5" font-size="19" fill="#7c3aed" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Independent</text>
<text x="400.0" y="247.5" font-size="17" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">judiciary</text>
<rect x="35.0" y="68.0" width="230.0" height="84.0" rx="12" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/>
<text x="150.0" y="89.0" font-size="15" fill="#0f766e" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Appointment on merit</text>
<text x="150.0" y="110.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">advice of the JLSC,</text>
<text x="150.0" y="131.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">approved by Parliament</text>
<line x1="150.0" y1="158.0" x2="400.0" y2="194.0" stroke="#475569" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a475569)"/>
<rect x="535.0" y="68.0" width="230.0" height="84.0" rx="12" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/>
<text x="650.0" y="89.0" font-size="15" fill="#0f766e" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Security of tenure</text>
<text x="650.0" y="110.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">serve until 65;</text>
<text x="650.0" y="131.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">hard to remove</text>
<line x1="650.0" y1="158.0" x2="400.0" y2="194.0" stroke="#475569" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a475569)"/>
<rect x="15.0" y="193.0" width="230.0" height="84.0" rx="12" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/>
<text x="130.0" y="214.0" font-size="15" fill="#0f766e" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Removal only for cause</text>
<text x="130.0" y="235.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">proven misconduct or</text>
<text x="130.0" y="256.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">incapacity, by tribunal</text>
<line x1="251.0" y1="235.0" x2="284.0" y2="235.0" stroke="#475569" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a475569)"/>
<rect x="555.0" y="193.0" width="230.0" height="84.0" rx="12" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/>
<text x="670.0" y="214.0" font-size="15" fill="#0f766e" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Protected salaries</text>
<text x="670.0" y="235.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">cannot be reduced;</text>
<text x="670.0" y="256.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Consolidated Fund</text>
<line x1="549.0" y1="235.0" x2="516.0" y2="235.0" stroke="#475569" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a475569)"/>
<rect x="35.0" y="318.0" width="230.0" height="84.0" rx="12" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/>
<text x="150.0" y="339.0" font-size="15" fill="#0f766e" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Judicial immunity</text>
<text x="150.0" y="360.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">not sued for</text>
<text x="150.0" y="381.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">judicial decisions</text>
<line x1="150.0" y1="312.0" x2="400.0" y2="276.0" stroke="#475569" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a475569)"/>
<rect x="535.0" y="318.0" width="230.0" height="84.0" rx="12" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/>
<text x="650.0" y="339.0" font-size="15" fill="#0f766e" text-anchor="middle" dominant-baseline="middle" font-weight="bold">No party politics</text>
<text x="650.0" y="360.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">judges stay neutral</text>
<text x="650.0" y="381.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">and impartial</text>
<line x1="650.0" y1="312.0" x2="400.0" y2="276.0" stroke="#475569" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a475569)"/>
</svg>
