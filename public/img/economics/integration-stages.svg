<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Stages of economic integration</title>
<desc id="d">Each stage adds to the one before: a free trade area removes tariffs among members; a customs union adds a common external tariff; a common market adds free movement of labour and capital; an economic union adds common economic policies and often a single currency.</desc>
<defs><marker id="a0f172a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f172a"/></marker><marker id="a0f172as" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#0f172a"/></marker></defs>
<rect width="760" height="470" rx="20" fill="#f8fafc"/>
<rect x="40.0" y="308.0" width="680.0" height="64.0" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
<text x="60.0" y="330.0" font-size="18" fill="#15803d" text-anchor="start" dominant-baseline="middle" font-weight="bold">Free trade area</text>
<text x="60.0" y="354.0" font-size="15" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">no tariffs between members</text>
<rect x="90.0" y="234.0" width="580.0" height="64.0" rx="12" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/>
<text x="110.0" y="256.0" font-size="18" fill="#0f766e" text-anchor="start" dominant-baseline="middle" font-weight="bold">Customs union</text>
<text x="110.0" y="280.0" font-size="15" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">+ a common external tariff</text>
<rect x="140.0" y="160.0" width="480.0" height="64.0" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="160.0" y="182.0" font-size="18" fill="#2563eb" text-anchor="start" dominant-baseline="middle" font-weight="bold">Common market</text>
<text x="160.0" y="206.0" font-size="15" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">+ free movement of labour and capital</text>
<rect x="190.0" y="86.0" width="380.0" height="64.0" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
<text x="210.0" y="108.0" font-size="18" fill="#7c3aed" text-anchor="start" dominant-baseline="middle" font-weight="bold">Economic union</text>
<text x="210.0" y="132.0" font-size="15" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">+ common policies, often one currency</text>
<line x1="720.0" y1="380.0" x2="720.0" y2="90.0" stroke="#0f172a" stroke-width="3" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<text x="712.0" y="418.0" font-size="15" fill="#0f172a" text-anchor="end" dominant-baseline="middle" font-weight="bold">deeper integration ↑</text>
<text x="380.0" y="40.0" font-size="19" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Each stage includes everything below it</text>
</svg>
