<title id="t">Movement along a demand curve and a shift of the curve</title>
<desc id="d">Left: a fall in the good&#x27;s own price moves buyers along the same demand curve from A to B (an extension of demand). Right: a change in income or tastes shifts the whole curve: right to D2 for an increase, left to D3 for a decrease.</desc>
