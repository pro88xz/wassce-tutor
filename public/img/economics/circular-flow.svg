<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The circular flow of income</title>
<desc id="d">Households supply factor services to firms and receive incomes (rent, wages, interest, profit). Firms supply goods and services to households, which pay for them with consumer spending. Money flows one way, real goods and services the other.</desc>
<defs><marker id="a0f766e" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/></marker><marker id="a0f766es" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#0f766e"/></marker><marker id="a7c3aed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker><marker id="a7c3aeds" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#7c3aed"/></marker><marker id="aea580c" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#ea580c"/></marker><marker id="aea580cs" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#ea580c"/></marker></defs>
<rect width="720" height="440" rx="20" fill="#f8fafc"/>
<rect x="45.0" y="180.0" width="210.0" height="90.0" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="150.0" y="225.0" font-size="21" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Households</text>
<rect x="465.0" y="180.0" width="210.0" height="90.0" rx="16" fill="#dcfce7" stroke="#15803d" stroke-width="3"/>
<text x="570.0" y="225.0" font-size="21" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Firms</text>
<path d="M 150 176 C 150 70, 570 70, 560 172" stroke="#ea580c" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#aea580c)"/>
<text x="360.0" y="76.0" font-size="16" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">consumer spending (money)</text>
<path d="M 570 120 C 510 110, 210 110, 154 172" stroke="#0f766e" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 6" marker-end="url(#a0f766e)"/>
<rect x="279.4" y="119.5" width="161.2" height="25.0" rx="4" fill="#f8fafc" stroke="none" stroke-width="0" opacity="0.92"/>
<text x="360.0" y="132.0" font-size="15" fill="#0f766e" text-anchor="middle" dominant-baseline="middle" font-weight="normal">goods and services</text>
<path d="M 570 274 C 570 380, 150 380, 160 278" stroke="#7c3aed" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a7c3aed)"/>
<text x="360.0" y="392.0" font-size="16" fill="#7c3aed" text-anchor="middle" dominant-baseline="middle" font-weight="bold">incomes: rent, wages, interest, profit (money)</text>
<path d="M 150 330 C 210 340, 510 340, 566 278" stroke="#0f766e" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 6" marker-end="url(#a0f766e)"/>
<rect x="145.0" y="305.5" width="430.0" height="25.0" rx="4" fill="#f8fafc" stroke="none" stroke-width="0" opacity="0.92"/>
<text x="360.0" y="318.0" font-size="15" fill="#0f766e" text-anchor="middle" dominant-baseline="middle" font-weight="normal">factor services: land, labour, capital, enterprise</text>
<text x="360.0" y="30.0" font-size="17" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Two-sector circular flow: money one way, real flows the other</text>
</svg>
