<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Aminata&#x27;s scale of preference</title>
<desc id="d">Aminata ranks five wants and adds up their cost: food 180, transport 60 and exercise books 40 come to 280 NLe, within her 300 NLe budget. Sandals (70) and phone data (30) are left unsatisfied.</desc>
<defs></defs>
<rect width="720" height="400" rx="20" fill="#f8fafc"/>
<text x="268.0" y="95.0" font-size="16" fill="#0f172a" text-anchor="end" dominant-baseline="middle" font-weight="bold">1  Food for the month</text>
<rect x="280.0" y="78.0" width="189.0" height="34.0" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="374.5" y="95.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">180</text>
<text x="268.0" y="145.0" font-size="16" fill="#0f172a" text-anchor="end" dominant-baseline="middle" font-weight="bold">2  Transport to school</text>
<rect x="469.0" y="128.0" width="63.0" height="34.0" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="500.5" y="145.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">60</text>
<text x="268.0" y="195.0" font-size="16" fill="#0f172a" text-anchor="end" dominant-baseline="middle" font-weight="bold">3  Exercise books</text>
<rect x="532.0" y="178.0" width="42.0" height="34.0" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="553.0" y="195.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">40</text>
<text x="268.0" y="245.0" font-size="16" fill="#475569" text-anchor="end" dominant-baseline="middle" font-weight="normal">4  New sandals</text>
<rect x="574.0" y="228.0" width="73.5" height="34.0" rx="4" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
<text x="610.8" y="245.0" font-size="14" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">70</text>
<text x="268.0" y="295.0" font-size="16" fill="#475569" text-anchor="end" dominant-baseline="middle" font-weight="normal">5  Phone data</text>
<rect x="647.5" y="278.0" width="31.5" height="34.0" rx="4" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
<text x="663.2" y="295.0" font-size="14" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">30</text>
<line x1="595.0" y1="62.0" x2="595.0" y2="334.0" stroke="#dc2626" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6"/>
<text x="595.0" y="352.0" font-size="15" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="bold">budget NLe 300</text>
<line x1="280.0" y1="330.0" x2="689.5" y2="330.0" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
<line x1="280.0" y1="326.0" x2="280.0" y2="334.0" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
<text x="280.0" y="348.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">0</text>
<line x1="385.0" y1="326.0" x2="385.0" y2="334.0" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
<text x="385.0" y="348.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">100</text>
<line x1="490.0" y1="326.0" x2="490.0" y2="334.0" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
<text x="490.0" y="348.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">200</text>
<line x1="595.0" y1="326.0" x2="595.0" y2="334.0" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
<line x1="700.0" y1="326.0" x2="700.0" y2="334.0" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
<text x="700.0" y="348.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">400</text>
<text x="470.0" y="386.0" font-size="15" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Wants 1–3 are satisfied; the sandals are the next want forgone.</text>
<text x="360.0" y="36.0" font-size="17" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Running total of the cost of each want (NLe)</text>
</svg>
