<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The vicious circle of poverty</title>
<desc id="d">Low income leads to low saving, which leads to low investment, low capital, low productivity and so low income again. Breaking any link, for example with foreign investment or education, can turn it into a virtuous circle.</desc>
