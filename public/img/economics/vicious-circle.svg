<text x="350.0" y="90.0" font-size="17" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Low income</text>
<rect x="431.4" y="186.9" width="170.0" height="48.0" rx="12" fill="#fef3c7" stroke="#ea580c" stroke-width="2.5"/>
<text x="516.4" y="210.9" font-size="17" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Low saving</text>
<rect x="367.9" y="382.6" width="170.0" height="48.0" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
<text x="452.9" y="406.6" font-size="17" fill="#7c3aed" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Low investment</text>
<rect x="162.1" y="382.6" width="170.0" height="48.0" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="247.1" y="406.6" font-size="17" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Little capital</text>
<rect x="98.6" y="186.9" width="170.0" height="48.0" rx="12" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/>
<text x="183.6" y="210.9" font-size="17" fill="#0f766e" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Low productivity</text>
<text x="350.0" y="255.0" font-size="18" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal" font-style="italic">the vicious circle</text>
<text x="350.0" y="281.0" font-size="18" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal" font-style="italic">of poverty</text>
