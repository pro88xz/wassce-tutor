<title id="t">Pie chart of a household&#x27;s monthly spending</title>
<desc id="d">A household spends NLe 600: food 300 (180 degrees), rent 150 (90 degrees), transport 90 (54 degrees) and school fees 60 (36 degrees).</desc>
