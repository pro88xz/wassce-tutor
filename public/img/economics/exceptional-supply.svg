<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Exceptional supply curves</title>
<desc id="d">Left: the backward-bending supply curve of labour. Above a certain wage, workers choose more leisure and offer fewer hours. Right: fixed supply, such as land, is a vertical line: the quantity cannot change whatever the price.</desc>
<defs><marker id="a0f172a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f172a"/></marker><marker id="a0f172as" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#0f172a"/></marker></defs>
<rect width="760" height="420" rx="20" fill="#f8fafc"/>
<line x1="70.0" y1="340.0" x2="376.0" y2="340.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<line x1="70.0" y1="340.0" x2="70.0" y2="62.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<text x="376.0" y="376.0" font-size="16" fill="#475569" text-anchor="end" dominant-baseline="middle" font-weight="normal">Hours of work offered</text>
<text x="78.0" y="54.0" font-size="16" fill="#475569" text-anchor="start" dominant-baseline="middle" font-weight="normal">Wage rate</text>
<path d="M 97.6 315.2 C 113.7 304.5 167.6 269.8 194.3 250.9 C 221.0 231.9 243.5 215.4 257.8 201.3 C 272.1 187.3 279.4 179.0 279.9 166.7 C 280.4 154.3 270.7 138.6 260.6 127.0 C 250.4 115.5 226.0 102.3 219.1 97.3" stroke="#15803d" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="211.1" y="89.3" font-size="15" fill="#15803d" text-anchor="end" dominant-baseline="middle" font-weight="bold">S (labour)</text>
<line x1="279.9" y1="166.7" x2="279.9" y2="340.0" stroke="#475569" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="6 5"/>
<line x1="279.9" y1="166.7" x2="70.0" y2="166.7" stroke="#475569" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="6 5"/>
<text x="289.9" y="172.7" font-size="14" fill="#475569" text-anchor="start" dominant-baseline="middle" font-weight="normal">bends back</text>
<text x="215.0" y="30.0" font-size="16" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Labour: more leisure at high wages</text>
<line x1="450.0" y1="340.0" x2="756.0" y2="340.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<line x1="450.0" y1="340.0" x2="450.0" y2="62.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<text x="756.0" y="376.0" font-size="16" fill="#475569" text-anchor="end" dominant-baseline="middle" font-weight="normal">Quantity</text>
<text x="458.0" y="54.0" font-size="16" fill="#475569" text-anchor="start" dominant-baseline="middle" font-weight="normal">Price</text>
<line x1="588.1" y1="340.0" x2="588.1" y2="346.0" stroke="#0f172a" stroke-width="1.6" stroke-linecap="round"/>
<text x="588.1" y="359.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Q</text>
<line x1="588.1" y1="325.1" x2="588.1" y2="97.3" stroke="#15803d" stroke-width="4" stroke-linecap="round"/>
<text x="600.1" y="101.3" font-size="17" fill="#15803d" text-anchor="start" dominant-baseline="middle" font-weight="bold">S</text>
<text x="600.1" y="216.2" font-size="14" fill="#475569" text-anchor="start" dominant-baseline="middle" font-weight="normal">fixed at any price</text>
<text x="595.0" y="30.0" font-size="16" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Fixed supply, such as land</text>
</svg>
