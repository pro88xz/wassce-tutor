<title id="t">Effects of shifts in demand and supply on equilibrium</title>
<desc id="d">Left: demand increases from D1 to D2, so equilibrium price and quantity both rise. Right: supply increases from S1 to S2 (for example a bumper harvest), so price falls and quantity rises.</desc>
