<title id="t">Movement along a supply curve and a shift of the curve</title>
<desc id="d">Left: a rise in the good&#x27;s own price moves sellers along the same supply curve from A to B (an extension of supply). Right: lower costs or better technology shift the curve right to S2 (increase); higher costs shift it left to S3 (decrease).</desc>
