<title id="t">Break-even chart</title>
<desc id="d">Total revenue (NLe 60 a unit) and total cost from the table. The lines cross between 3 and 4 units: below that output the firm makes a loss, above it a profit. Profit is greatest (NLe 30) at 5 units.</desc>
