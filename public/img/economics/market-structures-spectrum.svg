<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The four market structures</title>
<desc id="d">From perfect competition (very many firms, identical products) through monopolistic competition (many firms, differentiated products) and oligopoly (a few large firms) to monopoly (one firm).</desc>
<defs><marker id="a0f172a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f172a"/></marker><marker id="a0f172as" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#0f172a"/></marker></defs>
<rect width="760" height="380" rx="20" fill="#f8fafc"/>
<rect x="22.0" y="90.0" width="168.0" height="170.0" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
<text x="106.0" y="128.0" font-size="18" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Perfect</text>
<text x="106.0" y="152.0" font-size="18" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">competition</text>
<text x="106.0" y="200.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">very many firms</text>
<text x="106.0" y="226.0" font-size="14" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">identical product</text>
<rect x="206.0" y="90.0" width="168.0" height="170.0" rx="12" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/>
<text x="290.0" y="128.0" font-size="18" fill="#0f766e" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Monopolistic</text>
<text x="290.0" y="152.0" font-size="18" fill="#0f766e" text-anchor="middle" dominant-baseline="middle" font-weight="bold">competition</text>
<text x="290.0" y="200.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">many firms</text>
<text x="290.0" y="226.0" font-size="14" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">differentiated</text>
<rect x="390.0" y="90.0" width="168.0" height="170.0" rx="12" fill="#fef3c7" stroke="#ea580c" stroke-width="2.5"/>
<text x="474.0" y="116.0" font-size="18" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Oligopoly</text>
<text x="474.0" y="200.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">a few large firms</text>
<text x="474.0" y="226.0" font-size="14" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">similar or different</text>
<rect x="574.0" y="90.0" width="168.0" height="170.0" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
<text x="658.0" y="116.0" font-size="18" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Monopoly</text>
<text x="658.0" y="200.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">one firm</text>
<text x="658.0" y="226.0" font-size="14" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">no close substitute</text>
<line x1="60.0" y1="310.0" x2="700.0" y2="310.0" stroke="#0f172a" stroke-width="3" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<text x="380.0" y="338.0" font-size="16" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">fewer firms, more control over price</text>
<text x="380.0" y="46.0" font-size="19" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Market structures by number of sellers</text>
</svg>
