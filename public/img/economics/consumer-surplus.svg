<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Consumer surplus</title>
<desc id="d">On the plantain demand curve, at a market price of NLe 15 buyers purchase 60 bunches. The triangle above the price and below the demand curve is consumer surplus; the rectangle below the price is what buyers actually spend.</desc>
<defs><marker id="a0f172a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f172a"/></marker><marker id="a0f172as" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#0f172a"/></marker></defs>
<rect width="640" height="440" rx="20" fill="#f8fafc"/>
<line x1="90.0" y1="370.0" x2="566.0" y2="370.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<line x1="90.0" y1="370.0" x2="90.0" y2="62.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<text x="566.0" y="406.0" font-size="16" fill="#475569" text-anchor="end" dominant-baseline="middle" font-weight="normal">Quantity (bunches)</text>
<text x="98.0" y="54.0" font-size="16" fill="#475569" text-anchor="start" dominant-baseline="middle" font-weight="normal">Price (NLe)</text>
<text x="81.0" y="385.0" font-size="13" fill="#475569" text-anchor="end" dominant-baseline="middle" font-weight="normal">0</text>
<line x1="90.0" y1="370.0" x2="90.0" y2="376.0" stroke="#0f172a" stroke-width="1.6" stroke-linecap="round"/>
<line x1="310.8" y1="370.0" x2="310.8" y2="376.0" stroke="#0f172a" stroke-width="1.6" stroke-linecap="round"/>
<text x="310.8" y="389.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">60</text>
<line x1="531.6" y1="370.0" x2="531.6" y2="376.0" stroke="#0f172a" stroke-width="1.6" stroke-linecap="round"/>
<text x="531.6" y="389.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">120</text>
<line x1="84.0" y1="238.2" x2="90.0" y2="238.2" stroke="#0f172a" stroke-width="1.6" stroke-linecap="round"/>
<text x="80.0" y="238.2" font-size="13" fill="#475569" text-anchor="end" dominant-baseline="middle" font-weight="normal">15</text>
<line x1="84.0" y1="106.4" x2="90.0" y2="106.4" stroke="#0f172a" stroke-width="1.6" stroke-linecap="round"/>
<text x="80.0" y="106.4" font-size="13" fill="#475569" text-anchor="end" dominant-baseline="middle" font-weight="normal">30</text>
<polygon points="90.0,106.4 90.0,238.2 310.8,238.2" fill="#dcfce7" stroke="none" stroke-width="0" stroke-linejoin="round" opacity="0.85"/>
<polygon points="90.0,370.0 90.0,238.2 310.8,238.2 310.8,370.0" fill="#dbeafe" stroke="none" stroke-width="0" stroke-linejoin="round" opacity="0.6"/>
<path d="M 90.0 106.4 L 531.6 370.0" stroke="#2563eb" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="90.0" y1="238.2" x2="494.8" y2="238.2" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="8 6"/>
<text x="500.8" y="226.2" font-size="14" fill="#475569" text-anchor="end" dominant-baseline="middle" font-weight="normal">market price</text>
<text x="112.1" y="180.2" font-size="15" fill="#15803d" text-anchor="start" dominant-baseline="middle" font-weight="bold">consumer</text>
<text x="112.1" y="208.3" font-size="15" fill="#15803d" text-anchor="start" dominant-baseline="middle" font-weight="bold">surplus</text>
<text x="200.4" y="304.1" font-size="15" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">amount spent</text>
<text x="519.6" y="356.0" font-size="18" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">D</text>
<circle cx="310.8" cy="238.2" r="5.5" fill="#0f172a" stroke="#0f172a" stroke-width="1"/>
