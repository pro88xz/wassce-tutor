<title id="t">Malthus: population and food supply</title>
<desc id="d">Malthus argued that population tends to grow geometrically (1, 2, 4, 8, 16) while food supply grows only arithmetically (1, 2, 3, 4, 5), so population eventually outruns food.</desc>
