<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Demand-pull and cost-push inflation</title>
<desc id="d">Left: aggregate demand rises from AD1 to AD2, pulling the general price level up from P1 to P2 (demand-pull). Right: higher costs shift aggregate supply left from AS1 to AS2, pushing the price level up and cutting output (cost-push).</desc>
