<rect x="50.0" y="80.0" width="230.0" height="66.0" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
<text x="165.0" y="105.0" font-size="20" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Land</text>
<text x="165.0" y="129.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">farmland, minerals, rivers</text>
<line x1="290.0" y1="113.0" x2="430.0" y2="113.0" stroke="#15803d" stroke-width="3" stroke-linecap="round" marker-end="url(#a15803d)"/>
<text x="360.0" y="100.0" font-size="14" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">earns</text>
