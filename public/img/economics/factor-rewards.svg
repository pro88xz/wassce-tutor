<text x="540.0" y="113.0" font-size="20" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Rent</text>
<rect x="50.0" y="162.0" width="230.0" height="66.0" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="165.0" y="187.0" font-size="20" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Labour</text>
<text x="165.0" y="211.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">farmers, teachers, miners</text>
<line x1="290.0" y1="195.0" x2="430.0" y2="195.0" stroke="#2563eb" stroke-width="3" stroke-linecap="round" marker-end="url(#a2563eb)"/>
<text x="360.0" y="182.0" font-size="14" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">earns</text>
<rect x="440.0" y="170.0" width="200.0" height="50.0" rx="25" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
<text x="540.0" y="195.0" font-size="20" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Wages</text>
<rect x="50.0" y="244.0" width="230.0" height="66.0" rx="10" fill="#fef3c7" stroke="#ea580c" stroke-width="2.5"/>
<text x="165.0" y="269.0" font-size="20" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Capital</text>
<text x="165.0" y="293.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">tools, machines, buildings</text>
