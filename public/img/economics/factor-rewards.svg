<text x="540.0" y="277.0" font-size="20" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Interest</text>
<rect x="50.0" y="326.0" width="230.0" height="66.0" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
<text x="165.0" y="351.0" font-size="20" fill="#7c3aed" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Entrepreneur</text>
<text x="165.0" y="375.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">organises and takes risks</text>
<line x1="290.0" y1="359.0" x2="430.0" y2="359.0" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" marker-end="url(#a7c3aed)"/>
<text x="360.0" y="346.0" font-size="14" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">earns</text>
<rect x="440.0" y="334.0" width="200.0" height="50.0" rx="25" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5"/>
<text x="540.0" y="359.0" font-size="20" fill="#7c3aed" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Profit</text>
<text x="350.0" y="40.0" font-size="19" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Factor of production  →  its reward</text>
