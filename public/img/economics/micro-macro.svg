<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Microeconomics and macroeconomics</title>
<desc id="d">Microeconomics looks at single units: one household, one firm, one market. Macroeconomics looks at the whole economy: national income, the general price level, unemployment and the balance of payments.</desc>
<defs></defs>
<rect width="720" height="380" rx="20" fill="#f8fafc"/>
<rect x="30.0" y="80.0" width="300.0" height="250.0" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="180.0" y="115.0" font-size="22" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Microeconomics</text>
<text x="180.0" y="142.0" font-size="15" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal" font-style="italic">the trees: single units</text>
<text x="60.0" y="182.0" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">•  one household&#x27;s spending</text>
<text x="60.0" y="218.0" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">•  one firm&#x27;s costs and output</text>
<text x="60.0" y="254.0" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">•  the price of palm oil</text>
<text x="60.0" y="290.0" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">•  wages in one occupation</text>
<rect x="390.0" y="80.0" width="300.0" height="250.0" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
<text x="540.0" y="115.0" font-size="22" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Macroeconomics</text>
<text x="540.0" y="142.0" font-size="15" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal" font-style="italic">the forest: the whole economy</text>
<text x="420.0" y="182.0" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">•  national income (GDP)</text>
<text x="420.0" y="218.0" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">•  inflation (general prices)</text>
<text x="420.0" y="254.0" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">•  unemployment</text>
<text x="420.0" y="290.0" font-size="16" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">•  balance of payments</text>
<text x="360.0" y="44.0" font-size="19" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Two branches of economics</text>
</svg>
