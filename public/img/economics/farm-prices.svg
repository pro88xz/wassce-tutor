<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Why farm prices swing</title>
<desc id="d">Demand for a staple crop is inelastic (steep). A good harvest shifts supply right from S1 to S2 and the price falls sharply from P1 to P2; a poor harvest shifts supply left to S3 and the price jumps to P3.</desc>
