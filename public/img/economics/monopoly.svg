<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Monopoly equilibrium</title>
<desc id="d">The monopolist produces where marginal cost equals marginal revenue (Q), then charges the price the demand curve allows at that output (P). Price is above average cost, so it earns abnormal profit (shaded), which can last because entry is blocked.</desc>
