<text x="610.0" y="255.0" font-size="15" fill="#7c3aed" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Labour</text>
<line x1="437.8" y1="293.9" x2="487.3" y2="363.2" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round"/>
