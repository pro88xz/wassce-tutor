<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Factors that influence where industries locate</title>
<desc id="d">A factory in the centre surrounded by the factors that influence its location: raw materials, the market, labour, power, transport, water, government policy and external economies.</desc>
