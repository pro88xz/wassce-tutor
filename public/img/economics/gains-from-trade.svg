<text x="280.2" y="360.0" font-size="14" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">after</text>
<text x="231.1" y="386.0" font-size="17" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Rice</text>
<rect x="409.1" y="177.0" width="85.9" height="163.0" rx="0" fill="#e2e8f0" stroke="#475569" stroke-width="2.5"/>
<text x="452.0" y="165.0" font-size="16" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="bold">30</text>
