<text x="80.0" y="285.7" font-size="13" fill="#475569" text-anchor="end" dominant-baseline="middle" font-weight="normal">10</text>
<line x1="84.0" y1="231.3" x2="90.0" y2="231.3" stroke="#0f172a" stroke-width="1.6" stroke-linecap="round"/>
<text x="80.0" y="231.3" font-size="13" fill="#475569" text-anchor="end" dominant-baseline="middle" font-weight="normal">20</text>
<line x1="84.0" y1="177.0" x2="90.0" y2="177.0" stroke="#0f172a" stroke-width="1.6" stroke-linecap="round"/>
<text x="80.0" y="177.0" font-size="13" fill="#475569" text-anchor="end" dominant-baseline="middle" font-weight="normal">30</text>
<line x1="84.0" y1="122.6" x2="90.0" y2="122.6" stroke="#0f172a" stroke-width="1.6" stroke-linecap="round"/>
<text x="80.0" y="122.6" font-size="13" fill="#475569" text-anchor="end" dominant-baseline="middle" font-weight="normal">40</text>
<rect x="139.1" y="177.0" width="85.9" height="163.0" rx="0" fill="#e2e8f0" stroke="#475569" stroke-width="2.5"/>
<text x="182.0" y="165.0" font-size="16" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="bold">30</text>
