<text x="334.4" y="293.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">optimum</text>
<text x="212.2" y="312.2" font-size="15" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">economies of scale</text>
<text x="447.2" y="312.2" font-size="15" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="bold">diseconomies</text>
<text x="541.8" y="192.8" font-size="16" fill="#2563eb" text-anchor="start" dominant-baseline="middle" font-weight="bold">LRAC</text>
<text x="330.0" y="32.0" font-size="19" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Average cost falls, bottoms out, then rises as the firm grows</text>
