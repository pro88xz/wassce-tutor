<line x1="90.0" y1="350.0" x2="90.0" y2="62.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<text x="576.0" y="386.0" font-size="16" fill="#475569" text-anchor="end" dominant-baseline="middle" font-weight="normal">Size of population</text>
<text x="98.0" y="54.0" font-size="16" fill="#475569" text-anchor="start" dominant-baseline="middle" font-weight="normal">Output (income) per head</text>
<line x1="325.0" y1="350.0" x2="325.0" y2="356.0" stroke="#0f172a" stroke-width="1.6" stroke-linecap="round"/>
<text x="325.0" y="369.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">optimum</text>
