<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 430" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The optimum population</title>
<desc id="d">Output per head rises as population grows towards the optimum, where it is highest, and falls beyond it. To the left of the optimum the country is underpopulated; to the right it is overpopulated.</desc>
