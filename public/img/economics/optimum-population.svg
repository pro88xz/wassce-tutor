<text x="221.6" y="306.8" font-size="15" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">underpopulation</text>
<text x="433.1" y="306.8" font-size="15" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="bold">overpopulation</text>
