<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Primary, secondary and tertiary production</title>
<desc id="d">Fish moves through the three stages of production: caught by fishermen at Tombo (primary), smoked and packed (secondary), then transported and sold in Freetown markets (tertiary) before it reaches the consumer.</desc>
<defs><marker id="a0f172a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f172a"/></marker><marker id="a0f172as" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#0f172a"/></marker></defs>
<rect width="720" height="380" rx="20" fill="#f8fafc"/>
<rect x="30.0" y="110.0" width="190.0" height="150.0" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
<text x="125.0" y="145.0" font-size="21" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Primary</text>
<text x="125.0" y="178.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">extracts from nature</text>
<text x="125.0" y="222.0" font-size="14" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal" font-style="italic">fishing at Tombo</text>
<line x1="226.0" y1="185.0" x2="266.0" y2="185.0" stroke="#0f172a" stroke-width="3" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<rect x="270.0" y="110.0" width="190.0" height="150.0" rx="12" fill="#fef3c7" stroke="#ea580c" stroke-width="2.5"/>
<text x="365.0" y="145.0" font-size="21" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Secondary</text>
<text x="365.0" y="178.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">processes and makes</text>
<text x="365.0" y="222.0" font-size="14" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal" font-style="italic">smoking and packing fish</text>
<line x1="466.0" y1="185.0" x2="506.0" y2="185.0" stroke="#0f172a" stroke-width="3" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<rect x="510.0" y="110.0" width="190.0" height="150.0" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="605.0" y="145.0" font-size="21" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Tertiary</text>
<text x="605.0" y="178.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">provides services</text>
<text x="605.0" y="222.0" font-size="14" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal" font-style="italic">transport, trade, banking</text>
<text x="360.0" y="300.0" font-size="16" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">→  the consumer buys smoked fish in a Freetown market</text>
<text x="360.0" y="330.0" font-size="14" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Direct services (teachers, nurses) are tertiary production too.</text>
<text x="360.0" y="50.0" font-size="18" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Production is complete only when the good reaches the consumer</text>
</svg>
