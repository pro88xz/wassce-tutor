<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 640" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The five kinds of price elasticity of demand</title>
<desc id="d">Perfectly inelastic demand is a vertical line (PED 0); inelastic demand is steep (PED below 1); unitary demand is a rectangular hyperbola (PED 1); elastic demand is flat (PED above 1); perfectly elastic demand is horizontal (PED infinite).</desc>
