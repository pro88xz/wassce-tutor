<line x1="110.0" y1="124.0" x2="110.0" y2="176.0" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
<text x="110.0" y="106.0" font-size="19" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Capitalism</text>
<text x="110.0" y="200.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">the market decides</text>
<text x="110.0" y="222.0" font-size="15" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">private ownership</text>
<line x1="360.0" y1="124.0" x2="360.0" y2="176.0" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
<text x="360.0" y="106.0" font-size="19" fill="#0f766e" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Mixed economy</text>
<text x="360.0" y="200.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">market and state</text>
<text x="360.0" y="222.0" font-size="15" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">both sectors</text>
<line x1="610.0" y1="124.0" x2="610.0" y2="176.0" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
<text x="610.0" y="106.0" font-size="19" fill="#7c3aed" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Socialism</text>
<text x="610.0" y="200.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">the state plans</text>
<text x="610.0" y="222.0" font-size="15" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">public ownership</text>
<line x1="245.0" y1="300.0" x2="90.0" y2="300.0" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a2563eb)"/>
