<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The range of economic systems</title>
<desc id="d">Economic systems range from capitalism, where markets and private owners decide, through the mixed economy, to socialism, where the state plans and owns most resources. Sierra Leone is a mixed economy.</desc>
