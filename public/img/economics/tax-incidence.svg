<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Effect of a tax on a good</title>
<desc id="d">A tax per unit shifts supply up from S1 to S2 by the amount of the tax. The price paid by consumers rises from P1 to P2 and the quantity falls from Q1 to Q2. Consumers bear P1 to P2 of the tax and producers bear the rest.</desc>
