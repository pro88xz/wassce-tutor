<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The cycle of capital formation</title>
<desc id="d">Income that is not spent is saved; banks lend the savings to firms; firms invest in capital goods such as machines; more capital raises output and income, which allows more saving.</desc>
