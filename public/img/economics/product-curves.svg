<title id="t">Total, average and marginal product</title>
<desc id="d">From the table: total product rises to 48 with 5 and 6 workers, then falls. Marginal product rises to 14 with the 2nd worker, then falls, reaching 0 at the 6th and −3 at the 7th. Average product peaks at 12.</desc>
