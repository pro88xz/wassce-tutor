<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Elasticity of supply from straight-line supply curves</title>
<desc id="d">A straight supply line that starts on the price axis is elastic (PES above 1); one through the origin is unitary (PES 1); one that starts on the quantity axis is inelastic (PES below 1).</desc>
