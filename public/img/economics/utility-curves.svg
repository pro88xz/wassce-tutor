<title id="t">Total and marginal utility</title>
<desc id="d">From the oranges table: total utility rises to a maximum of 30 utils at 5 and 6 oranges, then falls. Marginal utility falls from 10 to 0 at the 6th orange and becomes negative (−2) at the 7th.</desc>
