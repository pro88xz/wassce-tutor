<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Graph of y = x³ − 2x² − 5x + 6 and its roots</title>
<desc id="d">The curve y = x cubed minus 2x squared minus 5x plus 6 crosses the x-axis at x = −2, x = 1 and x = 3, so the cubic factorises as (x + 2)(x − 1)(x − 3). It crosses the y-axis at 6, the constant term. Each root a gives a factor (x − a), by the factor theorem.</desc>
