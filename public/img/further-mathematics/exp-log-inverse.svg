<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">y = 3 to the power x and y = log base 3 of x are inverse functions</title>
<desc id="d">The curve y = 3^x passes through (0, 1) and (1, 3). The curve y = log3 x passes through (1, 0) and (3, 1). Each is the reflection of the other in the line y = x, because the logarithm undoes the exponential. log3 x is defined only for x greater than 0.</desc>
