<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Three-set Venn diagram for a survey of 60 students</title>
<desc id="d">A Venn diagram of a survey of 60 students: 30 study Further Mathematics (F), 28 Physics (P) and 26 Chemistry (C). 12 study F and P, 10 study F and C, 11 study P and C, and 5 study all three. Filling from the middle: 5 in all three; 7 F and P only, 5 F and C only, 6 P and C only; 13 F only, 10 P only, 10 C only; total in at least one set 56, so 4 study none.</desc>
<defs></defs>
<rect width="800" height="520" rx="20" fill="#f8fafc"/>
<text x="400.0" y="34.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">60 students: fill the Venn diagram from the middle out</text>
<rect x="90.0" y="60.0" width="620.0" height="410.0" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
<text x="110.0" y="82.0" font-size="17" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">U (60)</text>
<circle cx="320.0" cy="205.0" r="125.0" fill="none" stroke="#2563eb" stroke-width="3"/>
<circle cx="480.0" cy="205.0" r="125.0" fill="none" stroke="#15803d" stroke-width="3"/>
<circle cx="400.0" cy="330.0" r="125.0" fill="none" stroke="#7c3aed" stroke-width="3"/>
<text x="220.0" y="100.0" font-size="17" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">F (30)</text>
<text x="585.0" y="100.0" font-size="17" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">P (28)</text>
<text x="250.0" y="420.0" font-size="17" fill="#7c3aed" text-anchor="middle" dominant-baseline="middle" font-weight="bold">C (26)</text>
<text x="262.0" y="180.0" font-size="26" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">13</text>
<text x="540.0" y="180.0" font-size="26" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">10</text>
<text x="400.0" y="395.0" font-size="26" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">10</text>
<text x="400.0" y="175.0" font-size="26" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">7</text>
<text x="330.0" y="290.0" font-size="26" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">5</text>
<text x="470.0" y="290.0" font-size="26" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">6</text>
<text x="400.0" y="250.0" font-size="26" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">5</text>
<text x="660.0" y="440.0" font-size="26" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="bold">4</text>
<text x="400.0" y="505.0" font-size="17" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">n(F ∪ P ∪ C) = 30 + 28 + 26 − 12 − 10 − 11 + 5 = 56</text>
</svg>
