<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">One-to-one and many-to-one mappings</title>
<desc id="d">Two arrow diagrams. In the one-to-one mapping f(x) = 2x + 1 on the domain {1, 2, 3}, the elements map to 3, 5 and 7, each output from a single input. In the many-to-one mapping g(x) = x² on the domain {−2, −1, 1, 2}, both −2 and 2 map to 4, and both −1 and 1 map to 1. Both are functions, because each input has exactly one output; only the one-to-one function has an inverse.</desc>
<defs><marker id="a15803d" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker><marker id="a15803ds" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#15803d"/></marker><marker id="a2563eb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a2563ebs" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#2563eb"/></marker></defs>
<rect width="800" height="470" rx="20" fill="#f8fafc"/>
<text x="400.0" y="34.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Every input has exactly one output</text>
<text x="210.0" y="74.0" font-size="17" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">one-to-one: f(x) = 2x + 1</text>
<ellipse cx="100.0" cy="240.0" rx="62.0" ry="128.0" fill="#ffffff" stroke="#475569" stroke-width="2"/>
<text x="100.0" y="170.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">1</text>
<text x="100.0" y="245.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">2</text>
<text x="100.0" y="320.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">3</text>
<ellipse cx="320.0" cy="240.0" rx="62.0" ry="128.0" fill="#ffffff" stroke="#475569" stroke-width="2"/>
<text x="320.0" y="170.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">3</text>
<text x="320.0" y="245.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">5</text>
<text x="320.0" y="320.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">7</text>
<text x="100.0" y="390.0" font-size="15" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">domain</text>
<text x="320.0" y="390.0" font-size="15" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">range</text>
<line x1="122.0" y1="170.0" x2="296.0" y2="170.0" stroke="#2563eb" stroke-width="2.3" stroke-linecap="round" marker-end="url(#a2563eb)"/>
<line x1="122.0" y1="245.0" x2="296.0" y2="245.0" stroke="#2563eb" stroke-width="2.3" stroke-linecap="round" marker-end="url(#a2563eb)"/>
<line x1="122.0" y1="320.0" x2="296.0" y2="320.0" stroke="#2563eb" stroke-width="2.3" stroke-linecap="round" marker-end="url(#a2563eb)"/>
<text x="590.0" y="74.0" font-size="17" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">many-to-one: g(x) = x²</text>
<ellipse cx="480.0" cy="240.0" rx="62.0" ry="128.0" fill="#ffffff" stroke="#475569" stroke-width="2"/>
<text x="480.0" y="170.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">−2</text>
<text x="480.0" y="220.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">−1</text>
<text x="480.0" y="270.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">1</text>
<text x="480.0" y="320.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">2</text>
<ellipse cx="700.0" cy="240.0" rx="62.0" ry="128.0" fill="#ffffff" stroke="#475569" stroke-width="2"/>
<text x="700.0" y="170.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">1</text>
<text x="700.0" y="320.0" font-size="19" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">4</text>
<text x="480.0" y="390.0" font-size="15" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">domain</text>
<text x="700.0" y="390.0" font-size="15" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">range</text>
<line x1="502.0" y1="170.0" x2="676.0" y2="320.0" stroke="#15803d" stroke-width="2.3" stroke-linecap="round" marker-end="url(#a15803d)"/>
<line x1="502.0" y1="220.0" x2="676.0" y2="170.0" stroke="#15803d" stroke-width="2.3" stroke-linecap="round" marker-end="url(#a15803d)"/>
<line x1="502.0" y1="270.0" x2="676.0" y2="170.0" stroke="#15803d" stroke-width="2.3" stroke-linecap="round" marker-end="url(#a15803d)"/>
<line x1="502.0" y1="320.0" x2="676.0" y2="320.0" stroke="#15803d" stroke-width="2.3" stroke-linecap="round" marker-end="url(#a15803d)"/>
<text x="400.0" y="440.0" font-size="17" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Only a one-to-one function has an inverse</text>
</svg>
