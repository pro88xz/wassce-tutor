<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Pascal&#x27;s triangle, rows 0 to 6</title>
<desc id="d">Pascal&#x27;s triangle: each row starts and ends with 1, and every other number is the sum of the two numbers above it. Row 0 is 1; row 1 is 1 1; row 2 is 1 2 1; row 3 is 1 3 3 1; row 4 is 1 4 6 4 1; row 5 is 1 5 10 10 5 1; row 6 is 1 6 15 20 15 6 1. Row n gives the coefficients of (a + b) to the power n; for example 4 + 6 = 10 gives the 10 in row 5.</desc>
