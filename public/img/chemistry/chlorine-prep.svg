<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Laboratory preparation of chlorine</title>
<desc id="d">Concentrated hydrochloric acid is heated with manganese(IV) oxide. The gas passes through water, which removes hydrogen chloride, then through concentrated sulphuric acid, which dries it. Chlorine is collected by downward delivery, because it is denser than air. Done in a fume cupboard.</desc>
