<text x="615.0" y="122.0" font-size="16" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">copper (+)</text>
<text x="175.0" y="400.0" font-size="15" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">ZnSO<tspan dy="4.8" font-size="10.5">4</tspan><tspan dy="-4.8">(aq)</tspan></text>
<text x="605.0" y="400.0" font-size="15" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="normal">CuSO<tspan dy="4.8" font-size="10.5">4</tspan><tspan dy="-4.8">(aq)</tspan></text>
<path d="M 250 280 L 250 190 L 530 190 L 530 280" stroke="#cbd5e1" stroke-width="26" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
