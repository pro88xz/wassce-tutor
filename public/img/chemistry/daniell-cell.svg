<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The Daniell cell</title>
<desc id="d">A zinc electrode in zinc sulphate solution is connected through a voltmeter to a copper electrode in copper(II) sulphate solution. A salt bridge joins the two solutions. Zinc is oxidised and loses electrons, which flow through the wire to the copper, where Cu2+ ions are reduced. The voltage is about 1.10 V.</desc>
<defs><marker id="a15803d" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker><marker id="a15803ds" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#15803d"/></marker></defs>
<rect width="780" height="480" rx="20" fill="#f8fafc"/>
