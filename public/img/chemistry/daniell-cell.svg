<text x="390.0" y="71.0" font-size="18" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">V</text>
<line x1="220.0" y1="50.0" x2="330.0" y2="50.0" stroke="#15803d" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a15803d)"/>
<text x="275.0" y="36.0" font-size="14" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">electrons</text>
<text x="175.0" y="452.0" font-size="15" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="normal">oxidation: Zn → Zn<tspan dy="-6.3" font-size="10.5">2+</tspan><tspan dy="6.3"> + 2e</tspan><tspan dy="-6.3" font-size="10.5">−</tspan><tspan dy="6.3"></tspan></text>
<text x="605.0" y="452.0" font-size="15" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="normal">reduction: Cu<tspan dy="-6.3" font-size="10.5">2+</tspan><tspan dy="6.3"> + 2e</tspan><tspan dy="-6.3" font-size="10.5">−</tspan><tspan dy="6.3"> → Cu</tspan></text>
<text x="390.0" y="110.0" font-size="16" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">about 1.10 V</text>
</svg>
