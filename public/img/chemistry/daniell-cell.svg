<text x="390.0" y="176.0" font-size="15" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="bold">salt bridge (KNO₃)</text>
<line x1="165.0" y1="140.0" x2="165.0" y2="70.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
<line x1="165.0" y1="70.0" x2="365.0" y2="70.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
