<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The pH scale</title>
<desc id="d">The pH scale runs from 0 to 14. Below 7 is acidic (red to yellow on universal indicator), 7 is neutral (green) and above 7 is alkaline (blue to purple). Examples: stomach acid about 1, lime juice 2, vinegar 3, palm wine and rainwater 4 to 6, pure water 7, blood 7.4, sea water 8, baking soda 9, soap 10, ammonia solution 11, bleach 12, sodium hydroxide 14.</desc>
