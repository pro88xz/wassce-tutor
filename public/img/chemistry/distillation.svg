<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Simple distillation</title>
<desc id="d">Salt solution is heated in a flask. The water boils, the vapour passes the thermometer at the side arm, is cooled in a Liebig condenser by cold water flowing in at the bottom and out at the top, and drips into a beaker as the distillate. The salt stays behind in the flask.</desc>
