<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Volume of gas produced against time</title>
<desc id="d">Marble chips react with hydrochloric acid. With more concentrated acid (or warmer acid, or powdered marble) the curve is steeper at the start, showing a faster rate, but with the same amount of limiting reactant the same final volume of carbon(IV) oxide is reached. The rate is the gradient of the curve.</desc>
