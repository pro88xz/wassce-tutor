<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">How acid rain forms and what it damages</title>
<desc id="d">A factory chimney gives out sulphur(IV) oxide from burning fuels and smelting, and vehicles give out nitrogen oxides. In clouds these react with water and oxygen to form sulphuric(IV), sulphuric(VI) and nitric(V) acids. The rain that falls has a pH below about 5.6. It kills trees, makes lakes too acidic for fish, corrodes metals and wears away limestone and marble buildings.</desc>
