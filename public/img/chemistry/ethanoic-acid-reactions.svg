<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Reactions of ethanoic acid</title>
<desc id="d">Ethanoic acid in the centre. With sodium carbonate it fizzes, giving sodium ethanoate, water and carbon(IV) oxide. With magnesium it gives magnesium ethanoate and hydrogen. With sodium hydroxide it is neutralised to sodium ethanoate and water. With ethanol and a little concentrated sulphuric acid it forms ethyl ethanoate.</desc>
<defs><marker id="a15803d" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker><marker id="a15803ds" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#15803d"/></marker><marker id="a2563eb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a2563ebs" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#2563eb"/></marker><marker id="a7c3aed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker><marker id="a7c3aeds" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#7c3aed"/></marker><marker id="aea580c" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#ea580c"/></marker><marker id="aea580cs" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#ea580c"/></marker></defs>
<rect width="800" height="520" rx="20" fill="#f8fafc"/>
<rect x="300.0" y="190.0" width="200.0" height="160.0" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 5"/>
<text x="369.0" y="262.0" font-size="18" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">C</text>
<line x1="369.0" y1="250.0" x2="369.0" y2="230.0" stroke="#0f172a" stroke-width="2.4" stroke-linecap="round"/>
<text x="369.0" y="218.0" font-size="17" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">H</text>
<line x1="369.0" y1="274.0" x2="369.0" y2="294.0" stroke="#0f172a" stroke-width="2.4" stroke-linecap="round"/>
<text x="369.0" y="306.0" font-size="17" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">H</text>
<line x1="357.0" y1="262.0" x2="337.0" y2="262.0" stroke="#0f172a" stroke-width="2.4" stroke-linecap="round"/>
<text x="325.0" y="262.0" font-size="17" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">H</text>
<text x="431.0" y="262.0" font-size="18" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">C</text>
<line x1="427.5" y1="250.0" x2="427.5" y2="230.0" stroke="#0f172a" stroke-width="2.4" stroke-linecap="round"/>
<line x1="434.5" y1="250.0" x2="434.5" y2="230.0" stroke="#0f172a" stroke-width="2.4" stroke-linecap="round"/>
<text x="431.0" y="218.0" font-size="17" fill="#7c3aed" text-anchor="middle" dominant-baseline="middle" font-weight="bold">O</text>
<line x1="443.0" y1="262.0" x2="473.0" y2="262.0" stroke="#0f172a" stroke-width="2.4" stroke-linecap="round"/>
<text x="485.0" y="262.0" font-size="17" fill="#7c3aed" text-anchor="middle" dominant-baseline="middle" font-weight="bold">OH</text>
<line x1="382.0" y1="262.0" x2="418.0" y2="262.0" stroke="#0f172a" stroke-width="2.4" stroke-linecap="round"/>
<text x="400.0" y="334.0" font-size="15" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="bold">ethanoic acid</text>
<rect x="20.0" y="46.0" width="240.0" height="92.0" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="140.0" y="66.0" font-size="13" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">+ Na<tspan dy="4.2" font-size="9.1">2</tspan><tspan dy="-4.2">CO</tspan><tspan dy="4.2" font-size="9.1">3</tspan><tspan dy="-4.2"> (or NaHCO</tspan><tspan dy="4.2" font-size="9.1">3</tspan><tspan dy="-4.2">)</tspan></text>
<text x="140.0" y="92.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Effervescence</text>
<text x="140.0" y="116.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">CH<tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5">COONa + H</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">O + CO</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5"></tspan></text>
<line x1="330.0" y1="184.0" x2="210.0" y2="146.0" stroke="#2563eb" stroke-width="3" stroke-linecap="round" marker-end="url(#a2563eb)"/>
<rect x="540.0" y="46.0" width="240.0" height="92.0" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
<text x="660.0" y="66.0" font-size="13" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">+ magnesium</text>
<text x="660.0" y="92.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Magnesium ethanoate</text>
<text x="660.0" y="116.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">(CH<tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5">COO)</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">Mg + H</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5"></tspan></text>
<line x1="470.0" y1="184.0" x2="590.0" y2="146.0" stroke="#15803d" stroke-width="3" stroke-linecap="round" marker-end="url(#a15803d)"/>
<rect x="20.0" y="394.0" width="240.0" height="92.0" rx="12" fill="#fef3c7" stroke="#ea580c" stroke-width="2.5"/>
<text x="140.0" y="414.0" font-size="13" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">+ NaOH (neutralisation)</text>
<text x="140.0" y="440.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Sodium ethanoate</text>
<text x="140.0" y="464.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">CH<tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5">COONa + H</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">O</tspan></text>
<line x1="330.0" y1="356.0" x2="210.0" y2="386.0" stroke="#ea580c" stroke-width="3" stroke-linecap="round" marker-end="url(#aea580c)"/>
<rect x="540.0" y="394.0" width="240.0" height="92.0" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
<text x="660.0" y="414.0" font-size="13" fill="#7c3aed" text-anchor="middle" dominant-baseline="middle" font-weight="bold">+ C<tspan dy="4.2" font-size="9.1">2</tspan><tspan dy="-4.2">H</tspan><tspan dy="4.2" font-size="9.1">5</tspan><tspan dy="-4.2">OH, conc. H</tspan><tspan dy="4.2" font-size="9.1">2</tspan><tspan dy="-4.2">SO</tspan><tspan dy="4.2" font-size="9.1">4</tspan><tspan dy="-4.2"></tspan></text>
<text x="660.0" y="440.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Ethyl ethanoate (ester)</text>
<text x="660.0" y="464.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">CH<tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5">COOC</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">H</tspan><tspan dy="4.5" font-size="9.8">5</tspan><tspan dy="-4.5"> + H</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5">O</tspan></text>
<line x1="470.0" y1="356.0" x2="590.0" y2="386.0" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" marker-end="url(#a7c3aed)"/>
<text x="400.0" y="26.0" font-size="16" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">A weak acid with all the typical acid reactions, plus esterification</text>
</svg>
