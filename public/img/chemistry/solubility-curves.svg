<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Solubility curves</title>
<desc id="d">Solubility in grams per 100 g of water against temperature. Potassium nitrate rises steeply from 13 g at 0 °C to 169 g at 80 °C; copper(II) sulphate rises from 14 g to 55 g; sodium chloride hardly changes, about 36 to 38 g. Cooling saturated potassium nitrate solution from 60 °C (110 g) to 20 °C (32 g) crystallises about 78 g.</desc>
