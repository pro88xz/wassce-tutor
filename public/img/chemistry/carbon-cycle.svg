<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The carbon cycle</title>
<desc id="d">Carbon(IV) oxide in the air is taken in by plants in photosynthesis and built into carbohydrates. Animals eat plants. Respiration by plants, animals and decomposers, and the burning of fuels, return carbon(IV) oxide to the air. Dead matter can form fossil fuels and limestone over millions of years.</desc>
