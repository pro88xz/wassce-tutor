<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Addition reactions of ethene</title>
<desc id="d">Ethene in the centre. With hydrogen (nickel catalyst, 150 °C) it gives ethane; with bromine it gives 1,2-dibromoethane and the bromine is decolourised; with steam (phosphoric acid catalyst, 300 °C, 60 atm) it gives ethanol; with hydrogen bromide it gives bromoethane.</desc>
