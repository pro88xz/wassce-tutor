<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Forming a peptide bond</title>
<desc id="d">Two amino acids, each H2N–CHR–COOH. The OH of the first amino acid&#x27;s carboxyl group and an H from the second amino acid&#x27;s amino group leave as water. The new –CO–NH– link between them is the peptide bond, giving a dipeptide.</desc>
