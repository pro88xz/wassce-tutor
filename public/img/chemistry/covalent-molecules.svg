<title id="t">Covalent bonding: dot-and-cross diagrams</title>
<desc id="d">Outer-shell dot-and-cross diagrams. Hydrogen chloride shares one pair. Water: oxygen shares one pair with each hydrogen and keeps two lone pairs. Ammonia: three shared pairs and one lone pair. Methane: four shared pairs.</desc>
