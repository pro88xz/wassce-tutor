<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Protein structure and denaturation</title>
<desc id="d">Primary structure: a chain of amino acids in a particular order. Secondary structure: the chain coils into a helix (or folds into sheets), held by hydrogen bonds. Tertiary structure: the coiled chain folds into a precise 3-D shape, as in an enzyme. Denaturation by heat, strong acids or alkalis, heavy-metal ions or alcohol unfolds the shape and destroys the protein&#x27;s function, though the chain is not broken.</desc>
