<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Tests for proteins</title>
<desc id="d">Biuret test: sodium hydroxide then a few drops of dilute copper(II) sulphate give a violet colour. Millon&#x27;s reagent, warmed, gives a brick-red or pink precipitate. Xanthoproteic test: concentrated nitric acid, warmed, gives a yellow colour that turns orange with ammonia. Heating egg white coagulates it into a white solid.</desc>
<defs></defs>
<rect width="800" height="400" rx="20" fill="#f8fafc"/>
<text x="110.0" y="72.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Biuret test</text>
<text x="110.0" y="89.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">NaOH + dilute CuSO₄</text>
<path d="M 89.0 187.5 L 89.0 247.0 A 21.0 21.0 0 0 0 131.0 247.0 L 131.0 187.5 Z" stroke="none" stroke-width="0" fill="#8b5cf6" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 87.0 120 L 87.0 247.0 A 23.0 23.0 0 0 0 133.0 247.0 L 133.0 120" stroke="#0f172a" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="110.0" y="294.0" font-size="13" fill="#7c3aed" text-anchor="middle" dominant-baseline="middle" font-weight="bold">violet / purple</text>
<text x="110.0" y="311.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">peptide bonds</text>
<text x="300.0" y="72.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Millon&#x27;s reagent</text>
<text x="300.0" y="89.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">warm</text>
<path d="M 279.0 187.5 L 279.0 247.0 A 21.0 21.0 0 0 0 321.0 247.0 L 321.0 187.5 Z" stroke="none" stroke-width="0" fill="#fecdd3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 277.0 120 L 277.0 247.0 A 23.0 23.0 0 0 0 323.0 247.0 L 323.0 120" stroke="#0f172a" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 279.0 241.0 L 279.0 247.0 A 21.0 21.0 0 0 0 321.0 247.0 L 321.0 241.0 Z" stroke="none" stroke-width="0" fill="#be123c" stroke-linejoin="round" stroke-linecap="round"/>
<text x="300.0" y="294.0" font-size="13" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="bold">brick-red ppt</text>
<text x="300.0" y="311.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">protein present</text>
<text x="490.0" y="72.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Conc. HNO₃, warm</text>
<text x="490.0" y="89.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">(xanthoproteic test)</text>
<path d="M 469.0 187.5 L 469.0 247.0 A 21.0 21.0 0 0 0 511.0 247.0 L 511.0 187.5 Z" stroke="none" stroke-width="0" fill="#facc15" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 467.0 120 L 467.0 247.0 A 23.0 23.0 0 0 0 513.0 247.0 L 513.0 120" stroke="#0f172a" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="490.0" y="294.0" font-size="13" fill="#a16207" text-anchor="middle" dominant-baseline="middle" font-weight="bold">yellow</text>
<text x="490.0" y="311.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">orange with NH₃</text>
<text x="690.0" y="72.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Egg white</text>
<text x="690.0" y="89.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">heated</text>
<path d="M 669.0 187.5 L 669.0 247.0 A 21.0 21.0 0 0 0 711.0 247.0 L 711.0 187.5 Z" stroke="none" stroke-width="0" fill="#e5e7eb" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 667.0 120 L 667.0 247.0 A 23.0 23.0 0 0 0 713.0 247.0 L 713.0 120" stroke="#0f172a" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="690.0" y="294.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="bold">white solid</text>
<text x="690.0" y="311.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">coagulated (denatured)</text>
<text x="400.0" y="30.0" font-size="18" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Colour tests show that a food contains protein</text>
</svg>
