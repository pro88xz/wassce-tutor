<title id="t">Reading a burette</title>
<desc id="d">A close-up of a burette scale from 22.0 to 23.5 cm³, with numbers increasing downwards. The bottom of the meniscus is at 22.80 cm³. An eye level with the bottom of the meniscus reads 22.80 correctly. An eye above it reads too small a value, and an eye below it reads too large a value: parallax error.</desc>
