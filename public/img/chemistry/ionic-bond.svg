<title id="t">Ionic bonding in sodium chloride</title>
<desc id="d">A sodium atom (2, 8, 1) transfers its outer electron to a chlorine atom (2, 8, 7). The sodium ion Na+ (2, 8) and chloride ion Cl− (2, 8, 8) are held together by electrostatic attraction.</desc>
