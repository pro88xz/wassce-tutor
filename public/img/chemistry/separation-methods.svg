<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Filtration, evaporation and the separating funnel</title>
<desc id="d">Filtration separates an insoluble solid (residue) from a liquid (filtrate). Evaporation recovers a dissolved solid. A separating funnel separates two immiscible liquids, such as oil and water: the denser layer is run off first.</desc>
