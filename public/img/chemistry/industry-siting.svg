<text x="184.9" y="369.2" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">skilled workers</text>
<line x1="184.9" y1="321.7" x2="390.0" y2="276.0" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" marker-end="url(#a7c3aed)"/>
<rect x="5.0" y="204.0" width="190.0" height="62.0" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
<text x="100.0" y="224.5" font-size="15" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Waste and safety</text>
<text x="100.0" y="245.5" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">away from homes</text>
<line x1="201.0" y1="235.0" x2="274.0" y2="235.0" stroke="#dc2626" stroke-width="2" stroke-linecap="round" marker-end="url(#adc2626)"/>
<rect x="89.9" y="80.3" width="190.0" height="62.0" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="184.9" y="100.8" font-size="15" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Government</text>
<text x="184.9" y="121.8" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">incentives, permits</text>
<line x1="184.9" y1="148.3" x2="390.0" y2="194.0" stroke="#2563eb" stroke-width="2" stroke-linecap="round" marker-end="url(#a2563eb)"/>
