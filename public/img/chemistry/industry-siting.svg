<text x="680.0" y="245.5" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">for cooling, processing</text>
<line x1="579.0" y1="235.0" x2="506.0" y2="235.0" stroke="#0f766e" stroke-width="2" stroke-linecap="round" marker-end="url(#a0f766e)"/>
<rect x="500.1" y="327.7" width="190.0" height="62.0" rx="12" fill="#fef3c7" stroke="#ea580c" stroke-width="2.5"/>
<text x="595.1" y="348.2" font-size="15" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Transport</text>
<text x="595.1" y="369.2" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">roads, rail, port</text>
<line x1="595.1" y1="321.7" x2="390.0" y2="276.0" stroke="#ea580c" stroke-width="2" stroke-linecap="round" marker-end="url(#aea580c)"/>
<rect x="295.0" y="379.0" width="190.0" height="62.0" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
<text x="390.0" y="399.5" font-size="15" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Market</text>
<text x="390.0" y="420.5" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">near customers</text>
<line x1="390.0" y1="373.0" x2="390.0" y2="276.0" stroke="#15803d" stroke-width="2" stroke-linecap="round" marker-end="url(#a15803d)"/>
<rect x="89.9" y="327.7" width="190.0" height="62.0" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
