<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Purifying copper by electrolysis</title>
<desc id="d">Impure copper is the anode and a thin sheet of pure copper is the cathode, in copper(II) sulphate solution. Copper atoms at the anode lose electrons and go into solution as Cu2+ ions; Cu2+ ions gain electrons at the cathode and deposit as pure copper. Impurities fall as anode sludge.</desc>
