<text x="250.0" y="384.0" font-size="14" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">anode sludge (Ag, Au)</text>
<text x="616.0" y="200.0" font-size="15" fill="#dc2626" text-anchor="start" dominant-baseline="middle" font-weight="normal">Cu → Cu<tspan dy="-6.3" font-size="10.5">2+</tspan><tspan dy="6.3"> + 2e</tspan><tspan dy="-6.3" font-size="10.5">−</tspan><tspan dy="6.3"></tspan></text>
<text x="616.0" y="182.0" font-size="14" fill="#475569" text-anchor="start" dominant-baseline="middle" font-weight="normal">at the anode:</text>
<text x="616.0" y="262.0" font-size="15" fill="#2563eb" text-anchor="start" dominant-baseline="middle" font-weight="normal">Cu<tspan dy="-6.3" font-size="10.5">2+</tspan><tspan dy="6.3"> + 2e</tspan><tspan dy="-6.3" font-size="10.5">−</tspan><tspan dy="6.3"> → Cu</tspan></text>
<text x="616.0" y="244.0" font-size="14" fill="#475569" text-anchor="start" dominant-baseline="middle" font-weight="normal">at the cathode:</text>
<text x="380.0" y="392.0" font-size="14" fill="#475569" text-anchor="start" dominant-baseline="middle" font-weight="normal">electrolyte: copper(II) sulphate solution</text>
