<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">pH change during a titration and the choice of indicator</title>
<desc id="d">As sodium hydroxide is added to hydrochloric acid, the pH rises slowly from about 1, then jumps from about 3 to 11 at the end point (25 cm3), then levels off near 13. Both methyl orange (changes at pH 3.1 to 4.4) and phenolphthalein (8.3 to 10) change colour within the steep part, so either can be used for a strong acid and strong base.</desc>
