<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 590" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Fractional distillation of crude oil</title>
<desc id="d">Crude oil is heated in a furnace to about 400 °C and the vapour enters near the bottom of a tall column. The column is hot at the bottom and cool at the top. Vapours rise and condense at the level where the temperature falls below their boiling point. From top to bottom: refinery gas, petrol, naphtha, kerosene, diesel, lubricating oil and wax, fuel oil, and bitumen as the residue.</desc>
