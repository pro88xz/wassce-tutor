<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Making ethanol by fermentation</title>
<desc id="d">A conical flask of glucose solution and yeast stands in a warm water bath at about 30 °C. A delivery tube leads from the flask into a test tube of lime water, which turns milky as carbon(IV) oxide bubbles through. Air is kept out. The yeast enzyme zymase converts glucose into ethanol and carbon(IV) oxide.</desc>
