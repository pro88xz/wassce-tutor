<text x="560.0" y="268.0" font-size="14" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">turns milky:</text>
<text x="560.0" y="286.0" font-size="14" fill="#dc2626" text-anchor="start" dominant-baseline="middle" font-weight="bold">CO<tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5"> given off</tspan></text>
<text x="370.0" y="98.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">air kept out</text>
<text x="400.0" y="424.0" font-size="16" fill="#7c3aed" text-anchor="middle" dominant-baseline="middle" font-weight="bold">C<tspan dy="5.1" font-size="11.2">6</tspan><tspan dy="-5.1">H</tspan><tspan dy="5.1" font-size="11.2">12</tspan><tspan dy="-5.1">O</tspan><tspan dy="5.1" font-size="11.2">6</tspan><tspan dy="-5.1"> → 2C</tspan><tspan dy="5.1" font-size="11.2">2</tspan><tspan dy="-5.1">H</tspan><tspan dy="5.1" font-size="11.2">5</tspan><tspan dy="-5.1">OH + 2CO</tspan><tspan dy="5.1" font-size="11.2">2</tspan><tspan dy="-5.1">   (zymase in yeast)</tspan></text>
<text x="400.0" y="30.0" font-size="18" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Yeast turns sugar into ethanol and carbon(IV) oxide</text>
