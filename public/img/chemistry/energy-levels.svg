<text x="60.0" y="90.0" font-size="16" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">energy</text>
<text x="470.0" y="230.0" font-size="16" fill="#dc2626" text-anchor="start" dominant-baseline="middle" font-weight="bold">4s fills before 3d</text>
<text x="380.0" y="450.0" font-size="17" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">order: 1s 2s 2p 3s 3p 4s 3d 4p</text>
<text x="360.0" y="30.0" font-size="18" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Lowest energy sub-shell first</text>
</svg>
