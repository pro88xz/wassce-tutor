<rect x="172.0" y="216.0" width="436.0" height="182.0" rx="0" fill="#dbeafe" stroke="none" stroke-width="0"/>
<path d="M 164 170 L 170 176 L 170 400 L 610 400 L 610 170" stroke="#0f172a" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
