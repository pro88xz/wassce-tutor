<line x1="312.0" y1="310.0" x2="274.0" y2="310.0" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round" marker-end="url(#adc2626)"/>
<text x="470.0" y="340.0" font-size="15" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">cations → cathode</text>
<text x="320.0" y="375.0" font-size="15" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="bold">anions → anode</text>
<path d="M 300 60 C 330 40, 360 40, 372 52" stroke="#15803d" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a15803d)"/>
<path d="M 410 52 C 430 40, 460 40, 480 60" stroke="#15803d" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a15803d)"/>
<text x="650.0" y="60.0" font-size="14" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="normal">electrons flow</text>
<text x="650.0" y="78.0" font-size="14" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="normal">anode → cathode</text>
<text x="650.0" y="210.0" font-size="14" fill="#2563eb" text-anchor="start" dominant-baseline="middle" font-weight="normal">cathode: reduction</text>
<text x="650.0" y="232.0" font-size="14" fill="#2563eb" text-anchor="start" dominant-baseline="middle" font-weight="normal">(gain of electrons)</text>
<text x="30.0" y="210.0" font-size="14" fill="#dc2626" text-anchor="start" dominant-baseline="middle" font-weight="normal">anode: oxidation</text>
<text x="30.0" y="232.0" font-size="14" fill="#dc2626" text-anchor="start" dominant-baseline="middle" font-weight="normal">(loss of electrons)</text>
<text x="390.0" y="425.0" font-size="15" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">electrolyte (ions free to move)</text>
</svg>
