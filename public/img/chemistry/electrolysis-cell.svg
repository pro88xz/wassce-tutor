<text x="250.0" y="132.0" font-size="16" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="bold">anode (+)</text>
<text x="530.0" y="132.0" font-size="16" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">cathode (−)</text>
