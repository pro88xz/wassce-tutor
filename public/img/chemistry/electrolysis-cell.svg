<text x="398.0" y="40.0" font-size="16" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">−</text>
<text x="390.0" y="104.0" font-size="14" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">d.c. supply</text>
<line x1="382.0" y1="70.0" x2="250.0" y2="70.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
