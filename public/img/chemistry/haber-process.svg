<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The Haber process</title>
<desc id="d">Nitrogen from air and hydrogen from natural gas are mixed in a 1 : 3 ratio, compressed to about 200 atm and passed over an iron catalyst at about 450 °C in the converter. About 15% forms ammonia. The mixture is cooled so that ammonia liquefies and is removed; the unreacted nitrogen and hydrogen are recycled.</desc>
<defs><marker id="a0f172a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f172a"/></marker><marker id="a0f172as" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#0f172a"/></marker><marker id="aea580c" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#ea580c"/></marker><marker id="aea580cs" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#ea580c"/></marker></defs>
<rect width="800" height="400" rx="20" fill="#f8fafc"/>
<rect x="25.0" y="75.0" width="170.0" height="70.0" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="110.0" y="99.0" font-size="16" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">N₂ + 3H₂</text>
<text x="110.0" y="121.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">1 : 3 by volume</text>
<rect x="235.0" y="75.0" width="170.0" height="70.0" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
<text x="320.0" y="99.0" font-size="16" fill="#7c3aed" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Compressor</text>
<text x="320.0" y="121.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">about 200 atm</text>
<rect x="445.0" y="68.0" width="190.0" height="84.0" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
<text x="540.0" y="88.0" font-size="16" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Converter</text>
<text x="540.0" y="110.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">iron catalyst</text>
<text x="540.0" y="132.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">about 450 °C</text>
<rect x="445.0" y="235.0" width="190.0" height="70.0" rx="12" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/>
<text x="540.0" y="259.0" font-size="16" fill="#0f766e" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Cooler</text>
<text x="540.0" y="281.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">NH₃ liquefies</text>
<rect x="235.0" y="235.0" width="170.0" height="70.0" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
<text x="320.0" y="259.0" font-size="16" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Liquid ammonia</text>
<text x="320.0" y="281.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">to storage</text>
<line x1="201.0" y1="110.0" x2="229.0" y2="110.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<line x1="411.0" y1="110.0" x2="439.0" y2="110.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<line x1="540.0" y1="158.0" x2="540.0" y2="229.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<line x1="439.0" y1="270.0" x2="411.0" y2="270.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<path d="M 635 270 C 760 240, 760 60, 560 55 L 330 55 L 330 72" stroke="#ea580c" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 6" marker-end="url(#aea580c)"/>
<rect x="701.7" y="138.0" width="80.6" height="24.0" rx="4" fill="#f8fafc" stroke="none" stroke-width="0" opacity="0.92"/>
<text x="742.0" y="150.0" font-size="14" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">unreacted</text>
<rect x="709.6" y="158.0" width="64.9" height="24.0" rx="4" fill="#f8fafc" stroke="none" stroke-width="0" opacity="0.92"/>
<text x="742.0" y="170.0" font-size="14" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">N₂ + H₂</text>
<rect x="705.6" y="178.0" width="72.7" height="24.0" rx="4" fill="#f8fafc" stroke="none" stroke-width="0" opacity="0.92"/>
<text x="742.0" y="190.0" font-size="14" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">recycled</text>
<text x="400.0" y="370.0" font-size="17" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">N<tspan dy="5.4" font-size="11.9">2</tspan><tspan dy="-5.4"> + 3H</tspan><tspan dy="5.4" font-size="11.9">2</tspan><tspan dy="-5.4"> ⇌ 2NH</tspan><tspan dy="5.4" font-size="11.9">3</tspan><tspan dy="-5.4">     ΔH = −92 kJ/mol</tspan></text>
</svg>
