<line x1="358.0" y1="374.0" x2="358.0" y2="386.0" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/>
<text x="220.0" y="404.0" font-size="15" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">cathode (−)</text>
<text x="480.0" y="404.0" font-size="15" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="bold">anode (+)</text>
<text x="350.0" y="60.0" font-size="15" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">acidified water</text>
<text x="350.0" y="26.0" font-size="18" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Hydrogen : oxygen = 2 : 1 by volume</text>
</svg>
