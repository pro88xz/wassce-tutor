<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The isotopes of chlorine</title>
<desc id="d">Chlorine-35 (17 protons, 18 neutrons) makes up 75% of natural chlorine and chlorine-37 (17 protons, 20 neutrons) makes up 25%. The relative atomic mass is (35 × 75 + 37 × 25) ÷ 100 = 35.5.</desc>
