<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Energy profiles of exothermic and endothermic reactions</title>
<desc id="d">Left: in an exothermic reaction the products are lower in energy than the reactants; energy is given out and ΔH is negative. Right: in an endothermic reaction the products are higher; energy is taken in and ΔH is positive. In both, the reactants must first gain the activation energy Ea.</desc>
