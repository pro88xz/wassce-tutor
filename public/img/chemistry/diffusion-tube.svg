<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Diffusion of ammonia and hydrogen chloride</title>
<desc id="d">Cotton wool soaked in concentrated ammonia is placed at one end of a long glass tube and cotton wool soaked in concentrated hydrochloric acid at the other. A white ring of ammonium chloride forms nearer the hydrochloric acid end, because ammonia molecules are lighter and diffuse faster.</desc>
<defs><marker id="a2563eb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a2563ebs" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#2563eb"/></marker><marker id="adc2626" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="adc2626s" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#dc2626"/></marker></defs>
<rect width="780" height="300" rx="20" fill="#f8fafc"/>
<rect x="80.0" y="120.0" width="620.0" height="50.0" rx="24" fill="#e0f2fe" stroke="#0f172a" stroke-width="2.5"/>
<rect x="80.0" y="120.0" width="60.0" height="50.0" rx="20" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<rect x="640.0" y="120.0" width="60.0" height="50.0" rx="20" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
<text x="110.0" y="96.0" font-size="16" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">NH<tspan dy="5.1" font-size="11.2">3</tspan><tspan dy="-5.1">(aq)</tspan></text>
<text x="670.0" y="96.0" font-size="16" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="bold">HCl(aq)</text>
<rect x="432.0" y="122.0" width="16.0" height="46.0" rx="0" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<text x="440.0" y="196.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">white ring of</text>
<text x="440.0" y="216.0" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">NH<tspan dy="4.8" font-size="10.5">4</tspan><tspan dy="-4.8">Cl</tspan></text>
<line x1="150.0" y1="145.0" x2="426.0" y2="145.0" stroke="#2563eb" stroke-width="3" stroke-linecap="round" marker-end="url(#a2563eb)"/>
<line x1="630.0" y1="145.0" x2="454.0" y2="145.0" stroke="#dc2626" stroke-width="3" stroke-linecap="round" marker-end="url(#adc2626)"/>
<line x1="140.0" y1="250.0" x2="440.0" y2="250.0" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
<line x1="440.0" y1="250.0" x2="640.0" y2="250.0" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
<text x="290.0" y="270.0" font-size="14" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="normal">NH₃ travels further (M = 17)</text>
<text x="540.0" y="270.0" font-size="14" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="normal">HCl travels less (M = 36.5)</text>
<text x="390.0" y="34.0" font-size="18" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Lighter molecules diffuse faster</text>
</svg>
