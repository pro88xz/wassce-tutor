<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Heating curve of water</title>
<desc id="d">Ice at −20 °C is heated steadily. Its temperature rises to 0 °C, stays constant while it melts, rises to 100 °C, stays constant while it boils, then rises again as steam. The flat parts are where latent heat is absorbed.</desc>
<defs><marker id="a0f172a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f172a"/></marker><marker id="a0f172as" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#0f172a"/></marker></defs>
<rect width="760" height="420" rx="20" fill="#f8fafc"/>
<line x1="90.0" y1="340.0" x2="696.0" y2="340.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<line x1="90.0" y1="340.0" x2="90.0" y2="52.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<text x="696.0" y="376.0" font-size="16" fill="#475569" text-anchor="end" dominant-baseline="middle" font-weight="normal">time (heating at a steady rate)</text>
<text x="98.0" y="44.0" font-size="16" fill="#475569" text-anchor="start" dominant-baseline="middle" font-weight="normal">temperature (°C)</text>
<line x1="84.0" y1="323.1" x2="90.0" y2="323.1" stroke="#0f172a" stroke-width="1.6" stroke-linecap="round"/>
<text x="80.0" y="323.1" font-size="13" fill="#475569" text-anchor="end" dominant-baseline="middle" font-weight="normal">−20</text>
<line x1="84.0" y1="289.4" x2="90.0" y2="289.4" stroke="#0f172a" stroke-width="1.6" stroke-linecap="round"/>
<text x="80.0" y="289.4" font-size="13" fill="#475569" text-anchor="end" dominant-baseline="middle" font-weight="normal">0</text>
<line x1="84.0" y1="205.0" x2="90.0" y2="205.0" stroke="#0f172a" stroke-width="1.6" stroke-linecap="round"/>
<text x="80.0" y="205.0" font-size="13" fill="#475569" text-anchor="end" dominant-baseline="middle" font-weight="normal">50</text>
<line x1="84.0" y1="120.6" x2="90.0" y2="120.6" stroke="#0f172a" stroke-width="1.6" stroke-linecap="round"/>
<text x="80.0" y="120.6" font-size="13" fill="#475569" text-anchor="end" dominant-baseline="middle" font-weight="normal">100</text>
<path d="M 90.0 323.1 L 149.0 289.4 L 243.4 289.4 L 349.6 120.6 L 573.8 120.6 L 656.4 78.4" stroke="#dc2626" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="149.0" y1="289.4" x2="90.0" y2="289.4" stroke="#475569" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="6 5"/>
<line x1="349.6" y1="120.6" x2="90.0" y2="120.6" stroke="#475569" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="6 5"/>
<text x="105.5" y="306.2" font-size="15" fill="#2563eb" text-anchor="end" dominant-baseline="middle" font-weight="bold">ice warms</text>
<text x="196.2" y="271.4" font-size="15" fill="#7c3aed" text-anchor="middle" dominant-baseline="middle" font-weight="bold">melting</text>
<text x="314.5" y="205.0" font-size="15" fill="#2563eb" text-anchor="start" dominant-baseline="middle" font-weight="bold">water warms</text>
<text x="461.7" y="102.6" font-size="15" fill="#7c3aed" text-anchor="middle" dominant-baseline="middle" font-weight="bold">boiling</text>
<text x="633.1" y="99.5" font-size="15" fill="#2563eb" text-anchor="start" dominant-baseline="middle" font-weight="bold">steam</text>
<text x="196.2" y="309.4" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">solid + liquid</text>
<text x="461.7" y="140.6" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">liquid + gas</text>
<text x="380.0" y="28.0" font-size="18" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Temperature is constant while the state changes</text>
</svg>
