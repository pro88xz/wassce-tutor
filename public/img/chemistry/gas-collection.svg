<text x="660.0" y="160.0" font-size="16" fill="#7c3aed" text-anchor="middle" dominant-baseline="middle" font-weight="bold">gas</text>
<text x="660.0" y="320.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">upward delivery</text>
<text x="660.0" y="336.0" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">(gas lighter than air)</text>
<path d="M 570.0 306.0 L 660.0 306.0 L 660.0 150.0" stroke="#0f172a" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
