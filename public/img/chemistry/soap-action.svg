<text x="228.0" y="236.0" font-size="14" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Na<tspan dy="-5.9" font-size="9.8">+</tspan><tspan dy="5.9"></tspan></text>
<text x="110.0" y="236.0" font-size="13" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">hydrocarbon tail</text>
<text x="110.0" y="254.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">hydrophobic:</text>
<text x="110.0" y="270.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">dissolves in grease</text>
<text x="196.0" y="146.0" font-size="13" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">ionic head</text>
<text x="186.0" y="162.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">hydrophilic: in water</text>
<text x="400.0" y="92.0" font-size="15" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">2. Tails enter the grease</text>
