<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">How soap removes grease</title>
<desc id="d">Panel 1: a soap anion has a long hydrocarbon tail that is hydrophobic and dissolves in grease, and an ionic COO− head that is hydrophilic and dissolves in water. Panel 2: on a greasy cloth, the tails bury themselves in the grease and the heads stay in the water. Panel 3: rubbing lifts the grease off as a droplet surrounded by negative heads (a micelle); droplets repel each other and are rinsed away.</desc>
<defs><marker id="a0f172a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f172a"/></marker><marker id="a0f172as" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#0f172a"/></marker></defs>
