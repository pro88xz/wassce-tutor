<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Laboratory preparation of ethene</title>
<desc id="d">Ethanol is heated with excess concentrated sulphuric acid at about 170 °C. The gas is passed through sodium hydroxide solution to remove sulphur(IV) oxide and carbon(IV) oxide impurities, and collected over water.</desc>
