<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Distribution of particle energies at two temperatures</title>
<desc id="d">The number of particles with each kinetic energy at a lower temperature T1 and a higher temperature T2. At T2 the curve is flatter and shifted to the right, so many more particles have energy equal to or greater than the activation energy Ea (shaded). A catalyst lowers Ea, which also increases the number of particles able to react.</desc>
