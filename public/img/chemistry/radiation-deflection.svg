<rect x="240.0" y="70.0" width="300.0" height="14.0" rx="0" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="390.0" y="56.0" font-size="15" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="normal">+ + + + + + positive plate</text>
<rect x="240.0" y="300.0" width="300.0" height="14.0" rx="0" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="390.0" y="336.0" font-size="15" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="normal">− − − − − − negative plate</text>
