<title id="t">Electrons in orbital boxes</title>
<desc id="d">Box diagrams for nitrogen, oxygen and iron. In nitrogen the three 2p electrons occupy separate boxes with parallel spins (Hund&#x27;s rule). In oxygen one 2p box holds a pair. Iron is 1s2 2s2 2p6 3s2 3p6 3d6 4s2.</desc>
