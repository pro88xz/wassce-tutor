<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The nitrogen cycle</title>
<desc id="d">Nitrogen in the air is fixed by lightning, by nitrogen-fixing bacteria in the root nodules of legumes and by the Haber process (fertilisers). Plants absorb nitrates and make proteins; animals eat plants. Dead matter and wastes are decomposed to ammonium compounds, which nitrifying bacteria turn into nitrites and nitrates. Denitrifying bacteria return nitrogen gas to the air.</desc>
