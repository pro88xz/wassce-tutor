<path d="M 600.0 204.0 L 600.0 238.0 A 20.0 20.0 0 0 0 640.0 238.0 L 640.0 204.0 Z" stroke="none" stroke-width="0" fill="#d1d5db" stroke-linejoin="round" stroke-linecap="round"/>
<text x="620.0" y="284.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="bold">white</text>
<text x="620.0" y="301.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">dissolves</text>
<text x="730.0" y="62.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Ca²⁺</text>
<text x="730.0" y="79.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">+ NaOH(aq)</text>
