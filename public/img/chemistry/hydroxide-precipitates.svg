<path d="M 708.0 110 L 708.0 238.0 A 22.0 22.0 0 0 0 752.0 238.0 L 752.0 110" stroke="#0f172a" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 710.0 204.0 L 710.0 238.0 A 20.0 20.0 0 0 0 750.0 238.0 L 750.0 204.0 Z" stroke="none" stroke-width="0" fill="#d1d5db" stroke-linejoin="round" stroke-linecap="round"/>
<text x="730.0" y="284.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="bold">white</text>
<text x="730.0" y="301.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">insoluble</text>
<text x="400.0" y="336.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">second line: what happens when excess NaOH(aq) is added</text>
<text x="400.0" y="366.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">With NH₃(aq): Cu²⁺ ppt dissolves to a deep blue solution; Zn²⁺ ppt dissolves;</text>
<text x="400.0" y="384.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Al³⁺ and Pb²⁺ ppts do not; Ca²⁺ gives no ppt.</text>
<text x="400.0" y="26.0" font-size="18" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Hydroxide colours identify metal ions</text>
