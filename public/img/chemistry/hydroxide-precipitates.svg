<text x="400.0" y="284.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="bold">white</text>
<text x="400.0" y="301.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">dissolves</text>
<text x="510.0" y="62.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Al³⁺</text>
<text x="510.0" y="79.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">+ NaOH(aq)</text>
<path d="M 490.0 177.5 L 490.0 238.0 A 20.0 20.0 0 0 0 530.0 238.0 L 530.0 177.5 Z" stroke="none" stroke-width="0" fill="#f8fafc" stroke-linejoin="round" stroke-linecap="round"/>
