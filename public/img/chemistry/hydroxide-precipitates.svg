<text x="290.0" y="301.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">insoluble</text>
<text x="400.0" y="62.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Zn²⁺</text>
<text x="400.0" y="79.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">+ NaOH(aq)</text>
