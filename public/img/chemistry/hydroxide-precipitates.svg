<path d="M 490.0 204.0 L 490.0 238.0 A 20.0 20.0 0 0 0 530.0 238.0 L 530.0 204.0 Z" stroke="none" stroke-width="0" fill="#d1d5db" stroke-linejoin="round" stroke-linecap="round"/>
<text x="510.0" y="284.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="bold">white</text>
<text x="510.0" y="301.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">dissolves</text>
