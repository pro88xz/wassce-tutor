<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Precipitates with sodium hydroxide solution</title>
<desc id="d">Adding sodium hydroxide solution to solutions of metal ions: copper(II) gives a blue precipitate, iron(II) a dirty green one, iron(III) a red-brown one, all insoluble in excess. Zinc, aluminium and lead(II) ions give white precipitates that dissolve in excess sodium hydroxide. Calcium ions give a white precipitate that does not dissolve.</desc>
<defs></defs>
<rect width="800" height="410" rx="20" fill="#f8fafc"/>
<text x="70.0" y="62.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Cu²⁺</text>
<text x="70.0" y="79.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">+ NaOH(aq)</text>
<path d="M 50.0 177.5 L 50.0 238.0 A 20.0 20.0 0 0 0 90.0 238.0 L 90.0 177.5 Z" stroke="none" stroke-width="0" fill="#eff6ff" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 48.0 110 L 48.0 238.0 A 22.0 22.0 0 0 0 92.0 238.0 L 92.0 110" stroke="#0f172a" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 50.0 204.0 L 50.0 238.0 A 20.0 20.0 0 0 0 90.0 238.0 L 90.0 204.0 Z" stroke="none" stroke-width="0" fill="#2563eb" stroke-linejoin="round" stroke-linecap="round"/>
<text x="70.0" y="284.0" font-size="13" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">blue</text>
<text x="70.0" y="301.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">insoluble</text>
<text x="180.0" y="62.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Fe²⁺</text>
<text x="180.0" y="79.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">+ NaOH(aq)</text>
<path d="M 160.0 177.5 L 160.0 238.0 A 20.0 20.0 0 0 0 200.0 238.0 L 200.0 177.5 Z" stroke="none" stroke-width="0" fill="#f0fdf4" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 158.0 110 L 158.0 238.0 A 22.0 22.0 0 0 0 202.0 238.0 L 202.0 110" stroke="#0f172a" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
