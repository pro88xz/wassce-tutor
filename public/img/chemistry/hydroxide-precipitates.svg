<text x="180.0" y="284.0" font-size="13" fill="#4d7c0f" text-anchor="middle" dominant-baseline="middle" font-weight="bold">dirty green</text>
<text x="180.0" y="301.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">insoluble</text>
<text x="290.0" y="62.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Fe³⁺</text>
<text x="290.0" y="79.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">+ NaOH(aq)</text>
<path d="M 270.0 177.5 L 270.0 238.0 A 20.0 20.0 0 0 0 310.0 238.0 L 310.0 177.5 Z" stroke="none" stroke-width="0" fill="#fff7ed" stroke-linejoin="round" stroke-linecap="round"/>
