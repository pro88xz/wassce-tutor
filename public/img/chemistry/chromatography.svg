<text x="600.0" y="370.0" font-size="16" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Rf (blue) = 8 ÷ 10 = 0.8</text>
<text x="600.0" y="396.0" font-size="16" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Rf (red) = 5.5 ÷ 10 = 0.55</text>
<line x1="690.0" y1="330.0" x2="690.0" y2="243.0" stroke="#dc2626" stroke-width="2" stroke-linecap="round" marker-end="url(#adc2626)"/>
<text x="696.0" y="290.0" font-size="14" fill="#dc2626" text-anchor="start" dominant-baseline="middle" font-weight="normal">5.5</text>
<text x="390.0" y="30.0" font-size="18" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">The ink contains dye A and one other dye</text>
</svg>
