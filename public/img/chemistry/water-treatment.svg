<line x1="680.0" y1="169.0" x2="680.0" y2="251.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<line x1="593.0" y1="290.0" x2="577.0" y2="290.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<line x1="403.0" y1="290.0" x2="387.0" y2="290.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<line x1="213.0" y1="290.0" x2="197.0" y2="290.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<text x="400.0" y="390.0" font-size="15" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal" font-style="italic">e.g. Guma Valley treatment works supplying Freetown</text>
<text x="400.0" y="40.0" font-size="18" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">From raw water to tap water</text>
</svg>
