<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Choosing a method to prepare a salt</title>
<desc id="d">If the salt is insoluble, prepare it by precipitation (mixing two solutions), then filter, wash and dry. If it is soluble and a sodium, potassium or ammonium salt, use titration of acid with alkali. Other soluble salts are made by adding excess metal, insoluble base or carbonate to the acid, filtering off the excess and crystallising.</desc>
<defs><marker id="a15803d" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker><marker id="a15803ds" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#15803d"/></marker><marker id="a2563eb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a2563ebs" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#2563eb"/></marker><marker id="adc2626" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="adc2626s" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#dc2626"/></marker></defs>
<rect width="800" height="470" rx="20" fill="#f8fafc"/>
<rect x="250.0" y="50.0" width="300.0" height="52.0" rx="12" fill="#e2e8f0" stroke="#0f172a" stroke-width="2.5"/>
<text x="400.0" y="76.0" font-size="17" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Is the salt soluble in water?</text>
<rect x="25.0" y="147.0" width="250.0" height="86.0" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
<text x="150.0" y="168.0" font-size="16" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="bold">No: precipitation</text>
<text x="150.0" y="190.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">mix two solutions</text>
<text x="150.0" y="212.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">e.g. BaSO<tspan dy="4.5" font-size="9.8">4</tspan><tspan dy="-4.5">, AgCl, PbI</tspan><tspan dy="4.5" font-size="9.8">2</tspan><tspan dy="-4.5"></tspan></text>
<rect x="395.0" y="155.0" width="330.0" height="70.0" rx="12" fill="#e2e8f0" stroke="#0f172a" stroke-width="2.5"/>
<text x="560.0" y="179.0" font-size="16" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Yes: is it a Na, K or</text>
<text x="560.0" y="201.0" font-size="16" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">NH<tspan dy="5.1" font-size="11.2">4</tspan><tspan dy="-5.1"> salt?</tspan></text>
<path d="M 330 102 L 150 140" stroke="#dc2626" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#adc2626)"/>
<text x="228.0" y="112.0" font-size="15" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="bold">no</text>
<path d="M 470 102 L 560 150" stroke="#15803d" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a15803d)"/>
<text x="540.0" y="116.0" font-size="15" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">yes</text>
<rect x="305.0" y="307.0" width="250.0" height="86.0" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="430.0" y="328.0" font-size="16" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Yes: titration</text>
<text x="430.0" y="350.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">acid + alkali</text>
<text x="430.0" y="372.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">e.g. NaCl, KNO<tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5"></tspan></text>
<rect x="585.0" y="307.0" width="210.0" height="86.0" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
<text x="690.0" y="328.0" font-size="16" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">No: excess solid</text>
<text x="690.0" y="350.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">metal, oxide or</text>
<text x="690.0" y="372.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">carbonate + acid</text>
<path d="M 520 225 L 450 302" stroke="#2563eb" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a2563eb)"/>
<text x="460.0" y="258.0" font-size="15" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">yes</text>
<path d="M 610 225 L 680 302" stroke="#15803d" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a15803d)"/>
<text x="672.0" y="258.0" font-size="15" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">no</text>
<text x="150.0" y="260.0" font-size="15" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="normal">filter, wash, dry</text>
<text x="430.0" y="418.0" font-size="14" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="normal">repeat without indicator; crystallise</text>
<text x="690.0" y="418.0" font-size="14" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="normal">filter off excess; crystallise</text>
<text x="400.0" y="24.0" font-size="18" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Start with the solubility of the salt</text>
</svg>
