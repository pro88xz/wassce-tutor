<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The Solvay process for sodium carbonate</title>
<desc id="d">Brine is saturated with ammonia, then carbon(IV) oxide is bubbled through it in a carbonating tower. Sodium hydrogencarbonate, which is only slightly soluble, precipitates and is filtered off, then heated to give sodium carbonate. The carbon(IV) oxide comes from heating limestone, and the ammonia is recovered and reused.</desc>
<defs><marker id="a0f172a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f172a"/></marker><marker id="a0f172as" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#0f172a"/></marker><marker id="adc2626" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="adc2626s" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#dc2626"/></marker><marker id="aea580c" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#ea580c"/></marker><marker id="aea580cs" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#ea580c"/></marker></defs>
<rect width="800" height="430" rx="20" fill="#f8fafc"/>
<rect x="25.0" y="75.0" width="190.0" height="70.0" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="120.0" y="99.0" font-size="16" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Brine</text>
<text x="120.0" y="121.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">+ ammonia</text>
<rect x="285.0" y="68.0" width="230.0" height="84.0" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
<text x="400.0" y="88.0" font-size="16" fill="#7c3aed" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Carbonating tower</text>
<text x="400.0" y="110.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">CO₂ bubbled in</text>
<text x="400.0" y="132.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">NaHCO₃ precipitates</text>
<rect x="585.0" y="75.0" width="190.0" height="70.0" rx="12" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/>
<text x="680.0" y="99.0" font-size="16" fill="#0f766e" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Filter</text>
<text x="680.0" y="121.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">solid NaHCO₃</text>
<rect x="585.0" y="248.0" width="190.0" height="84.0" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
<text x="680.0" y="269.0" font-size="15" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Heat</text>
<text x="680.0" y="290.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">2NaHCO₃ →</text>
<text x="680.0" y="311.0" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Na₂CO₃ + H₂O + CO₂</text>
<rect x="285.0" y="255.0" width="230.0" height="70.0" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
<text x="400.0" y="279.0" font-size="16" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Sodium carbonate</text>
<text x="400.0" y="301.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">soda ash</text>
<rect x="25.0" y="248.0" width="190.0" height="84.0" rx="12" fill="#fef3c7" stroke="#ea580c" stroke-width="2.5"/>
<text x="120.0" y="279.5" font-size="15" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Limestone kiln</text>
<text x="120.0" y="300.5" font-size="13" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">CaCO₃ → CaO + CO₂</text>
<line x1="221.0" y1="110.0" x2="279.0" y2="110.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<line x1="521.0" y1="110.0" x2="579.0" y2="110.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<line x1="680.0" y1="151.0" x2="680.0" y2="242.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<line x1="579.0" y1="290.0" x2="521.0" y2="290.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<path d="M 120 248 C 140 200, 250 200, 290 150" stroke="#ea580c" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 5" marker-end="url(#aea580c)"/>
<text x="160.0" y="200.0" font-size="14" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">CO₂</text>
<path d="M 680 248 C 650 200, 560 200, 520 158" stroke="#dc2626" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 5" marker-end="url(#adc2626)"/>
<text x="640.0" y="200.0" font-size="13" fill="#dc2626" text-anchor="start" dominant-baseline="middle" font-weight="bold">CO₂ reused</text>
<text x="400.0" y="400.0" font-size="16" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">NaCl + NH<tspan dy="5.1" font-size="11.2">3</tspan><tspan dy="-5.1"> + CO</tspan><tspan dy="5.1" font-size="11.2">2</tspan><tspan dy="-5.1"> + H</tspan><tspan dy="5.1" font-size="11.2">2</tspan><tspan dy="-5.1">O → NaHCO</tspan><tspan dy="5.1" font-size="11.2">3</tspan><tspan dy="-5.1"> + NH</tspan><tspan dy="5.1" font-size="11.2">4</tspan><tspan dy="-5.1">Cl</tspan></text>
<text x="400.0" y="36.0" font-size="16" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Ammonia is recovered from NH₄Cl with CaO and reused</text>
</svg>
