<text x="205.0" y="278.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">separate chains, weak forces between them</text>
<text x="205.0" y="298.0" font-size="13" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">softens on heating; can be remoulded</text>
<text x="595.0" y="278.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">strong cross-links (red) join the chains</text>
<text x="595.0" y="298.0" font-size="13" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="bold">does not soften; chars on strong heating</text>
<text x="400.0" y="28.0" font-size="18" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Cross-links decide whether a plastic melts</text>
