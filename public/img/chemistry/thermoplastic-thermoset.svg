<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Thermoplastics and thermosetting plastics</title>
<desc id="d">Left: a thermoplastic has separate long chains held by weak forces; heating lets them slide, so it softens and can be remoulded (poly(ethene), PVC, nylon). Right: a thermosetting plastic has chains joined by strong cross-links; it does not soften on heating and chars instead (Bakelite, melamine).</desc>
