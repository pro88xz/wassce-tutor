<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Diamond and graphite</title>
<desc id="d">In diamond each carbon atom is joined to four others in a rigid three-dimensional tetrahedral network, so diamond is very hard and does not conduct electricity. In graphite each carbon is joined to three others in flat hexagonal layers held by weak forces; the layers slide, and one electron per atom is delocalised, so graphite is soft and conducts.</desc>
