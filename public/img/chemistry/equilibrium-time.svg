<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Approaching dynamic equilibrium</title>
<desc id="d">For A + B ⇌ C + D started with only A and B, the concentrations of reactants fall and of products rise until, at equilibrium, all concentrations stay constant. The forward rate falls and the backward rate rises until they are equal.</desc>
