<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Shapes of s and p orbitals</title>
<desc id="d">An s orbital is spherical. There are three p orbitals, each dumbbell-shaped, pointing along the x, y and z axes at right angles to each other.</desc>
<defs></defs>
<rect width="760" height="330" rx="20" fill="#f8fafc"/>
<circle cx="120.0" cy="170.0" r="70.0" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<circle cx="120.0" cy="170.0" r="4.0" fill="#0f172a" stroke="#0f172a" stroke-width="1"/>
<text x="120.0" y="280.0" font-size="16" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">s orbital: sphere</text>
<ellipse cx="372.0" cy="170.0" rx="48" ry="24" transform="rotate(0 372.0 170.0)" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
<ellipse cx="268.0" cy="170.0" rx="48" ry="24" transform="rotate(0 268.0 170.0)" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
<circle cx="320.0" cy="170.0" r="4.0" fill="#0f172a" stroke="#0f172a" stroke-width="1"/>
<text x="320.0" y="280.0" font-size="16" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="bold">px orbital</text>
<ellipse cx="480.0" cy="118.0" rx="48" ry="24" transform="rotate(-90 480.0 118.0)" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
<ellipse cx="480.0" cy="222.0" rx="48" ry="24" transform="rotate(-90 480.0 222.0)" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
<circle cx="480.0" cy="170.0" r="4.0" fill="#0f172a" stroke="#0f172a" stroke-width="1"/>
<text x="480.0" y="280.0" font-size="16" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">py orbital</text>
<ellipse cx="682.6" cy="140.2" rx="48" ry="24" transform="rotate(-35 682.6 140.2)" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
<ellipse cx="597.4" cy="199.8" rx="48" ry="24" transform="rotate(-35 597.4 199.8)" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
<circle cx="640.0" cy="170.0" r="4.0" fill="#0f172a" stroke="#0f172a" stroke-width="1"/>
<text x="640.0" y="280.0" font-size="16" fill="#7c3aed" text-anchor="middle" dominant-baseline="middle" font-weight="bold">pz orbital</text>
<text x="500.0" y="40.0" font-size="16" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">three p orbitals, at right angles to each other</text>
</svg>
