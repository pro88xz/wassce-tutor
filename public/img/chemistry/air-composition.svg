<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Composition of dry air by volume</title>
<desc id="d">Dry air is about 78% nitrogen, 21% oxygen, 0.93% argon and other noble gases, and 0.04% carbon(IV) oxide, with variable amounts of water vapour and pollutants.</desc>
<defs></defs>
<rect width="720" height="380" rx="20" fill="#f8fafc"/>
<path d="M 210.0 60.0 A 140 140 0 1 1 72.6 173.1 L 141.3 186.5 A 70 70 0 1 0 210.0 130.0 Z" stroke="#ffffff" stroke-width="2" fill="#2563eb" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 72.6 173.1 A 140 140 0 0 1 201.5 60.3 L 205.7 130.1 A 70 70 0 0 0 141.3 186.5 Z" stroke="#ffffff" stroke-width="2" fill="#dc2626" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 201.5 60.3 A 140 140 0 0 1 210.0 60.0 L 210.0 130.0 A 70 70 0 0 0 205.7 130.1 Z" stroke="#ffffff" stroke-width="2" fill="#7c3aed" stroke-linejoin="round" stroke-linecap="round"/>
<text x="210.0" y="192.0" font-size="17" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">dry air</text>
<text x="210.0" y="214.0" font-size="14" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">by volume</text>
<rect x="400.0" y="100.0" width="20.0" height="20.0" rx="3" fill="#2563eb" stroke="#2563eb" stroke-width="1"/>
<text x="430.0" y="110.0" font-size="15" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">Nitrogen, N₂</text>
<text x="700.0" y="110.0" font-size="15" fill="#2563eb" text-anchor="end" dominant-baseline="middle" font-weight="bold">78%</text>
<rect x="400.0" y="144.0" width="20.0" height="20.0" rx="3" fill="#dc2626" stroke="#dc2626" stroke-width="1"/>
<text x="430.0" y="154.0" font-size="15" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">Oxygen, O₂</text>
<text x="700.0" y="154.0" font-size="15" fill="#dc2626" text-anchor="end" dominant-baseline="middle" font-weight="bold">21%</text>
<rect x="400.0" y="188.0" width="20.0" height="20.0" rx="3" fill="#7c3aed" stroke="#7c3aed" stroke-width="1"/>
<text x="430.0" y="198.0" font-size="15" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">Argon and other noble gases</text>
<text x="700.0" y="198.0" font-size="15" fill="#7c3aed" text-anchor="end" dominant-baseline="middle" font-weight="bold">0.93%</text>
<rect x="400.0" y="232.0" width="20.0" height="20.0" rx="3" fill="#15803d" stroke="#15803d" stroke-width="1"/>
<text x="430.0" y="242.0" font-size="15" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">Carbon(IV) oxide, CO₂</text>
<text x="700.0" y="242.0" font-size="15" fill="#15803d" text-anchor="end" dominant-baseline="middle" font-weight="bold">0.04%</text>
<rect x="400.0" y="276.0" width="20.0" height="20.0" rx="3" fill="#0f766e" stroke="#0f766e" stroke-width="1"/>
<text x="430.0" y="286.0" font-size="15" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">Water vapour</text>
<text x="700.0" y="286.0" font-size="15" fill="#0f766e" text-anchor="end" dominant-baseline="middle" font-weight="bold">variable</text>
<text x="360.0" y="30.0" font-size="18" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Air is a mixture, not a compound</text>
</svg>
