<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 590" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Addition and condensation polymerisation</title>
<desc id="d">Addition: many ethene molecules, each with a C=C double bond, join into one long chain of poly(ethene); the double bonds open and nothing else is formed. Condensation: a dicarboxylic acid and a diol join end to end through ester links, and a small molecule of water is released at every link, giving a polyester.</desc>
