<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Laboratory preparation of carbon(IV) oxide</title>
<desc id="d">Dilute hydrochloric acid is added through a thistle funnel to marble chips (calcium carbonate). The carbon(IV) oxide is collected by downward delivery because it is denser than air (it can also be collected over water, as it is only fairly soluble).</desc>
<defs></defs>
<rect width="800" height="460" rx="20" fill="#f8fafc"/>
<polygon points="61.8,359.5 158.2,359.5 173.0,398.0 47.0,398.0" fill="#bfdbfe" stroke="none" stroke-width="0" stroke-linejoin="round"/>
<path d="M 93.1 230 L 93.1 284.4 L 45.0 400 L 175.0 400 L 126.9 284.4 L 126.9 230" stroke="#0f172a" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="90.0" y="224.0" width="40.0" height="12.0" rx="3" fill="#a16207" stroke="#0f172a" stroke-width="1.5"/>
<path d="M 102 160 L 102 380 M 108 160 L 108 380" stroke="#0f172a" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 105 160 m -18 -26 a 18 14 0 1 0 36 0 a 18 14 0 1 0 -36 0" stroke="#0f172a" stroke-width="2.5" fill="#ffffff" stroke-linejoin="round" stroke-linecap="round"/>
<text x="110.0" y="420.0" font-size="14" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">CaCO<tspan dy="4.5" font-size="9.8">3</tspan><tspan dy="-4.5"> + dilute HCl</tspan></text>
<rect x="328.0" y="230.0" width="64.0" height="170.0" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
<rect x="328.0" y="340.0" width="64.0" height="58.0" rx="0" fill="#bbf7d0" stroke="none" stroke-width="0" opacity="0.8"/>
<text x="360.0" y="370.0" font-size="16" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">CO<tspan dy="5.1" font-size="11.2">2</tspan><tspan dy="-5.1"></tspan></text>
<text x="360.0" y="420.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">downward delivery</text>
<text x="360.0" y="436.0" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">(gas denser than air)</text>
<path d="M 118.0 234.0 L 360.0 234.0 L 360.0 380.0" stroke="#0f172a" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 118.0 234.0 L 360.0 234.0 L 360.0 380.0" stroke="#e0f2fe" stroke-width="2.4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="400.0" y="28.0" font-size="18" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">CaCO₃ + 2HCl → CaCl₂ + H₂O + CO₂</text>
</svg>
