<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Boyle&#x27;s law and Charles&#x27; law graphs</title>
<desc id="d">Left: at constant temperature, pressure against volume is a curve: doubling the pressure halves the volume (Boyle&#x27;s law). Right: at constant pressure, volume against kelvin temperature is a straight line through the origin (Charles&#x27; law); extended, it reaches zero volume at −273 °C (0 K).</desc>
