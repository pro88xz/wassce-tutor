<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 560" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The reactivity series and methods of extraction</title>
<desc id="d">Metals in order of reactivity: potassium, sodium, calcium, magnesium and aluminium are extracted by electrolysis of molten compounds; carbon fits between aluminium and zinc; zinc, iron, tin and lead are extracted by reduction with carbon or carbon(II) oxide; hydrogen fits between lead and copper; copper, mercury, silver and gold are less reactive, and silver and gold are found native.</desc>
<defs><marker id="adc2626" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="adc2626s" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#dc2626"/></marker></defs>
<rect width="780" height="560" rx="20" fill="#f8fafc"/>
