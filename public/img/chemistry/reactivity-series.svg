<text x="100.0" y="220.0" font-size="15" fill="#475569" text-anchor="start" dominant-baseline="middle" font-weight="bold">C</text>
<text x="145.0" y="220.0" font-size="15" fill="#475569" text-anchor="start" dominant-baseline="middle" font-weight="normal" font-style="italic">carbon</text>
