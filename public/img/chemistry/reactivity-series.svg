<text x="100.0" y="124.0" font-size="15" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Ca</text>
<text x="145.0" y="124.0" font-size="15" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">calcium</text>
<rect x="80.0" y="143.0" width="190.0" height="26.0" rx="5" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.5"/>
