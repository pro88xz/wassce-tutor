<rect x="80.0" y="495.0" width="190.0" height="26.0" rx="5" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.5"/>
<text x="100.0" y="508.0" font-size="15" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="bold">Au</text>
<text x="145.0" y="508.0" font-size="15" fill="#0f172a" text-anchor="start" dominant-baseline="middle" font-weight="normal">gold</text>
<line x1="40.0" y1="508.0" x2="40.0" y2="56.0" stroke="#dc2626" stroke-width="3" stroke-linecap="round" marker-end="url(#adc2626)"/>
<text x="26.0" y="28.0" font-size="14" fill="#dc2626" text-anchor="start" dominant-baseline="middle" font-weight="bold">more reactive</text>
<rect x="300.0" y="46.0" width="440.0" height="156.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="520.0" y="114.0" font-size="16" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Electrolysis of molten compounds</text>
<text x="520.0" y="136.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">most energy needed; ores very stable</text>
<rect x="300.0" y="238.0" width="440.0" height="124.0" rx="8" fill="#fef3c7" stroke="#ea580c" stroke-width="2"/>
<text x="520.0" y="290.0" font-size="16" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Reduction with carbon / carbon(II) oxide</text>
<text x="520.0" y="312.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">blast furnace and similar</text>
<rect x="300.0" y="398.0" width="440.0" height="60.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="520.0" y="418.0" font-size="16" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Roasting / heating ore</text>
<text x="520.0" y="440.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">copper, mercury</text>
<rect x="300.0" y="462.0" width="440.0" height="60.0" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="520.0" y="482.0" font-size="16" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Found native (uncombined)</text>
<text x="520.0" y="504.0" font-size="14" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">silver, gold</text>
<text x="520.0" y="220.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal" font-style="italic">carbon reduces oxides of metals below it</text>
<text x="520.0" y="380.0" font-size="13" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal" font-style="italic">metals above hydrogen give H₂ with dilute acids</text>
</svg>
