<line x1="84.0" y1="271.2" x2="90.0" y2="271.2" stroke="#0f172a" stroke-width="1.6" stroke-linecap="round"/>
<text x="80.0" y="271.2" font-size="13" fill="#475569" text-anchor="end" dominant-baseline="middle" font-weight="normal">20</text>
