<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Radioactive decay and half-life</title>
<desc id="d">The mass of a radioactive sample halves every half-life: 80 g becomes 40 g after one half-life, 20 g after two, 10 g after three and 5 g after four.</desc>
