<line x1="580.9" y1="315.3" x2="580.9" y2="330.0" stroke="#475569" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="6 5"/>
<line x1="580.9" y1="315.3" x2="90.0" y2="315.3" stroke="#475569" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="6 5"/>
