<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Primary, secondary and tertiary alkanols</title>
<desc id="d">Propan-1-ol is a primary alkanol: the carbon carrying the OH group is joined to one other carbon. Propan-2-ol is secondary: that carbon is joined to two other carbons. 2-Methylpropan-2-ol is tertiary: it is joined to three. Primary alkanols are oxidised to alkanals and then alkanoic acids, secondary ones to alkanones, and tertiary ones are not easily oxidised.</desc>
