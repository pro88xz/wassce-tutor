<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Cracking liquid paraffin in the laboratory</title>
<desc id="d">Mineral wool soaked in liquid paraffin sits at the closed end of a horizontal boiling tube, with broken porcelain in the middle. The porcelain is heated strongly and the paraffin gently, so its vapour passes over the hot porcelain and cracks. The gaseous alkenes, mainly ethene, are collected over water. The delivery tube must be removed from the water before heating stops.</desc>
