<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Titration apparatus</title>
<desc id="d">A burette clamped vertically above a conical flask standing on a white tile. The conical flask holds a measured volume of alkali from a pipette and a few drops of indicator. Acid is run in from the burette while the flask is swirled. The burette is read at the bottom of the meniscus with the eye level with it.</desc>
