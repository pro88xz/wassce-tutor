<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Esterification: ethanoic acid and ethanol</title>
<desc id="d">Ethanoic acid reacts with ethanol, with a little concentrated sulphuric acid as catalyst, to form ethyl ethanoate and water. The OH from the acid and the H from the alcohol&#x27;s OH group leave as water. The reaction is reversible.</desc>
