<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Boiling points of the first eight alkanes</title>
<desc id="d">Boiling point rises steadily with the number of carbon atoms: methane −162 °C, ethane −89, propane −42, butane −0.5, pentane 36, hexane 69, heptane 98, octane 126 °C. The first four are gases at room temperature.</desc>
