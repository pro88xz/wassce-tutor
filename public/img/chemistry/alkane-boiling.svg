<line x1="100.0" y1="330.0" x2="100.0" y2="52.0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a0f172a)"/>
<text x="676.0" y="366.0" font-size="16" fill="#475569" text-anchor="end" dominant-baseline="middle" font-weight="normal">number of carbon atoms</text>
