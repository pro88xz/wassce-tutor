<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Tests for common gases</title>
<desc id="d">Hydrogen: a lighted splint burns with a squeaky pop. Oxygen: a glowing splint relights. Carbon(IV) oxide: lime water turns milky. Ammonia: damp red litmus turns blue, and white fumes form with hydrogen chloride. Chlorine: damp blue litmus turns red and is then bleached. Sulphur(IV) oxide: acidified potassium dichromate(VI) paper turns from orange to green. Hydrogen chloride: white fumes with ammonia. Hydrogen sulphide: lead(II) ethanoate paper turns black.</desc>
