<title id="t">Laboratory preparation of ammonia</title>
<desc id="d">A mixture of calcium hydroxide and ammonium chloride is heated in a test tube sloping slightly downwards. The ammonia is dried by passing through a tower of calcium oxide (quicklime) and collected by upward delivery, because it is lighter than air.</desc>
