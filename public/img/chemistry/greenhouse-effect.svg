<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The greenhouse effect</title>
<desc id="d">Sunlight, mainly visible and short-wave radiation, passes through the atmosphere and warms the Earth&#x27;s surface. The warm surface gives out long-wave infrared radiation. Greenhouse gases in the atmosphere (carbon(IV) oxide, methane, water vapour, nitrogen oxides and CFCs) absorb much of it and re-emit it in all directions, some back to the surface, which keeps the Earth warmer. More greenhouse gas traps more heat: global warming.</desc>
