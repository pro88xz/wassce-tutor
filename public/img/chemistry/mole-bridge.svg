<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Converting to and from moles</title>
<desc id="d">The mole is the bridge between quantities. Mass in grams divided by molar mass gives moles; moles times molar mass gives mass. Moles times the Avogadro constant gives the number of particles. Gas volume divided by 22.4 dm3 at s.t.p. gives moles. Concentration times volume in dm3 gives moles.</desc>
<defs><marker id="a0f766e" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/></marker><marker id="a0f766es" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#0f766e"/></marker><marker id="a15803d" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker><marker id="a15803ds" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#15803d"/></marker><marker id="a7c3aed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker><marker id="a7c3aeds" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#7c3aed"/></marker><marker id="aea580c" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#ea580c"/></marker><marker id="aea580cs" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#ea580c"/></marker></defs>
<rect width="780" height="420" rx="20" fill="#f8fafc"/>
<rect x="305.0" y="172.0" width="170.0" height="76.0" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="390.0" y="196.0" font-size="22" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">moles</text>
<text x="390.0" y="224.0" font-size="20" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">n</text>
<rect x="295.0" y="28.0" width="190.0" height="64.0" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
<text x="390.0" y="48.5" font-size="17" fill="#15803d" text-anchor="middle" dominant-baseline="middle" font-weight="bold">mass (g)</text>
<text x="390.0" y="71.5" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">m</text>
<line x1="378.0" y1="97.0" x2="378.0" y2="167.0" stroke="#15803d" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a15803d)"/>
<line x1="402.0" y1="167.0" x2="402.0" y2="97.0" stroke="#15803d" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a15803d)"/>
<text x="366.0" y="132.0" font-size="14" fill="#15803d" text-anchor="end" dominant-baseline="middle" font-weight="bold">÷ M</text>
<text x="414.0" y="132.0" font-size="14" fill="#15803d" text-anchor="start" dominant-baseline="middle" font-weight="bold">× M</text>
<rect x="15.0" y="178.0" width="190.0" height="64.0" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
<text x="110.0" y="198.5" font-size="17" fill="#7c3aed" text-anchor="middle" dominant-baseline="middle" font-weight="bold">particles</text>
<text x="110.0" y="221.5" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">N</text>
<line x1="210.0" y1="200.0" x2="300.0" y2="200.0" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a7c3aed)"/>
<line x1="300.0" y1="220.0" x2="210.0" y2="220.0" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a7c3aed)"/>
<text x="255.0" y="184.0" font-size="14" fill="#7c3aed" text-anchor="middle" dominant-baseline="middle" font-weight="bold">÷ 6.02 × 10²³</text>
<text x="255.0" y="240.0" font-size="14" fill="#7c3aed" text-anchor="middle" dominant-baseline="middle" font-weight="bold">× 6.02 × 10²³</text>
<rect x="575.0" y="178.0" width="190.0" height="64.0" rx="12" fill="#fef3c7" stroke="#ea580c" stroke-width="2.5"/>
<text x="670.0" y="198.5" font-size="17" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">gas volume</text>
<text x="670.0" y="221.5" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">V (dm³)</text>
<line x1="570.0" y1="200.0" x2="480.0" y2="200.0" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round" marker-end="url(#aea580c)"/>
<line x1="480.0" y1="220.0" x2="570.0" y2="220.0" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round" marker-end="url(#aea580c)"/>
<text x="525.0" y="184.0" font-size="14" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">÷ 22.4</text>
<text x="525.0" y="240.0" font-size="14" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-weight="bold">× 22.4</text>
<rect x="295.0" y="328.0" width="190.0" height="64.0" rx="12" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/>
<text x="390.0" y="348.5" font-size="17" fill="#0f766e" text-anchor="middle" dominant-baseline="middle" font-weight="bold">solution</text>
<text x="390.0" y="371.5" font-size="15" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="normal">C × V (dm³)</text>
<line x1="378.0" y1="323.0" x2="378.0" y2="253.0" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a0f766e)"/>
<line x1="402.0" y1="253.0" x2="402.0" y2="323.0" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a0f766e)"/>
<text x="366.0" y="288.0" font-size="14" fill="#0f766e" text-anchor="end" dominant-baseline="middle" font-weight="bold">C × V</text>
<text x="414.0" y="288.0" font-size="14" fill="#0f766e" text-anchor="start" dominant-baseline="middle" font-weight="bold">n ÷ V</text>
<text x="130.0" y="390.0" font-size="14" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">M = molar mass (g/mol)</text>
<text x="660.0" y="390.0" font-size="14" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">22.4 dm³ per mole at s.t.p.</text>
</svg>
