<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The Tyndall effect</title>
<desc id="d">A beam of light passes invisibly through a true solution such as salt solution, but its path is visible through a colloid such as starch solution or diluted milk, because the colloid particles scatter the light.</desc>
