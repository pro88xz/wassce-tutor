<title id="t">Particles in solids, liquids and gases</title>
<desc id="d">In a solid, particles are closely packed in a regular pattern and only vibrate. In a liquid, particles are close together but irregular and can slide past each other. In a gas, particles are far apart and move quickly in all directions.</desc>
