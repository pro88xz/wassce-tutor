<text x="390.0" y="276.0" font-size="18" fill="#0f172a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Liquid</text>
<text x="390.0" y="300.0" font-size="15" fill="#475569" text-anchor="middle" dominant-baseline="middle" font-weight="normal">close, irregular; slide</text>
