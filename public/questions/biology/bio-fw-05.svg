<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 132" width="420" height="132" role="img">
  <title>A pyramid of numbers with three bars: a very narrow bar for the producer at the bottom, a very wide bar for the primary consumers above it, and a narrower bar for the secondary consumers at the top</title>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <rect x="146.8" y="84.7" width="26.6" height="22.2" fill="#dcfce7" stroke="#111827" stroke-width="1.6"/>
  <text x="255.5" y="95.8" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="normal" fill="#6b7280" text-anchor="start" dominant-baseline="central">Producer</text>
  <rect x="71.4" y="58.1" width="177.4" height="22.2" fill="#fef3c7" stroke="#111827" stroke-width="1.6"/>
  <text x="255.5" y="69.2" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="normal" fill="#6b7280" text-anchor="start" dominant-baseline="central">Primary consumer</text>
  <rect x="126.9" y="31.5" width="66.5" height="22.2" fill="#dbeafe" stroke="#111827" stroke-width="1.6"/>
  <text x="255.5" y="42.6" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="normal" fill="#6b7280" text-anchor="start" dominant-baseline="central">Secondary consumer</text>
  <text x="160.1" y="23.8" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle" dominant-baseline="central">Pyramid of numbers</text>
</svg>
