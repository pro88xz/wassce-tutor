  <line x1="63.7" y1="51.6" x2="63.7" y2="159.3" stroke="#111827" stroke-width="2" stroke-linecap="round"/>
  <line x1="63.7" y1="159.3" x2="265.8" y2="159.3" stroke="#111827" stroke-width="2" stroke-linecap="round"/>
  <line x1="265.8" y1="159.3" x2="63.7" y2="51.6" stroke="#111827" stroke-width="2" stroke-linecap="round"/>
  <path d="M63.7,148.3 L74.7,148.3 L74.7,159.3" fill="none" stroke="#111827" stroke-width="1.5"/>
  <path d="M231.8,159.3 A34,34 0 0 1 235.8,143.3" fill="none" stroke="#111827" stroke-width="1.6"/>
