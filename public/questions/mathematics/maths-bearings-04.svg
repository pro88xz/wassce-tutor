<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 263" width="260" height="263" role="img">
  <title>A ship sails 8 km north from P to Q, then 6 km east to R. Theta is the angle at P between north and PR.</title>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <line x1="81.7" y1="209.3" x2="81.7" y2="71.4" stroke="#111827" stroke-width="2" stroke-linecap="round"/>
  <line x1="81.7" y1="71.4" x2="185.2" y2="71.4" stroke="#111827" stroke-width="2" stroke-linecap="round"/>
  <line x1="81.7" y1="209.3" x2="185.2" y2="71.4" stroke="#111827" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/>
  <line x1="47.2" y1="78.3" x2="47.2" y2="50.7" stroke="#111827" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M51.2,58.8 L47.2,50.7 L43.3,58.8" fill="none" stroke="#111827" stroke-width="1.6"/>
  <text x="47.2" y="39.7" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#111827" text-anchor="middle" dominant-baseline="central">N</text>
  <path d="M81.7,175.3 A34,34 0 0 1 102.1,182.1" fill="none" stroke="#1d4ed8" stroke-width="1.6"/>
  <text x="97.2" y="162.8" font-family="Georgia, serif" font-size="16" font-style="italic" font-weight="bold" fill="#1d4ed8" text-anchor="middle" dominant-baseline="central">θ</text>
  <text x="68.7" y="140.3" font-family="system-ui, sans-serif" font-size="14" fill="#111827" text-anchor="end" dominant-baseline="central">8 km</text>
  <text x="133.4" y="58.4" font-family="system-ui, sans-serif" font-size="14" fill="#111827" text-anchor="middle" dominant-baseline="central">6 km</text>
  <circle cx="81.7" cy="209.3" r="3.2" fill="#111827"/>
  <text x="81.7" y="224.3" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-style="italic" font-weight="normal" fill="#111827" text-anchor="middle" dominant-baseline="central">P</text>
  <circle cx="81.7" cy="71.4" r="3.2" fill="#111827"/>
  <text x="71.1" y="60.8" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-style="italic" font-weight="normal" fill="#111827" text-anchor="middle" dominant-baseline="central">Q</text>
  <circle cx="185.2" cy="71.4" r="3.2" fill="#111827"/>
  <text x="200.2" y="71.4" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-style="italic" font-weight="normal" fill="#111827" text-anchor="middle" dominant-baseline="central">R</text>
</svg>
