  <path d="M150.0,150.0 L215.6,240.3 A111.6,111.6 0 0 0 150.0,38.4 Z" fill="#dbeafe" stroke="#111827" stroke-width="2" stroke-linejoin="round"/>
  <path d="M150.0,150.0 L59.7,215.6 A111.6,111.6 0 0 0 215.6,240.3 Z" fill="#dcfce7" stroke="#111827" stroke-width="2" stroke-linejoin="round"/>
