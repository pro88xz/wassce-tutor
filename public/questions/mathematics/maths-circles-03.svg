<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300" role="img">
  <title>Cyclic quadrilateral PQRS. Angle QPS is 2x degrees and angle QRS is (x + 30) degrees.</title>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <circle cx="150.0" cy="150.0" r="90.0" fill="none" stroke="#111827" stroke-width="2"/>
  <line x1="150.0" y1="60.0" x2="61.4" y2="134.4" stroke="#111827" stroke-width="2" stroke-linecap="round"/>
  <line x1="61.4" y1="134.4" x2="150.0" y2="240.0" stroke="#111827" stroke-width="2" stroke-linecap="round"/>
  <line x1="150.0" y1="240.0" x2="238.6" y2="134.4" stroke="#111827" stroke-width="2" stroke-linecap="round"/>
  <line x1="238.6" y1="134.4" x2="150.0" y2="60.0" stroke="#111827" stroke-width="2" stroke-linecap="round"/>
  <path d="M131.6,75.4 A24,24 0 0 0 168.4,75.4" fill="none" stroke="#111827" stroke-width="1.6"/>
  <text x="150.0" y="99.0" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" fill="#111827" text-anchor="middle" dominant-baseline="central">2x°</text>
  <path d="M135.9,223.1 A22,22 0 0 1 164.1,223.1" fill="none" stroke="#111827" stroke-width="1.6"/>
  <text x="150.0" y="194.0" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" fill="#111827" text-anchor="middle" dominant-baseline="central">(x + 30)°</text>
  <circle cx="150.0" cy="60.0" r="3.2" fill="#111827"/>
  <text x="150.0" y="45.0" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-style="italic" font-weight="normal" fill="#111827" text-anchor="middle" dominant-baseline="central">P</text>
  <circle cx="61.4" cy="134.4" r="3.2" fill="#111827"/>
  <text x="46.6" y="131.8" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-style="italic" font-weight="normal" fill="#111827" text-anchor="middle" dominant-baseline="central">Q</text>
  <circle cx="150.0" cy="240.0" r="3.2" fill="#111827"/>
  <text x="150.0" y="255.0" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-style="italic" font-weight="normal" fill="#111827" text-anchor="middle" dominant-baseline="central">R</text>
  <circle cx="238.6" cy="134.4" r="3.2" fill="#111827"/>
  <text x="253.4" y="131.8" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-style="italic" font-weight="normal" fill="#111827" text-anchor="middle" dominant-baseline="central">S</text>
</svg>
