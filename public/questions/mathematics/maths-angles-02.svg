<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="280" height="280" role="img">
  <title>Two straight lines cross. Vertically opposite angles are (3x − 20)° and (x + 40)°.</title>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <line x1="231.4" y1="123.9" x2="48.6" y2="156.1" stroke="#111827" stroke-width="2" stroke-linecap="round"/>
  <line x1="156.1" y1="48.6" x2="123.9" y2="231.4" stroke="#111827" stroke-width="2" stroke-linecap="round"/>
  <path d="M163.6,135.8 A24,24 0 0 0 144.2,116.4" fill="none" stroke="#111827" stroke-width="1.6"/>
  <text x="181.0" y="99.0" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" fill="#111827" text-anchor="middle" dominant-baseline="central">(3x − 20)°</text>
  <path d="M116.4,144.2 A24,24 0 0 0 135.8,163.6" fill="none" stroke="#111827" stroke-width="1.6"/>
  <text x="99.0" y="181.0" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" fill="#111827" text-anchor="middle" dominant-baseline="central">(x + 40)°</text>
  <circle cx="140.0" cy="140.0" r="3.2" fill="#111827"/>
</svg>
