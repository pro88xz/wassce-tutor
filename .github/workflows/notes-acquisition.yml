name: Open-licence WASSCE content acquisition (benched)

# BENCHED (2026-11-07): no schedule and no automatic runs. The content it can
# find is not good enough to put in front of students unreviewed: only a few
# OpenStax books (Physics, Statistics) and Wikibooks are licensed for a paid
# site, and their sections are general textbook text, not WASSCE notes. Run it
# by hand from Actions -> Run workflow, with DRY_RUN on, to see what it finds.
#
# It no longer scrapes Google, Bing, Brave, DuckDuckGo or Yahoo: they block
# GitHub's servers (every earlier run found nothing). It asks OpenStax and
# Wikibooks through their own APIs instead (scripts/oer-acquisition.mjs).
on:
  workflow_dispatch:
    inputs:
      topic_limit:
        description: Lessons to create in this run (1-3)
        required: false
        default: '3'
      dry_run:
        description: Only report what would be added (no database writes)
        required: false
        default: '1'

permissions:
  contents: read

concurrency:
  group: wassce-oer-acquisition
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Find openly licensed material for topics without lessons
        env:
          NOTES_CATALOG_URL: https://wasscetutor.com/api/notes-engine/catalog
          NOTES_INGEST_URL: https://wasscetutor.com/api/notes-engine/ingest
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          WIKIMEDIA_TOKEN: ${{ secrets.WIKIMEDIA_TOKEN }}
          TOPIC_LIMIT: ${{ github.event.inputs.topic_limit || '3' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '1' }}
        run: node scripts/oer-acquisition.mjs
