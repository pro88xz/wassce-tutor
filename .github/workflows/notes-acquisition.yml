name: Playwright WASSCE content acquisition

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/notes-acquisition.yml'
      - 'scripts/playwright-notes-acquisition.mjs'
      - 'api/notes-engine/ingest.js'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      topic_limit:
        description: Maximum missing topics to research in this run (1–3)
        required: false
        default: '3'

permissions:
  contents: read

concurrency:
  group: wassce-playwright-acquisition
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install application dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Discover, scrape, verify licences and populate topic gaps
        env:
          NOTES_CATALOG_URL: https://wasscetutor.com/api/notes-engine/catalog
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          NOTES_INGEST_URL: https://wasscetutor.com/api/notes-engine/ingest
          TOPIC_LIMIT: ${{ github.event.inputs.topic_limit || '3' }}
        run: node scripts/playwright-notes-acquisition.mjs
