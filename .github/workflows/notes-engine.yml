name: Notes engine

on:
  push:
    branches: [main]
    paths:
      - 'content/notes/**'
      - 'content/sources/**'
      - 'scripts/notes-ingestion.mjs'
      - 'api/notes-engine/**'
      - 'vercel.json'
      - 'scripts/source-acquisition.mjs'
      - 'scripts/notes-ingestion.test.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/notes-engine.yml'
  pull_request:
    paths:
      - 'content/notes/**'
      - 'content/sources/**'
      - 'scripts/notes-ingestion.mjs'
      - 'scripts/source-acquisition.mjs'
      - 'scripts/notes-ingestion.test.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/notes-engine.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notes-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run notes:validate
      - run: npm run notes:test
      - run: npm run notes:build
      - name: Check autonomous engine serverless function syntax
        run: node --check api/notes-engine/run.js
      - name: Verify live Supabase curriculum mapping
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_ANON_KEY" ]]; then
            echo "::notice::Skipping live catalog check; configure SUPABASE_URL and SUPABASE_ANON_KEY repository Actions secrets to enable it."
            exit 0
          fi
          npm run notes:catalog
      - name: Upload generated ingestion report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notes-ingestion-report
          path: dist/notes-ingestion/
          if-no-files-found: ignore
          retention-days: 14
