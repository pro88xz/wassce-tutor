name: Email engine daily run

# Backup starter for the email engine, and a way to run it by hand from the
# Actions tab. The main clock is now in the database: pg_cron in Supabase
# starts the run at 10:00 Freetown time (GMT) every day (migration 21).
# GitHub's scheduler sometimes delays or drops jobs, especially on the hour
# (on 16 November 2026 its 10:00 run never started), so this backup runs at
# 10:37, off the busy top of the hour. Running twice is safe: each email has
# its own key per student and the daily limit counts what was already sent,
# so the backup only sends what the 10:00 run missed.
#
# The engine itself runs on the website (api/email/run.js); this only knocks
# on the door with the schedule secret kept in Supabase Vault. What happens is
# decided by the mode in Admin → Emails. The run's summary is printed below
# each run.
on:
  schedule:
    - cron: '37 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wassce-tutor-email-engine-run
  cancel-in-progress: false

jobs:
  run:
    name: Run the email engine
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Start the run on wasscetutor.com
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL" || { echo "Missing SUPABASE_DB_URL"; exit 1; }
          SECRET="$(psql "$SUPABASE_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align \
            --command "select decrypted_secret from vault.decrypted_secrets where name = 'email_cron_secret';" | tr -d '[:space:]')"
          test -n "$SECRET" || { echo "No schedule secret yet: run the 'Set up email engine' workflow first."; exit 1; }
          echo "::add-mask::$SECRET"
          curl --fail-with-body --silent --show-error --max-time 120 \
            --header "Authorization: Bearer $SECRET" \
            https://wasscetutor.com/api/email/run
          echo
