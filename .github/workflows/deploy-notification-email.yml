name: Deploy tutor notification email function

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wassce-tutor-notification-email-deploy
  cancel-in-progress: false

jobs:
  deploy-notification-email:
    name: Deploy authenticated notification email function
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    if: github.ref == 'refs/heads/feature/tutor-affiliate-platform'
    steps:
      - name: Check out the selected feature branch
        uses: actions/checkout@v5

      - name: Validate deployment configuration
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$SUPABASE_PROJECT_REF" || { echo "Missing SUPABASE_PROJECT_REF"; exit 1; }
          test -n "$RESEND_API_KEY" || { echo "Missing RESEND_API_KEY"; exit 1; }
          test -n "$EMAIL_FROM" || { echo "Missing EMAIL_FROM"; exit 1; }
          test -s "supabase/functions/send-notification-email/index.ts" || { echo "Edge Function source is missing"; exit 1; }
          test -s "supabase/config.toml" || { echo "Supabase config is missing"; exit 1; }

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Set production Edge Function secrets
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: |
          set -euo pipefail
          supabase secrets set \
            --project-ref "$SUPABASE_PROJECT_REF" \
            "RESEND_API_KEY=$RESEND_API_KEY" \
            "EMAIL_FROM=$EMAIL_FROM" \
            "APP_ORIGIN=https://wasscetutor.com"

      - name: Deploy only the notification email function
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          supabase functions deploy send-notification-email --remote="$SUPABASE_PROJECT_REF"
