name: Apply database migrations

# Run by hand from the Actions tab, on main. Applies every migration numbered 18
# or later (supabase/migrations/<date>_<number>_<name>.sql) that has not been
# applied yet, once, in order, and records each one with its checksum. Safe to
# run again: anything already recorded is skipped. Migrations up to 17 have
# their own workflows (the email ones: "Set up email engine").
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wassce-tutor-database-migrations
  cancel-in-progress: false

jobs:
  apply:
    name: Apply new database migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    if: github.ref == 'refs/heads/main'
    env:
      FIRST: '18'
    steps:
      - name: Check out main
        uses: actions/checkout@v5

      - name: Validate migrations and database secret
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL" || { echo "Missing SUPABASE_DB_URL"; exit 1; }
          for FILE in supabase/migrations/*.sql; do
            NUM="$(basename "$FILE" | cut -d_ -f2)"
            [[ "$NUM" =~ ^[0-9]+$ ]] && (( 10#$NUM >= FIRST )) || continue
            grep -qiE '^[[:space:]]*begin;' "$FILE" || { echo "$FILE has no begin;"; exit 1; }
            grep -qiE '^[[:space:]]*commit;' "$FILE" || { echo "$FILE has no commit;"; exit 1; }
          done

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Apply each new migration once and record its checksum
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --quiet <<'SQL'
          create schema if not exists wassce_internal;
          revoke all on schema wassce_internal from public, anon, authenticated;
          create table if not exists wassce_internal.deployed_migrations (
            version text primary key,
            sha256 text not null,
            applied_at timestamptz not null default now()
          );
          revoke all on all tables in schema wassce_internal from public, anon, authenticated;
          SQL

          for FILE in $(ls supabase/migrations/*.sql | sort); do
            NUM="$(basename "$FILE" | cut -d_ -f2)"
            [[ "$NUM" =~ ^[0-9]+$ ]] && (( 10#$NUM >= FIRST )) || continue
            VERSION="$(basename "$FILE" .sql)"
            APPLIED="$(psql "$SUPABASE_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align --command "select exists (select 1 from wassce_internal.deployed_migrations where version = '$VERSION');" | tr -d '[:space:]')"
            if [[ "$APPLIED" == "t" ]]; then
              echo "$VERSION: already applied"
              continue
            fi
            CHECKSUM="$(sha256sum "$FILE" | cut -d ' ' -f 1)"
            {
              echo "begin;"
              echo "do \$\$ begin if exists (select 1 from wassce_internal.deployed_migrations where version = '$VERSION') then raise exception 'Migration already applied'; end if; end \$\$;"
              sed '/^[[:space:]]*begin;[[:space:]]*$/Id; /^[[:space:]]*commit;[[:space:]]*$/Id;' "$FILE"
              printf "insert into wassce_internal.deployed_migrations(version, sha256) values ('%s', '%s');\n" "$VERSION" "$CHECKSUM"
              echo "commit;"
            } | psql "$SUPABASE_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --quiet
            echo "$VERSION: applied"
          done

      - name: Verify (18) tutor booking on WhatsApp
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          RESULT="$(psql "$SUPABASE_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align --command "select concat_ws(',',
            has_function_privilege('authenticated','public.contact_tutor(uuid,uuid)','execute'),
            has_function_privilege('anon','public.contact_tutor(uuid,uuid)','execute'),
            has_column_privilege('anon','public.tutors','phone','select'),
            has_column_privilege('authenticated','public.tutors','phone','select'),
            (select count(*) from public.tutors where teaching_mode <> 'in_person'));" | tr -d '[:space:]')"
          echo "students can contact, visitors can contact, visitors read phones, students read phones, tutors not in person: $RESULT"
          test "$RESULT" = "t,f,f,f,0" || { echo "Checks did not match t,f,f,f,0"; exit 1; }

      - name: Verify (19) several subjects, groups and payment methods
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          RESULT="$(psql "$SUPABASE_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align --command "select concat_ws(',',
            has_function_privilege('authenticated','public.request_tutor(uuid,uuid[],integer)','execute'),
            has_function_privilege('anon','public.request_tutor(uuid,uuid[],integer)','execute'),
            has_function_privilege('authenticated','public.update_tutor_offer(jsonb,integer,integer,integer,text[])','execute'),
            has_column_privilege('anon','public.tutors','group_max','select'),
            has_column_privilege('anon','public.tutors','phone','select'));" | tr -d '[:space:]')"
          echo "students can request, visitors can request, tutors can set offers, visitors read offers, visitors read phones: $RESULT"
          test "$RESULT" = "t,f,t,t,f" || { echo "Checks did not match t,f,t,t,f"; exit 1; }

      - name: Verify (20) tutors edit, publish and hide their card; admins remove
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          RESULT="$(psql "$SUPABASE_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align --command "select concat_ws(',',
            has_function_privilege('authenticated','public.set_tutor_listed(boolean)','execute'),
            has_function_privilege('anon','public.set_tutor_listed(boolean)','execute'),
            has_function_privilege('authenticated','public.update_tutor_card(text,text,text,integer)','execute'),
            has_column_privilege('anon','public.tutors','listed','select'),
            (select count(*) from pg_proc where proname = 'set_tutor_status' and pronamespace = 'public'::regnamespace));" | tr -d '[:space:]')"
          echo "tutors can hide, visitors can hide, tutors can publish, visitors read listed, set_tutor_status versions: $RESULT"
          test "$RESULT" = "t,f,t,t,1" || { echo "Checks did not match t,f,t,t,1"; exit 1; }

      - name: Verify (21) the database starts the email run at 10:00 GMT
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          RESULT="$(psql "$SUPABASE_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align --command "select concat_ws(',',
            (select count(*) from cron.job where jobname = 'email-engine-daily' and schedule = '0 10 * * *' and active),
            has_function_privilege('anon','public.email_engine_kick()','execute'),
            has_function_privilege('authenticated','public.email_engine_kick()','execute'),
            (select count(*) from vault.decrypted_secrets where name = 'email_cron_secret' and length(decrypted_secret) >= 16));" | tr -d '[:space:]')"
          echo "daily job at 10:00, visitors can start it, students can start it, schedule secret present: $RESULT"
          test "$RESULT" = "1,f,f,1" || { echo "Checks did not match 1,f,f,1"; exit 1; }

          # Can the database reach the website? An unsigned request is refused
          # with 401 and does nothing, so this proves the route without a run.
          ID="$(psql "$SUPABASE_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align --command "select net.http_get(url := 'https://wasscetutor.com/api/email/run', timeout_milliseconds := 30000);" | tr -d '[:space:]')"
          STATUS=""
          for i in $(seq 1 20); do
            sleep 3
            STATUS="$(psql "$SUPABASE_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align --command "select coalesce(status_code::text, 'error:' || coalesce(error_msg, '')) from net._http_response where id = $ID;" | tr -d '[:space:]')"
            [ -n "$STATUS" ] && break
          done
          echo "database → wasscetutor.com/api/email/run without the secret: ${STATUS:-no reply}"
          test "$STATUS" = "401" || { echo "Expected 401 (route reachable, unsigned call refused)"; exit 1; }

      - name: Verify (22) every lesson and practice set is free; mock exams stay with a plan
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          RESULT="$(psql "$SUPABASE_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align --command "select concat_ws(',',
            (select count(*) from public.wassce_lesson_index where not is_free),
            (select count(*) from public.lessons where is_published) = (select count(*) from public.wassce_public_lessons),
            (select count(*) from public.papers where is_published and coalesce(paper_type, '') <> 'Mock' and not is_free),
            has_function_privilege('anon','public.is_free_lesson(uuid)','execute'),
            (select count(*) from pg_policies where schemaname = 'public' and tablename = 'lessons' and policyname = 'lessons readable by everyone when published'));" | tr -d '[:space:]')"
          echo "locked lessons, every lesson public, locked practice sets, visitors check lessons, open lesson rule: $RESULT"
          test "$RESULT" = "0,t,0,t,1" || { echo "Checks did not match 0,t,0,t,1"; exit 1; }

          # As a signed-out visitor: every published lesson and practice
          # question is readable, and no mock exam question is.
          VISITOR="$(psql "$SUPABASE_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align --quiet <<'SQL' | tr -d '[:space:]'
          begin;
          set local role anon;
          select concat_ws(',',
            (select count(*) from public.lessons) = (select count(*) from public.wassce_public_lessons),
            (select count(*) from public.questions q join public.papers p on p.id = q.paper_id where p.paper_type = 'Mock'),
            (select count(*) from public.questions) > 0);
          rollback;
          SQL
          )"
          echo "visitor reads every lesson, visitor reads mock questions, visitor reads practice questions: $VISITOR"
          test "$VISITOR" = "t,0,t" || { echo "Checks did not match t,0,t"; exit 1; }

      - name: Verify (23) no plain-text $ amounts left in the accounting lesson
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          RESULT="$(psql "$SUPABASE_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align --command "select count(*) from public.lessons where id = '5f81e3d3-be2f-42f7-8c47-c8ab937b95bd' and content ~ '(?<![\\\\\$])\\\$(?=[0-9])';" | tr -d '[:space:]')"
          echo "accounting lesson with unescaped amounts: $RESULT"
          test "$RESULT" = "0" || { echo "Expected 0"; exit 1; }
