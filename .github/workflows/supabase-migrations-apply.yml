name: Apply database migrations

# Run by hand from the Actions tab, on main. Applies every migration numbered 18
# or later (supabase/migrations/<date>_<number>_<name>.sql) that has not been
# applied yet, once, in order, and records each one with its checksum. Safe to
# run again: anything already recorded is skipped. Migrations up to 17 have
# their own workflows (the email ones: "Set up email engine").
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wassce-tutor-database-migrations
  cancel-in-progress: false

jobs:
  apply:
    name: Apply new database migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    if: github.ref == 'refs/heads/main'
    env:
      FIRST: '18'
    steps:
      - name: Check out main
        uses: actions/checkout@v5

      - name: Validate migrations and database secret
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL" || { echo "Missing SUPABASE_DB_URL"; exit 1; }
          for FILE in supabase/migrations/*.sql; do
            NUM="$(basename "$FILE" | cut -d_ -f2)"
            [[ "$NUM" =~ ^[0-9]+$ ]] && (( 10#$NUM >= FIRST )) || continue
            grep -qiE '^[[:space:]]*begin;' "$FILE" || { echo "$FILE has no begin;"; exit 1; }
            grep -qiE '^[[:space:]]*commit;' "$FILE" || { echo "$FILE has no commit;"; exit 1; }
          done

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Apply each new migration once and record its checksum
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --quiet <<'SQL'
          create schema if not exists wassce_internal;
          revoke all on schema wassce_internal from public, anon, authenticated;
          create table if not exists wassce_internal.deployed_migrations (
            version text primary key,
            sha256 text not null,
            applied_at timestamptz not null default now()
          );
          revoke all on all tables in schema wassce_internal from public, anon, authenticated;
          SQL

          for FILE in $(ls supabase/migrations/*.sql | sort); do
            NUM="$(basename "$FILE" | cut -d_ -f2)"
            [[ "$NUM" =~ ^[0-9]+$ ]] && (( 10#$NUM >= FIRST )) || continue
            VERSION="$(basename "$FILE" .sql)"
            APPLIED="$(psql "$SUPABASE_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align --command "select exists (select 1 from wassce_internal.deployed_migrations where version = '$VERSION');" | tr -d '[:space:]')"
            if [[ "$APPLIED" == "t" ]]; then
              echo "$VERSION: already applied"
              continue
            fi
            CHECKSUM="$(sha256sum "$FILE" | cut -d ' ' -f 1)"
            {
              echo "begin;"
              echo "do \$\$ begin if exists (select 1 from wassce_internal.deployed_migrations where version = '$VERSION') then raise exception 'Migration already applied'; end if; end \$\$;"
              sed '/^[[:space:]]*begin;[[:space:]]*$/Id; /^[[:space:]]*commit;[[:space:]]*$/Id;' "$FILE"
              printf "insert into wassce_internal.deployed_migrations(version, sha256) values ('%s', '%s');\n" "$VERSION" "$CHECKSUM"
              echo "commit;"
            } | psql "$SUPABASE_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --quiet
            echo "$VERSION: applied"
          done

      - name: Verify (18) tutor booking on WhatsApp
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          RESULT="$(psql "$SUPABASE_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align --command "select concat_ws(',',
            has_function_privilege('authenticated','public.contact_tutor(uuid,uuid)','execute'),
            has_function_privilege('anon','public.contact_tutor(uuid,uuid)','execute'),
            has_column_privilege('anon','public.tutors','phone','select'),
            has_column_privilege('authenticated','public.tutors','phone','select'),
            (select count(*) from public.tutors where teaching_mode <> 'in_person'));" | tr -d '[:space:]')"
          echo "students can contact, visitors can contact, visitors read phones, students read phones, tutors not in person: $RESULT"
          test "$RESULT" = "t,f,f,f,0" || { echo "Checks did not match t,f,f,f,0"; exit 1; }

      - name: Verify (19) several subjects, groups and payment methods
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          RESULT="$(psql "$SUPABASE_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align --command "select concat_ws(',',
            has_function_privilege('authenticated','public.request_tutor(uuid,uuid[],integer)','execute'),
            has_function_privilege('anon','public.request_tutor(uuid,uuid[],integer)','execute'),
            has_function_privilege('authenticated','public.update_tutor_offer(jsonb,integer,integer,integer,text[])','execute'),
            has_column_privilege('anon','public.tutors','group_max','select'),
            has_column_privilege('anon','public.tutors','phone','select'));" | tr -d '[:space:]')"
          echo "students can request, visitors can request, tutors can set offers, visitors read offers, visitors read phones: $RESULT"
          test "$RESULT" = "t,f,t,t,f" || { echo "Checks did not match t,f,t,t,f"; exit 1; }

      - name: Verify (20) tutors edit, publish and hide their card; admins remove
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          RESULT="$(psql "$SUPABASE_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align --command "select concat_ws(',',
            has_function_privilege('authenticated','public.set_tutor_listed(boolean)','execute'),
            has_function_privilege('anon','public.set_tutor_listed(boolean)','execute'),
            has_function_privilege('authenticated','public.update_tutor_card(text,text,text,integer)','execute'),
            has_column_privilege('anon','public.tutors','listed','select'),
            (select count(*) from pg_proc where proname = 'set_tutor_status' and pronamespace = 'public'::regnamespace));" | tr -d '[:space:]')"
          echo "tutors can hide, visitors can hide, tutors can publish, visitors read listed, set_tutor_status versions: $RESULT"
          test "$RESULT" = "t,f,t,t,1" || { echo "Checks did not match t,f,t,t,1"; exit 1; }

      - name: Verify (21) the database starts the email run at 10:00 GMT
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          RESULT="$(psql "$SUPABASE_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align --command "select concat_ws(',',
            (select count(*) from cron.job where jobname = 'email-engine-daily' and schedule = '0 10 * * *' and active),
            has_function_privilege('anon','public.email_engine_kick()','execute'),
            has_function_privilege('authenticated','public.email_engine_kick()','execute'),
            (select count(*) from vault.decrypted_secrets where name = 'email_cron_secret' and length(decrypted_secret) >= 16));" | tr -d '[:space:]')"
          echo "daily job at 10:00, visitors can start it, students can start it, schedule secret present: $RESULT"
          test "$RESULT" = "1,f,f,1" || { echo "Checks did not match 1,f,f,1"; exit 1; }

          # Can the database reach the website? An unsigned request is refused
          # with 401 and does nothing, so this proves the route without a run.
          ID="$(psql "$SUPABASE_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align --command "select net.http_get(url := 'https://wasscetutor.com/api/email/run', timeout_milliseconds := 30000);" | tr -d '[:space:]')"
          STATUS=""
          for i in $(seq 1 20); do
            sleep 3
            STATUS="$(psql "$SUPABASE_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align --command "select coalesce(status_code::text, 'error:' || coalesce(error_msg, '')) from net._http_response where id = $ID;" | tr -d '[:space:]')"
            [ -n "$STATUS" ] && break
          done
          echo "database → wasscetutor.com/api/email/run without the secret: ${STATUS:-no reply}"
          test "$STATUS" = "401" || { echo "Expected 401 (route reachable, unsigned call refused)"; exit 1; }

      - name: Verify (22) every lesson and practice set is free; mock exams stay with a plan
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          RESULT="$(psql "$SUPABASE_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align --command "select concat_ws(',',
            (select count(*) from public.wassce_lesson_index where not is_free),
            (select count(*) from public.lessons where is_published) = (select count(*) from public.wassce_public_lessons),
            (select count(*) from public.papers where is_published and coalesce(paper_type, '') <> 'Mock' and not is_free),
            has_function_privilege('anon','public.is_free_lesson(uuid)','execute'),
            (select count(*) from pg_policies where schemaname = 'public' and tablename = 'lessons' and policyname = 'lessons readable by everyone when published'));" | tr -d '[:space:]')"
          echo "locked lessons, every lesson public, locked practice sets, visitors check lessons, open lesson rule: $RESULT"
          test "$RESULT" = "0,t,0,t,1" || { echo "Checks did not match 0,t,0,t,1"; exit 1; }

          # As a signed-out visitor: every published lesson and practice
          # question is readable, and no mock exam question is.
          VISITOR="$(psql "$SUPABASE_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align --quiet <<'SQL' | tr -d '[:space:]'
          begin;
          set local role anon;
          select concat_ws(',',
            (select count(*) from public.lessons) = (select count(*) from public.wassce_public_lessons),
            (select count(*) from public.questions q join public.papers p on p.id = q.paper_id where p.paper_type = 'Mock'),
            (select count(*) from public.questions) > 0);
          rollback;
          SQL
          )"
          echo "visitor reads every lesson, visitor reads mock questions, visitor reads practice questions: $VISITOR"
          test "$VISITOR" = "t,0,t" || { echo "Checks did not match t,0,t"; exit 1; }

      - name: Verify (23) no plain-text $ amounts left in the accounting lesson
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          RESULT="$(psql "$SUPABASE_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align --command "select count(*) from public.lessons where id = '5f81e3d3-be2f-42f7-8c47-c8ab937b95bd' and content ~ '(?<![\\\\\$])\\\$(?=[0-9])';" | tr -d '[:space:]')"
          echo "accounting lesson with unescaped amounts: $RESULT"
          test "$RESULT" = "0" || { echo "Expected 0"; exit 1; }

      - name: Verify (24) key term progress is each student's own
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          RESULT="$(psql "$SUPABASE_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align --command "select concat_ws(',',
            (select relrowsecurity from pg_class where oid = 'public.key_term_progress'::regclass),
            (select count(*) from pg_policies where schemaname = 'public' and tablename = 'key_term_progress'),
            has_table_privilege('anon', 'public.key_term_progress', 'select'),
            has_table_privilege('authenticated', 'public.key_term_progress', 'insert'),
            has_table_privilege('authenticated', 'public.key_term_progress', 'update'));" | tr -d '[:space:]')"
          echo "row security on, policies, visitors read, students insert, students update: $RESULT"
          test "$RESULT" = "t,4,f,t,t" || { echo "Checks did not match t,4,f,t,t"; exit 1; }

      - name: Verify (25) new tutors go live when they apply
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          RESULT="$(psql "$SUPABASE_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align --command "select concat_ws(',',
            (select count(*) from public.tutor_settings),
            has_column_privilege('anon','public.tutor_settings','auto_approve','select'),
            has_function_privilege('authenticated','public.approve_tutor_application(uuid,uuid,text)','execute'),
            has_function_privilege('anon','public.set_tutor_auto_approve(boolean)','execute'),
            has_function_privilege('authenticated','public.set_tutor_auto_approve(boolean)','execute'),
            (select count(*) from pg_proc where pronamespace = 'public'::regnamespace
               and proname in ('submit_tutor_application', 'review_tutor_application') and prosrc like '%approve_tutor_application%'));" | tr -d '[:space:]')"
          echo "settings row, visitors read the setting, students approve directly, visitors switch it, admins switch it, functions that approve: $RESULT"
          test "$RESULT" = "1,t,f,f,t,2" || { echo "Checks did not match 1,t,f,f,t,2"; exit 1; }
          # For the record (these change as people use the site, so they are not checked).
          psql "$SUPABASE_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align --command "select concat_ws(', ',
            'automatic approval ' || (select case when auto_approve then 'on' else 'off' end from public.tutor_settings),
            (select count(*) from public.tutor_applications where status in ('submitted', 'under_review')) || ' applications waiting',
            (select count(*) from public.tutors where status = 'active' and listed) || ' tutors in the marketplace');"

      - name: Verify (26) every account knows whether it is a student, tutor or affiliate
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          RESULT="$(psql "$SUPABASE_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align --command "select concat_ws(',',
            (select count(*) from information_schema.columns where table_schema = 'public' and table_name = 'profiles' and column_name = 'account_role'),
            has_column_privilege('authenticated', 'public.profiles', 'account_role', 'UPDATE'),
            (select count(*) from pg_trigger where not tgisinternal
               and tgname in ('account_role_from_signup', 'tutor_application_marks_account', 'tutor_marks_account', 'affiliate_marks_account')),
            (select count(*) from public.tutors t join public.profiles p on p.id = t.user_id where p.account_role <> 'tutor'));" | tr -d '[:space:]')"
          echo "account_role column, accounts can change their own, role triggers, tutors not marked as tutors: $RESULT"
          test "$RESULT" = "1,f,4,0" || { echo "Checks did not match 1,f,4,0"; exit 1; }
          # For the record (changes as people sign up).
          psql "$SUPABASE_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align --command "select string_agg(account_role || ': ' || n, ', ' order by account_role) from (select account_role, count(*) n from public.profiles group by 1) r;"

      - name: Verify (27) every practice set is free, now and when new ones are added
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          RESULT="$(psql "$SUPABASE_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align --command "select concat_ws(',',
            (select count(*) from public.papers where coalesce(paper_type, '') <> 'Mock' and not is_free),
            (select count(*) from pg_trigger where not tgisinternal and tgname = 'practice_sets_stay_free'));" | tr -d '[:space:]')"
          echo "practice sets marked locked, trigger that keeps them free: $RESULT"
          test "$RESULT" = "0,1" || { echo "Checks did not match 0,1"; exit 1; }

      - name: Verify (28) every tutor has their own page; reviewers review lessons in their subjects
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          RESULT="$(psql "$SUPABASE_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align --command "select concat_ws(',',
            (select count(*) from public.tutors where slug is null),
            (select count(*) from public.tutors t join public.subjects s on s.slug = t.slug),
            has_column_privilege('anon', 'public.tutors', 'slug', 'select'),
            has_column_privilege('anon', 'public.tutors', 'phone', 'select'),
            has_function_privilege('anon', 'public.tutor_review_lesson(uuid,text,text)', 'execute'),
            has_function_privilege('authenticated', 'public.tutor_review_lesson(uuid,text,text)', 'execute'),
            has_function_privilege('authenticated', 'public.set_tutor_reviewer(uuid,boolean)', 'execute'),
            (select count(*) from information_schema.columns where table_schema = 'public' and table_name = 'wassce_public_lessons' and column_name = 'reviewer_tutor_slug'));" | tr -d '[:space:]')"
          echo "tutors without a page, pages that clash with a subject, visitors read slugs, visitors read phones, visitors review, tutors review, admins switch reviewers, byline link: $RESULT"
          test "$RESULT" = "0,0,t,f,f,t,t,1" || { echo "Checks did not match 0,0,t,f,f,t,t,1"; exit 1; }
          # For the record: who reviews lessons, and their pages.
          psql "$SUPABASE_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align --command "select coalesce(string_agg(full_name || ' (/tutors/' || slug || ')', ', ' order by verified_at), 'none') from public.tutors where reviewer;"

      - name: Verify (29) no listed tutor has a numbered address while a hidden tutor holds the plain one
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          RESULT="$(psql "$SUPABASE_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align --command "select concat_ws(',',
            (select count(*) from public.tutors pub join public.tutors hid on pub.slug ~ ('^' || hid.slug || '-[0-9]+\$')
              where pub.status = 'active' and pub.listed and not (hid.status = 'active' and hid.listed)
                and hid.slug = btrim(regexp_replace(lower(hid.full_name), '[^a-z0-9]+', '-', 'g'), '-')),
            (select count(*) from pg_trigger where not tgisinternal and tgname = 'tutors_set_slug' and tgenabled = 'O'));" | tr -d '[:space:]')"
          echo "listed tutors on a numbered address behind a hidden one, address trigger on: $RESULT"
          test "$RESULT" = "0,1" || { echo "Checks did not match 0,1"; exit 1; }
          psql "$SUPABASE_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align --command "select string_agg(full_name || ' /tutors/' || slug, ', ' order by verified_at) from public.tutors where status = 'active' and listed;"

      - name: Verify (30) the first lesson reviews are recorded
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          RESULT="$(psql "$SUPABASE_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align --command "select count(*) from public.lessons l join public.tutors t on t.user_id = l.reviewed_by where l.is_published and t.slug in ('john-kaitibie', 'mohamed-bangura', 'nicholas-norman');" | tr -d '[:space:]')"
          echo "published lessons reviewed by the three reviewers: $RESULT"
          test "$RESULT" -gt 0 || { echo "Expected reviewed lessons"; exit 1; }
          # For the record: lessons per reviewer and subject.
          psql "$SUPABASE_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align --command "select string_agg(line, '; ') from (select t.full_name || ', ' || s.name || ': ' || count(*) as line from public.lessons l join public.tutors t on t.user_id = l.reviewed_by join public.topics tp on tp.id = l.topic_id join public.subjects s on s.id = tp.subject_id where l.is_published group by t.full_name, s.name order by t.full_name, s.name) r;"

      - name: Verify (31) the fuller tutor cards (for the record)
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          # The update skips a card the tutor edited meanwhile, so this only reports.
          psql "$SUPABASE_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align --command "select string_agg(full_name || ': ' || array_length(regexp_split_to_array(btrim(bio), '\s+'), 1) || ' words, ' || location, '; ' order by verified_at) from public.tutors where status = 'active' and listed;"

      - name: Verify (32) rewritten lessons carry no old approval; two text fixes applied
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          RESULT="$(psql "$SUPABASE_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align --command "select concat_ws(',',
            (select count(*) from public.lessons where id in ('6aa1ff46-fbee-48ea-b76e-cb24e2a26231','ea3be6ef-17d8-44a7-b643-d739da45a812','e5b2cf54-2451-423f-bf51-c10005a14dd2','8a6898e6-93e2-403c-8d23-ca366276fa31','d581e82f-9bad-439c-8f56-70a8c3383757','60434abd-d891-4c24-acd8-26afd389e8f3','730555e2-ddc3-44dc-9eb4-fd73c4cdb8e7','bbdbc508-6b59-48b5-84a6-b0ce03898870','dcae68f0-944d-4ce8-829a-2903c1d31c28','f9e5ccb9-9029-47f8-9066-8b70d6679163') and reviewed_at < timestamptz '2026-11-19 00:00:00+00'),
            (select count(*) from public.lessons where id = '192d9ccc-6f49-42d9-8f64-a74276db8e44' and content like '%<br>%'),
            (select count(*) from public.lessons where id = 'aa39949a-d814-4b12-862a-7d7ff1da5ef9' and content like '%nearest cedi%'));" | tr -d '[:space:]')"
          echo "rewritten lessons with an old approval, literal <br>, weight rounded to a currency: $RESULT"
          test "$RESULT" = "0,0,0" || { echo "Checks did not match 0,0,0"; exit 1; }

      - name: Verify (33) Chemistry topics 11-48 and English topics 11-31 are reviewed
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          RESULT="$(psql "$SUPABASE_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align --command "select count(*) from public.lessons l join public.topics tp on tp.id = l.topic_id join public.subjects s on s.id = tp.subject_id where l.is_published and l.reviewed_at is null and ((s.slug = 'chemistry' and tp.slug in ('empirical-and-molecular-formulas','acids-bases-and-ph','salts-and-their-preparation','acid-base-titration','water-and-its-properties','solutions-and-solubility','oxidation-and-reduction-reactions','electrolysis','electrochemical-cells','energy-changes-in-reactions','rate-of-reaction','chemical-equilibrium','hydrogen','oxygen-and-air','the-halogens','nitrogen-and-its-compounds','sulphur-and-its-compounds','carbon-and-its-inorganic-compounds','reactivity-series-and-extraction-of-metals','alkali-metals','alkaline-earth-metals','aluminium-and-group-iii-metals','iron-and-other-transition-metals','industrial-chemical-processes','introduction-to-organic-chemistry','alkanes','alkenes','alkynes','petroleum-and-petrochemicals','alkanols','alkanoic-acids','alkanoates-and-esters','soaps-detergents-and-oils','carbohydrates','proteins-and-amino-acids','polymers-and-plastics','chemistry-and-the-environment','practical-chemistry-skills')) or (s.slug = 'english-language' and tp.slug in ('conjunctions','articles','subject-verb-agreement','direct-and-reported-speech','question-tags','modal-verbs','conditionals','phrases-and-clauses','sentence-types','punctuation','common-confusable-words','synonyms-and-antonyms','homonyms-and-homophones','idioms-and-idiomatic-expressions','figures-of-speech','word-formation','vocabulary-in-context','literal-and-inferential-comprehension','approaching-a-comprehension-passage','tone-and-attitude-in-comprehension','summary-writing')));" | tr -d '[:space:]')"
          echo "published lessons in those topics still without a review: $RESULT"
          test "$RESULT" = "0" || { echo "Expected every lesson in those topics to be reviewed"; exit 1; }
          # For the record: lessons per reviewer and subject.
          psql "$SUPABASE_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align --command "select string_agg(line, '; ') from (select t.full_name || ', ' || s.name || ': ' || count(*) as line from public.lessons l join public.tutors t on t.user_id = l.reviewed_by join public.topics tp on tp.id = l.topic_id join public.subjects s on s.id = tp.subject_id where l.is_published group by t.full_name, s.name order by t.full_name, s.name) r;"

      - name: Verify (34) the study emails can find a question, a tutor and the next lesson
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          # The function exists, only the server key may call it, and it answers for real students.
          RESULT="$(psql "$SUPABASE_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align --command "select (to_regprocedure('public.email_student_extras(uuid[])') is not null)::text || ',' || has_function_privilege('anon', 'public.email_student_extras(uuid[])', 'execute')::text || ',' || has_function_privilege('authenticated', 'public.email_student_extras(uuid[])', 'execute')::text;" | tr -d '[:space:]')"
          echo "exists, anon may call, signed-in may call: $RESULT"
          test "$RESULT" = "true,false,false" || { echo "Expected the function to exist for the server key only"; exit 1; }
          # For the record: of 200 recent students, how many would get each part.
          psql "$SUPABASE_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align --command "select 'students ' || count(*) || '; with a question ' || count(question_id) || '; with a weak subject ' || count(weak_subject_id) || '; with a tutor ' || count(tutor_slug) || '; with a next lesson ' || count(next_lesson_id) from public.email_student_extras(array(select id from public.profiles order by created_at desc limit 200));"
          # Questions offered never carry the answer.
          LEAK="$(psql "$SUPABASE_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align --command "select count(*) from public.email_student_extras(array(select id from public.profiles order by created_at desc limit 200)) e, jsonb_array_elements(e.question_options) o where o ? 'is_correct';" | tr -d '[:space:]')"
          test "$LEAK" = "0" || { echo "Question options must not carry the answer"; exit 1; }

      - name: Verify (35) lesson videos are readable only through the public view; keys never
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          RESULT="$(psql "$SUPABASE_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align --command "select concat_ws(',',
            has_table_privilege('anon', 'public.wassce_public_lesson_videos', 'select'),
            has_table_privilege('anon', 'public.lesson_videos', 'select'),
            has_table_privilege('authenticated', 'public.lesson_videos', 'select'),
            has_table_privilege('anon', 'public.lesson_video_keys', 'select'),
            has_table_privilege('authenticated', 'public.lesson_video_keys', 'select'),
            (select public from storage.buckets where id = 'lesson-video'),
            (select public from storage.buckets where id = 'lesson-video-public'));" | tr -d '[:space:]')"
          echo "visitors read the view, visitors/students read videos, visitors/students read keys, private bucket public, public bucket public: $RESULT"
          test "$RESULT" = "t,f,f,f,f,f,t" || { echo "Checks did not match t,f,f,f,f,f,t"; exit 1; }
