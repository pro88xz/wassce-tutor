name: Set up email engine (16)

# Run by hand from the Actions tab, on main. Safe to run again at any time.
#  1. Applies migration 16 once: the email engine's tables, consent (existing
#     accounts subscribed by default), and two secrets made inside the database.
#  2. Every run: copies RESEND_API_KEY and EMAIL_FROM (and, if set,
#     RESEND_WEBHOOK_SECRET and EMAIL_REPLY_TO) from this repository's secrets
#     into Supabase Vault, where the website reads them. Nothing has to be
#     copied into Vercel. Run it again after changing any of those secrets.
#  3. Connects Resend's bounce and complaint webhook through the Resend API
#     (once), and stores its signing secret in Vault.
#  4. Applies the mode, pilot addresses and daily limit chosen when starting
#     the run (the same settings as Admin → Emails).
# See docs/email-engine.md.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Engine mode (keep = leave as it is)'
        type: choice
        options: ['keep', 'off', 'dry-run', 'pilot', 'live']
        default: 'keep'
      pilot_addresses:
        description: 'Pilot addresses, comma-separated (blank = leave as they are)'
        required: false
        default: ''
      daily_limit:
        description: 'Most emails per day, 0-5000 (blank = leave as it is)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: wassce-tutor-email-engine-migration
  cancel-in-progress: false

jobs:
  apply-email-engine:
    name: Set up the email engine
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Check out main
        uses: actions/checkout@v5

      - name: Validate target migration and secrets
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL" || { echo "Missing SUPABASE_DB_URL"; exit 1; }
          test -n "$RESEND_API_KEY" || { echo "Missing RESEND_API_KEY"; exit 1; }
          test -n "$EMAIL_FROM" || { echo "Missing EMAIL_FROM"; exit 1; }
          test -s "supabase/migrations/20261115_16_email_engine.sql" || { echo "Migration file missing"; exit 1; }
          grep -qiE '^[[:space:]]*begin;' supabase/migrations/20261115_16_email_engine.sql
          grep -qiE '^[[:space:]]*commit;' supabase/migrations/20261115_16_email_engine.sql

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Apply migration once and record checksum
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          MIGRATION_VERSION: "20261115_16_email_engine"
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 <<'SQL'
          create schema if not exists wassce_internal;
          revoke all on schema wassce_internal from public, anon, authenticated;
          create table if not exists wassce_internal.deployed_migrations (
            version text primary key,
            sha256 text not null,
            applied_at timestamptz not null default now()
          );
          revoke all on all tables in schema wassce_internal from public, anon, authenticated;
          SQL

          APPLIED="$(psql "$SUPABASE_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align --command "select exists (select 1 from wassce_internal.deployed_migrations where version = '$MIGRATION_VERSION');" | tr -d '[:space:]')"
          if [[ "$APPLIED" == "t" ]]; then
            echo "Migration $MIGRATION_VERSION is already recorded; nothing to apply."
            exit 0
          fi

          CHECKSUM="$(sha256sum supabase/migrations/20261115_16_email_engine.sql | cut -d ' ' -f 1)"
          {
            echo "begin;"
            echo "do \$\$ begin if exists (select 1 from wassce_internal.deployed_migrations where version = '$MIGRATION_VERSION') then raise exception 'Migration already applied'; end if; end \$\$;"
            sed '/^[[:space:]]*begin;[[:space:]]*$/Id; /^[[:space:]]*commit;[[:space:]]*$/Id;' supabase/migrations/20261115_16_email_engine.sql
            printf "insert into wassce_internal.deployed_migrations(version, sha256) values ('%s', '%s');\\n" "$MIGRATION_VERSION" "$CHECKSUM"
            echo "commit;"
          } | psql "$SUPABASE_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1

          echo "Migration applied and recorded successfully."

      - name: Store the Resend key and sender in Supabase Vault
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
          EMAIL_REPLY_TO: ${{ secrets.EMAIL_REPLY_TO }}
        run: |
          set -euo pipefail
          # Values go in as psql variables (:'name' quotes them safely) and are never printed.
          psql "$SUPABASE_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --quiet \
            --set=resend="$RESEND_API_KEY" --set=sender="$EMAIL_FROM" \
            --set=webhook="${RESEND_WEBHOOK_SECRET:-}" --set=reply="${EMAIL_REPLY_TO:-}" <<'SQL' > /dev/null
          select public.email_store_secret('email_resend_api_key', :'resend');
          select public.email_store_secret('email_from', :'sender');
          select public.email_store_secret('email_webhook_secret', nullif(:'webhook', ''));
          select public.email_store_secret('email_reply_to', nullif(:'reply', ''));
          SQL
          echo "Stored. Webhook secret provided: $([ -n "${RESEND_WEBHOOK_SECRET:-}" ] && echo yes || echo no)"

      - name: Connect Resend's bounce and complaint webhook
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          set -euo pipefail
          HAVE="$(psql "$SUPABASE_DB_URL" --no-psqlrc --tuples-only --no-align --command "select count(*) from vault.secrets where name = 'email_webhook_secret';" | tr -d '[:space:]')"
          if [ "$HAVE" != "0" ]; then echo "Webhook secret already stored; nothing to do."; exit 0; fi
          URL="https://wasscetutor.com/api/email/webhook"
          api() { curl --silent --show-error --max-time 30 --write-out $'\n%{http_code}' --header "Authorization: Bearer $RESEND_API_KEY" --header 'Content-Type: application/json' "$@" || true; }
          LIST="$(api https://api.resend.com/webhooks)"
          CODE="${LIST##*$'\n'}"; BODY="${LIST%$'\n'*}"
          if [ "$CODE" != "200" ]; then
            echo "::warning::Resend did not allow listing webhooks (HTTP $CODE); the API key may be send-only. Add the webhook in Resend by hand: see docs/email-engine.md."
            exit 0
          fi
          ID="$(jq -r --arg u "$URL" '[.data[]? | select(.endpoint == $u)][0].id // empty' <<<"$BODY" 2>/dev/null || true)"
          if [ -n "$ID" ]; then
            RES="$(api --request POST "https://api.resend.com/webhooks/$ID/signing-secret/rotate")"
          else
            RES="$(api --request POST https://api.resend.com/webhooks --data "$(jq -n --arg u "$URL" '{endpoint: $u, events: ["email.sent", "email.delivered", "email.bounced", "email.complained"]}')")"
          fi
          CODE="${RES##*$'\n'}"; BODY="${RES%$'\n'*}"
          SECRET="$(jq -r '.signing_secret // empty' <<<"$BODY" 2>/dev/null || true)"
          if [[ "$SECRET" != whsec_* ]]; then
            echo "::warning::Could not connect the Resend webhook (HTTP $CODE): $(jq -r '.message // .name // empty' <<<"$BODY" 2>/dev/null || true). Add it in Resend by hand: see docs/email-engine.md."
            exit 0
          fi
          echo "::add-mask::$SECRET"
          psql "$SUPABASE_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --quiet --set=webhook="$SECRET" <<'SQL' > /dev/null
          select public.email_store_secret('email_webhook_secret', :'webhook');
          SQL
          echo "Resend webhook connected to $URL"

      - name: Apply engine settings
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          MODE: ${{ inputs.mode }}
          PILOT: ${{ inputs.pilot_addresses }}
          LIMIT: ${{ inputs.daily_limit }}
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 \
            --set=mode="${MODE:-keep}" --set=pilot="${PILOT:-}" --set=lim="${LIMIT:-}" <<'SQL'
          update public.email_settings set
            mode = case when :'mode' in ('off', 'dry-run', 'pilot', 'live') then :'mode' else mode end,
            pilot_addresses = case when btrim(:'pilot') = '' then pilot_addresses else
              (select coalesce(array_agg(distinct lower(btrim(a))), '{}') from unnest(string_to_array(:'pilot', ',')) a where btrim(a) like '%_@_%') end,
            daily_limit = case when btrim(:'lim') ~ '^[0-9]{1,4}$' then least(btrim(:'lim')::integer, 5000) else daily_limit end,
            updated_at = now()
          where id;
          select mode, cardinality(pilot_addresses) as pilot_addresses, daily_limit, paused from public.email_settings;
          SQL

      - name: Verify the migration took effect
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          RESULT="$(psql "$SUPABASE_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align --command "select concat_ws(',',
            (select count(*) from information_schema.tables where table_schema='public' and table_name in ('email_preferences','email_consent_log','email_suppressions','email_settings','email_send_jobs','email_message_events','email_click_events')),
            has_function_privilege('authenticated','public.set_my_marketing_preference(boolean,text,text)','execute'),
            has_function_privilege('authenticated','public.email_audience(uuid,integer)','execute'),
            has_function_privilege('anon','public.set_my_marketing_preference(boolean,text,text)','execute'),
            (select count(*) from pg_trigger where tgname = 'on_auth_user_created_email_preferences'),
            (select count(*) from vault.secrets where name in ('email_resend_api_key','email_from','email_token_secret','email_cron_secret')));" | tr -d '[:space:]')"
          echo "tables, students can set their choice, students can read audience, anon can set, sign-up trigger, secrets: $RESULT"
          test "$RESULT" = "7,t,f,f,1,4" || { echo "Email engine checks did not match 7,t,f,f,1,4"; exit 1; }
          psql "$SUPABASE_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --command "select consent_source, marketing_status, count(*) from public.email_preferences group by 1, 2 order by 1, 2;"
